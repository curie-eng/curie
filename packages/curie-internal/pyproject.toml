[project]
name = "curie-internal"
version = "0.0.0"
description = "Shared internal Curie wire state and validation"
requires-python = ">=3.13"
dependencies = [
    "redis>=5.2",
    "sqlalchemy[asyncio]>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/curie_internal"]

[tool.hatch.build.targets.wheel.force-include]
"src/curie_internal/wire_sites.json" = "curie_internal/wire_sites.json"
