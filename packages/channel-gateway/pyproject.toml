[project]
name = "curie-channel-gateway"
version = "0.1.0"
description = "Provider implementations and neutral ports for Curie channels"
requires-python = ">=3.13"
dependencies = ["curie-channel-protocol"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/curie_channel_gateway"]
