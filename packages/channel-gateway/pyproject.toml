[project]
name = "curie-channel-gateway"
version = "0.1.0"
description = "Provider implementations and neutral ports for Curie channels"
requires-python = ">=3.13"
dependencies = [
    "aci-protocol",
    "curie-channel-protocol",
    "curie-internal",
    "curie-telemetry",
    "curie-upgrade-pause",
    "slack-bolt>=1.30.0",
    "redis>=5.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.15.0",
    "httpx>=0.28",
    "aiohttp>=3.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/curie_channel_gateway"]
