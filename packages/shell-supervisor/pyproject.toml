[project]
name = "curie-shell-supervisor"
version = "0.0.0"
description = "Trusted PID 1 supervisor for a static-pool harness shell: claim control API and ACI proxy"
requires-python = ">=3.13"
# Runs inside the runner image, so it may only use what that image already
# installs. It never imports the runner, the worker or a model SDK.
dependencies = ["aiohttp>=3.11"]

[project.scripts]
curie-shell-supervisor = "curie_shell_supervisor.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/curie_shell_supervisor"]
