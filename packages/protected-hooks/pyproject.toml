# @spec PROTECTED-HOOK-SOURCE-6
[project]
name = "curie-protected-hooks"
version = "0.0.0"
description = "Internal protected hook source authority primitives"
requires-python = ">=3.13"

# @spec PROTECTED-HOOK-ADMISSION-2
dependencies = ["aci-protocol", "cryptography>=50.0.1", "redis>=8.1.0", "sqlalchemy[asyncio]>=2.0.51"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/curie_protected_hooks"]
