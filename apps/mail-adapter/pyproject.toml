[project]
name = "curie-mail-adapter"
version = "0.0.0"
description = "Curie email channel adapter (AgentMail): polls an inbox to channel ingress, serves the neutral reply wire"
requires-python = ">=3.13"
dependencies = [
    "aci-protocol",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/curie_mail_adapter"]
