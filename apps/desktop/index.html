<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The renderer loads nothing from the network: scripts and styles come
         from the bundle, and every outbound request goes through the main
         process instead. Stating that as a policy means a stray CDN import or
         an injected <script> fails loudly rather than silently working. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'none'; base-uri 'none'"
    />
    <link rel="icon" type="image/svg+xml" href='data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"%3E%3Crect width="32" height="32" rx="7" fill="%23121212"/%3E%3Cpath d="M22 11a7 7 0 1 0 0 10" fill="none" stroke="%233ecf8e" stroke-width="3" stroke-linecap="round"/%3E%3C/svg%3E' />
    <title>Curie</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
