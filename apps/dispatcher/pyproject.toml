[project]
name = "curie-dispatcher"
version = "0.0.0"
description = "Deployment package for gateway-owned Slack intake"
requires-python = ">=3.13"
dependencies = ["curie-channel-gateway"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/curie_dispatcher"]
