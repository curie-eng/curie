[project]
name = "curie-worker"
version = "0.0.0"
description = "Curie worker: concurrency kernel (routing, finish-race CAS, steer/interrupt), sandbox substrate, eval runner"
requires-python = ">=3.13"
dependencies = [
    "redis>=8.1.0",
    "pydantic-settings>=2.7",
    "kubernetes>=36.0.3",
    "aci-protocol",
    "curie-channel-protocol",
    "plugin-format",
    "curie-dispatcher",
    "aiohttp>=3.11",
    "slack-sdk>=3.43",
    "httpx>=0.28",
    # Sealed connector credentials (ADR-0094). libsodium sealed boxes, the same
    # named primitive the CLI seals with -- not a compatible-looking
    # reimplementation, which is how two AEAD stacks disagree at deploy time.
    "pynacl>=1.5",
    "sqlalchemy[asyncio]>=2.0.51",
    "asyncpg>=0.30",
    "boto3>=1.43.55",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/curie_worker"]
