# gitleaks configuration for a PUBLIC repository.
#
# The default rules catch credentials. They do not catch the other thing that
# must not be here: real identifiers from the deployments Curie runs. This repo
# is open source, so a Slack conversation id, an AWS account number, or an
# internal hostname committed as documentation is a permanent disclosure of a
# private environment -- and unlike a leaked key, it cannot be rotated away.
#
# The rule for contributors: EXAMPLES ONLY. Docs, ADRs, tests, and fixtures use
# placeholder values. If you are documenting something real, describe its shape,
# not its value.
#
# These rules exist because this actually happened: an ADR and its tests were
# written using a live workspace's Slack channel ids as the worked example,
# purely because they were the values in front of the author at the time.

[extend]
useDefault = true

[[rules]]
id = "slack-conversation-id"
description = "Slack conversation id (channel/group/DM) -- use an EXAMPLE id in docs and tests"
# Slack ids are C/G/D, then a digit, then 7-9 more uppercase alphanumerics
# (C0EXAMPLE1). Requiring the digit is what separates them from ordinary
# uppercase words -- without it, CONNECTORS and DEPLOYMENT both match. RE2 has
# no lookahead, so the digit is positional rather than "contains a digit".
regex = '''\b[CGD][0-9][A-Z0-9]{7,9}\b'''
tags = ["identifier", "slack"]

[[rules]]
id = "aws-account-id"
description = "AWS account id -- use 000000000000 in docs and tests"
# 12 digits adjacent to something that gives them account meaning, so ordinary
# long numbers (timestamps, byte counts) do not trip it.
# Anchored to something that gives the digits ACCOUNT meaning. A bare
# "-123456789012" was matching timestamps and version labels, which is how a
# noisy rule gets disabled and stops protecting anything.
regex = '''(?i)(arn:aws[a-z-]*:[a-z0-9-]*:[a-z0-9-]*:|account[_-]?id["'\s:=]{1,4}|\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com|s3://[a-z0-9.-]*-)([0-9]{12})\b'''
secretGroup = 2
tags = ["identifier", "aws"]

[[rules]]
id = "aws-instance-id"
description = "EC2 instance id -- use i-0123456789abcdef0 in docs and tests"
regex = '''\bi-[0-9a-f]{8,17}\b'''
tags = ["identifier", "aws"]

[[rules]]
id = "internal-hostname"
description = "Internal hostname -- use example.com in docs and tests"
# Curie's own product domains. example.com and *.svc.cluster.local are fine:
# the first is reserved for documentation, the second names no real host.
regex = '''\b[a-z0-9][a-z0-9.-]*\.(curie-tech\.net|curie-tech\.com)\b'''
tags = ["identifier", "hostname"]

[[rules]]
id = "downstream-repo-slug"
description = "Downstream repository slug -- describe the repo's role, do not name it"
# This repo is the platform; the repos that USE it are somebody's private
# deployment. A slug in our own org is the case that actually happened: three
# Accepted ADRs cited a private agent repository by `org/repo` and by
# `org/repo#123`, which reads as ordinary sourcing and resolves to a 404 for
# every reader but us.
#
# Deliberately scoped to OUR org rather than any `org/repo`: docs link to
# upstream projects constantly, and a rule that fires on every third-party
# GitHub link is a rule someone disables. RE2 has no lookahead, so "not our own
# repo" is expressed as the rule allowlist below rather than in the pattern.
#
# The slug must END on an alphanumeric so the match is the repo name and
# nothing else. Without that, `curie-eng/curie.` (sentence-final) and
# `ghcr.io/curie-eng/curie-{runner,api}` (brace expansion) match with a
# trailing `.` or `-`, which then fails an anchored allowlist and fires on this
# repo's own name -- the noisy-rule failure mode the aws-account-id comment
# above describes.
regex = '''\bcurie-eng/[A-Za-z0-9._-]*[A-Za-z0-9]'''
tags = ["identifier", "repo"]

  [rules.allowlist]
  description = "This repo itself, under both its names"
  regexTarget = "match"
  # `curie-eng/agentos` is this repo's former name, so it names the same public
  # repository. Both forms take the `-*` suffix because that is the published
  # image repos (curie-api, curie-runner, curie-worker-local, ...), which the
  # full-history scan meets under the pre-rename name across 26 commits.
  regexes = [
    '''^curie-eng/curie(-[A-Za-z0-9._-]+)?$''',
    '''^curie-eng/agentos(-[A-Za-z0-9._-]+)?$''',
  ]

[[rules]]
id = "cross-repo-issue-ref"
description = "Cross-repo issue reference -- cite this repo's issues, or describe the finding"
# A bare `#123` is this repo's own issue tracker and is used everywhere on
# purpose; the owner-qualified form points somewhere else, which for this repo
# has only ever meant a private downstream repository.
#
# The owner must start with a LETTER, which is what separates an owner from a
# number. GitHub owners cannot begin with a digit anyway, and without the
# constraint the prose `#456/PR#503` -- two of this repo's own references,
# written back to back -- parses as owner `456`, repo `PR`, issue `503`.
regex = '''\b[A-Za-z][A-Za-z0-9-]*/[A-Za-z0-9._-]+#[0-9]+\b'''
tags = ["identifier", "repo"]

  [rules.allowlist]
  description = "This repo's own issues, written in the qualified form"
  regexTarget = "match"
  regexes = ['''^curie-eng/(curie|agentos)#[0-9]+$''']

[allowlist]
description = "Placeholder values this repo uses deliberately, plus generated artifacts"

# The example identifiers. Keep this list short and obviously fake: anything
# here is a value a reader is meant to copy and replace.
regexTarget = "match"
regexes = [
  # All three conversation prefixes: the CLI validates D (DM) and G (legacy
  # private group) ids alongside C, so their examples need the same cover.
  '''\b[CGD]0EXAMPLE[0-9]\b''',
  '''\bi-0123456789abcdef0\b''',
  '''\b000000000000\b''',
  '''\bexample\.com\b''',
  # The provider prefix is intentionally present in the public fixture. The
  # complete finding is anchored so no other OpenRouter shaped value is covered.
  '''^credentials":"sk-or-v1-PLACEHOLDER"$''',
  # Slack token fixtures. The prefix is the whole point of the test that uses
  # them (curie seal / credcheck), so they cannot be shortened past it -- the
  # EXAMPLE marker is what makes them obviously not a live token.
  '''\b(xapp|xoxb|xoxp)-EXAMPLE[A-Za-z0-9-]*''',
  # Historical redaction regression input. Every token component is a repeated
  # zero or the literal FAKE marker, so it cannot identify a real Slack app.
  '''\bxapp-0-0000000000-0000000000-FAKEFAKEFAKEFAKE\b''',
  # Historical warm-pool fixtures use these exact fabricated values to prove
  # credential rotation and value-free equality. Anchor the complete finding:
  # another value under either key must still be detected by generic-api-key.
  '''^STATE_TOKEN_ENV: "sbx\.other2\.sig"$''',
  '''^GH_TOKEN": "MATERIAL-B-91c2"$''',
]

paths = [
  # Build output and caches. Without these the scan walks >1GB of target/ and
  # node_modules and takes minutes, which is how a gate gets skipped in practice.
  '''(^|/)(target|node_modules|\.venv|venv|dist|build)/''',
  '''(^|/)\.(pytest_cache|mypy_cache|ruff_cache|curie)/''',
  '''(^|/)target-linux-[^/]+/''',
  # Lockfiles and generated code carry hashes that look like ids and are not.
  '''(^|/)(pnpm-lock\.yaml|Cargo\.lock|uv\.lock)$''',
  '''(^|/)packages/[^/]+/generated/''',
  # This file names the patterns it forbids.
  '''^\.gitleaks\.toml$''',
]

# Gitleaks stopwords are case insensitive substring matches, so an entry
# suppresses any longer identifier containing it, including identifiers
# prefixed by that entry. Every value is an
# obviously invented fixture id: it spells a word (C0MANAGERS), repeats a
# character (C0FFFFFF6), or is mostly zeroes (C000000A01). That is the bar for
# a new one: a reader must be able to tell at a glance that it is not somebody's
# channel. `C0EXAMPLE` reserves the documentation-placeholder family (including
# numbered variants) that deploy target validation must name and reject.
# Adding to this list should be rare; prefer reusing C0EXAMPLE1.
stopwords = [
  "C000000A01",
  "C000000A02",
  "C000000B01",
  "C000000B02",
  "C000000C01",
  "C000000C02",
