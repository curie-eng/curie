# OTel Collector config for the Curie dev stack.
#
# Receives OTLP traces, logs, and metrics from our services over BOTH gRPC
# (4317) and HTTP (4318). Traces go to Langfuse; development logs and metrics
# use debug plus explicit nop exporters until #1765 supplies their backends.
# Langfuse OTLP ingest is HTTP-only (gRPC is silently unsupported), so the
# collector adapts trace traffic to otlphttp. Langfuse appends /v1/traces to
# the otlphttp endpoint's base path itself.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20
  batch: {}
  # Drops known childless API reads and platform loops before Langfuse.
  # Unknown routes are kept. Compose debug sees the same filtered stream.
  filter/langfuse_platform_noise:
    error_mode: ignore
    traces:
      span:
        - >-
          name == "http.server.request" and
          attributes["service.name"] == "curie-api" and
          attributes["source"] == "GET" and
          (attributes["operation"] == "/health" or
          attributes["operation"] == "/ready" or
          attributes["operation"] == "/agents" or
          attributes["operation"] == "/agents/{agent_id}" or
          attributes["operation"] == "/approvals" or
          attributes["operation"] == "/approvals/{approval_id}" or
          attributes["operation"] == "/approvals/{approval_id}/audit" or
          attributes["operation"] == "/langfuse/traces" or
          attributes["operation"] == "/langfuse/traces/{trace_id}" or
          attributes["operation"] == "/observability/metrics/summary" or
          attributes["operation"] == "/observability/metrics/series" or
          attributes["operation"] == "/observability/runners")
        - 'IsMatch(name, "^curie\\.background\\.")'
        - 'name == "curie.sandbox.cleanup"'

exporters:
  otlphttp/langfuse:
    endpoint: http://langfuse-web:3000/api/public/otel
    headers:
      # Basic auth for the LANGFUSE_INIT project keys baked into compose.dev.yaml.
      # Value is base64("<public-key>:<secret-key>"), supplied via .env.
      Authorization: ${env:LANGFUSE_OTLP_AUTH_HEADER}
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 5m
    sending_queue:
      enabled: true
      storage: file_storage
      queue_size: 1000
      num_consumers: 2
  nop/logs: {}
  nop/metrics: {}
  debug:
    verbosity: normal

extensions:
  file_storage:
    directory: /var/lib/otelcol/storage
    timeout: 1s
    create_directory: true
    fsync: true
    compaction:
      on_start: true
      on_rebound: true
      directory: /var/lib/otelcol/storage
      cleanup_on_start: true

service:
  extensions: [file_storage]
  telemetry:
    metrics:
      level: normal
      address: 0.0.0.0:8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/langfuse_platform_noise, batch]
      exporters: [otlphttp/langfuse, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [nop/logs, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [nop/metrics, debug]
