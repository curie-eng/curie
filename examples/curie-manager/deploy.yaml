# Where this bundle is deployed. Replace the channel ID with your team's channel,
# and use the same ID as the `platform-check` trigger's `target` in
# .claude-plugin/plugin.json: a cron trigger posts only to a channel already
# bound to the agent.
targets:
  prod:
    agent: curie-manager
    env: prod
    slack_channel: C0YOURCHANNEL
