# This bundle's repository toolchains and stdio MCP servers ship in its own
# runner layer (ADR 0173), not in the platform runner. Each Curie release
# publishes it, and `curie example dark-factory render` locks its digest. After editing
# runner.Dockerfile, rebuild it:
#   curie build --plugin-dir <this directory> --registry <ref>
connectors: {}
runner:
  build:
    context: .
    dockerfile: runner.Dockerfile
    platforms: [linux/amd64, linux/arm64]
