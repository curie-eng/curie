[project]
name = "curie-factory-preparation"
version = "0.1.0"
description = "Factory-owned local specification and ticket-set structural checks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/curie_factory_preparation"]

[tool.ruff]
extend = "../../../pyproject.toml"
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
