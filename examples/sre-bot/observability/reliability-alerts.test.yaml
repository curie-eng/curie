  # kube-state-metrics' own scrape target, as the kubernetes-service-endpoints
  # job presents it through the Service labelmap. Prometheus synthesizes `up`
  # after metric relabeling, so it carries no curie_source stamp. The node
  # exporter shares the job, and its target going down is not kube-state-metrics
  # going down. kube-state-metrics can answer on two targets, its metrics port
  # and its self-monitoring port, and one failing pages while the other answers.
  # absent() of a comparison and count() without `by` take no labels from the
  # selector, so the alert carries only its own.
  - name: kube-state-metrics gone from the scrape fires
