        values: '1x15'
    alert_rule_test:
      - eval_time: 4m
        alertname: CurieCoreWorkloadNotReady
        exp_alerts: []
      - eval_time: 5m
        alertname: CurieCoreWorkloadNotReady
        exp_alerts:
          - exp_labels:
              severity: page
              component: curie-core
              namespace: acme
              deployment: acme-curie-api
