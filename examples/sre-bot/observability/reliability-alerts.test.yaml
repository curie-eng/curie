              summary: A core Curie Deployment has an unavailable replica or is scaled to zero
              description: >-
                The api, worker or dispatcher of a Curie release has a replica
                that is not available, such as a crashed pod or a rollout
                whose new pod never became ready, or has been scaled to zero.
