  # Kubelet volume stats come from the node-role scrape, which carries the
  # curie_source stamp like the node rules above, for a volume in any
  # namespace. The threshold is strictly under 10 percent. A claim mounted on
  # two nodes is reported by both kubelets, and the lower free share decides
  # one alert. A second stack's series for the same claim has no stamp and
  # must not page this one.
  - name: a persistent volume at 5 percent free fires
    interval: 1m
    input_series:
      - series: 'kubelet_volume_stats_available_bytes{namespace="acme",persistentvolumeclaim="data-acme-curie-valkey-0",instance="acme-node-1",job="kubernetes-nodes",curie_source="curie-sre-bot"}'
        values: '5x20'
      - series: 'kubelet_volume_stats_capacity_bytes{namespace="acme",persistentvolumeclaim="data-acme-curie-valkey-0",instance="acme-node-1",job="kubernetes-nodes",curie_source="curie-sre-bot"}'
        values: '100x20'
    alert_rule_test:
      - eval_time: 14m
        alertname: CuriePersistentVolumeSpaceLow
        exp_alerts: []
      - eval_time: 15m
        alertname: CuriePersistentVolumeSpaceLow
        exp_alerts:
          - exp_labels:
              severity: page
              component: curie-storage
              namespace: acme
              persistentvolumeclaim: data-acme-curie-valkey-0
            exp_annotations:
              summary: A persistent volume has less than 10 percent free
              description: >-
                A persistent volume mounted on any node has stayed below 10
                percent free for 15 minutes. A full volume stops the workload
                that writes to it.

