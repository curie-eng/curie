rule_files:
  - reliability-alerts.rules.yaml

evaluation_interval: 5m

tests:
  - name: application metrics absent fires
    interval: 5m
    input_series: []
    alert_rule_test:
      - eval_time: 15m
        alertname: CurieApplicationMetricsAbsent
        exp_alerts:
          - exp_labels:
              component: curie-metrics
              severity: page
            exp_annotations:
              summary: Curie application metrics are absent from Prometheus
              description: >-
                No curie_turn_accepted_total series has been retained for 10
                minutes. Treat missing metrics as a failure, not as a quiet
                system.

  - name: application metrics recover when the series returns
    interval: 5m
    input_series:
      - series: 'curie_turn_accepted_total{service_name="curie-worker",source="worker",outcome="accepted"}'
        values: '1+1x6'
    alert_rule_test:
      - eval_time: 15m
        alertname: CurieApplicationMetricsAbsent
        exp_alerts: []

  - name: missed canary fires after accepted turns go quiet
    interval: 15m
    input_series:
      - series: 'curie_turn_accepted_total{service_name="curie-worker",source="worker",outcome="accepted"}'
        values: '1+1x20 21+0x680'
    alert_rule_test:
      - eval_time: 10h
        alertname: CurieTurnAcceptedStale
        exp_alerts:
          - exp_labels:
              component: curie-canary
              outcome: accepted
              service_name: curie-worker
              severity: page
              source: worker
            exp_annotations:
              summary: No Curie turn has been accepted for 90 minutes
              description: >-
                Turns were accepted in the last seven days, but none in the
                last 90 minutes. On the soak cadence that is a missed canary.

  - name: healthy canary cadence stays quiet
    interval: 15m
    input_series:
      - series: 'curie_turn_accepted_total{service_name="curie-worker",source="worker",outcome="accepted"}'
        values: '1+1x40'
    alert_rule_test:
      - eval_time: 10h
        alertname: CurieTurnAcceptedStale
        exp_alerts: []

  - name: classified task failure fires
    interval: 5m
    input_series:
      - series: 'curie_turn_completed_total{service_name="curie-worker",source="worker",outcome="classified_failure"}'
        values: '0+1x6'
    alert_rule_test:
      - eval_time: 20m
        alertname: CurieTaskFailure
        exp_alerts:
          - exp_labels:
              component: curie-task
              outcome: classified_failure
              service_name: curie-worker
              severity: page
              source: worker
            exp_annotations:
              summary: A Curie turn completed as classified_failure
              description: >-
                curie_turn_completed_total with outcome classified_failure
                increased in the last 15 minutes.

  - name: successful completions stay quiet
    interval: 5m
    input_series:
      - series: 'curie_turn_completed_total{service_name="curie-worker",source="worker",outcome="done"}'
        values: '0+1x6'
    alert_rule_test:
      - eval_time: 20m
        alertname: CurieTaskFailure
        exp_alerts: []

  - name: oldest queued age fires
    interval: 5m
    input_series:
      - series: 'curie_queue_message_age_seconds{service_name="curie-worker",source="worker",outcome="pending"}'
        values: '1200+0x6'
    alert_rule_test:
      - eval_time: 20m
        alertname: CurieQueueMessageAgeHigh
        exp_alerts:
          - exp_labels:
              component: curie-queue
              outcome: pending
              service_name: curie-worker
              severity: page
              source: worker
            exp_annotations:
              summary: Oldest queued Curie message is older than 15 minutes
              description: >-
                curie_queue_message_age_seconds has stayed above 900 for 10
                minutes.

  - name: fresh queue age stays quiet
    interval: 5m
    input_series:
      - series: 'curie_queue_message_age_seconds{service_name="curie-worker",source="worker",outcome="pending"}'
        values: '30+0x6'
    alert_rule_test:
      - eval_time: 20m
        alertname: CurieQueueMessageAgeHigh
        exp_alerts: []

  - name: owed completion age fires
    interval: 5m
    input_series:
      - series: 'curie_completion_outbox_age_seconds{service_name="curie-worker",operation="observe",outcome="retry"}'
        values: '600+0x6'
    alert_rule_test:
      - eval_time: 20m
        alertname: CurieCompletionOutboxAgeHigh
        exp_alerts:
          - exp_labels:
              component: curie-completion
              operation: observe
              outcome: retry
              service_name: curie-worker
              severity: page
            exp_annotations:
              summary: An owed completion is older than five minutes
              description: >-
                curie_completion_outbox_age_seconds has stayed above 300 for
                10 minutes. A drained run queue does not clear this signal.

  - name: empty outbox age stays quiet
    interval: 5m
    input_series:
      - series: 'curie_completion_outbox_age_seconds{service_name="curie-worker",operation="observe",outcome="retry"}'
        values: '0+0x6'
    alert_rule_test:
      - eval_time: 20m
        alertname: CurieCompletionOutboxAgeHigh
        exp_alerts: []

  - name: missing outbox signal fires while turns flow
    interval: 5m
    input_series:
      - series: 'curie_turn_accepted_total{service_name="curie-worker",source="worker",outcome="accepted"}'
        values: '1+1x6'
    alert_rule_test:
      - eval_time: 20m
        alertname: CurieCompletionOutboxSignalAbsent
        exp_alerts:
          - exp_labels:
              component: curie-completion
              severity: page
            exp_annotations:
              summary: Completion-outbox metrics are absent while turns flow
              description: >-
                Turns are being accepted, but curie_completion_outbox is
                missing. Absent completion-delivery telemetry is a failure
                signal.

  - name: present outbox signal recovers absence
    interval: 5m
    input_series:
      - series: 'curie_turn_accepted_total{service_name="curie-worker",source="worker",outcome="accepted"}'
        values: '1+1x6'
      - series: 'curie_completion_outbox{service_name="curie-worker",operation="observe",outcome="retry"}'
        values: '0+0x6'
    alert_rule_test:
      - eval_time: 20m
        alertname: CurieCompletionOutboxSignalAbsent
        exp_alerts: []

  - name: repeated reply refusal fires
    interval: 5m
    input_series:
      - series: 'curie_reply_delivery_total{service_name="curie-worker",operation="post",role="client",outcome="failure"}'
        values: '0+2x8'
    alert_rule_test:
      - eval_time: 30m
        alertname: CurieReplyDeliveryRefused
        exp_alerts:
          - exp_labels:
              component: curie-delivery
              operation: post
              outcome: failure
              role: client
              service_name: curie-worker
              severity: page
            exp_annotations:
              summary: Repeated Curie reply delivery failures
              description: >-
                curie_reply_delivery_total with outcome failure increased by
                three or more in 15 minutes.

  - name: isolated reply failure stays quiet
    interval: 5m
    input_series:
      - series: 'curie_reply_delivery_total{service_name="curie-worker",operation="post",role="client",outcome="failure"}'
        values: '0+0x4 1 1 1'
    alert_rule_test:
      - eval_time: 30m
        alertname: CurieReplyDeliveryRefused
        exp_alerts: []

  - name: token rotation 5xx fires
    interval: 5m
    input_series:
      - series: 'curie_http_server_request_total{service_name="curie-api",operation="/channels/token",role="server",source="POST",outcome="5xx"}'
        values: '0+1x8'
    alert_rule_test:
      - eval_time: 25m
        alertname: CurieChannelTokenRotationFailed
        exp_alerts:
          - exp_labels:
              component: curie-token
              operation: /channels/token
              outcome: 5xx
              role: server
              service_name: curie-api
              severity: page
              source: POST
            exp_annotations:
              summary: Channel-token HTTP rotation returned 5xx
              description: >-
                curie_http_server_request_total for /channels/token with
                outcome 5xx increased in the last hour.

  - name: token rotation 2xx stays quiet
    interval: 5m
    input_series:
      - series: 'curie_http_server_request_total{service_name="curie-api",operation="/channels/token",role="server",source="POST",outcome="2xx"}'
        values: '0+1x8'
    alert_rule_test:
      - eval_time: 25m
        alertname: CurieChannelTokenRotationFailed
        exp_alerts: []

  - name: mail adapter unready fires
    interval: 5m
    input_series:
      - series: 'kube_deployment_status_replicas_unavailable{deployment="curie-mail-adapter",namespace="curie"}'
        values: '1+0x6'
    alert_rule_test:
      - eval_time: 20m
        alertname: CurieMailAdapterNotReady
        exp_alerts:
          - exp_labels:
              component: curie-token
              deployment: curie-mail-adapter
              namespace: curie
              severity: page
            exp_annotations:
              summary: Mail adapter replicas are unavailable
              description: >-
                The mail adapter Deployment has unavailable replicas. An
                expired channel token fails /readyz and surfaces here without
                inspecting a token value.

  - name: mail adapter ready stays quiet
    interval: 5m
    input_series:
      - series: 'kube_deployment_status_replicas_unavailable{deployment="curie-mail-adapter",namespace="curie"}'
        values: '0+0x6'
    alert_rule_test:
      - eval_time: 20m
        alertname: CurieMailAdapterNotReady
        exp_alerts: []

  - name: sustained low memory headroom fires
    interval: 5m
    input_series:
      - series: 'node_memory_MemAvailable_bytes{curie_source="curie-sre-bot",instance="k8:9101"}'
        values: '8+0x6'
      - series: 'node_memory_MemTotal_bytes{curie_source="curie-sre-bot",instance="k8:9101"}'
        values: '100+0x6'
    alert_rule_test:
      - eval_time: 20m
        alertname: CurieNodeMemoryHeadroomLow
        exp_alerts:
          - exp_labels:
              component: curie-node
              curie_source: curie-sre-bot
              instance: k8:9101
              severity: page
            exp_annotations:
              summary: Node memory headroom is below 10 percent
              description: >-
                A curie_source=curie-sre-bot memory series has had less than
                10 percent available for 15 minutes.

  - name: ordinary memory usage stays quiet
    interval: 5m
    input_series:
      - series: 'node_memory_MemAvailable_bytes{curie_source="curie-sre-bot",instance="k8:9101"}'
        values: '30+0x6'
      - series: 'node_memory_MemTotal_bytes{curie_source="curie-sre-bot",instance="k8:9101"}'
        values: '100+0x6'
    alert_rule_test:
      - eval_time: 20m
        alertname: CurieNodeMemoryHeadroomLow
        exp_alerts: []

  - name: root disk pressure fires
    interval: 5m
    input_series:
      - series: 'node_filesystem_avail_bytes{curie_source="curie-sre-bot",instance="k8:9101",mountpoint="/",fstype="ext4"}'
        values: '10+0x6'
      - series: 'node_filesystem_size_bytes{curie_source="curie-sre-bot",instance="k8:9101",mountpoint="/",fstype="ext4"}'
        values: '100+0x6'
    alert_rule_test:
      - eval_time: 20m
        alertname: CurieRootDiskPressure
        exp_alerts:
          - exp_labels:
              component: curie-node
              curie_source: curie-sre-bot
              fstype: ext4
              instance: k8:9101
              mountpoint: /
              severity: page
            exp_annotations:
              summary: Root disk has less than 20 percent free
              description: >-
                A curie_source=curie-sre-bot root filesystem has stayed below
                20 percent free for 15 minutes.

  - name: healthy root disk stays quiet
    interval: 5m
    input_series:
      - series: 'node_filesystem_avail_bytes{curie_source="curie-sre-bot",instance="k8:9101",mountpoint="/",fstype="ext4"}'
        values: '40+0x6'
      - series: 'node_filesystem_size_bytes{curie_source="curie-sre-bot",instance="k8:9101",mountpoint="/",fstype="ext4"}'
        values: '100+0x6'
    alert_rule_test:
      - eval_time: 20m
        alertname: CurieRootDiskPressure
        exp_alerts: []

  - name: duplicate node exporter fires
    interval: 5m
    input_series:
      - series: 'node_memory_MemAvailable_bytes{curie_source="curie-sre-bot",instance="k8:9100"}'
        values: '30+0x6'
      - series: 'node_memory_MemAvailable_bytes{curie_source="curie-sre-bot",instance="k8:9101"}'
        values: '30+0x6'
    alert_rule_test:
      - eval_time: 20m
        alertname: CurieDuplicateNodeExporter
        exp_alerts:
          - exp_labels:
              component: curie-node
              severity: page
            exp_annotations:
              summary: Both 9100 and 9101 node-exporter series are retained
              description: >-
                node_memory_MemAvailable_bytes with curie_source=curie-sre-bot
                has series on :9100 and :9101. Naive sums of that set
                double-count the node. Isolate scrape to one intended series.

  - name: single intended node exporter stays quiet
    interval: 5m
    input_series:
      - series: 'node_memory_MemAvailable_bytes{curie_source="curie-sre-bot",instance="k8:9101"}'
        values: '30+0x6'
    alert_rule_test:
      - eval_time: 20m
        alertname: CurieDuplicateNodeExporter
        exp_alerts: []

  - name: one series per node on 9101 stays quiet
    interval: 5m
    input_series:
      - series: 'node_memory_MemAvailable_bytes{curie_source="curie-sre-bot",instance="k8a:9101"}'
        values: '30+0x6'
      - series: 'node_memory_MemAvailable_bytes{curie_source="curie-sre-bot",instance="k8b:9101"}'
        values: '30+0x6'
    alert_rule_test:
      - eval_time: 20m
        alertname: CurieDuplicateNodeExporter
        exp_alerts: []

  - name: supervised restart loop fires on repeated restarts
    interval: 5m
    input_series:
      - series: 'curie_worker_supervised_restart_total{service_name="curie-worker",operation="publications",outcome="restart"}'
        values: '0 1 2 3 4 5 6 7 8'
    alert_rule_test:
      - eval_time: 40m
        alertname: CurieWorkerSupervisedRestartLoop
        exp_alerts:
          - exp_labels:
              severity: page
              component: curie-worker
              service_name: curie-worker
              operation: publications
              outcome: restart
            exp_annotations:
              summary: A supervised worker task is crash-looping
              description: >-
                curie_worker_supervised_restart_total with outcome restart
                increased by three or more in 30 minutes for one operation.
                The task is backing off and will be parked if it keeps
                crashing.

  - name: supervised restart loop stays quiet on a single restart
    interval: 5m
    input_series:
      - series: 'curie_worker_supervised_restart_total{service_name="curie-worker",operation="runs",outcome="restart"}'
        values: '0 1 1 1 1 1 1 1 1'
    alert_rule_test:
      - eval_time: 40m
        alertname: CurieWorkerSupervisedRestartLoop
        exp_alerts: []

  - name: supervised task parked fires on the first give_up sample
    interval: 5m
    input_series:
      # Absent, then constant at 1: the real shape of a counter that is
      # emitted exactly once when the supervisor parks the task.
      - series: 'curie_worker_supervised_restart_total{service_name="curie-worker",operation="runs",outcome="give_up"}'
        values: '_ _ 1 1 1'
    alert_rule_test:
      - eval_time: 15m
        alertname: CurieWorkerSupervisedTaskParked
        exp_alerts:
          - exp_labels:
              severity: page
              component: curie-worker
              service_name: curie-worker
              operation: runs
              outcome: give_up
            exp_annotations:
              summary: A supervised worker task was parked after repeated crashes
              description: >-
                curie_worker_supervised_restart_total with outcome give_up
                is present. The named operation stopped restarting and stays
                down until the worker pod restarts.

  - name: supervised task parked stays quiet when only restarts are seen
    interval: 5m
    input_series:
      - series: 'curie_worker_supervised_restart_total{service_name="curie-worker",operation="runs",outcome="restart"}'
        values: '1 2 3 4 5'
    alert_rule_test:
      - eval_time: 15m
        alertname: CurieWorkerSupervisedTaskParked
        exp_alerts: []

  # A mail adapter scaled to zero is stopped. kube-state-metrics reports
  # `replicas_unavailable` as spec minus available, so at zero replicas it is
  # 0 - 0 = 0 and a rule on `unavailable > 0` cannot see it. Found on a
  # downstream EKS cluster by scaling one to zero on purpose: nothing fired.
  - name: a mail adapter scaled to zero fires
    interval: 1m
    input_series:
      - series: 'kube_deployment_spec_replicas{namespace="curie",deployment="mail-adapter"}'
        values: '0x15'
      - series: 'kube_deployment_status_replicas_unavailable{namespace="curie",deployment="mail-adapter"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: CurieMailAdapterNotReady
        exp_alerts:
          - exp_labels:
              severity: page
              component: curie-token
              namespace: curie
              deployment: mail-adapter
            exp_annotations:
              summary: Mail adapter replicas are unavailable
              description: The mail adapter Deployment has unavailable replicas. An expired channel token fails /readyz and surfaces here without inspecting a token value.

  # One installation can run several mail adapters, one per mailbox, named
  # with a suffix. PromQL label matchers are fully anchored, so
  # `deployment=~".*mail-adapter"` matches `mail-adapter` and not
  # `mail-adapter-brand`. On the downstream cluster that measured this, two of
  # its three adapters could never alert.
  - name: a suffixed mail adapter with unavailable replicas fires
    interval: 1m
    input_series:
      - series: 'kube_deployment_spec_replicas{namespace="curie",deployment="mail-adapter-brand"}'
        values: '1x15'
      - series: 'kube_deployment_status_replicas_unavailable{namespace="curie",deployment="mail-adapter-brand"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: CurieMailAdapterNotReady
        exp_alerts:
          - exp_labels:
              severity: page
              component: curie-token
              namespace: curie
              deployment: mail-adapter-brand
            exp_annotations:
              summary: Mail adapter replicas are unavailable
              description: The mail adapter Deployment has unavailable replicas. An expired channel token fails /readyz and surfaces here without inspecting a token value.

  # A connector is a Deployment per (agent, connector) named
  # `<release>-<agent>-mcp-<connector>`. When one is down its agent still
  # answers -- it says it cannot reach the systems it reads from -- so nothing
  # else in this rule set notices. No rule watched a connector at all.
  - name: a connector with no available replica fires
    interval: 1m
    input_series:
      - series: 'kube_deployment_spec_replicas{namespace="curie",deployment="curie-brand-mcp-brand"}'
        values: '1x15'
      - series: 'kube_deployment_status_replicas_unavailable{namespace="curie",deployment="curie-brand-mcp-brand"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: CurieConnectorNotReady
        exp_alerts:
          - exp_labels:
              severity: page
              component: curie-connector
              namespace: curie
              deployment: curie-brand-mcp-brand
            exp_annotations:
              summary: A connector Deployment is not serving
              description: A connector has no available replica, or has been scaled to zero. Its agent still answers, and tells the person it cannot reach the systems it reads from.

  - name: a connector scaled to zero fires
    interval: 1m
    input_series:
      - series: 'kube_deployment_spec_replicas{namespace="curie",deployment="curie-brand-mcp-brand"}'
        values: '0x15'
      - series: 'kube_deployment_status_replicas_unavailable{namespace="curie",deployment="curie-brand-mcp-brand"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: CurieConnectorNotReady
        exp_alerts:
          - exp_labels:
              severity: page
              component: curie-connector
              namespace: curie
              deployment: curie-brand-mcp-brand
            exp_annotations:
              summary: A connector Deployment is not serving
              description: A connector has no available replica, or has been scaled to zero. Its agent still answers, and tells the person it cannot reach the systems it reads from.

  - name: a healthy connector stays quiet
    interval: 1m
    input_series:
      - series: 'kube_deployment_spec_replicas{namespace="curie",deployment="curie-brand-mcp-brand"}'
        values: '1x15'
      - series: 'kube_deployment_status_replicas_unavailable{namespace="curie",deployment="curie-brand-mcp-brand"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: CurieConnectorNotReady
        exp_alerts: []

  # The dispatcher down is the quietest failure an installation has: every pod
  # is Running, nothing errors, and no Slack message reaches any agent.
  # CurieWorkerSupervisedRestartLoop watches the worker's own supervised-task
  # counter, not a pod restarting, and nothing watched the dispatcher.
  - name: a crash-looping dispatcher fires
    interval: 1m
    input_series:
      - series: 'kube_pod_container_status_restarts_total{namespace="curie",pod="curie-dispatcher-7dfc698888-q9nr5",container="dispatcher"}'
        values: '0+1x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: CurieDispatcherRestartLoop
        exp_alerts:
          - exp_labels:
              severity: page
              component: curie-dispatcher
              namespace: curie
              pod: curie-dispatcher-7dfc698888-q9nr5
              container: dispatcher
            exp_annotations:
              summary: The dispatcher is crash-looping
              description: A dispatcher container restarted three or more times in 30 minutes. While it is down no Slack message reaches any agent, and every other pod still looks healthy.

  - name: a dispatcher that restarted once and settled stays quiet
    interval: 1m
    input_series:
      - series: 'kube_pod_container_status_restarts_total{namespace="curie",pod="curie-dispatcher-7dfc698888-q9nr5",container="dispatcher"}'
        values: '0 1x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: CurieDispatcherRestartLoop
        exp_alerts: []

  # kube-state-metrics reports three series per node for the Ready condition,
  # one per status, and exactly one of them is 1. The rule reads the
  # status="true" series, so a node that reports false and a node that stopped
  # reporting (unknown) both fire, and the other two series never do.
  - name: a node reporting NotReady fires
    interval: 1m
    input_series:
      - series: 'kube_node_status_condition{node="acme-node-1",condition="Ready",status="true"}'
        values: '0x15'
      - series: 'kube_node_status_condition{node="acme-node-1",condition="Ready",status="false"}'
        values: '1x15'
      - series: 'kube_node_status_condition{node="acme-node-1",condition="Ready",status="unknown"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: CurieNodeNotReady
        exp_alerts:
          - exp_labels:
              severity: page
              component: curie-node
              node: acme-node-1
              condition: Ready
              status: "true"
            exp_annotations:
              summary: A node is not Ready
              description: A node has not reported Ready for 5 minutes. Pods on it stop being scheduled, and a sandbox placed there cannot start.

  - name: a node whose Ready condition is unknown fires
    interval: 1m
    input_series:
      - series: 'kube_node_status_condition{node="acme-node-1",condition="Ready",status="true"}'
        values: '0x15'
      - series: 'kube_node_status_condition{node="acme-node-1",condition="Ready",status="false"}'
        values: '0x15'
      - series: 'kube_node_status_condition{node="acme-node-1",condition="Ready",status="unknown"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: CurieNodeNotReady
        exp_alerts:
          - exp_labels:
              severity: page
              component: curie-node
              node: acme-node-1
              condition: Ready
              status: "true"
            exp_annotations:
              summary: A node is not Ready
              description: A node has not reported Ready for 5 minutes. Pods on it stop being scheduled, and a sandbox placed there cannot start.

  - name: a Ready node stays quiet
    interval: 1m
    input_series:
      - series: 'kube_node_status_condition{node="acme-node-1",condition="Ready",status="true"}'
        values: '1x15'
      - series: 'kube_node_status_condition{node="acme-node-1",condition="Ready",status="false"}'
        values: '0x15'
      - series: 'kube_node_status_condition{node="acme-node-1",condition="Ready",status="unknown"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: CurieNodeNotReady
        exp_alerts: []

  # kube-state-metrics emits a waiting_reason series only while the container
  # waits, so the series exists or it does not. A container that crashes, runs
  # briefly and crashes again drops out between scrapes, and the scrape that
  # misses it writes a staleness marker. The flapping case alternates a sample
  # and a marker each minute, so an instant `== 1` rule would see no series at
  # the 5m and 15m evaluations and reset its `for` each time.
  - name: a crash-looping container fires
    interval: 1m
    input_series:
      - series: 'kube_pod_container_status_waiting_reason{namespace="acme",pod="acme-curie-api-7dfc698888-q9nr5",container="api",reason="CrashLoopBackOff"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: CuriePodCrashLooping
        exp_alerts:
          - exp_labels:
              severity: page
              component: curie-pod
              namespace: acme
              pod: acme-curie-api-7dfc698888-q9nr5
              container: api
              reason: CrashLoopBackOff
            exp_annotations:
              summary: A container is crash-looping
              description: A container has been in CrashLoopBackOff for 10 minutes. It keeps failing on start and waits longer before each retry.

  - name: a container flapping between waiting and running fires
    interval: 1m
    input_series:
      - series: 'kube_pod_container_status_waiting_reason{namespace="acme",pod="acme-curie-api-7dfc698888-q9nr5",container="api",reason="CrashLoopBackOff"}'
        values: '1 stale 1 stale 1 stale 1 stale 1 stale 1 stale 1 stale 1 stale 1 stale 1 stale 1'
    alert_rule_test:
      - eval_time: 15m
        alertname: CuriePodCrashLooping
        exp_alerts:
          - exp_labels:
              severity: page
              component: curie-pod
              namespace: acme
              pod: acme-curie-api-7dfc698888-q9nr5
              container: api
              reason: CrashLoopBackOff
            exp_annotations:
              summary: A container is crash-looping
              description: A container has been in CrashLoopBackOff for 10 minutes. It keeps failing on start and waits longer before each retry.

  - name: a container waiting for another reason stays quiet
    interval: 1m
    input_series:
      - series: 'kube_pod_container_status_waiting_reason{namespace="acme",pod="acme-curie-api-7dfc698888-q9nr5",container="api",reason="ContainerCreating"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: CuriePodCrashLooping
        exp_alerts: []

  # The core Deployments are `<fullname>-api`, `-worker` and `-dispatcher`.
  # Same two terms as the connector rule, for the same reason. The chart's
  # Langfuse worker also ends in `-worker`, and a connector for an agent can
  # end in `-api`; neither belongs to this rule.
  - name: a core api scaled to zero fires
    interval: 1m
    input_series:
      - series: 'kube_deployment_spec_replicas{namespace="acme",deployment="acme-curie-api"}'
        values: '0x15'
      - series: 'kube_deployment_status_replicas_unavailable{namespace="acme",deployment="acme-curie-api"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: CurieCoreWorkloadNotReady
        exp_alerts:
          - exp_labels:
              severity: page
              component: curie-core
              namespace: acme
              deployment: acme-curie-api
            exp_annotations:
              summary: A core Curie Deployment is not serving
              description: The api, worker or dispatcher has no available replica, or has been scaled to zero. The api readiness probe queries the database, so a database outage, including one outside the cluster, surfaces here as an unavailable api.

  - name: a core worker with an unavailable replica fires
    interval: 1m
    input_series:
      - series: 'kube_deployment_spec_replicas{namespace="acme",deployment="acme-curie-worker"}'
        values: '1x15'
      - series: 'kube_deployment_status_replicas_unavailable{namespace="acme",deployment="acme-curie-worker"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: CurieCoreWorkloadNotReady
        exp_alerts:
          - exp_labels:
              severity: page
              component: curie-core
              namespace: acme
              deployment: acme-curie-worker
            exp_annotations:
              summary: A core Curie Deployment is not serving
              description: The api, worker or dispatcher has no available replica, or has been scaled to zero. The api readiness probe queries the database, so a database outage, including one outside the cluster, surfaces here as an unavailable api.

  - name: a healthy core dispatcher stays quiet
    interval: 1m
    input_series:
      - series: 'kube_deployment_spec_replicas{namespace="acme",deployment="acme-curie-dispatcher"}'
        values: '1x15'
      - series: 'kube_deployment_status_replicas_unavailable{namespace="acme",deployment="acme-curie-dispatcher"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: CurieCoreWorkloadNotReady
        exp_alerts: []

  - name: a langfuse worker scaled to zero stays quiet
    interval: 1m
    input_series:
      - series: 'kube_deployment_spec_replicas{namespace="acme",deployment="acme-curie-langfuse-worker"}'
        values: '0x15'
      - series: 'kube_deployment_status_replicas_unavailable{namespace="acme",deployment="acme-curie-langfuse-worker"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: CurieCoreWorkloadNotReady
        exp_alerts: []

  - name: a connector ending in api scaled to zero stays quiet
    interval: 1m
    input_series:
      - series: 'kube_deployment_spec_replicas{namespace="acme",deployment="acme-curie-acme-bot-mcp-api"}'
        values: '0x15'
      - series: 'kube_deployment_status_replicas_unavailable{namespace="acme",deployment="acme-curie-acme-bot-mcp-api"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: CurieCoreWorkloadNotReady
        exp_alerts: []

  # Valkey and Postgres are StatefulSets named `<fullname>-valkey` and
  # `<fullname>-postgres`. Ready below desired is the first term. Scaled to
  # zero is the second, since ready 0 is not below desired 0. The two terms
  # cannot both hold for one StatefulSet.
  - name: a valkey with no ready replica fires
    interval: 1m
    input_series:
      - series: 'kube_statefulset_replicas{namespace="acme",statefulset="acme-curie-valkey"}'
        values: '1x15'
      - series: 'kube_statefulset_status_replicas_ready{namespace="acme",statefulset="acme-curie-valkey"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: CurieStateStoreNotReady
        exp_alerts:
          - exp_labels:
              severity: page
              component: curie-state
              namespace: acme
              statefulset: acme-curie-valkey
            exp_annotations:
              summary: Valkey or Postgres is not ready
              description: >-
                A Valkey or Postgres StatefulSet has fewer ready replicas than
                it asks for, or has been scaled to zero. Every agent depends on
                both: Valkey carries the run queue and Postgres the agents and
                their state.

  - name: a postgres scaled to zero fires
    interval: 1m
    input_series:
      - series: 'kube_statefulset_replicas{namespace="acme",statefulset="acme-curie-postgres"}'
        values: '0x15'
      - series: 'kube_statefulset_status_replicas_ready{namespace="acme",statefulset="acme-curie-postgres"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: CurieStateStoreNotReady
        exp_alerts:
          - exp_labels:
              severity: page
              component: curie-state
              namespace: acme
              statefulset: acme-curie-postgres
            exp_annotations:
              summary: Valkey or Postgres is not ready
              description: >-
                A Valkey or Postgres StatefulSet has fewer ready replicas than
                it asks for, or has been scaled to zero. Every agent depends on
                both: Valkey carries the run queue and Postgres the agents and
                their state.

  - name: a valkey with every replica ready stays quiet
    interval: 1m
    input_series:
      - series: 'kube_statefulset_replicas{namespace="acme",statefulset="acme-curie-valkey"}'
        values: '1x15'
      - series: 'kube_statefulset_status_replicas_ready{namespace="acme",statefulset="acme-curie-valkey"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: CurieStateStoreNotReady
        exp_alerts: []

  # Both StatefulSet series come from one kube-state-metrics target, so they
  # share every label but __name__, and the alert keeps all of them whichever
  # term holds. Matching the first term `on` a subset of labels would give it a
  # smaller label set than the second, and a store going from not ready to
  # scaled to zero would become a new alert whose `for` starts again. Here
  # the scale to zero lands at 7m, so the 10m evaluation is 10 minutes into
  # the outage but only 3 minutes into the second term.
  - name: a valkey with no ready replica fires with every target label
    interval: 1m
    input_series:
      - series: 'kube_statefulset_replicas{namespace="acme",statefulset="acme-curie-valkey",job="kubernetes-service-endpoints",instance="10.0.0.10:8080",curie_source="curie-sre-bot"}'
        values: '1x15'
      - series: 'kube_statefulset_status_replicas_ready{namespace="acme",statefulset="acme-curie-valkey",job="kubernetes-service-endpoints",instance="10.0.0.10:8080",curie_source="curie-sre-bot"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: CurieStateStoreNotReady
        exp_alerts:
          - exp_labels:
              severity: page
              component: curie-state
              namespace: acme
              statefulset: acme-curie-valkey
              job: kubernetes-service-endpoints
              instance: "10.0.0.10:8080"
              curie_source: curie-sre-bot
            exp_annotations:
              summary: Valkey or Postgres is not ready
              description: >-
                A Valkey or Postgres StatefulSet has fewer ready replicas than
                it asks for, or has been scaled to zero. Every agent depends on
                both: Valkey carries the run queue and Postgres the agents and
                their state.

  - name: a valkey scaled to zero while not ready keeps firing
    interval: 1m
    input_series:
      - series: 'kube_statefulset_replicas{namespace="acme",statefulset="acme-curie-valkey",job="kubernetes-service-endpoints",instance="10.0.0.10:8080",curie_source="curie-sre-bot"}'
        values: '1x6 0x9'
      - series: 'kube_statefulset_status_replicas_ready{namespace="acme",statefulset="acme-curie-valkey",job="kubernetes-service-endpoints",instance="10.0.0.10:8080",curie_source="curie-sre-bot"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: CurieStateStoreNotReady
        exp_alerts:
          - exp_labels:
              severity: page
              component: curie-state
              namespace: acme
              statefulset: acme-curie-valkey
              job: kubernetes-service-endpoints
              instance: "10.0.0.10:8080"
              curie_source: curie-sre-bot
            exp_annotations:
              summary: Valkey or Postgres is not ready
              description: >-
                A Valkey or Postgres StatefulSet has fewer ready replicas than
                it asks for, or has been scaled to zero. Every agent depends on
                both: Valkey carries the run queue and Postgres the agents and
                their state.

  # Kubelet volume stats come from the node-role scrape, which carries the
  # curie_source stamp like the node rules above. A second stack's series for
  # the same claim has no stamp and must not page this one.
  - name: a persistent volume under 10 percent free fires
    interval: 1m
    input_series:
      - series: 'kubelet_volume_stats_available_bytes{namespace="acme",persistentvolumeclaim="data-acme-curie-valkey-0",job="kubernetes-nodes",curie_source="curie-sre-bot"}'
        values: '5x25'
      - series: 'kubelet_volume_stats_capacity_bytes{namespace="acme",persistentvolumeclaim="data-acme-curie-valkey-0",job="kubernetes-nodes",curie_source="curie-sre-bot"}'
        values: '100x25'
    alert_rule_test:
      - eval_time: 20m
        alertname: CuriePersistentVolumeSpaceLow
        exp_alerts:
          - exp_labels:
              severity: page
              component: curie-storage
              namespace: acme
              persistentvolumeclaim: data-acme-curie-valkey-0
              job: kubernetes-nodes
              curie_source: curie-sre-bot
            exp_annotations:
              summary: A persistent volume has less than 10 percent free
              description: A curie_source=curie-sre-bot volume series has stayed below 10 percent free for 15 minutes. A full volume stops the workload that writes to it.

  - name: a persistent volume half free stays quiet
    interval: 1m
    input_series:
      - series: 'kubelet_volume_stats_available_bytes{namespace="acme",persistentvolumeclaim="data-acme-curie-valkey-0",job="kubernetes-nodes",curie_source="curie-sre-bot"}'
        values: '50x25'
      - series: 'kubelet_volume_stats_capacity_bytes{namespace="acme",persistentvolumeclaim="data-acme-curie-valkey-0",job="kubernetes-nodes",curie_source="curie-sre-bot"}'
        values: '100x25'
    alert_rule_test:
      - eval_time: 20m
        alertname: CuriePersistentVolumeSpaceLow
        exp_alerts: []

  - name: an unstamped persistent volume under 10 percent free stays quiet
    interval: 1m
    input_series:
      - series: 'kubelet_volume_stats_available_bytes{namespace="acme",persistentvolumeclaim="data-acme-curie-valkey-0",job="kubernetes-nodes"}'
        values: '5x25'
      - series: 'kubelet_volume_stats_capacity_bytes{namespace="acme",persistentvolumeclaim="data-acme-curie-valkey-0",job="kubernetes-nodes"}'
        values: '100x25'
    alert_rule_test:
      - eval_time: 20m
        alertname: CuriePersistentVolumeSpaceLow
        exp_alerts: []
