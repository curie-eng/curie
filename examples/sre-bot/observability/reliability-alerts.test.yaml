  # The same two series with three restarts at 40m, 52m and 65m, a spread of 25
  # minutes. Both terms hold from 65m, a's until 68m and b's until 69m, short of
  # `for: 5m`, so neither fires. An offset over 30m keeps b's term until 70m and
  # fires it there.
