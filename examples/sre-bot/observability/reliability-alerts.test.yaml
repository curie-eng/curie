      - eval_time: 15m
        alertname: CurieKubeStateMetricsDown
        exp_alerts: []

  # A Curie counter series does not exist until its first measurement: the
  # OpenTelemetry SDK exports an attribute set only once something has been
  # recorded on it, so a failure counter reaches Prometheus already at its
  # first value, with no zero before it. The series below have that shape:
  # `_` until the first export, then the counter's value, never a leading 0.
  # Each process exports under its own `instance`, so a restarted worker's
  # counters are new series too. increase() cannot see a series' first
  # sample, so each counter rule also counts, from zero, a series that had no
  # sample in the hour ending one window ago.
  #
  # Timing. Rules evaluate every 1m, as in production, and so do the inputs,
  # so each eval_time is one evaluation. `last_over_time(X[1h] offset O)`
  # evaluated at t reads (t-O-1h, t-O], called the offset hour below; O is
  # the rule's window. An instant selector looks back 5m, left-open. Promtool
  # has no history before 0m: a series sampled from 0m is new there, and
  # becomes old once its first sample falls inside the offset hour.

  # First export at 1m. Pending from 1m and firing at 6m on the new-series term
  # alone, since a counter flat at 1 never increases. Still firing at 15m, where
  # the offset hour ends at 0m and finds nothing: an offset of 14m or less
  # reaches 1m there and goes quiet. Quiet at 16m, where the offset hour ends at
  # 1m: an offset over 15m still fires there.
  - name: classified task failure fires on a new series' first sample
    interval: 1m
    input_series:
      - series: 'curie_turn_completed_total{service_name="curie-worker",source="worker",outcome="classified_failure"}'
        values: '_ 1x40'
    alert_rule_test:
      - eval_time: 5m
        alertname: CurieTaskFailure
        exp_alerts: []
      - eval_time: 6m
        alertname: CurieTaskFailure
        exp_alerts:
          - exp_labels:
              component: curie-task
              outcome: classified_failure
              service_name: curie-worker
              severity: page
              source: worker
            exp_annotations:
              summary: A Curie turn completed as classified_failure
              description: >-
                curie_turn_completed_total with outcome classified_failure
                increased in the last 15 minutes, counting a series' first
                sample as an increase from zero.
      - eval_time: 15m
        alertname: CurieTaskFailure
        exp_alerts:
          - exp_labels:
              component: curie-task
              outcome: classified_failure
              service_name: curie-worker
              severity: page
              source: worker
            exp_annotations:
              summary: A Curie turn completed as classified_failure
              description: >-
                curie_turn_completed_total with outcome classified_failure
                increased in the last 15 minutes, counting a series' first
                sample as an increase from zero.
      - eval_time: 16m
        alertname: CurieTaskFailure
        exp_alerts: []

  # Sampled from 0m, so new until the offset hour reaches its first sample: it
  # fires from 5m to 14m. At 15m the offset hour ends at 0m, and a counter flat
  # at 1 has not increased: quiet. An offset over 15m still reads nothing at 15m
  # and fires. 40m is the steady state: a series older than the window that does
  # not increase.
  - name: a classified failure series flat at 1 stays quiet once older than the window
    interval: 1m
    input_series:
      - series: 'curie_turn_completed_total{service_name="curie-worker",source="worker",outcome="classified_failure"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 15m
        alertname: CurieTaskFailure
        exp_alerts: []
      - eval_time: 40m
        alertname: CurieTaskFailure
        exp_alerts: []

  # The new-series term keeps the rule's selector: a new series of another
  # outcome is not a failure.
  - name: a new successful completion series stays quiet
    interval: 1m
    input_series:
      - series: 'curie_turn_completed_total{service_name="curie-worker",source="worker",outcome="done"}'
        values: '_ 1x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: CurieTaskFailure
        exp_alerts: []

  # Both terms hold from 2m to 15m. `or` matches on every label but the metric
  # name, so they give one series and one alert; two series with one label set
  # would fail the rule's evaluation. From 16m only the increase term holds, and
  # the alert keeps its labels.
  - name: a new classified failure series that keeps failing fires once
    interval: 1m
    input_series:
      - series: 'curie_turn_completed_total{service_name="curie-worker",source="worker",outcome="classified_failure"}'
        values: '_ 1+1x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: CurieTaskFailure
        exp_alerts:
          - exp_labels:
              component: curie-task
              outcome: classified_failure
              service_name: curie-worker
              severity: page
              source: worker
            exp_annotations:
              summary: A Curie turn completed as classified_failure
              description: >-
                curie_turn_completed_total with outcome classified_failure
                increased in the last 15 minutes, counting a series' first
                sample as an increase from zero.
      - eval_time: 30m
        alertname: CurieTaskFailure
        exp_alerts:
          - exp_labels:
              component: curie-task
              outcome: classified_failure
              service_name: curie-worker
              severity: page
              source: worker
            exp_annotations:
              summary: A Curie turn completed as classified_failure
              description: >-
                curie_turn_completed_total with outcome classified_failure
                increased in the last 15 minutes, counting a series' first
                sample as an increase from zero.

  # A worker restart. The old process's series, flat at 1, has its last export
  # at 40m; the new process's first failure is exported at 42m under its own
  # instance, as a new series. Quiet at 40m. Pending from 42m and firing at 47m
  # with the new instance's labels only. The old series is another label set and
  # plays no part in the new one's term.
  - name: classified task failure fires on the first failure after a worker restart
    interval: 1m
    input_series:
      - series: 'curie_turn_completed_total{service_name="curie-worker",source="worker",outcome="classified_failure",instance="curie-worker-a"}'
        values: '1x40'
      - series: 'curie_turn_completed_total{service_name="curie-worker",source="worker",outcome="classified_failure",instance="curie-worker-b"}'
        values: '_x42 1x30'
    alert_rule_test:
      - eval_time: 40m
        alertname: CurieTaskFailure
        exp_alerts: []
      - eval_time: 46m
        alertname: CurieTaskFailure
        exp_alerts: []
      - eval_time: 47m
        alertname: CurieTaskFailure
        exp_alerts:
          - exp_labels:
              component: curie-task
              outcome: classified_failure
              service_name: curie-worker
              severity: page
              source: worker
              instance: curie-worker-b
            exp_annotations:
              summary: A Curie turn completed as classified_failure
              description: >-
                curie_turn_completed_total with outcome classified_failure
                increased in the last 15 minutes, counting a series' first
                sample as an increase from zero.

  # One series, flat at 1, whose samples stop after 30m and resume at 51m, as
  # after a 20-minute pipeline outage. Its offset hour always holds a sample from
  # before the gap or after it, so it never looks new. 60m and 65m are where a
  # plain `X offset 15m` would find the gap and fire.
  - name: a classified failure series that resumes after a 20-minute gap stays quiet
    interval: 1m
    input_series:
      - series: 'curie_turn_completed_total{service_name="curie-worker",source="worker",outcome="classified_failure"}'
        values: '1x30 _x20 1x40'
    alert_rule_test:
      - eval_time: 60m
        alertname: CurieTaskFailure
        exp_alerts: []
      - eval_time: 65m
        alertname: CurieTaskFailure
        exp_alerts: []
      - eval_time: 90m
        alertname: CurieTaskFailure
        exp_alerts: []

  # The cost of the new-series term. A series at 1 whose samples stop after 30m
  # and resume at 100m, 70 minutes later. The offset hour at t is
  # (t-75m, t-15m]: it holds no sample once t-75m reaches 30m, at 105m, and holds
  # the resumed samples once t-15m reaches 100m, at 115m. So the series looks new
  # from 105m to 114m, ten evaluations: pending until 109m, firing from 110m to
  # 114m, quiet from 115m. It fires once. A gap refires only when it exceeds the
  # 1h lookback plus `for: 5m` by an evaluation, 66 minutes; a lookback of 59m
  # or 61m moves the firing a minute and fails at 109m or 110m.
  - name: a classified failure series that resumes after a 70-minute gap fires once
    interval: 1m
    input_series:
      - series: 'curie_turn_completed_total{service_name="curie-worker",source="worker",outcome="classified_failure"}'
        values: '1x30 _x69 1x40'
    alert_rule_test:
      - eval_time: 104m
        alertname: CurieTaskFailure
        exp_alerts: []
      - eval_time: 109m
        alertname: CurieTaskFailure
        exp_alerts: []
      - eval_time: 110m
        alertname: CurieTaskFailure
        exp_alerts:
          - exp_labels:
              component: curie-task
              outcome: classified_failure
              service_name: curie-worker
              severity: page
              source: worker
            exp_annotations:
              summary: A Curie turn completed as classified_failure
              description: >-
                curie_turn_completed_total with outcome classified_failure
                increased in the last 15 minutes, counting a series' first
                sample as an increase from zero.
      - eval_time: 114m
        alertname: CurieTaskFailure
        exp_alerts:
          - exp_labels:
              component: curie-task
              outcome: classified_failure
              service_name: curie-worker
              severity: page
              source: worker
            exp_annotations:
              summary: A Curie turn completed as classified_failure
              description: >-
                curie_turn_completed_total with outcome classified_failure
                increased in the last 15 minutes, counting a series' first
                sample as an increase from zero.
      - eval_time: 115m
        alertname: CurieTaskFailure
        exp_alerts: []
      - eval_time: 130m
        alertname: CurieTaskFailure
        exp_alerts: []

  # Samples stop after 30m and resume at 89m, 59 minutes later. The offset hour
  # would hold no sample from 105m, but it holds the resumed samples from 104m:
  # the series never looks new.
  - name: a classified failure series that resumes after a 59-minute gap stays quiet
    interval: 1m
    input_series:
      - series: 'curie_turn_completed_total{service_name="curie-worker",source="worker",outcome="classified_failure"}'
        values: '1x30 _x58 1x40'
    alert_rule_test:
      - eval_time: 95m
        alertname: CurieTaskFailure
        exp_alerts: []
      - eval_time: 104m
        alertname: CurieTaskFailure
        exp_alerts: []
      - eval_time: 110m
        alertname: CurieTaskFailure
        exp_alerts: []
      - eval_time: 120m
        alertname: CurieTaskFailure
        exp_alerts: []

  # First export at 1m. Pending from 1m, firing at 6m. Still firing at 60m, where
  # the offset hour ends at 0m: an offset of 59m or less reaches 1m there and
  # goes quiet. Quiet at 61m: an offset over 1h still fires there.
  - name: token rotation 5xx fires on a new series' first sample
    interval: 1m
    input_series:
      - series: 'curie_http_server_request_total{service_name="curie-api",operation="/channels/token",role="server",source="POST",outcome="5xx"}'
        values: '_ 1x80'
    alert_rule_test:
      - eval_time: 5m
        alertname: CurieChannelTokenRotationFailed
        exp_alerts: []
      - eval_time: 6m
        alertname: CurieChannelTokenRotationFailed
        exp_alerts:
          - exp_labels:
              component: curie-token
              operation: /channels/token
              outcome: 5xx
              role: server
              service_name: curie-api
              severity: page
              source: POST
            exp_annotations:
              summary: Channel-token HTTP rotation returned 5xx
              description: >-
                curie_http_server_request_total for /channels/token with
                outcome 5xx increased in the last hour, counting a series'
                first sample as an increase from zero.
      - eval_time: 60m
        alertname: CurieChannelTokenRotationFailed
        exp_alerts:
          - exp_labels:
              component: curie-token
              operation: /channels/token
              outcome: 5xx
              role: server
              service_name: curie-api
              severity: page
              source: POST
            exp_annotations:
              summary: Channel-token HTTP rotation returned 5xx
              description: >-
                curie_http_server_request_total for /channels/token with
                outcome 5xx increased in the last hour, counting a series'
                first sample as an increase from zero.
      - eval_time: 61m
        alertname: CurieChannelTokenRotationFailed
        exp_alerts: []

  # Sampled from 0m. At 60m the offset hour ends at 0m, and a counter flat at 1
  # has not increased in the hour: quiet. An offset over 1h still reads nothing
  # at 60m and fires. 90m is the steady state.
  - name: a token rotation 5xx series flat at 1 stays quiet once older than the window
    interval: 1m
    input_series:
      - series: 'curie_http_server_request_total{service_name="curie-api",operation="/channels/token",role="server",source="POST",outcome="5xx"}'
        values: '1x90'
    alert_rule_test:
      - eval_time: 60m
        alertname: CurieChannelTokenRotationFailed
        exp_alerts: []
      - eval_time: 90m
        alertname: CurieChannelTokenRotationFailed
        exp_alerts: []

  - name: a new token rotation 2xx series stays quiet
    interval: 1m
    input_series:
      - series: 'curie_http_server_request_total{service_name="curie-api",operation="/channels/token",role="server",source="POST",outcome="2xx"}'
        values: '_ 1x80'
    alert_rule_test:
      - eval_time: 10m
        alertname: CurieChannelTokenRotationFailed
        exp_alerts: []

  # Both terms hold from 2m to 60m and give one alert. From 61m only the increase
  # term holds.
  - name: a new token rotation 5xx series that keeps failing fires once
    interval: 1m
    input_series:
      - series: 'curie_http_server_request_total{service_name="curie-api",operation="/channels/token",role="server",source="POST",outcome="5xx"}'
