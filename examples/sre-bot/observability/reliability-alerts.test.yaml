              severity: page
              component: curie-node
              node: acme-node-1
            exp_annotations:
              summary: A node is not Ready or its kubelet is unreachable
              description: >-
                A node has not reported Ready, or this Prometheus has not
                reached its kubelet, for 5 minutes. A node that is not Ready
                takes no new pods, evicts the ones it has after five minutes,
                and cannot start a sandbox. If every node fires at once,
                suspect this Prometheus's own network rather than the nodes.

