              operation: post
              outcome: failure
              role: client
              service_name: curie-worker
              severity: page
              instance: curie-worker-a
            exp_annotations:
              summary: Repeated Curie reply delivery failures
              description: >-
                curie_reply_delivery_total with outcome failure increased by
                three or more in 15 minutes, counting a series' first sample
                as an increase from zero.
          - exp_labels:
              component: curie-delivery
              operation: post
              outcome: failure
              role: client
              service_name: curie-worker
              severity: page
              instance: curie-worker-b
            exp_annotations:
              summary: Repeated Curie reply delivery failures
              description: >-
                curie_reply_delivery_total with outcome failure increased by
                three or more in 15 minutes, counting a series' first sample
                as an increase from zero.
      - eval_time: 54m
        alertname: CurieReplyDeliveryRefused
        exp_alerts:
          - exp_labels:
              component: curie-delivery
              operation: post
              outcome: failure
              role: client
              service_name: curie-worker
              severity: page
              instance: curie-worker-b
            exp_annotations:
              summary: Repeated Curie reply delivery failures
              description: >-
                curie_reply_delivery_total with outcome failure increased by
                three or more in 15 minutes, counting a series' first sample
