  # kube-state-metrics' own scrape target, as the kubernetes-service-endpoints
  # job presents it through the Service labelmap. Prometheus synthesizes `up`
  # after metric relabeling, so it carries no curie_source stamp. The node
  # exporter shares the job, and its target going down is not kube-state-metrics
  # going down. kube-state-metrics can answer on two targets, its metrics port
  # and its self-monitoring port, and one failing pages while the other answers.
  # absent() of a comparison and count() without `by` take no labels from the
  # selector, so the alert carries only its own.
  - name: kube-state-metrics gone from the scrape fires
    interval: 1m
    input_series:
      - series: 'up{job="kubernetes-service-endpoints",app_kubernetes_io_name="prometheus-node-exporter",service="prometheus-prometheus-node-exporter",instance="10.0.0.11:9100",namespace="observability",node="acme-node-1"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 4m
        alertname: CurieKubeStateMetricsDown
        exp_alerts: []
      - eval_time: 5m
        alertname: CurieKubeStateMetricsDown
        exp_alerts:
          - exp_labels:
              severity: page
              component: curie-kube-state-metrics
            exp_annotations:
              summary: A kube-state-metrics scrape is failing
              description: >-
                A kube-state-metrics target has failed its scrape, or none has
                been scraped, for 5 minutes. The rules that read it may then
                see nothing, or only part of what they read, and can stay quiet
                whatever the cluster does: the mail adapter, connector,
                dispatcher, core workload, state store and crash loop rules,
                and the node rule's Ready term.

