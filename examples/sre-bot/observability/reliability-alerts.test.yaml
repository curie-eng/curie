rule_files:
  - reliability-alerts.rules.yaml

# Production evaluates every 60s, and so does this file.
evaluation_interval: 1m

tests:
  - name: application metrics absent fires
    interval: 5m
    input_series: []
    alert_rule_test:
      - eval_time: 15m
        alertname: CurieApplicationMetricsAbsent
        exp_alerts:
          - exp_labels:
              component: curie-metrics
              service_name: curie-api
              severity: page
            exp_annotations:
              summary: Curie application metrics are absent from Prometheus
              description: >-
                curie_queue_depth or curie_approval_pending has had no sample
                for about 15 minutes. The worker records curie_queue_depth on
                every maintenance tick and the api records
                curie_approval_pending on every sweep, so a missing gauge is a
                broken metrics pipeline, a dead process, or a worker or api that
                cannot read Valkey or Postgres, never a quiet system.
          - exp_labels:
              component: curie-metrics
              service_name: curie-worker
              severity: page
            exp_annotations:
              summary: Curie application metrics are absent from Prometheus
              description: >-
                curie_queue_depth or curie_approval_pending has had no sample
                for about 15 minutes. The worker records curie_queue_depth on
                every maintenance tick and the api records
                curie_approval_pending on every sweep, so a missing gauge is a
                broken metrics pipeline, a dead process, or a worker or api that
                cannot read Valkey or Postgres, never a quiet system.

  # Both gauges are missing until 15m while turns are accepted throughout: an
  # accepted-turn counter is not evidence the pipeline works. Firing at 10m,
  # one alert per missing gauge, each naming its service; quiet at 15m, the
  # first evaluation that finds both gauges again.
  - name: application metrics recover when both gauges return
    interval: 1m
    input_series:
      - series: 'curie_turn_accepted_total{service_name="curie-worker",source="worker",outcome="accepted"}'
        values: '1+1x30'
      - series: 'curie_queue_depth{service_name="curie-worker",source="worker",outcome="pending"}'
        values: '_x15 0x15'
      - series: 'curie_approval_pending{service_name="curie-api",operation="observe",outcome="pending"}'
        values: '_x15 0x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: CurieApplicationMetricsAbsent
        exp_alerts:
          - exp_labels:
              component: curie-metrics
              service_name: curie-api
              severity: page
            exp_annotations:
              summary: Curie application metrics are absent from Prometheus
              description: >-
                curie_queue_depth or curie_approval_pending has had no sample
                for about 15 minutes. The worker records curie_queue_depth on
                every maintenance tick and the api records
                curie_approval_pending on every sweep, so a missing gauge is a
                broken metrics pipeline, a dead process, or a worker or api that
                cannot read Valkey or Postgres, never a quiet system.
          - exp_labels:
              component: curie-metrics
              service_name: curie-worker
              severity: page
            exp_annotations:
              summary: Curie application metrics are absent from Prometheus
              description: >-
                curie_queue_depth or curie_approval_pending has had no sample
                for about 15 minutes. The worker records curie_queue_depth on
                every maintenance tick and the api records
                curie_approval_pending on every sweep, so a missing gauge is a
                broken metrics pipeline, a dead process, or a worker or api that
                cannot read Valkey or Postgres, never a quiet system.
      - eval_time: 15m
        alertname: CurieApplicationMetricsAbsent
        exp_alerts: []

  - name: missed canary fires after accepted turns go quiet
    interval: 15m
    input_series:
      - series: 'curie_turn_accepted_total{service_name="curie-worker",source="worker",outcome="accepted"}'
        values: '1+1x20 21+0x680'
    alert_rule_test:
      - eval_time: 10h
        alertname: CurieTurnAcceptedStale
        exp_alerts:
          - exp_labels:
              component: curie-canary
              outcome: accepted
              service_name: curie-worker
              severity: page
              source: worker
            exp_annotations:
              summary: No Curie turn has been accepted for 90 minutes
              description: >-
                Turns were accepted in the last seven days, but none in the
                last 90 minutes. On the soak cadence that is a missed canary.

  - name: healthy canary cadence stays quiet
    interval: 15m
    input_series:
      - series: 'curie_turn_accepted_total{service_name="curie-worker",source="worker",outcome="accepted"}'
        values: '1+1x40'
    alert_rule_test:
      - eval_time: 10h
        alertname: CurieTurnAcceptedStale
        exp_alerts: []

  - name: classified task failure fires
    interval: 5m
    input_series:
      - series: 'curie_turn_completed_total{service_name="curie-worker",source="worker",outcome="classified_failure"}'
        values: '0+1x6'
    alert_rule_test:
      - eval_time: 20m
        alertname: CurieTaskFailure
        exp_alerts:
          - exp_labels:
              component: curie-task
              outcome: classified_failure
              service_name: curie-worker
              severity: page
              source: worker
            exp_annotations:
              summary: A Curie turn completed as classified_failure
              description: >-
                curie_turn_completed_total with outcome classified_failure
                increased in the last 15 minutes, counting a series' first
                sample as an increase from zero.

  - name: successful completions stay quiet
    interval: 5m
    input_series:
      - series: 'curie_turn_completed_total{service_name="curie-worker",source="worker",outcome="done"}'
        values: '0+1x6'
    alert_rule_test:
      - eval_time: 20m
        alertname: CurieTaskFailure
        exp_alerts: []

  # curie_queue_lag is the worker's gauge of the whole run stream's lag, one
  # series per worker process, recorded on every maintenance tick, about every
  # 30s. The rule drops the instance and reads that lag at each minute of the
  # last 15. Here lag is 0 until 10m and 3 from then on, so the 15 minutes
  # 10m..24m first read no 0 at 24m and `for` has held for 5m at 29m.
  - name: queue lag above zero for the window and for fires
    interval: 30s
    input_series:
      - series: 'curie_queue_lag{job="curie/curie-worker",instance="worker-a",service_name="curie-worker",source="worker",outcome="pending"}'
        values: '0x19 3x60'
    alert_rule_test:
      - eval_time: 28m
        alertname: CurieQueueMessageAgeHigh
        exp_alerts: []
      - eval_time: 29m
        alertname: CurieQueueMessageAgeHigh
        exp_alerts:
          - exp_labels:
              component: curie-queue
              job: curie/curie-worker
              outcome: pending
              service_name: curie-worker
              severity: page
              source: worker
            exp_annotations:
              summary: Queued Curie messages have waited undelivered for 15 minutes
              description: >-
                curie_queue_lag, the entries in the run stream not yet
                delivered to the worker consumer group, has been above 0 at
                every minute for 15 minutes, whichever worker recorded it. A
                queue that is draining reads 0.

  # One undelivered entry is enough: the threshold is above 0, not a size.
  - name: a queue lag of one entry for the window and for fires
    interval: 30s
    input_series:
      - series: 'curie_queue_lag{job="curie/curie-worker",instance="worker-a",service_name="curie-worker",source="worker",outcome="pending"}'
        values: '0x19 1x60'
    alert_rule_test:
      - eval_time: 29m
        alertname: CurieQueueMessageAgeHigh
        exp_alerts:
          - exp_labels:
              component: curie-queue
              job: curie/curie-worker
              outcome: pending
              service_name: curie-worker
              severity: page
              source: worker
            exp_annotations:
              summary: Queued Curie messages have waited undelivered for 15 minutes
              description: >-
                curie_queue_lag, the entries in the run stream not yet
                delivered to the worker consumer group, has been above 0 at
                every minute for 15 minutes, whichever worker recorded it. A
                queue that is draining reads 0.

  # The same series with one 0 at 21m, which the minute read sees: the 15
  # minutes read no 0 again only from 36m, so at 40m, eleven minutes after the
  # case above fires, `for` has not held.
  - name: queue lag that drops to zero inside the window stays quiet
    interval: 30s
    input_series:
      - series: 'curie_queue_lag{job="curie/curie-worker",instance="worker-a",service_name="curie-worker",source="worker",outcome="pending"}'
        values: '0x19 3x21 0 3x38'
    alert_rule_test:
      - eval_time: 40m
        alertname: CurieQueueMessageAgeHigh
        exp_alerts: []

  # One tick at 11m sees an entry not yet delivered; every other tick reads 0.
  - name: a single queue lag sample above zero stays quiet
    interval: 30s
    input_series:
      - series: 'curie_queue_lag{job="curie/curie-worker",instance="worker-a",service_name="curie-worker",source="worker",outcome="pending"}'
        values: '0x21 4 0x38'
    alert_rule_test:
      - eval_time: 20m
        alertname: CurieQueueMessageAgeHigh
        exp_alerts: []

  - name: a healthy queue lag of zero stays quiet
    interval: 30s
    input_series:
      - series: 'curie_queue_lag{job="curie/curie-worker",instance="worker-a",service_name="curie-worker",source="worker",outcome="pending"}'
        values: '0x80'
    alert_rule_test:
      - eval_time: 40m
        alertname: CurieQueueMessageAgeHigh
        exp_alerts: []

  # A worker restarts into a backlog: worker-a's lag is 3 from 10m and its
  # last sample is at 20m; worker-b, the new process, reads 3 from 21m. The
  # lag with the instance dropped runs on unbroken from 10m, so it fires at
  # 29m as the single series above does, not 5m after worker-b's first
  # sample, and once.
  - name: queue lag across a worker restart into a backlog fires once on the joined series
    interval: 30s
    input_series:
      - series: 'curie_queue_lag{job="curie/curie-worker",instance="worker-a",service_name="curie-worker",source="worker",outcome="pending"}'
        values: '0x19 3x20'
      - series: 'curie_queue_lag{job="curie/curie-worker",instance="worker-b",service_name="curie-worker",source="worker",outcome="pending"}'
        values: '_x42 3x40'
    alert_rule_test:
      - eval_time: 28m
        alertname: CurieQueueMessageAgeHigh
        exp_alerts: []
      - eval_time: 29m
        alertname: CurieQueueMessageAgeHigh
        exp_alerts:
          - exp_labels:
              component: curie-queue
              job: curie/curie-worker
              outcome: pending
              service_name: curie-worker
              severity: page
              source: worker
            exp_annotations:
              summary: Queued Curie messages have waited undelivered for 15 minutes
              description: >-
                curie_queue_lag, the entries in the run stream not yet
                delivered to the worker consumer group, has been above 0 at
                every minute for 15 minutes, whichever worker recorded it. A
                queue that is draining reads 0.

  # Every worker process records the same stream's lag.
  - name: queue lag from two worker replicas fires one alert
    interval: 30s
    input_series:
      - series: 'curie_queue_lag{job="curie/curie-worker",instance="worker-a",service_name="curie-worker",source="worker",outcome="pending"}'
        values: '0x19 3x60'
      - series: 'curie_queue_lag{job="curie/curie-worker",instance="worker-b",service_name="curie-worker",source="worker",outcome="pending"}'
        values: '0x19 3x60'
    alert_rule_test:
      - eval_time: 29m
        alertname: CurieQueueMessageAgeHigh
        exp_alerts:
          - exp_labels:
              component: curie-queue
              job: curie/curie-worker
              outcome: pending
              service_name: curie-worker
              severity: page
              source: worker
            exp_annotations:
              summary: Queued Curie messages have waited undelivered for 15 minutes
              description: >-
                curie_queue_lag, the entries in the run stream not yet
                delivered to the worker consumer group, has been above 0 at
                every minute for 15 minutes, whichever worker recorded it. A
                queue that is draining reads 0.

  # Prometheus first holds the series at 5m, already at 3. Under 15 minutes of
  # minute reads it stays quiet, 13 minutes on as well; the 15 reads 5m..19m
  # are first all there at 19m, and `for` has held for 5m at 24m.
  - name: a queue lag series younger than 15 minutes stays quiet
    interval: 30s
    input_series:
      - series: 'curie_queue_lag{job="curie/curie-worker",instance="worker-a",service_name="curie-worker",source="worker",outcome="pending"}'
        values: '_x10 3x60'
    alert_rule_test:
      - eval_time: 18m
        alertname: CurieQueueMessageAgeHigh
        exp_alerts: []
      - eval_time: 23m
        alertname: CurieQueueMessageAgeHigh
        exp_alerts: []
      - eval_time: 24m
        alertname: CurieQueueMessageAgeHigh
        exp_alerts:
          - exp_labels:
              component: curie-queue
              job: curie/curie-worker
              outcome: pending
              service_name: curie-worker
              severity: page
              source: worker
            exp_annotations:
              summary: Queued Curie messages have waited undelivered for 15 minutes
              description: >-
                curie_queue_lag, the entries in the run stream not yet
                delivered to the worker consumer group, has been above 0 at
                every minute for 15 minutes, whichever worker recorded it. A
                queue that is draining reads 0.

  - name: owed completion age fires
    interval: 5m
    input_series:
      - series: 'curie_completion_outbox_age_seconds{service_name="curie-worker",operation="observe",outcome="retry"}'
        values: '600+0x6'
    alert_rule_test:
      - eval_time: 20m
        alertname: CurieCompletionOutboxAgeHigh
        exp_alerts:
          - exp_labels:
              component: curie-completion
              operation: observe
              outcome: retry
              service_name: curie-worker
              severity: page
            exp_annotations:
              summary: An owed completion is older than five minutes
              description: >-
                curie_completion_outbox_age_seconds has stayed above 300 for
                10 minutes. A drained run queue does not clear this signal.

  - name: empty outbox age stays quiet
    interval: 5m
    input_series:
      - series: 'curie_completion_outbox_age_seconds{service_name="curie-worker",operation="observe",outcome="retry"}'
        values: '0+0x6'
    alert_rule_test:
      - eval_time: 20m
        alertname: CurieCompletionOutboxAgeHigh
        exp_alerts: []

  - name: missing outbox signal fires while turns flow
    interval: 5m
    input_series:
      - series: 'curie_turn_accepted_total{service_name="curie-worker",source="worker",outcome="accepted"}'
        values: '1+1x6'
    alert_rule_test:
      - eval_time: 20m
        alertname: CurieCompletionOutboxSignalAbsent
        exp_alerts:
          - exp_labels:
              component: curie-completion
              severity: page
            exp_annotations:
              summary: Completion-outbox metrics are absent while turns flow
              description: >-
                Turns are being accepted, but curie_completion_outbox is
                missing. Absent completion-delivery telemetry is a failure
                signal.

  - name: present outbox signal recovers absence
    interval: 5m
    input_series:
      - series: 'curie_turn_accepted_total{service_name="curie-worker",source="worker",outcome="accepted"}'
        values: '1+1x6'
      - series: 'curie_completion_outbox{service_name="curie-worker",operation="observe",outcome="retry"}'
        values: '0+0x6'
    alert_rule_test:
      - eval_time: 20m
        alertname: CurieCompletionOutboxSignalAbsent
        exp_alerts: []

  - name: repeated reply refusal fires
    interval: 5m
    input_series:
      - series: 'curie_reply_delivery_total{service_name="curie-worker",operation="post",role="client",outcome="failure"}'
        values: '0+2x8'
    alert_rule_test:
      - eval_time: 30m
        alertname: CurieReplyDeliveryRefused
        exp_alerts:
          - exp_labels:
              component: curie-delivery
              operation: post
              outcome: failure
              role: client
              service_name: curie-worker
              severity: page
            exp_annotations:
              summary: Repeated Curie reply delivery failures
              description: >-
                curie_reply_delivery_total with outcome failure increased by
                three or more in 15 minutes, counting a series' first sample
                as an increase from zero.

  - name: isolated reply failure stays quiet
    interval: 5m
    input_series:
      - series: 'curie_reply_delivery_total{service_name="curie-worker",operation="post",role="client",outcome="failure"}'
        values: '0+0x4 1 1 1'
    alert_rule_test:
      - eval_time: 30m
        alertname: CurieReplyDeliveryRefused
        exp_alerts: []

  - name: token rotation 5xx fires
    interval: 5m
    input_series:
      - series: 'curie_http_server_request_total{service_name="curie-api",operation="/channels/token",role="server",source="POST",outcome="5xx"}'
        values: '0+1x8'
    alert_rule_test:
      - eval_time: 25m
        alertname: CurieChannelTokenRotationFailed
        exp_alerts:
          - exp_labels:
              component: curie-token
              operation: /channels/token
              outcome: 5xx
              role: server
              service_name: curie-api
              severity: page
              source: POST
            exp_annotations:
              summary: Channel-token HTTP rotation returned 5xx
              description: >-
                curie_http_server_request_total for /channels/token with
                outcome 5xx increased in the last hour, counting a series'
                first sample as an increase from zero.

  - name: token rotation 2xx stays quiet
    interval: 5m
    input_series:
      - series: 'curie_http_server_request_total{service_name="curie-api",operation="/channels/token",role="server",source="POST",outcome="2xx"}'
        values: '0+1x8'
    alert_rule_test:
      - eval_time: 25m
        alertname: CurieChannelTokenRotationFailed
        exp_alerts: []

  - name: mail adapter unready fires
    interval: 5m
    input_series:
      - series: 'kube_deployment_status_replicas_unavailable{deployment="curie-mail-adapter",namespace="curie"}'
        values: '1+0x6'
    alert_rule_test:
      - eval_time: 20m
        alertname: CurieMailAdapterNotReady
        exp_alerts:
          - exp_labels:
              component: curie-token
              deployment: curie-mail-adapter
              namespace: curie
              severity: page
            exp_annotations:
              summary: Mail adapter replicas are unavailable
              description: >-
                The mail adapter Deployment has unavailable replicas. An
                expired channel token fails /readyz and surfaces here without
                inspecting a token value.

  - name: mail adapter ready stays quiet
    interval: 5m
    input_series:
      - series: 'kube_deployment_status_replicas_unavailable{deployment="curie-mail-adapter",namespace="curie"}'
        values: '0+0x6'
    alert_rule_test:
      - eval_time: 20m
        alertname: CurieMailAdapterNotReady
        exp_alerts: []

  - name: sustained low memory headroom fires
    interval: 5m
    input_series:
      - series: 'node_memory_MemAvailable_bytes{curie_source="curie-sre-bot",instance="k8:9101"}'
        values: '8+0x6'
      - series: 'node_memory_MemTotal_bytes{curie_source="curie-sre-bot",instance="k8:9101"}'
        values: '100+0x6'
    alert_rule_test:
      - eval_time: 20m
        alertname: CurieNodeMemoryHeadroomLow
        exp_alerts:
          - exp_labels:
              component: curie-node
              curie_source: curie-sre-bot
              instance: k8:9101
              severity: page
            exp_annotations:
              summary: Node memory headroom is below 10 percent
              description: >-
                A curie_source=curie-sre-bot memory series has had less than
                10 percent available for 15 minutes.

  - name: ordinary memory usage stays quiet
    interval: 5m
    input_series:
      - series: 'node_memory_MemAvailable_bytes{curie_source="curie-sre-bot",instance="k8:9101"}'
        values: '30+0x6'
      - series: 'node_memory_MemTotal_bytes{curie_source="curie-sre-bot",instance="k8:9101"}'
        values: '100+0x6'
    alert_rule_test:
      - eval_time: 20m
        alertname: CurieNodeMemoryHeadroomLow
        exp_alerts: []

  - name: root disk pressure fires
    interval: 5m
    input_series:
      - series: 'node_filesystem_avail_bytes{curie_source="curie-sre-bot",instance="k8:9101",mountpoint="/",fstype="ext4"}'
        values: '10+0x6'
      - series: 'node_filesystem_size_bytes{curie_source="curie-sre-bot",instance="k8:9101",mountpoint="/",fstype="ext4"}'
        values: '100+0x6'
    alert_rule_test:
      - eval_time: 20m
        alertname: CurieRootDiskPressure
        exp_alerts:
          - exp_labels:
              component: curie-node
              curie_source: curie-sre-bot
              fstype: ext4
              instance: k8:9101
              mountpoint: /
              severity: page
            exp_annotations:
              summary: Root disk has less than 20 percent free
              description: >-
                A curie_source=curie-sre-bot root filesystem has stayed below
                20 percent free for 15 minutes.

  - name: healthy root disk stays quiet
    interval: 5m
    input_series:
      - series: 'node_filesystem_avail_bytes{curie_source="curie-sre-bot",instance="k8:9101",mountpoint="/",fstype="ext4"}'
        values: '40+0x6'
      - series: 'node_filesystem_size_bytes{curie_source="curie-sre-bot",instance="k8:9101",mountpoint="/",fstype="ext4"}'
        values: '100+0x6'
    alert_rule_test:
      - eval_time: 20m
        alertname: CurieRootDiskPressure
        exp_alerts: []

  - name: duplicate node exporter fires
    interval: 5m
    input_series:
      - series: 'node_memory_MemAvailable_bytes{curie_source="curie-sre-bot",instance="k8:9100"}'
        values: '30+0x6'
      - series: 'node_memory_MemAvailable_bytes{curie_source="curie-sre-bot",instance="k8:9101"}'
        values: '30+0x6'
    alert_rule_test:
      - eval_time: 20m
        alertname: CurieDuplicateNodeExporter
        exp_alerts:
          - exp_labels:
              component: curie-node
              severity: page
            exp_annotations:
              summary: Both 9100 and 9101 node-exporter series are retained
              description: >-
                node_memory_MemAvailable_bytes with curie_source=curie-sre-bot
                has series on :9100 and :9101. Naive sums of that set
                double-count the node. Isolate scrape to one intended series.

  - name: single intended node exporter stays quiet
    interval: 5m
    input_series:
      - series: 'node_memory_MemAvailable_bytes{curie_source="curie-sre-bot",instance="k8:9101"}'
        values: '30+0x6'
    alert_rule_test:
      - eval_time: 20m
        alertname: CurieDuplicateNodeExporter
        exp_alerts: []

  - name: one series per node on 9101 stays quiet
    interval: 5m
    input_series:
      - series: 'node_memory_MemAvailable_bytes{curie_source="curie-sre-bot",instance="k8a:9101"}'
        values: '30+0x6'
      - series: 'node_memory_MemAvailable_bytes{curie_source="curie-sre-bot",instance="k8b:9101"}'
        values: '30+0x6'
    alert_rule_test:
      - eval_time: 20m
        alertname: CurieDuplicateNodeExporter
        exp_alerts: []

  - name: supervised restart loop fires on repeated restarts
    interval: 5m
    input_series:
      - series: 'curie_worker_supervised_restart_total{service_name="curie-worker",operation="publications",outcome="restart"}'
        values: '0 1 2 3 4 5 6 7 8'
    alert_rule_test:
      - eval_time: 40m
        alertname: CurieWorkerSupervisedRestartLoop
        exp_alerts:
          - exp_labels:
              severity: page
              component: curie-worker
              service_name: curie-worker
              operation: publications
              outcome: restart
            exp_annotations:
              summary: A supervised worker task is crash-looping
              description: >-
                curie_worker_supervised_restart_total with outcome restart
                increased by three or more in 30 minutes for one operation,
                counting a series' first sample as an increase from zero. The
                task is backing off and will be parked if it keeps crashing.

  - name: supervised restart loop stays quiet on a single restart
    interval: 5m
    input_series:
      - series: 'curie_worker_supervised_restart_total{service_name="curie-worker",operation="runs",outcome="restart"}'
        values: '0 1 1 1 1 1 1 1 1'
    alert_rule_test:
      - eval_time: 40m
        alertname: CurieWorkerSupervisedRestartLoop
        exp_alerts: []

  - name: supervised task parked fires on the first give_up sample
    interval: 5m
    input_series:
      # Absent, then constant at 1: the real shape of a counter that is
      # emitted exactly once when the supervisor parks the task.
      - series: 'curie_worker_supervised_restart_total{service_name="curie-worker",operation="runs",outcome="give_up"}'
        values: '_ _ 1 1 1'
    alert_rule_test:
      - eval_time: 15m
        alertname: CurieWorkerSupervisedTaskParked
        exp_alerts:
          - exp_labels:
              severity: page
              component: curie-worker
              service_name: curie-worker
              operation: runs
              outcome: give_up
            exp_annotations:
              summary: A supervised worker task was parked after repeated crashes
              description: >-
                curie_worker_supervised_restart_total with outcome give_up
                is present. The named operation stopped restarting and stays
                down until the worker pod restarts.

  - name: supervised task parked stays quiet when only restarts are seen
    interval: 5m
    input_series:
      - series: 'curie_worker_supervised_restart_total{service_name="curie-worker",operation="runs",outcome="restart"}'
        values: '1 2 3 4 5'
    alert_rule_test:
      - eval_time: 15m
        alertname: CurieWorkerSupervisedTaskParked
        exp_alerts: []

  # A mail adapter scaled to zero is stopped. kube-state-metrics reports
  # `replicas_unavailable` as spec minus available, so at zero replicas it is
  # 0 - 0 = 0 and a rule on `unavailable > 0` cannot see it. Found on a
  # downstream EKS cluster by scaling one to zero on purpose: nothing fired.
  - name: a mail adapter scaled to zero fires
    interval: 1m
    input_series:
      - series: 'kube_deployment_spec_replicas{namespace="curie",deployment="mail-adapter"}'
        values: '0x15'
      - series: 'kube_deployment_status_replicas_unavailable{namespace="curie",deployment="mail-adapter"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: CurieMailAdapterNotReady
        exp_alerts:
          - exp_labels:
              severity: page
              component: curie-token
              namespace: curie
              deployment: mail-adapter
            exp_annotations:
              summary: Mail adapter replicas are unavailable
              description: The mail adapter Deployment has unavailable replicas. An expired channel token fails /readyz and surfaces here without inspecting a token value.

  # One installation can run several mail adapters, one per mailbox, named
  # with a suffix. PromQL label matchers are fully anchored, so
  # `deployment=~".*mail-adapter"` matches `mail-adapter` and not
  # `mail-adapter-brand`. On the downstream cluster that measured this, two of
  # its three adapters could never alert.
  - name: a suffixed mail adapter with unavailable replicas fires
    interval: 1m
    input_series:
      - series: 'kube_deployment_spec_replicas{namespace="curie",deployment="mail-adapter-brand"}'
        values: '1x15'
      - series: 'kube_deployment_status_replicas_unavailable{namespace="curie",deployment="mail-adapter-brand"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: CurieMailAdapterNotReady
        exp_alerts:
          - exp_labels:
              severity: page
              component: curie-token
              namespace: curie
              deployment: mail-adapter-brand
            exp_annotations:
              summary: Mail adapter replicas are unavailable
              description: The mail adapter Deployment has unavailable replicas. An expired channel token fails /readyz and surfaces here without inspecting a token value.

  # A connector is a Deployment per (agent, connector) named
  # `<release>-<agent>-mcp-<connector>`. When one is down its agent still
  # answers -- it says it cannot reach the systems it reads from -- so nothing
  # else in this rule set notices. No rule watched a connector at all.
  - name: a connector with no available replica fires
    interval: 1m
    input_series:
      - series: 'kube_deployment_spec_replicas{namespace="curie",deployment="curie-brand-mcp-brand"}'
        values: '1x15'
      - series: 'kube_deployment_status_replicas_unavailable{namespace="curie",deployment="curie-brand-mcp-brand"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: CurieConnectorNotReady
        exp_alerts:
          - exp_labels:
              severity: page
              component: curie-connector
              namespace: curie
              deployment: curie-brand-mcp-brand
            exp_annotations:
              summary: A connector Deployment is not serving
              description: A connector has no available replica, or has been scaled to zero. Its agent still answers, and tells the person it cannot reach the systems it reads from.

  - name: a connector scaled to zero fires
    interval: 1m
    input_series:
      - series: 'kube_deployment_spec_replicas{namespace="curie",deployment="curie-brand-mcp-brand"}'
        values: '0x15'
      - series: 'kube_deployment_status_replicas_unavailable{namespace="curie",deployment="curie-brand-mcp-brand"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: CurieConnectorNotReady
        exp_alerts:
          - exp_labels:
              severity: page
              component: curie-connector
              namespace: curie
              deployment: curie-brand-mcp-brand
            exp_annotations:
              summary: A connector Deployment is not serving
              description: A connector has no available replica, or has been scaled to zero. Its agent still answers, and tells the person it cannot reach the systems it reads from.

  - name: a healthy connector stays quiet
    interval: 1m
    input_series:
      - series: 'kube_deployment_spec_replicas{namespace="curie",deployment="curie-brand-mcp-brand"}'
        values: '1x15'
      - series: 'kube_deployment_status_replicas_unavailable{namespace="curie",deployment="curie-brand-mcp-brand"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: CurieConnectorNotReady
        exp_alerts: []

  # The dispatcher down is the quietest failure an installation has: every pod
  # is Running, nothing errors, and no Slack message reaches any agent.
  # CurieWorkerSupervisedRestartLoop watches the worker's own supervised-task
  # counter, not a pod restarting, and nothing watched the dispatcher.
  - name: a crash-looping dispatcher fires
    interval: 1m
    input_series:
      - series: 'kube_pod_container_status_restarts_total{namespace="curie",pod="curie-dispatcher-7dfc698888-q9nr5",container="dispatcher"}'
        values: '0+1x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: CurieDispatcherRestartLoop
        exp_alerts:
          - exp_labels:
              severity: page
              component: curie-dispatcher
              namespace: curie
              pod: curie-dispatcher-7dfc698888-q9nr5
              container: dispatcher
            exp_annotations:
              summary: The dispatcher is crash-looping
              description: A dispatcher container restarted three or more times in 30 minutes. While it is down no Slack message reaches any agent, and every other pod still looks healthy.

  - name: a dispatcher that restarted once and settled stays quiet
    interval: 1m
    input_series:
      - series: 'kube_pod_container_status_restarts_total{namespace="curie",pod="curie-dispatcher-7dfc698888-q9nr5",container="dispatcher"}'
        values: '0 1x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: CurieDispatcherRestartLoop
        exp_alerts: []

  # Every kube-state-metrics series below carries its scrape target's
  # instance, job and node and the curie_source stamp, and every kubelet
  # series its node's instance and job. Those change when kube-state-metrics
  # is rescheduled, so each alert is expected with its identity labels only.

  # The pending checks (exp_alerts: [] one evaluation before `for` elapses)
  # pin each `for` to the minute, since this file evaluates every 60s as
  # production does.

  # CurieNodeNotReady has two terms. kube-state-metrics reports three Ready
  # series per node, one per status, and the rule reads status="true" for 0,
  # so a node reporting false and one gone unknown both fire. The kubelet term
  # reads `up` for the kubernetes-nodes job only, so it still fires when
  # kube-state-metrics ran on the failed node and its series are gone, and a
  # pod target that stops answering is not a node. Both terms reduce to the
  # node, so a node failing both ways is one alert.
  - name: a node reporting NotReady fires
    interval: 1m
    input_series:
      - series: 'kube_node_status_condition{node="acme-node-1",condition="Ready",status="true",instance="10.0.0.10:8080",job="kubernetes-service-endpoints",curie_source="curie-sre-bot"}'
        values: '0x15'
      - series: 'kube_node_status_condition{node="acme-node-1",condition="Ready",status="false",instance="10.0.0.10:8080",job="kubernetes-service-endpoints",curie_source="curie-sre-bot"}'
        values: '1x15'
      - series: 'kube_node_status_condition{node="acme-node-1",condition="Ready",status="unknown",instance="10.0.0.10:8080",job="kubernetes-service-endpoints",curie_source="curie-sre-bot"}'
        values: '0x15'
      - series: 'up{job="kubernetes-nodes",instance="acme-node-1"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 4m
        alertname: CurieNodeNotReady
        exp_alerts: []
      - eval_time: 5m
        alertname: CurieNodeNotReady
        exp_alerts:
          - exp_labels:
              severity: page
              component: curie-node
              node: acme-node-1
            exp_annotations:
              summary: A node is not Ready or its kubelet is unreachable
              description: >-
                A node has not reported Ready, or this Prometheus has not
                reached its kubelet, for 5 minutes. A node that is not Ready
                takes no new pods, evicts the ones it has after five minutes,
                and cannot start a sandbox. If every node fires at once,
                suspect this Prometheus's own network rather than the nodes.

  - name: a node whose Ready condition is unknown fires
    interval: 1m
    input_series:
      - series: 'kube_node_status_condition{node="acme-node-1",condition="Ready",status="true",instance="10.0.0.10:8080",job="kubernetes-service-endpoints",curie_source="curie-sre-bot"}'
        values: '0x15'
      - series: 'kube_node_status_condition{node="acme-node-1",condition="Ready",status="false",instance="10.0.0.10:8080",job="kubernetes-service-endpoints",curie_source="curie-sre-bot"}'
        values: '0x15'
      - series: 'kube_node_status_condition{node="acme-node-1",condition="Ready",status="unknown",instance="10.0.0.10:8080",job="kubernetes-service-endpoints",curie_source="curie-sre-bot"}'
        values: '1x15'
      - series: 'up{job="kubernetes-nodes",instance="acme-node-1"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 5m
        alertname: CurieNodeNotReady
        exp_alerts:
          - exp_labels:
              severity: page
              component: curie-node
              node: acme-node-1
            exp_annotations:
              summary: A node is not Ready or its kubelet is unreachable
              description: >-
                A node has not reported Ready, or this Prometheus has not
                reached its kubelet, for 5 minutes. A node that is not Ready
                takes no new pods, evicts the ones it has after five minutes,
                and cannot start a sandbox. If every node fires at once,
                suspect this Prometheus's own network rather than the nodes.

  - name: a node whose kubelet stops answering fires without kube-state-metrics
    interval: 1m
    input_series:
      - series: 'up{job="kubernetes-nodes",instance="acme-node-1"}'
        values: '1x15'
      - series: 'up{job="kubernetes-nodes",instance="acme-node-2"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 4m
        alertname: CurieNodeNotReady
        exp_alerts: []
      - eval_time: 5m
        alertname: CurieNodeNotReady
        exp_alerts:
          - exp_labels:
              severity: page
              component: curie-node
              node: acme-node-2
            exp_annotations:
              summary: A node is not Ready or its kubelet is unreachable
              description: >-
                A node has not reported Ready, or this Prometheus has not
                reached its kubelet, for 5 minutes. A node that is not Ready
                takes no new pods, evicts the ones it has after five minutes,
                and cannot start a sandbox. If every node fires at once,
                suspect this Prometheus's own network rather than the nodes.

  - name: a node failing both terms fires once
    interval: 1m
    input_series:
      - series: 'kube_node_status_condition{node="acme-node-1",condition="Ready",status="true",instance="10.0.0.10:8080",job="kubernetes-service-endpoints",curie_source="curie-sre-bot"}'
        values: '0x15'
      - series: 'kube_node_status_condition{node="acme-node-1",condition="Ready",status="false",instance="10.0.0.10:8080",job="kubernetes-service-endpoints",curie_source="curie-sre-bot"}'
        values: '0x15'
      - series: 'kube_node_status_condition{node="acme-node-1",condition="Ready",status="unknown",instance="10.0.0.10:8080",job="kubernetes-service-endpoints",curie_source="curie-sre-bot"}'
        values: '1x15'
      - series: 'up{job="kubernetes-nodes",instance="acme-node-1"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 5m
        alertname: CurieNodeNotReady
        exp_alerts:
          - exp_labels:
              severity: page
              component: curie-node
              node: acme-node-1
            exp_annotations:
              summary: A node is not Ready or its kubelet is unreachable
              description: >-
                A node has not reported Ready, or this Prometheus has not
                reached its kubelet, for 5 minutes. A node that is not Ready
                takes no new pods, evicts the ones it has after five minutes,
                and cannot start a sandbox. If every node fires at once,
                suspect this Prometheus's own network rather than the nodes.

  - name: a Ready and scraped node stays quiet
    interval: 1m
    input_series:
      - series: 'kube_node_status_condition{node="acme-node-1",condition="Ready",status="true",instance="10.0.0.10:8080",job="kubernetes-service-endpoints",curie_source="curie-sre-bot"}'
        values: '1x15'
      - series: 'kube_node_status_condition{node="acme-node-1",condition="Ready",status="false",instance="10.0.0.10:8080",job="kubernetes-service-endpoints",curie_source="curie-sre-bot"}'
        values: '0x15'
      - series: 'kube_node_status_condition{node="acme-node-1",condition="Ready",status="unknown",instance="10.0.0.10:8080",job="kubernetes-service-endpoints",curie_source="curie-sre-bot"}'
        values: '0x15'
      - series: 'up{job="kubernetes-nodes",instance="acme-node-1"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 5m
        alertname: CurieNodeNotReady
        exp_alerts: []

  - name: a pod target that stops answering stays quiet
    interval: 1m
    input_series:
      - series: 'up{job="kubernetes-nodes",instance="acme-node-1"}'
        values: '1x15'
      - series: 'up{job="kubernetes-pods",instance="10.0.0.20:9090",namespace="acme",pod="acme-curie-api-7dfc698888-q9nr5",node="acme-node-1"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 5m
        alertname: CurieNodeNotReady
        exp_alerts: []

  # kube-state-metrics emits a waiting_reason series only while a container
  # waits, so a container that crashes, runs briefly and crashes again drops
  # out between scrapes, and the scrape that misses it writes a staleness
  # marker. The flapping case alternates a sample and a marker each minute, so
  # a rule on the raw series would see nothing at the 5m evaluation and
  # restart its `for`. An init container reports on a metric of its own and
  # flaps the same way, and the app container behind it waits on
  # PodInitializing, which is not a crash.
  - name: a crash-looping container fires
    interval: 1m
    input_series:
      - series: 'kube_pod_container_status_waiting_reason{namespace="acme",pod="acme-curie-api-7dfc698888-q9nr5",uid="00000000-0000-0000-0000-000000000001",container="api",reason="CrashLoopBackOff",instance="10.0.0.10:8080",job="kubernetes-service-endpoints",node="acme-node-1",curie_source="curie-sre-bot"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 9m
        alertname: CuriePodCrashLooping
        exp_alerts: []
      - eval_time: 10m
        alertname: CuriePodCrashLooping
        exp_alerts:
          - exp_labels:
              severity: page
              component: curie-pod
              namespace: acme
              pod: acme-curie-api-7dfc698888-q9nr5
              container: api
            exp_annotations:
              summary: A container is crash-looping
              description: >-
                A container or init container in any namespace has been in
                CrashLoopBackOff for 10 minutes. It keeps failing on start and
                waits longer before each retry.

  - name: a container flapping between waiting and running fires
    interval: 1m
    input_series:
      - series: 'kube_pod_container_status_waiting_reason{namespace="acme",pod="acme-curie-api-7dfc698888-q9nr5",uid="00000000-0000-0000-0000-000000000001",container="api",reason="CrashLoopBackOff",instance="10.0.0.10:8080",job="kubernetes-service-endpoints",node="acme-node-1",curie_source="curie-sre-bot"}'
        values: '1 stale 1 stale 1 stale 1 stale 1 stale 1 stale 1 stale 1 stale 1 stale 1 stale 1'
    alert_rule_test:
      - eval_time: 10m
        alertname: CuriePodCrashLooping
        exp_alerts:
          - exp_labels:
              severity: page
              component: curie-pod
              namespace: acme
              pod: acme-curie-api-7dfc698888-q9nr5
              container: api
            exp_annotations:
              summary: A container is crash-looping
              description: >-
                A container or init container in any namespace has been in
                CrashLoopBackOff for 10 minutes. It keeps failing on start and
                waits longer before each retry.

  - name: a crash-looping init container fires
    interval: 1m
    input_series:
      - series: 'kube_pod_init_container_status_waiting_reason{namespace="acme",pod="acme-curie-api-7dfc698888-q9nr5",uid="00000000-0000-0000-0000-000000000001",container="migrate",reason="CrashLoopBackOff",instance="10.0.0.10:8080",job="kubernetes-service-endpoints",node="acme-node-1",curie_source="curie-sre-bot"}'
        values: '1x20'
      - series: 'kube_pod_container_status_waiting_reason{namespace="acme",pod="acme-curie-api-7dfc698888-q9nr5",uid="00000000-0000-0000-0000-000000000001",container="api",reason="PodInitializing",instance="10.0.0.10:8080",job="kubernetes-service-endpoints",node="acme-node-1",curie_source="curie-sre-bot"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 9m
        alertname: CuriePodCrashLooping
        exp_alerts: []
      - eval_time: 10m
        alertname: CuriePodCrashLooping
        exp_alerts:
          - exp_labels:
              severity: page
              component: curie-pod
              namespace: acme
              pod: acme-curie-api-7dfc698888-q9nr5
              container: migrate
            exp_annotations:
              summary: A container is crash-looping
              description: >-
                A container or init container in any namespace has been in
                CrashLoopBackOff for 10 minutes. It keeps failing on start and
                waits longer before each retry.

  - name: a flapping init container fires
    interval: 1m
    input_series:
      - series: 'kube_pod_init_container_status_waiting_reason{namespace="acme",pod="acme-curie-api-7dfc698888-q9nr5",uid="00000000-0000-0000-0000-000000000001",container="migrate",reason="CrashLoopBackOff",instance="10.0.0.10:8080",job="kubernetes-service-endpoints",node="acme-node-1",curie_source="curie-sre-bot"}'
        values: '1 stale 1 stale 1 stale 1 stale 1 stale 1 stale 1 stale 1 stale 1 stale 1 stale 1'
      - series: 'kube_pod_container_status_waiting_reason{namespace="acme",pod="acme-curie-api-7dfc698888-q9nr5",uid="00000000-0000-0000-0000-000000000001",container="api",reason="PodInitializing",instance="10.0.0.10:8080",job="kubernetes-service-endpoints",node="acme-node-1",curie_source="curie-sre-bot"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: CuriePodCrashLooping
        exp_alerts:
          - exp_labels:
              severity: page
              component: curie-pod
              namespace: acme
              pod: acme-curie-api-7dfc698888-q9nr5
              container: migrate
            exp_annotations:
              summary: A container is crash-looping
              description: >-
                A container or init container in any namespace has been in
                CrashLoopBackOff for 10 minutes. It keeps failing on start and
                waits longer before each retry.

  - name: a container waiting for another reason stays quiet
    interval: 1m
    input_series:
      - series: 'kube_pod_container_status_waiting_reason{namespace="acme",pod="acme-curie-api-7dfc698888-q9nr5",uid="00000000-0000-0000-0000-000000000001",container="api",reason="ContainerCreating",instance="10.0.0.10:8080",job="kubernetes-service-endpoints",node="acme-node-1",curie_source="curie-sre-bot"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: CuriePodCrashLooping
        exp_alerts: []

  - name: an init container waiting for another reason stays quiet
    interval: 1m
    input_series:
      - series: 'kube_pod_init_container_status_waiting_reason{namespace="acme",pod="acme-curie-api-7dfc698888-q9nr5",uid="00000000-0000-0000-0000-000000000001",container="migrate",reason="ContainerCreating",instance="10.0.0.10:8080",job="kubernetes-service-endpoints",node="acme-node-1",curie_source="curie-sre-bot"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: CuriePodCrashLooping
        exp_alerts: []

  # Core Deployments are selected by the chart's labels, not by name:
  # app.kubernetes.io/component in api, worker or dispatcher, and
  # helm.sh/chart curie-*, both exported on kube_deployment_labels by the
  # kube-state-metrics allowlist. The Langfuse worker has no component label,
  # ui is not a core component, another chart's `*-api` is not Curie's, and a
  # Deployment with no labels series has nothing to select on, so none of them
  # pages here. Unavailable reads 0 at zero replicas, hence the scaled to zero
  # term.
  - name: a chart-labelled api scaled to zero fires
    interval: 1m
    input_series:
      - series: 'kube_deployment_spec_replicas{namespace="acme",deployment="acme-curie-api",instance="10.0.0.10:8080",job="kubernetes-service-endpoints",node="acme-node-1",curie_source="curie-sre-bot"}'
        values: '0x15'
      - series: 'kube_deployment_status_replicas_unavailable{namespace="acme",deployment="acme-curie-api",instance="10.0.0.10:8080",job="kubernetes-service-endpoints",node="acme-node-1",curie_source="curie-sre-bot"}'
        values: '0x15'
      - series: 'kube_deployment_labels{namespace="acme",deployment="acme-curie-api",label_app_kubernetes_io_component="api",label_helm_sh_chart="curie-0.9.3",instance="10.0.0.10:8080",job="kubernetes-service-endpoints",node="acme-node-1",curie_source="curie-sre-bot"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 4m
        alertname: CurieCoreWorkloadNotReady
        exp_alerts: []
      - eval_time: 5m
        alertname: CurieCoreWorkloadNotReady
        exp_alerts:
          - exp_labels:
              severity: page
              component: curie-core
              namespace: acme
              deployment: acme-curie-api
            exp_annotations:
              summary: A core Curie Deployment has an unavailable replica or is scaled to zero
              description: >-
                The api, worker or dispatcher of a Curie release has a replica
                that is not available, such as a crashed pod or a rollout
                whose new pod never became ready, or has been scaled to zero.
                The api readiness probe queries the database, so a database
                outage, including one outside the cluster, surfaces here as an
                unavailable api.

  - name: a chart-labelled worker with an unavailable replica fires
    interval: 1m
    input_series:
      - series: 'kube_deployment_spec_replicas{namespace="acme",deployment="acme-curie-worker",instance="10.0.0.10:8080",job="kubernetes-service-endpoints",node="acme-node-1",curie_source="curie-sre-bot"}'
        values: '1x15'
      - series: 'kube_deployment_status_replicas_unavailable{namespace="acme",deployment="acme-curie-worker",instance="10.0.0.10:8080",job="kubernetes-service-endpoints",node="acme-node-1",curie_source="curie-sre-bot"}'
        values: '1x15'
      - series: 'kube_deployment_labels{namespace="acme",deployment="acme-curie-worker",label_app_kubernetes_io_component="worker",label_helm_sh_chart="curie-0.9.3",instance="10.0.0.10:8080",job="kubernetes-service-endpoints",node="acme-node-1",curie_source="curie-sre-bot"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 5m
        alertname: CurieCoreWorkloadNotReady
        exp_alerts:
          - exp_labels:
              severity: page
              component: curie-core
              namespace: acme
              deployment: acme-curie-worker
            exp_annotations:
              summary: A core Curie Deployment has an unavailable replica or is scaled to zero
              description: >-
                The api, worker or dispatcher of a Curie release has a replica
                that is not available, such as a crashed pod or a rollout
                whose new pod never became ready, or has been scaled to zero.
                The api readiness probe queries the database, so a database
