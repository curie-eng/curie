  # kube-state-metrics emits a waiting_reason series only while a container
  # waits, so a container that crashes, runs briefly and crashes again drops
  # out between scrapes, and the scrape that misses it writes a staleness
  # marker. The flapping case alternates a sample and a marker each minute, so
  # a rule on the raw series would see nothing at the 5m evaluation and
  # restart its `for`. An init container reports on a metric of its own and
  # flaps the same way, and the app container behind it waits on
  # PodInitializing, which is not a crash.
  - name: a crash-looping container fires
    interval: 1m
    input_series:
      - series: 'kube_pod_container_status_waiting_reason{namespace="acme",pod="acme-curie-api-7dfc698888-q9nr5",uid="00000000-0000-0000-0000-000000000001",container="api",reason="CrashLoopBackOff",instance="10.0.0.10:8080",job="kubernetes-service-endpoints",node="acme-node-1",curie_source="curie-sre-bot"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 9m
        alertname: CuriePodCrashLooping
        exp_alerts: []
      - eval_time: 10m
        alertname: CuriePodCrashLooping
        exp_alerts:
          - exp_labels:
              severity: page
              component: curie-pod
              namespace: acme
              pod: acme-curie-api-7dfc698888-q9nr5
              container: api
            exp_annotations:
              summary: A container is crash-looping
              description: >-
                A container or init container in any namespace has been in
                CrashLoopBackOff for 10 minutes. It keeps failing on start and
                waits longer before each retry.

  - name: a container flapping between waiting and running fires
    interval: 1m
    input_series:
      - series: 'kube_pod_container_status_waiting_reason{namespace="acme",pod="acme-curie-api-7dfc698888-q9nr5",uid="00000000-0000-0000-0000-000000000001",container="api",reason="CrashLoopBackOff",instance="10.0.0.10:8080",job="kubernetes-service-endpoints",node="acme-node-1",curie_source="curie-sre-bot"}'
        values: '1 stale 1 stale 1 stale 1 stale 1 stale 1 stale 1 stale 1 stale 1 stale 1 stale 1'
    alert_rule_test:
      - eval_time: 10m
        alertname: CuriePodCrashLooping
        exp_alerts:
          - exp_labels:
              severity: page
              component: curie-pod
              namespace: acme
              pod: acme-curie-api-7dfc698888-q9nr5
              container: api
            exp_annotations:
