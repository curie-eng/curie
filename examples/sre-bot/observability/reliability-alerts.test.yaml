    interval: 1m
    input_series:
      - series: 'curie_worker_supervised_restart_total{service_name="curie-worker",operation="publications",outcome="restart",instance="curie-worker-a"}'
        values: '5x39 6x11 7x12 8x40'
      - series: 'curie_worker_supervised_restart_total{service_name="curie-worker",operation="publications",outcome="restart",instance="curie-worker-b"}'
        values: '_x40 1x11 2x12 3x40'
    alert_rule_test:
      - eval_time: 69m
        alertname: CurieWorkerSupervisedRestartLoop
        exp_alerts: []
      - eval_time: 70m
        alertname: CurieWorkerSupervisedRestartLoop
        exp_alerts: []

  - name: a new supervised restart series at 2 stays quiet
    interval: 1m
    input_series:
      - series: 'curie_worker_supervised_restart_total{service_name="curie-worker",operation="publications",outcome="restart"}'
        values: '_x6 1x13 2x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: CurieWorkerSupervisedRestartLoop
        exp_alerts: []
      - eval_time: 40m
        alertname: CurieWorkerSupervisedRestartLoop
        exp_alerts: []

  # Sampled from 0m at 5, so it fires from 5m to 29m. At 30m the offset hour ends
  # at 0m and the counter has not increased: quiet. An offset over 30m still
  # reads nothing at 30m and fires. 80m is the steady state.
  - name: a supervised restart series flat at 5 stays quiet once older than the window
    interval: 1m
    input_series:
      - series: 'curie_worker_supervised_restart_total{service_name="curie-worker",operation="runs",outcome="restart"}'
        values: '5x80'
    alert_rule_test:
      - eval_time: 30m
        alertname: CurieWorkerSupervisedRestartLoop
        exp_alerts: []
      - eval_time: 80m
        alertname: CurieWorkerSupervisedRestartLoop
        exp_alerts: []

  # Two operations, each first exported at 6m already at 3 and restarting once a
  # minute. The new-series term holds from 6m to 35m and the increase term from
  # 9m; pending at 10m and firing from 11m with one alert per operation. At 45m
  # only the increase term holds.
  - name: new supervised restart series that start at 3 and keep restarting fire once per operation
    interval: 1m
    input_series:
      - series: 'curie_worker_supervised_restart_total{service_name="curie-worker",operation="publications",outcome="restart"}'
        values: '_x6 3+1x40'
      - series: 'curie_worker_supervised_restart_total{service_name="curie-worker",operation="runs",outcome="restart"}'
        values: '_x6 3+1x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: CurieWorkerSupervisedRestartLoop
        exp_alerts: []
      - eval_time: 11m
        alertname: CurieWorkerSupervisedRestartLoop
        exp_alerts:
          - exp_labels:
              severity: page
              component: curie-worker
              service_name: curie-worker
              operation: publications
              outcome: restart
            exp_annotations:
              summary: A supervised worker task is crash-looping
              description: >-
                curie_worker_supervised_restart_total with outcome restart
                increased by three or more in 30 minutes for one operation,
                counting a series' first sample as an increase from zero. The
                task is backing off and will be parked if it keeps crashing.
          - exp_labels:
              severity: page
              component: curie-worker
              service_name: curie-worker
              operation: runs
              outcome: restart
            exp_annotations:
              summary: A supervised worker task is crash-looping
              description: >-
                curie_worker_supervised_restart_total with outcome restart
                increased by three or more in 30 minutes for one operation,
                counting a series' first sample as an increase from zero. The
                task is backing off and will be parked if it keeps crashing.
      - eval_time: 45m
        alertname: CurieWorkerSupervisedRestartLoop
        exp_alerts:
          - exp_labels:
              severity: page
              component: curie-worker
              service_name: curie-worker
              operation: publications
              outcome: restart
            exp_annotations:
              summary: A supervised worker task is crash-looping
              description: >-
                curie_worker_supervised_restart_total with outcome restart
                increased by three or more in 30 minutes for one operation,
                counting a series' first sample as an increase from zero. The
                task is backing off and will be parked if it keeps crashing.
          - exp_labels:
              severity: page
              component: curie-worker
              service_name: curie-worker
              operation: runs
              outcome: restart
            exp_annotations:
              summary: A supervised worker task is crash-looping
              description: >-
                curie_worker_supervised_restart_total with outcome restart
                increased by three or more in 30 minutes for one operation,
                counting a series' first sample as an increase from zero. The
                task is backing off and will be parked if it keeps crashing.

  # A worker restart. The old process's series, at 1, has its last export at
  # 40m; the new process's first restart is exported at 42m under its own
  # instance, and its third at 50m. increase() sees at most two. The new-series
  # term holds from 50m to 71m: pending at 54m, firing at 55m with the new
  # instance's labels only.
  - name: supervised restart loop fires on three restarts after a worker restart
    interval: 1m
    input_series:
      - series: 'curie_worker_supervised_restart_total{service_name="curie-worker",operation="publications",outcome="restart",instance="curie-worker-a"}'
        values: '1x40'
      - series: 'curie_worker_supervised_restart_total{service_name="curie-worker",operation="publications",outcome="restart",instance="curie-worker-b"}'
        values: '_x42 1x2 2x4 3x20'
    alert_rule_test:
      - eval_time: 54m
        alertname: CurieWorkerSupervisedRestartLoop
        exp_alerts: []
      - eval_time: 55m
        alertname: CurieWorkerSupervisedRestartLoop
        exp_alerts:
          - exp_labels:
              severity: page
              component: curie-worker
              service_name: curie-worker
              operation: publications
              outcome: restart
              instance: curie-worker-b
            exp_annotations:
              summary: A supervised worker task is crash-looping
              description: >-
                curie_worker_supervised_restart_total with outcome restart
                increased by three or more in 30 minutes for one operation,
                counting a series' first sample as an increase from zero. The
                task is backing off and will be parked if it keeps crashing.

  # Flat at 5, at the threshold. Samples stop after 40m and resume at 61m. 85m
  # and 90m are where a plain `X offset 30m` would find the gap and fire; the
  # offset hour always holds a sample.
  - name: a supervised restart series that resumes after a 20-minute gap stays quiet
    interval: 1m
    input_series:
      - series: 'curie_worker_supervised_restart_total{service_name="curie-worker",operation="runs",outcome="restart"}'
        values: '5x40 _x20 5x40'
    alert_rule_test:
      - eval_time: 85m
        alertname: CurieWorkerSupervisedRestartLoop
        exp_alerts: []
      - eval_time: 90m
        alertname: CurieWorkerSupervisedRestartLoop
        exp_alerts: []

  # CurieTurnAcceptedStale is about a label set, not a process. A restart ends
  # the old instance's series and starts the new one's at its first turn, so a
  # count per series pages on the old instance's flat series and cannot see the
  # new one's first turn. The rule counts each window over every instance of a
  # label set. The 90m count reads a series first sampled inside the window from
  # zero, whether or not its process is still exporting, and a label set with
  # turns in 7 days but no 90m count counts 0 there. The 7d count is increase()
  # alone: with under seven days of history every live series would look new
  # over 7d. The alert names no instance.

  # A worker restart with the canary healthy throughout, on a 30-minute
  # cadence. Worker a's last turn is first exported at 121m and its last export
  # is at 145m; worker b's first turn is exported at 147m and another follows
  # every 30 minutes. Counted per series, a's range holds only flat samples from
  # 210m to 233m, so it fires from 225m. An old series pages that way only with
  # at least 16 minutes of flat exports after its last turn, so a cadence of 15
  # minutes or less cannot show it. a's series leaves the 90m range at 234m,
  # b's first sample counts until 236m, and b's own increase from 237m. At 240m
  # and 250m a's last sample is 95 and 105 minutes old: a per-series count that
  # reads a series missing from the range as 0 is firing there.
  - name: a worker restart with the canary healthy stays quiet
    interval: 1m
    input_series:
      - series: 'curie_turn_accepted_total{service_name="curie-worker",source="worker",outcome="accepted",instance="curie-worker-a"}'
        values: '_ 1x29 2x29 3x29 4x29 5x24'
      - series: 'curie_turn_accepted_total{service_name="curie-worker",source="worker",outcome="accepted",instance="curie-worker-b"}'
        values: '_x147 1x29 2x29 3x29 4x29 5x29 6x3'
    alert_rule_test:
      - eval_time: 225m
        alertname: CurieTurnAcceptedStale
        exp_alerts: []
      - eval_time: 233m
        alertname: CurieTurnAcceptedStale
        exp_alerts: []
      - eval_time: 237m
        alertname: CurieTurnAcceptedStale
        exp_alerts: []
      - eval_time: 240m
        alertname: CurieTurnAcceptedStale
        exp_alerts: []
      - eval_time: 250m
        alertname: CurieTurnAcceptedStale
        exp_alerts: []
      - eval_time: 300m
        alertname: CurieTurnAcceptedStale
        exp_alerts: []

  # Worker a's last turn is exported at 121m and its last export is at 122m, a
  # restart; worker b accepts one turn, exported at 124m, and none after.
  # Counted per series the rule never pages: b's 7d increase is 0 at its first
  # value, and a's series leaves the range. Counted per label set, b's first
  # sample holds the 90m count at 1 until 213m. From 214m the count is 0 while
  # a's increases keep the 7d count above 0: pending, and firing at 229m, 105
  # minutes after b's turn, and still at 300m. A 90m count without the
  # new-series term is 0 from 210m and fires from 225m.
  - name: a canary that stops one turn after a worker restart fires
    interval: 1m
    input_series:
      - series: 'curie_turn_accepted_total{service_name="curie-worker",source="worker",outcome="accepted",instance="curie-worker-a"}'
        values: '_ 1x29 2x29 3x29 4x29 5x1'
      - series: 'curie_turn_accepted_total{service_name="curie-worker",source="worker",outcome="accepted",instance="curie-worker-b"}'
        values: '_x124 1x176'
    alert_rule_test:
      - eval_time: 228m
        alertname: CurieTurnAcceptedStale
        exp_alerts: []
      - eval_time: 229m
        alertname: CurieTurnAcceptedStale
        exp_alerts:
          - exp_labels:
              component: curie-canary
              outcome: accepted
              service_name: curie-worker
              severity: page
              source: worker
            exp_annotations:
              summary: No Curie turn has been accepted for 90 minutes
              description: >-
                Turns were accepted in the last seven days, but none in the
                last 90 minutes. On the soak cadence that is a missed canary.
      - eval_time: 300m
        alertname: CurieTurnAcceptedStale
        exp_alerts:
          - exp_labels:
              component: curie-canary
              outcome: accepted
              service_name: curie-worker
              severity: page
              source: worker
            exp_annotations:
              summary: No Curie turn has been accepted for 90 minutes
              description: >-
                Turns were accepted in the last seven days, but none in the
                last 90 minutes. On the soak cadence that is a missed canary.

  # Worker a's last turn is exported at 121m and its last export is at 122m;
  # worker b never accepts a turn, so it has no series. a's last two samples
  # give a 90m increase of 0 at 210m, and from 211m, with one sample left in
  # range, increase() gives nothing and the label set has no 90m count at all
  # while its 7d count stays above 0. Read as 0, that
  # is pending from 210m and firing at 225m, 104 minutes after a's last turn,
  # and still at 300m. Read as absent, or per series, the rule never pages.
  - name: a canary that never accepts a turn after a worker restart fires
    interval: 1m
    input_series:
      - series: 'curie_turn_accepted_total{service_name="curie-worker",source="worker",outcome="accepted",instance="curie-worker-a"}'
        values: '_ 1x29 2x29 3x29 4x29 5x1'
    alert_rule_test:
      - eval_time: 224m
        alertname: CurieTurnAcceptedStale
        exp_alerts: []
      - eval_time: 225m
        alertname: CurieTurnAcceptedStale
        exp_alerts:
          - exp_labels:
              component: curie-canary
              outcome: accepted
              service_name: curie-worker
              severity: page
              source: worker
            exp_annotations:
              summary: No Curie turn has been accepted for 90 minutes
              description: >-
                Turns were accepted in the last seven days, but none in the
                last 90 minutes. On the soak cadence that is a missed canary.
      - eval_time: 300m
        alertname: CurieTurnAcceptedStale
        exp_alerts:
          - exp_labels:
              component: curie-canary
              outcome: accepted
              service_name: curie-worker
              severity: page
              source: worker
            exp_annotations:
              summary: No Curie turn has been accepted for 90 minutes
              description: >-
                Turns were accepted in the last seven days, but none in the
                last 90 minutes. On the soak cadence that is a missed canary.

  # Two worker restarts within one 60-minute cadence. Worker a takes the turns
  # at 1m and 61m and exits at 70m; worker b takes the 121m turn and exits at
  # 130m; worker c takes the turns from 181m on. a's increase counts until
  # 149m, b's turn from zero until 210m, 90 minutes after it, and c's from
  # 181m, so the 90m count never reaches 0. Read through the instant vector
  # instead, b's turn stops counting at 135m, 5 minutes after its last export,
  # and the rule fires from 165m to 180m, 44 minutes after an accepted turn.
  - name: a worker that takes one turn and exits keeps the canary quiet
    interval: 1m
    input_series:
      - series: 'curie_turn_accepted_total{service_name="curie-worker",source="worker",outcome="accepted",instance="curie-worker-a"}'
        values: '_ 1x59 2x9'
      - series: 'curie_turn_accepted_total{service_name="curie-worker",source="worker",outcome="accepted",instance="curie-worker-b"}'
        values: '_x121 1x9'
      - series: 'curie_turn_accepted_total{service_name="curie-worker",source="worker",outcome="accepted",instance="curie-worker-c"}'
        values: '_x181 1x59 2x59 3x29'
    alert_rule_test:
      - eval_time: 165m
        alertname: CurieTurnAcceptedStale
        exp_alerts: []
      - eval_time: 180m
        alertname: CurieTurnAcceptedStale
        exp_alerts: []
      - eval_time: 210m
        alertname: CurieTurnAcceptedStale
        exp_alerts: []
      - eval_time: 270m
        alertname: CurieTurnAcceptedStale
        exp_alerts: []
      - eval_time: 330m
        alertname: CurieTurnAcceptedStale
        exp_alerts: []

  # The runner records curie.turn.accepted from one short-lived process per
  # sandbox, each its own instance. Sandbox a serves a thread with turns at 1m
  # and 4m and exits at 9m, which leaves an increase in the 7d range. From 61m
  # a new sandbox takes the canary's turn every 60 minutes, exports for 5
  # minutes and exits. Each turn counts from zero for the 90 minutes after it,
  # so each overlaps the next and the rule stays quiet throughout. Read through
  # the instant vector instead, a turn stops counting 10 minutes after it: the
  # rule fires from 108m to 120m, then from 15 minutes after each sandbox's
  # series goes stale until the next turn. The evaluations below fall in each
  # of those spans.
  - name: one-turn runner sandboxes an hour apart keep the canary quiet
    interval: 1m
    input_series:
      - series: 'curie_turn_accepted_total{service_name="curie-runner",source="runner",outcome="accepted",instance="curie-runner-a"}'
        values: '_ 1x2 2x5'
      - series: 'curie_turn_accepted_total{service_name="curie-runner",source="runner",outcome="accepted",instance="curie-runner-b"}'
        values: '_x61 1x5'
      - series: 'curie_turn_accepted_total{service_name="curie-runner",source="runner",outcome="accepted",instance="curie-runner-c"}'
        values: '_x121 1x5'
      - series: 'curie_turn_accepted_total{service_name="curie-runner",source="runner",outcome="accepted",instance="curie-runner-d"}'
        values: '_x181 1x5'
      - series: 'curie_turn_accepted_total{service_name="curie-runner",source="runner",outcome="accepted",instance="curie-runner-e"}'
        values: '_x241 1x5'
      - series: 'curie_turn_accepted_total{service_name="curie-runner",source="runner",outcome="accepted",instance="curie-runner-f"}'
        values: '_x301 1x5'
      - series: 'curie_turn_accepted_total{service_name="curie-runner",source="runner",outcome="accepted",instance="curie-runner-g"}'
        values: '_x361 1x5'
    alert_rule_test:
      - eval_time: 108m
        alertname: CurieTurnAcceptedStale
        exp_alerts: []
      - eval_time: 120m
        alertname: CurieTurnAcceptedStale
        exp_alerts: []
      - eval_time: 150m
        alertname: CurieTurnAcceptedStale
        exp_alerts: []
      - eval_time: 180m
        alertname: CurieTurnAcceptedStale
        exp_alerts: []
      - eval_time: 210m
        alertname: CurieTurnAcceptedStale
        exp_alerts: []
      - eval_time: 240m
        alertname: CurieTurnAcceptedStale
        exp_alerts: []
      - eval_time: 270m
        alertname: CurieTurnAcceptedStale
        exp_alerts: []
      - eval_time: 300m
        alertname: CurieTurnAcceptedStale
        exp_alerts: []
      - eval_time: 330m
        alertname: CurieTurnAcceptedStale
        exp_alerts: []
      - eval_time: 360m
        alertname: CurieTurnAcceptedStale
        exp_alerts: []
      - eval_time: 390m
        alertname: CurieTurnAcceptedStale
        exp_alerts: []
      - eval_time: 420m
        alertname: CurieTurnAcceptedStale
        exp_alerts: []

  # A live worker whose counter has stood at 5 since 25m, with no turn after.
  # Its turns at 10m to 25m are in the 7d range until 7d20m, so the rule pages
  # until then; from there, with no turn in 7 days, it is quiet. A 7d range at
  # 1m holds 10080 samples, over promtool's 10000-sample query limit, so this
  # case samples every 5m; the 5m instant look-back still finds a sample at
  # every evaluation.
  - name: a label set with no turn in 7 days stays quiet
    interval: 5m
    input_series:
      - series: 'curie_turn_accepted_total{service_name="curie-worker",source="worker",outcome="accepted",instance="curie-worker-a"}'
        values: '_ 1+1x4 5x2034'
    alert_rule_test:
      - eval_time: 10140m
        alertname: CurieTurnAcceptedStale
        exp_alerts: []

  # A fresh Prometheus beside a worker that has run for weeks. Its series is
  # first seen at 5m already at 4000 and accepts no turn. Promtool has no
  # history before 0m, so over the 7d window the series looks new until 7d4m;
  # a 7d count that read a new series from zero would count all 4000 and page
  # from 110m, 15 minutes after the 90m count reaches 0, to the end of the run.
  # increase() over 7d is 0 throughout. Sampled every 5m for the same limit as
  # above.
  - name: a series first seen at its lifetime count on a fresh Prometheus stays quiet
    interval: 5m
    input_series:
      - series: 'curie_turn_accepted_total{service_name="curie-worker",source="worker",outcome="accepted",instance="curie-worker-a"}'
        values: '_ 4000x2016'
    alert_rule_test:
      - eval_time: 110m
        alertname: CurieTurnAcceptedStale
        exp_alerts: []
      - eval_time: 12h
        alertname: CurieTurnAcceptedStale
        exp_alerts: []
      - eval_time: 3d
        alertname: CurieTurnAcceptedStale
        exp_alerts: []
      - eval_time: 7d
        alertname: CurieTurnAcceptedStale
        exp_alerts: []

  # Two sources, each under its own job. The worker's last turn is exported at
  # 60m and the dispatcher's at 120m. The worker's 90m count is 0 from 149m and
  # fires alone at 164m while the dispatcher still accepts turns; the
  # dispatcher's is 0 from 209m and fires beside it at 224m. One alert per
  # label set, each keeping `job` and naming no instance.
  - name: two sources that stop accepting turns page separately without an instance
    interval: 1m
    input_series:
      - series: 'curie_turn_accepted_total{job="curie-worker",instance="curie-worker-a",service_name="curie-worker",source="worker",outcome="accepted"}'
        values: '_ 1+1x59 60x239'
      - series: 'curie_turn_accepted_total{job="curie-dispatcher",instance="curie-dispatcher-a",service_name="curie-dispatcher",source="dispatcher",outcome="accepted"}'
        values: '_ 1+1x119 120x179'
    alert_rule_test:
      - eval_time: 164m
        alertname: CurieTurnAcceptedStale
        exp_alerts:
          - exp_labels:
              component: curie-canary
              job: curie-worker
              outcome: accepted
              service_name: curie-worker
              severity: page
              source: worker
            exp_annotations:
              summary: No Curie turn has been accepted for 90 minutes
              description: >-
                Turns were accepted in the last seven days, but none in the
                last 90 minutes. On the soak cadence that is a missed canary.
      - eval_time: 224m
        alertname: CurieTurnAcceptedStale
        exp_alerts:
          - exp_labels:
              component: curie-canary
              job: curie-dispatcher
              outcome: accepted
              service_name: curie-dispatcher
              severity: page
              source: dispatcher
            exp_annotations:
              summary: No Curie turn has been accepted for 90 minutes
              description: >-
                Turns were accepted in the last seven days, but none in the
                last 90 minutes. On the soak cadence that is a missed canary.
          - exp_labels:
              component: curie-canary
              job: curie-worker
              outcome: accepted
              service_name: curie-worker
              severity: page
              source: worker
            exp_annotations:
              summary: No Curie turn has been accepted for 90 minutes
              description: >-
                Turns were accepted in the last seven days, but none in the
                last 90 minutes. On the soak cadence that is a missed canary.

  # CurieApplicationMetricsAbsent reads the two gauges, which the worker
  # records on every maintenance tick and the api on every sweep whether or
  # not anything happens, so a quiet system still has both. A counter is no
  # such evidence: it has no series until its first measurement. Each absent()
  # names its service, so each missing gauge is its own alert.

  # The worker has run its maintenance loop and the api has swept, and no turn
  # has been accepted since they started, so no counter series exists at all.
  - name: both gauges present with no counter series stays quiet
    interval: 1m
    input_series:
      - series: 'curie_queue_depth{service_name="curie-worker",source="worker",outcome="pending"}'
        values: '0x40'
      - series: 'curie_approval_pending{service_name="curie-api",operation="observe",outcome="pending"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 15m
        alertname: CurieApplicationMetricsAbsent
        exp_alerts: []
      - eval_time: 40m
        alertname: CurieApplicationMetricsAbsent
        exp_alerts: []

  # Missing from 0m: pending at 9m and firing at 10m, naming the worker.
  # Accepted turns and the api's gauge do not hold it quiet.
  - name: a missing queue depth gauge fires while turns flow
    interval: 1m
    input_series:
      - series: 'curie_turn_accepted_total{service_name="curie-worker",source="worker",outcome="accepted"}'
        values: '1+1x30'
      - series: 'curie_approval_pending{service_name="curie-api",operation="observe",outcome="pending"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 9m
        alertname: CurieApplicationMetricsAbsent
        exp_alerts: []
      - eval_time: 10m
        alertname: CurieApplicationMetricsAbsent
        exp_alerts:
          - exp_labels:
              component: curie-metrics
              service_name: curie-worker
              severity: page
            exp_annotations:
              summary: Curie application metrics are absent from Prometheus
              description: >-
                curie_queue_depth or curie_approval_pending has had no sample
                for about 15 minutes. The worker records curie_queue_depth on
                every maintenance tick and the api records
                curie_approval_pending on every sweep, so a missing gauge is a
                broken metrics pipeline, a dead process, or a worker or api that
                cannot read Valkey or Postgres, never a quiet system.

  - name: a missing approval pending gauge fires while turns flow
    interval: 1m
    input_series:
      - series: 'curie_turn_accepted_total{service_name="curie-worker",source="worker",outcome="accepted"}'
        values: '1+1x30'
      - series: 'curie_queue_depth{service_name="curie-worker",source="worker",outcome="pending"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 9m
        alertname: CurieApplicationMetricsAbsent
        exp_alerts: []
      - eval_time: 10m
        alertname: CurieApplicationMetricsAbsent
        exp_alerts:
          - exp_labels:
              component: curie-metrics
              service_name: curie-api
              severity: page
            exp_annotations:
              summary: Curie application metrics are absent from Prometheus
              description: >-
                curie_queue_depth or curie_approval_pending has had no sample
                for about 15 minutes. The worker records curie_queue_depth on
                every maintenance tick and the api records
                curie_approval_pending on every sweep, so a missing gauge is a
                broken metrics pipeline, a dead process, or a worker or api that
                cannot read Valkey or Postgres, never a quiet system.

  # The worker's last maintenance tick is at 10m, as when its process dies. The
  # 5m left-open look-back reads the gauge absent from 15m, so it is pending
  # until 24m and fires at 25m, about 15 minutes after the last sample, while the
  # api's gauge and accepted turns keep coming.
  - name: a queue depth gauge that stops fires about 15 minutes after its last sample
    interval: 1m
    input_series:
      - series: 'curie_turn_accepted_total{service_name="curie-worker",source="worker",outcome="accepted"}'
        values: '1+1x40'
      - series: 'curie_queue_depth{service_name="curie-worker",source="worker",outcome="pending"}'
        values: '0x10'
      - series: 'curie_approval_pending{service_name="curie-api",operation="observe",outcome="pending"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 24m
        alertname: CurieApplicationMetricsAbsent
        exp_alerts: []
      - eval_time: 25m
        alertname: CurieApplicationMetricsAbsent
        exp_alerts:
          - exp_labels:
              component: curie-metrics
              service_name: curie-worker
              severity: page
            exp_annotations:
              summary: Curie application metrics are absent from Prometheus
              description: >-
                curie_queue_depth or curie_approval_pending has had no sample
                for about 15 minutes. The worker records curie_queue_depth on
                every maintenance tick and the api records
                curie_approval_pending on every sweep, so a missing gauge is a
                broken metrics pipeline, a dead process, or a worker or api that
                cannot read Valkey or Postgres, never a quiet system.

  - name: queue dead letter fires and clears after its window
    interval: 1m
    input_series:
      - series: 'curie_queue_dead_letter_total{service_name="curie-worker",source="worker",outcome="success"}'
        values: '1+0x30'
    alert_rule_test:
      - eval_time: 5m
        alertname: CurieQueueDeadLettered
        exp_alerts:
          - exp_labels:
              component: curie-queue
              outcome: success
              service_name: curie-worker
              severity: page
              source: worker
            exp_annotations:
              summary: A Curie message was dead lettered
              description: >-
                At least one message was dead lettered in 15 minutes, including
                a new counter series. The turn needs operator investigation.
      - eval_time: 16m
        alertname: CurieQueueDeadLettered
        exp_alerts: []

  - name: slow sandbox claims fire and clear after fast claims
    interval: 1m
    input_series:
      - series: 'curie_sandbox_claim_duration_seconds_sum{service_name="curie-worker",operation="claim",outcome="failed"}'
        values: '0+120x20 2430+30x30'
      - series: 'curie_sandbox_claim_duration_seconds_count{service_name="curie-worker",operation="claim",outcome="failed"}'
        values: '0+1x20 21+1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: CurieSandboxClaimSlow
        exp_alerts:
          - exp_labels:
              component: curie-sandbox
              operation: claim
              outcome: failed
              service_name: curie-worker
              severity: page
            exp_annotations:
              summary: Sandbox claims are slow
              description: >-
                Completed sandbox claims averaged more than 60 seconds over 15
                minutes. Check sandbox capacity and binding.
      - eval_time: 41m
        alertname: CurieSandboxClaimSlow
        exp_alerts: []

  - name: sandbox capacity refusal fires and clears after its window
    interval: 1m
    input_series:
      - series: 'curie_sandbox_lifecycle_total{service_name="curie-worker",operation="reclaim",outcome="reclaimed-retry-refused"}'
        values: '1+0x30'
    alert_rule_test:
      - eval_time: 5m
        alertname: CurieSandboxCapacityRefused
        exp_alerts:
          - exp_labels:
              component: curie-sandbox
              operation: reclaim
              outcome: reclaimed-retry-refused
              service_name: curie-worker
              severity: page
            exp_annotations:
              summary: Sandbox capacity reclamation was refused
              description: >-
                A reclaim attempt was refused in 15 minutes because quota,
                budget, or a safe route was unavailable.
      - eval_time: 16m
        alertname: CurieSandboxCapacityRefused
        exp_alerts: []

  - name: history persistence failure fires and clears after its window
    interval: 1m
    input_series:
      - series: 'curie_history_persistence_failure_total{service_name="curie-api",source="state-api",outcome="capacity",limit="value"}'
        values: '1+0x30'
    alert_rule_test:
      - eval_time: 5m
        alertname: CurieHistoryPersistenceFailed
        exp_alerts:
          - exp_labels:
              component: curie-state
              limit: value
              outcome: capacity
              service_name: curie-api
              severity: page
              source: state-api
            exp_annotations:
              summary: Curie transcript persistence hit a capacity limit
              description: >-
                Transcript persistence failed in 15 minutes because a value or
                namespace capacity limit was reached.
      - eval_time: 16m
        alertname: CurieHistoryPersistenceFailed
        exp_alerts: []
