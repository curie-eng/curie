# Opt-in heartbeat for the alert path (#3059). Apply this overlay after
# alertmanager-webhook.yaml. It adds CurieAlertPathHeartbeat, a rule that always
# fires, and routes it only to a `heartbeat` receiver that posts to a dead man's
# switch outside the cluster, which alarms when the posts stop. The heartbeat
# never reaches curie-sre, the bot; every other alert still does.
#
# The rule lives here and not in the default rules, so nothing changes until an
# operator opts in. In alerting_rules.yml it would reach every Alertmanager
# already installed with alertmanager-webhook.yaml, and any overlay that
# restates the routes would send it to the bot every repeat_interval, starting
# an agent turn each time.
#
# Helm replaces lists instead of merging them, so this file restates the route
# tree and receivers, with curie-sre exactly as alertmanager-webhook.yaml has
# it. An operator overlay applied after this one replaces them again and must
# keep the heartbeat route and receiver.
#
# Needs the Secret alertmanager-heartbeat, key `url`, in the observability
# namespace, holding the external service's URL. Alertmanager does not start
# without it. Posts arrive about every two minutes, not every repeat_interval,
# so the external service should allow at least five minutes between posts.
#
# rule_files is a list too: the chart's four defaults, in order, so
# alerting_rules.yml keeps loading, then heartbeat_rules.yml.
alertmanager:
  enabled: true
  extraSecretMounts:
    - name: alertmanager-heartbeat
      mountPath: /etc/alertmanager-heartbeat
      secretName: alertmanager-heartbeat
      readOnly: true
  config:
    route:
      receiver: curie-sre
      group_by: ["alertname", "curie_workload"]
      routes:
        - receiver: heartbeat
          matchers: ['alertname = "CurieAlertPathHeartbeat"']
          group_wait: 0s
          group_interval: 1m
          repeat_interval: 1m
    receivers:
      - name: curie-sre
        webhook_configs:
          - url: "http://alert-signer:8080/"
            send_resolved: true
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/alert-signer/token
      - name: heartbeat
        webhook_configs:
          - url_file: /etc/alertmanager-heartbeat/url
            send_resolved: false
serverFiles:
  heartbeat_rules.yml:
    groups:
      - name: curie-alert-path
        rules:
          - alert: CurieAlertPathHeartbeat
            expr: vector(1)
            labels:
              severity: none
              component: curie-alert-path
            annotations:
              summary: Always firing, so the alert path can be seen working
              description: >-
                This alert fires by design and never pages. The heartbeat
                receiver posts it to a dead man's switch outside the cluster
                about every two minutes; that service alarms when the posts
                stop, which means Prometheus, rule evaluation, Alertmanager or
                the way out of the cluster has stopped. A receiver inside the
                cluster cannot report its own death.
  prometheus.yml:
    rule_files:
      - /etc/config/recording_rules.yml
      - /etc/config/alerting_rules.yml
      - /etc/config/rules
      - /etc/config/alerts
      - /etc/config/heartbeat_rules.yml
