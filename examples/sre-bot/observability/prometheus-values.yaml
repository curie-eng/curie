alertmanager:
  enabled: false
prometheus-pushgateway:
  enabled: false
configmapReload:
  prometheus:
    enabled: false
kube-state-metrics:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi
prometheus-node-exporter:
  enabled: true
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 64Mi
# The source boundary (issue #2060). This Prometheus is the SRE bot's OWN
# capacity evidence, not a cluster-wide scrape platform, and the chart's default
# annotation-driven discovery does not know the difference: `prometheus.io/scrape`
# on ANY Service, EndpointSlice or Pod in ANY namespace is a target. Installed
# beside a monitoring stack that was already there, that silently ingests a
# second kube-state-metrics and a second node exporter, so one Kubernetes object
# comes back twice with identical workload labels and the bot reports double the
# restarts and double the estate.
#
# Two halves, and each covers something the other does not:
#
#   1. `namespaces.own_namespace` on every annotation-driven job. Discovery is
#      bounded to the namespace Prometheus itself runs in -- whatever
#      `--observability-namespace` named -- which is where this installer puts
#      kube-state-metrics and the node exporter. A stack that was already in the
#      cluster is out of scope BY CONSTRUCTION rather than by a name filter that
#      a differently-named release would slip past. The node-role jobs
#      (`kubernetes-nodes`, `kubernetes-nodes-cadvisor`) are deliberately left
#      alone: they resolve one target per Node through the API server, so they
#      cannot double count, and namespace-scoping them would blind the bot to
#      the kubelet. `kubernetes-api-servers` already pins `default;kubernetes`.
#
#   2. `curie_source` stamped on every scraped sample, so the boundary is
#      visible in the data and a shipped query can say which install an answer
#      came from.
#
# Two limits, stated because a boundary nobody can see through is worse than
# none. `metric_relabel_configs` do NOT reach Prometheus's own per-scrape series
# (`up`, `scrape_duration_seconds`), which are synthesized after metric
# relabeling and so carry no stamp -- qualify those by `job`. And the scope is a
# NAMESPACE, not a release: a second monitoring stack installed into this same
# namespace puts both kube-state-metrics instances back in scope, stamped
# identically, so give this stack a namespace of its own.
#
# What this gives up outside that namespace, and why an operator who wants a
# cluster-wide scrape platform should run a separate one, is in
# examples/sre-bot/README.md ("One source of capacity truth"). Enforced by
# charts/curie/ci/observability-stack-assertions.sh, which renders this file
# beside a second annotated stack and replays the rendered relabel program.
#
# Keyed by job name: Helm deep-merges these maps over the chart's own
# `scrapeConfigs`, so each job keeps its default `relabel_configs` and only the
# discovery scope is replaced and the stamp added. The stamp is written once and
# aliased -- YAML anchors are resolved when Helm loads this file, so the chart
# sees nine literal copies. They do not cross `-f` boundaries, so keep the
# anchor and its aliases in this one file.
scrapeConfigs:
  # The pushgateway subchart is disabled above, so this job can only ever
  # resolve someone else's pushgateway.
  prometheus-pushgateway:
    enabled: false
  prometheus:
    metric_relabel_configs: &curie_source_stamp
      - target_label: curie_source
        replacement: curie-sre-bot
  kubernetes-api-servers:
    metric_relabel_configs: *curie_source_stamp
  kubernetes-nodes:
    metric_relabel_configs: *curie_source_stamp
  kubernetes-nodes-cadvisor:
    metric_relabel_configs: *curie_source_stamp
  kubernetes-service-endpoints:
    kubernetes_sd_configs:
      - role: endpointslice
        namespaces:
          own_namespace: true
    metric_relabel_configs: *curie_source_stamp
  kubernetes-service-endpoints-slow:
    kubernetes_sd_configs:
      - role: endpointslice
        namespaces:
          own_namespace: true
    metric_relabel_configs: *curie_source_stamp
  kubernetes-services:
    kubernetes_sd_configs:
      - role: service
        namespaces:
          own_namespace: true
    metric_relabel_configs: *curie_source_stamp
  kubernetes-pods:
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          own_namespace: true
    metric_relabel_configs: *curie_source_stamp
  kubernetes-pods-slow:
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          own_namespace: true
    metric_relabel_configs: *curie_source_stamp
server:
  extraArgs:
    web.enable-remote-write-receiver: ""
  retention: 7d
  retentionSize: 3GB
  global:
    scrape_interval: 60s
    evaluation_interval: 60s
  persistentVolume:
    enabled: true
    size: 8Gi
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

# Reliability alerts for retained Curie metrics and node capacity. Alertmanager
# stays disabled: these rules fire inside Prometheus so an operator can query
# /api/v1/alerts. This issue does not send notifications to people.
serverFiles:
  alerting_rules.yml:
    groups:
      - name: curie-reliability
        rules:
          - alert: CurieApplicationMetricsAbsent
            expr: absent(curie_turn_accepted_total)
            for: 10m
            labels:
              severity: page
              component: curie-metrics
            annotations:
              summary: Curie application metrics are absent from Prometheus
              description: >-
                No curie_turn_accepted_total series has been retained for 10
                minutes. Treat missing metrics as a failure, not as a quiet
                system.
          - alert: CurieTurnAcceptedStale
            expr: |
              (
                increase(curie_turn_accepted_total[90m]) == 0
              )
              and
              (
                increase(curie_turn_accepted_total[7d]) > 0
              )
            for: 15m
            labels:
              severity: page
              component: curie-canary
            annotations:
              summary: No Curie turn has been accepted for 90 minutes
              description: >-
                Turns were accepted in the last seven days, but none in the
                last 90 minutes. On the soak cadence that is a missed canary.
          - alert: CurieTaskFailure
            expr: |
              increase(
                curie_turn_completed_total{outcome="classified_failure"}[15m]
              ) > 0
            for: 5m
            labels:
              severity: page
              component: curie-task
            annotations:
              summary: A Curie turn completed as classified_failure
              description: >-
                curie_turn_completed_total with outcome classified_failure
                increased in the last 15 minutes.
          - alert: CurieQueueMessageAgeHigh
            expr: curie_queue_message_age_seconds > 900
            for: 10m
            labels:
              severity: page
              component: curie-queue
            annotations:
              summary: Oldest queued Curie message is older than 15 minutes
              description: >-
                curie_queue_message_age_seconds has stayed above 900 for 10
                minutes.
          - alert: CurieCompletionOutboxAgeHigh
            expr: curie_completion_outbox_age_seconds > 300
            for: 10m
            labels:
              severity: page
              component: curie-completion
            annotations:
              summary: An owed completion is older than five minutes
              description: >-
                curie_completion_outbox_age_seconds has stayed above 300 for
                10 minutes. A drained run queue does not clear this signal.
          - alert: CurieCompletionOutboxSignalAbsent
            expr: |
              absent(curie_completion_outbox)
              and
              count(curie_turn_accepted_total) > 0
            for: 10m
            labels:
              severity: page
              component: curie-completion
            annotations:
              summary: Completion-outbox metrics are absent while turns flow
              description: >-
                Turns are being accepted, but curie_completion_outbox is
                missing. Absent completion-delivery telemetry is a failure
                signal.
          - alert: CurieWorkerSupervisedRestartLoop
            expr: |
              increase(
                curie_worker_supervised_restart_total{outcome="restart"}[30m]
              ) >= 3
            for: 5m
            labels:
              severity: page
              component: curie-worker
            annotations:
              summary: A supervised worker task is crash-looping
              description: >-
                curie_worker_supervised_restart_total with outcome restart
                increased by three or more in 30 minutes for one operation.
                The task is backing off and will be parked if it keeps
                crashing.
          - alert: CurieWorkerSupervisedTaskParked
            # A level check, not increase(): a parked task emits give_up once
            # and its series first appears already at 1 with no zero sample, so
            # increase() would never see it. The series leaves with the worker
            # process, which is also what un-parks the task.
            expr: |
              curie_worker_supervised_restart_total{outcome="give_up"} > 0
            labels:
              severity: page
              component: curie-worker
            annotations:
              summary: A supervised worker task was parked after repeated crashes
              description: >-
                curie_worker_supervised_restart_total with outcome give_up
                is present. The named operation stopped restarting and stays
                down until the worker pod restarts.
          - alert: CurieReplyDeliveryRefused
            expr: |
              increase(
                curie_reply_delivery_total{outcome="failure"}[15m]
              ) >= 3
            for: 10m
            labels:
              severity: page
              component: curie-delivery
            annotations:
              summary: Repeated Curie reply delivery failures
              description: >-
                curie_reply_delivery_total with outcome failure increased by
                three or more in 15 minutes.
          - alert: CurieChannelTokenRotationFailed
            expr: |
              increase(
                curie_http_server_request_total{
                  operation="/channels/token",
                  outcome="5xx"
                }[1h]
              ) > 0
            for: 5m
            labels:
              severity: page
              component: curie-token
            annotations:
              summary: Channel-token HTTP rotation returned 5xx
              description: >-
                curie_http_server_request_total for /channels/token with
                outcome 5xx increased in the last hour.
          - alert: CurieMailAdapterNotReady
            # Two terms, because `unavailable > 0` alone cannot see a
            # Deployment scaled to zero: kube-state-metrics reports
            # unavailable as spec minus available, which is 0 - 0 there.
            # The regex is `.*mail-adapter.*` because matchers are fully
            # anchored and an installation names one adapter per mailbox
            # with a suffix (`mail-adapter-brand`).
            expr: |
              (
                kube_deployment_status_replicas_unavailable{
                  deployment=~".*mail-adapter.*"
                } > 0
              )
              or
              (
                kube_deployment_spec_replicas{
                  deployment=~".*mail-adapter.*"
                } == 0
              )
            for: 5m
            labels:
              severity: page
              component: curie-token
            annotations:
              summary: Mail adapter replicas are unavailable
              description: >-
                The mail adapter Deployment has unavailable replicas. An
                expired channel token fails /readyz and surfaces here without
                inspecting a token value.
          - alert: CurieConnectorNotReady
            # A connector is one Deployment per (agent, connector), named
            # `<release>-<agent>-mcp-<connector>`. Same two terms as the mail
            # adapter, for the same reason. Nothing else in this file notices
            # a connector down: its agent still answers, and says it cannot
            # reach the systems it reads from.
            expr: |
              (
                kube_deployment_status_replicas_unavailable{
                  deployment=~".*-mcp-.*"
                } > 0
              )
              or
              (
                kube_deployment_spec_replicas{
                  deployment=~".*-mcp-.*"
                } == 0
              )
            for: 5m
            labels:
              severity: page
              component: curie-connector
            annotations:
              summary: A connector Deployment is not serving
              description: >-
                A connector has no available replica, or has been scaled to
                zero. Its agent still answers, and tells the person it cannot
                reach the systems it reads from.
          - alert: CurieDispatcherRestartLoop
            # Pod restarts, not CurieWorkerSupervisedRestartLoop's in-process
            # counter: a dispatcher that crashes takes its counter with it.
            # Same window and threshold as that rule so the two read alike.
            expr: |
              increase(
                kube_pod_container_status_restarts_total{
                  pod=~".*-dispatcher-.*"
                }[30m]
              ) >= 3
            for: 5m
            labels:
              severity: page
              component: curie-dispatcher
            annotations:
              summary: The dispatcher is crash-looping
              description: >-
                A dispatcher container restarted three or more times in 30
                minutes. While it is down no Slack message reaches any agent,
                and every other pod still looks healthy.
          - alert: CurieNodeNotReady
            # Testing the status="true" series for 0 catches Unknown as well
            # as False. A node that stops reporting goes Unknown, which a
            # status="false" rule would miss.
            expr: |
              kube_node_status_condition{condition="Ready",status="true"} == 0
            for: 5m
            labels:
              severity: page
              component: curie-node
            annotations:
              summary: A node is not Ready
              description: >-
                A node has not reported Ready for 5 minutes. Pods on it stop
                being scheduled, and a sandbox placed there cannot start.
          - alert: CuriePodCrashLooping
            # max_over_time, not the raw series: the waiting series exists
            # only while the container waits, so each brief run between
            # back-offs would drop it and restart the `for` clock. Held over
            # 5m, a container that flaps between waiting and running stays
            # firing.
            expr: |
              max_over_time(
                kube_pod_container_status_waiting_reason{
                  reason="CrashLoopBackOff"
                }[5m]
              ) >= 1
            for: 10m
            labels:
              severity: page
              component: curie-pod
            annotations:
              summary: A container is crash-looping
              description: >-
                A container has been in CrashLoopBackOff for 10 minutes. It
                keeps failing on start and waits longer before each retry.
          - alert: CurieCoreWorkloadNotReady
            # Same two terms as the mail adapter, for the same reason. The
            # role regex also matches `<release>-langfuse-worker`, which is
            # Langfuse's worker and not Curie's, and a connector whose name
            # ends in a role, which CurieConnectorNotReady already owns. The
            # second matcher drops both.
            expr: |
              (
                kube_deployment_status_replicas_unavailable{
                  deployment=~".+-(api|worker|dispatcher)",
                  deployment!~".*-(mcp|langfuse)-.*"
                } > 0
              )
              or
              (
                kube_deployment_spec_replicas{
                  deployment=~".+-(api|worker|dispatcher)",
                  deployment!~".*-(mcp|langfuse)-.*"
                } == 0
              )
            for: 5m
            labels:
              severity: page
              component: curie-core
            annotations:
              summary: A core Curie Deployment is not serving
              description: >-
                The api, worker or dispatcher has no available replica, or has
                been scaled to zero. The api readiness probe queries the
                database, so a database outage, including one outside the
                cluster, surfaces here as an unavailable api.
          - alert: CurieStateStoreNotReady
            # Two terms, because ready < replicas is 0 < 0 at zero replicas.
            # No `on (...)`: both series share every label but __name__, so
            # both terms yield the same label set, and a store going from not
            # ready to scaled to zero keeps firing instead of restarting the
            # 5m wait under new labels.
            expr: |
              (
                kube_statefulset_status_replicas_ready{
                  statefulset=~".+-(valkey|postgres)"
                }
                <
                kube_statefulset_replicas{
                  statefulset=~".+-(valkey|postgres)"
                }
              )
              or
              (
                kube_statefulset_replicas{
                  statefulset=~".+-(valkey|postgres)"
                } == 0
              )
            for: 5m
            labels:
              severity: page
              component: curie-state
            annotations:
              summary: Valkey or Postgres is not ready
              description: >-
                A Valkey or Postgres StatefulSet has fewer ready replicas than
                it asks for, or has been scaled to zero. Every agent depends
                on both: Valkey carries the run queue and Postgres the agents
                and their state.
          - alert: CuriePersistentVolumeSpaceLow
            # Filtered on the curie_source stamp like the node rules below:
            # these come from the kubelet via the node-role scrape, which is
            # not namespace bounded, so the stamp is what marks a series as
            # this stack's own. An unstamped series belongs to another source.
            expr: |
              (
                kubelet_volume_stats_available_bytes{
                  curie_source="curie-sre-bot"
                }
                /
                kubelet_volume_stats_capacity_bytes{
                  curie_source="curie-sre-bot"
                }
              ) < 0.10
            for: 15m
            labels:
              severity: page
              component: curie-storage
            annotations:
              summary: A persistent volume has less than 10 percent free
              description: >-
                A curie_source=curie-sre-bot volume series has stayed below 10
                percent free for 15 minutes. A full volume stops the workload
                that writes to it.
          - alert: CurieNodeMemoryHeadroomLow
            expr: |
              100 * (
                node_memory_MemAvailable_bytes{curie_source="curie-sre-bot"}
                /
                node_memory_MemTotal_bytes{curie_source="curie-sre-bot"}
              ) < 10
            for: 15m
            labels:
              severity: page
              component: curie-node
            annotations:
              summary: Node memory headroom is below 10 percent
              description: >-
                A curie_source=curie-sre-bot memory series has had less than
                10 percent available for 15 minutes.
          - alert: CurieRootDiskPressure
            expr: |
              (
                node_filesystem_avail_bytes{
                  curie_source="curie-sre-bot",
                  mountpoint="/",
                  fstype!~"rootfs|tmpfs|overlay"
                }
                /
                node_filesystem_size_bytes{
                  curie_source="curie-sre-bot",
                  mountpoint="/",
                  fstype!~"rootfs|tmpfs|overlay"
                }
              ) < 0.20
            for: 15m
            labels:
              severity: page
              component: curie-node
            annotations:
              summary: Root disk has less than 20 percent free
              description: >-
                A curie_source=curie-sre-bot root filesystem has stayed below
                20 percent free for 15 minutes.
          - alert: CurieDuplicateNodeExporter
            expr: |
              count(
                node_memory_MemAvailable_bytes{
                  curie_source="curie-sre-bot",
                  instance=~".*:9100"
                }
              ) > 0
              and
              count(
                node_memory_MemAvailable_bytes{
                  curie_source="curie-sre-bot",
                  instance=~".*:9101"
                }
              ) > 0
            for: 10m
            labels:
              severity: page
              component: curie-node
            annotations:
              summary: Both 9100 and 9101 node-exporter series are retained
              description: >-
                node_memory_MemAvailable_bytes with curie_source=curie-sre-bot
                has series on :9100 and :9101. Naive sums of that set
                double-count the node. Isolate scrape to one intended series.
