# Opt-in operator grant for the pinned upstream Kubernetes MCP connector.
#
# kubernetes-access.yaml confines writes to workload APIs in `sre-demo`, so an
# approved restart of a workload in any other namespace receives a 403 from
# the API server. This file lets an installation's SRE bot act on the workloads
# it diagnoses: it binds the same `curie:sre-bot-kubernetes` ServiceAccount to
# one aggregated ClusterRole that can get, list, watch, create, update, patch,
# delete and deletecollection every built-in kind, in every namespace and at
# cluster scope, except what is withheld below. Every write still waits for
# Curie's per-call approval; RBAC is still the ceiling, and this file raises
# it. Applying it is an operator security decision, not an approval setting.
#
# Reads widen too, and reads never wait for approval. The bot's ungated read
# tools then reach every non-Secret resource in every namespace, Curie's own
# objects and RBAC included, and the kubelet API through nodes/proxy, which the
# ungated node reads (`nodes_log`, `nodes_stats_summary`) use: a `nodes_log`
# read returns the node's own log files. Those tools only read logs and stats
# through it, but the credential is not limited to that: any access to
# nodes/proxy, get included, reaches the kubelet's exec and run endpoints, so
# it is exec into any container on the node.
#
# Apply it after kubernetes-access.yaml, which owns the ServiceAccount, its
# token and the default grant. The CLI never applies this file:
#
#   kubectl apply -f examples/sre-bot/manifests/kubernetes-access.yaml
#   kubectl apply -f examples/sre-bot/manifests/kubernetes-operator-access.yaml
#
# An install outside namespace `curie` changes the binding subject's namespace
# at the end of this file to its own.
#
# Withheld. RBAC has no deny rule, so each is withheld by never being granted:
#
# - Secrets: no verb on `secrets` in any namespace, so no Secret is read.
# - serviceaccounts/token: no token is minted for any ServiceAccount, the
#   bot's own included.
# - pods/proxy and services/proxy: no tool of this bundle uses them, and they
#   would tunnel ungated reads into any in-cluster endpoint, whose answers can
#   carry secret material.
# - escalate and bind: the API server refuses a Role, ClusterRole or binding
#   that grants more than this file holds, a binding to cluster-admin included.
#   A role or binding within what it already holds is still allowed.
# - impersonate: the bot cannot act as another user, group or ServiceAccount.
# - approve and sign: it cannot approve or issue a CertificateSigningRequest.
#
# What stays open, each path one approved call away:
#
# - exec: pods/exec, pods/attach and pods/ephemeralcontainers, through the
#   gated `pods_exec`. A container's environment and files often carry Secret
#   values.
# - a pod that mounts a Secret, runs as any ServiceAccount in its namespace
#   and so acts with that account's grant, or mounts a hostPath from its node.
#   The ungated `pods_log` then reads whatever the pod prints, so the approval
#   of a pod create is the one checkpoint in front of every Secret. A
#   Deployment, Job or any other workload that creates pods counts as one.
# - admission webhooks and CEL admission policies: a webhook configuration
#   sends the objects it matches, Secrets included, to a service the bot names,
#   and a policy can change or refuse any later write.
# - apiregistration.k8s.io: an APIService can redirect a whole API group to a
#   service the bot names.
# - a RoleBinding or ClusterRoleBinding that hands this role, or any part of
#   it, to another subject. The binding outlives the approval that created it.
# - Curie itself: its Deployments and SandboxTemplates, including the parts
#   that enforce approval. After one such change, later writes may not reach
#   an approval at all.
# - Argo CD: an Application or ApplicationSet deploys with Argo CD's own
#   identity, not with this grant, and that identity can commonly write the
#   Secrets this grant withholds.
#
# Approval is therefore the real protection under this grant, and approvers
# should read each card as a call that could reach Secret contents. Approval
# controls the agent, not the credential: a leaked connector credential
# carries this whole grant, with no approval in front of it, and through
# nodes/proxy that includes exec into any container on any node.
#
# A cluster's own CRD groups and cloud groups are not listed here, because
# they belong to that installation. Add them with a ClusterRole of the
# cluster's own carrying the label
# curie.dev/aggregate-to-sre-bot-operator: "true"; the aggregation controller
# folds its rules into sre-bot-kubernetes-operator. Never edit this file for
# that. Keep such a role to the same verbs, and away from Secrets and tokens.
#
# Verify the ceiling after applying (the aggregated role fills within seconds):
#
#   kubectl auth can-i --as=system:serviceaccount:curie:sre-bot-kubernetes \
#     patch deployments -n kube-system                                # yes
#   kubectl auth can-i --as=system:serviceaccount:curie:sre-bot-kubernetes \
#     delete pods -n curie                                            # yes
#   kubectl auth can-i --as=system:serviceaccount:curie:sre-bot-kubernetes \
#     patch nodes                                                     # yes
#   kubectl auth can-i --as=system:serviceaccount:curie:sre-bot-kubernetes \
#     get nodes --subresource=proxy                                   # yes
#   kubectl auth can-i --as=system:serviceaccount:curie:sre-bot-kubernetes \
#     get secrets --all-namespaces                                    # no
#   kubectl auth can-i --as=system:serviceaccount:curie:sre-bot-kubernetes \
#     create serviceaccounts --subresource=token -n curie             # no
#   kubectl auth can-i --as=system:serviceaccount:curie:sre-bot-kubernetes \
#     get pods --subresource=proxy -n curie                           # no
#   kubectl auth can-i --as=system:serviceaccount:curie:sre-bot-kubernetes \
#     get services --subresource=proxy -n curie                       # no
#   kubectl auth can-i --as=system:serviceaccount:curie:sre-bot-kubernetes \
#     escalate clusterroles                                           # no
#   kubectl auth can-i --as=system:serviceaccount:curie:sre-bot-kubernetes \
#     bind clusterroles                                               # no
#   kubectl auth can-i --as=system:serviceaccount:curie:sre-bot-kubernetes \
#     impersonate serviceaccounts                                     # no
#
# Approving a certificate needs `approve` on its signer, a resource no API
# serves, so `kubectl auth can-i` cannot resolve it. Ask a SubjectAccessReview,
# which is evaluated and never stored; it prints false:
#
#   kubectl create -o jsonpath='{.status.allowed}' -f - <<'EOF'
#   apiVersion: authorization.k8s.io/v1
#   kind: SubjectAccessReview
#   spec:
#     user: system:serviceaccount:curie:sre-bot-kubernetes
#     resourceAttributes:
#       group: certificates.k8s.io
#       resource: signers
#       name: kubernetes.io/kube-apiserver-client
#       verb: approve
#   EOF
#
# The API server refuses a self-binding to cluster-admin; a server-side dry run
# shows it without creating anything:
#
#   kubectl create clusterrolebinding sre-bot-self-admin --dry-run=server \
#     --clusterrole=cluster-admin \
#     --serviceaccount=curie:sre-bot-kubernetes \
#     --as=system:serviceaccount:curie:sre-bot-kubernetes             # Forbidden
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sre-bot-kubernetes-operator
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        curie.dev/aggregate-to-sre-bot-operator: "true"
# The aggregation controller writes the union of the labelled roles here.
rules: []
---
# Core kinds and subresources, each by name: RBAC reads `pods/*` literally and
# grants nothing through it. `secrets`, `serviceaccounts/token`, `pods/proxy`
# and `services/proxy` are absent. `nodes/proxy` stays for the node read tools,
# and it also reaches the kubelet's exec and run endpoints; see the header.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sre-bot-kubernetes-operator-core
  labels:
    curie.dev/aggregate-to-sre-bot-operator: "true"
rules:
  - apiGroups: [""]
    resources:
      - bindings
      - componentstatuses
      - configmaps
      - endpoints
      - events
      - limitranges
      - namespaces
      - namespaces/finalize
      - namespaces/status
      - nodes
      - nodes/proxy
      - nodes/status
      - persistentvolumeclaims
      - persistentvolumeclaims/status
      - persistentvolumes
      - persistentvolumes/status
      - pods
      - pods/attach
      - pods/binding
      - pods/ephemeralcontainers
      - pods/eviction
      - pods/exec
      - pods/log
      - pods/portforward
      - pods/resize
      - pods/status
      - podtemplates
      - replicationcontrollers
      - replicationcontrollers/scale
      - replicationcontrollers/status
      - resourcequotas
      - resourcequotas/status
      - serviceaccounts
      - services
      - services/status
    verbs: [get, list, watch, create, update, patch, delete, deletecollection]
---
# Every built-in non-core group of current Kubernetes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sre-bot-kubernetes-operator-builtin
  labels:
    curie.dev/aggregate-to-sre-bot-operator: "true"
rules:
  - apiGroups:
      - admissionregistration.k8s.io
      - apiextensions.k8s.io
      - apiregistration.k8s.io
      - apps
      - authentication.k8s.io
      - authorization.k8s.io
      - autoscaling
      - batch
      - certificates.k8s.io
      - coordination.k8s.io
      - discovery.k8s.io
      - events.k8s.io
      - flowcontrol.apiserver.k8s.io
      - networking.k8s.io
      - node.k8s.io
      - policy
      - rbac.authorization.k8s.io
      - resource.k8s.io
      - scheduling.k8s.io
      - storage.k8s.io
    resources: ["*"]
    verbs: [get, list, watch, create, update, patch, delete, deletecollection]
---
# Curie's own sandbox groups, and the add-on groups the default grant reads:
# metrics-server's metrics.k8s.io and Argo CD's argoproj.io.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sre-bot-kubernetes-operator-addons
  labels:
    curie.dev/aggregate-to-sre-bot-operator: "true"
rules:
  - apiGroups:
      - agents.x-k8s.io
      - extensions.agents.x-k8s.io
      - metrics.k8s.io
      - argoproj.io
    resources: ["*"]
    verbs: [get, list, watch, create, update, patch, delete, deletecollection]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sre-bot-kubernetes-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sre-bot-kubernetes-operator
subjects:
  - kind: ServiceAccount
    name: sre-bot-kubernetes
    # An install outside namespace `curie` changes this to its own.
    namespace: curie
