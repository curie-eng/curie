[package]
name = "curie"
version = "0.7.0"
edition = "2021"
description = "Curie CLI: init/start/send/eval a plugin against a local runner (task I1)"

[[bin]]
name = "curie"
path = "src/main.rs"

[dependencies]
curie-aci-protocol = { path = "../packages/aci-protocol/generated/rust" }
anstream = "1"
anstyle = "1"
anstyle-query = "1"
anyhow = "1"
axum = { version = "0.8", default-features = false, features = [
    "tokio",
    "http1",
    "json",
] }
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
# Reads `.env` files (repo-root + bundle-local) into the process env so
# `skill up` config lives in files the CLI owns rather than ambient shell
# exports. Non-overriding load: a real shell export always wins over a file.
dotenvy = "0.15"
flate2 = "1"
futures-util = "0.3"
indicatif = "0.18"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "multipart",
    "rustls-tls",
] }
redis = { version = "1.3", default-features = false, features = [
    "tokio-comp",
    "streams",
] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"] }
unicode-width = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
# Content-addressed bundle identity: sha256 of the packed tar.gz, the same
# digest `apps/api` records for that bundle on deploy (#1087).
sha2 = "0.11"
signal-hook = "0.4"
tar = "0.4"
time = { version = "0.3", features = ["formatting", "parsing"] }
uuid = { version = "1", features = ["v4"] }
# OS CSPRNG for generating strong per-release chart secrets (cluster up). Same
# 0.2 line uuid already pulls in; the free `getrandom::getrandom` fill API.
getrandom = "0.4"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "process",
    "time",
    "fs",
    "io-util",
    "net",
    "sync",
] }
keyring = "4.1.5"
rpassword = "7.5.4"
# JSON Schema validation. Originally a test-only dependency for the agent-facing
# `--json` contract gate (ADR-0021); promoted to a real dependency by #701 so
# `skill_approvals` can validate a plugin manifest against the frozen
# `packages/plugin-format` schema at runtime (`commands::parse_manifest_gates`),
# closing the ADR-0041 known limitation without hand-mirroring every
# `PluginManifest` field in Rust. Default features pull reqwest + a second TLS
# stack for remote `$ref` resolution neither use case needs; the committed
# schemas are self-contained, so keep it lean.
jsonschema = { version = "0.49", default-features = false }
serde_norway = "0.9.42"
crypto_box = { version = "0.9.1", features = ["seal", "std"] }
base64 = "0.23.1"

[dev-dependencies]
tempfile = "3"
# The frozen ACI types are a normal dependency of the lib, but integration test
# crates need them by name to build a SessionStatus for the status_json contract.
curie-aci-protocol = { path = "../packages/aci-protocol/generated/rust" }
# AST parse of cli/src/api.rs for the --json field-parity gate (#691): resolve
# serde rename/skip/flatten and derive spellings exactly. `full` parses fn
# bodies, `visit` recurses into fn/impl-body items (the method-local BundleFiles),
# `extra-traits` gives the PartialEq the walk relies on.
syn = { version = "3", features = ["full", "visit", "extra-traits"] }
# Both already ride in transitively via syn; named directly for the emit-hop
# gate (#699, `support/emit_parity.rs`), which walks a `json!` macro's raw
# token stream (a `json!` argument is opaque to syn's AST -- it is never parsed
# into an `Expr` tree) to recover its object-literal keys, and re-tokenizes a
# parsed `syn::Block` (`ToTokens::to_token_stream`) to hand that walk its input.
proc-macro2 = "1"
quote = "1"

# Dev builds carried full DWARF, which dominated the target dir. A section dump
# of one 181MB integration test binary measured .text at 3.5MB against roughly
# 175MB of .debug_* sections, so about 97% of every artifact was debug info.
# With 41 integration test targets in cli/tests, each statically linking the
# whole crate graph, a single target dir reached 175G.
#
# line-tables-only keeps file and line numbers in panics and backtraces, which
# is what the test suite and local debugging actually read. It drops type and
# variable DWARF, so a step debugger will not resolve locals. For that, build
# the one target you are debugging with CARGO_PROFILE_DEV_DEBUG=2.
[profile.dev]
debug = "line-tables-only"
