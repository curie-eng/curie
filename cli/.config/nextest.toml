# The CI test partitions run `cargo nextest run --profile ci`.
[profile.ci]
fail-fast = false
failure-output = "immediate-final"

[test-groups.convergence]
max-threads = 1

[[profile.ci.overrides]]
filter = "test(ops::convergence::tests::)"
test-group = "convergence"
slow-timeout = { period = "60s", terminate-after = 15 }
