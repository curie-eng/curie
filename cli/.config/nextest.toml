# The CI test partitions run `cargo nextest run --profile ci`.
[profile.ci]
fail-fast = false
failure-output = "immediate-final"

# One test owns the cluster and runs the isolated convergence cases concurrently.
[[profile.ci.overrides]]
filter = "test(/^ops::convergence::tests::/)"
slow-timeout = { period = "60s", terminate-after = 15 }
