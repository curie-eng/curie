# The CI test partitions run `cargo nextest run --profile ci`.
[profile.ci]
fail-fast = false
failure-output = "immediate-final"

# The kind + Helm convergence regressions each own a kind cluster; run them one
# at a time. CI runs them in the rust-convergence job, not the partitions.
[test-groups.convergence]
max-threads = 1

[[profile.ci.overrides]]
filter = "test(/^ops::convergence::tests::/)"
test-group = "convergence"
slow-timeout = { period = "60s", terminate-after = 15 }
