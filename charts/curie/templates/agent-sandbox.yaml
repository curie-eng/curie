{{/*
Agent Sandbox substrate (G1): the runner SandboxTemplate and SandboxWarmPool
the worker claims from, plus (optionally) the vendored upstream controller.

- CRDs live in this chart's crds/ directory (Helm installs them before
  templates render, so the CRs below never race their own CRDs).
- The controller bundle is the upstream v0.5.0 release manifests
  (core manifest + extensions overlay: the Deployment runs with --extensions),
  vendored under files/agent-sandbox/ with two Curie security patches (#66:
  the networkpolicies RBAC is de-scoped from cluster-wide to the release
  namespace via the Role/RoleBinding below, and the Deployment carries a
  hardened securityContext). Cluster-scoped, one per cluster. A third,
  template-layer patch injects the platform priorityClassName into the
  controller Deployment below (issue #816, ADR-0059 decision 5) rather than
  baking it into the vendored file, so it tracks the operator-set class name;
  the vendored file itself still carries only the #66 securityContext patch.
- The SandboxTemplate bakes the generic warm-pod env. Per-session env
  (CURIE_HISTORY_REF, CURIE_SESSION_ID) is injected per-claim by the
  substrate; envVarsInjectionPolicy Overrides makes that injection win.
- service: true is what gives every claimed sandbox its routable
  .status.serviceFQDN (PT-1: without it no Service is created at all).
- networkPolicyManagement: Unmanaged (issue #765, ADR-0067) stops the
  controller from reconciling its OWN separately-managed NetworkPolicy for
  this template. NetworkPolicy allows are additive across objects selecting
  the same pods, so the controller's default "allow public internet"
  behavior would otherwise silently widen (not be narrowed by) Rail 1's
  default-deny + allowlist in security-networkpolicy.yaml.
*/}}
{{- if .Values.agentSandbox.controller.deploy }}
{{/*
ADR-0059 decision 5 / issue #816: the vendored controller carries no
priorityClassName (priority 0), so under node Disk/Memory pressure the
kubelet would evict it BEFORE the sandbox pods (curie-sandbox, value
100000) it reconciles, halting claim/release servicing exactly when the node
is under pressure. Injecting the platform PriorityClass keeps the controller
ranked above the sandboxes it manages. The name tracks
.Values.priorityClasses.platform.name so an operator rename propagates; the
vendored file stays a static .Files.Get (not tpl-ed) and this value-dependent
patch lives in the template layer alongside the #66 RBAC patch below.
*/}}
{{- $controllerManifest := .Files.Get "files/agent-sandbox/controller.yaml" }}
{{- with .Values.priorityClasses.platform.name }}
{{- $controllerManifest = $controllerManifest | replace "      serviceAccountName: agent-sandbox-controller" (printf "      serviceAccountName: agent-sandbox-controller\n      priorityClassName: %s" .) }}
{{- end }}
{{ $controllerManifest }}
---
{{/*
NetworkPolicy RBAC for the vendored controller, split by verb along the
read/mutate line (issue #350, ADR-0023). The upstream v0.5.0 controller runs a
CLUSTER-scope NetworkPolicy informer (upstream `Owns(&networkingv1.NetworkPolicy{})`
with no cache namespace scoping and no `--namespace` flag), so it needs
cluster-wide get/list/watch to sync -- a namespaced Role alone can never satisfy a
cluster-scope LIST, so the informer cache never syncs, the manager aborts, and the
controller crash-loops (no SandboxClaim ever binds -- issue #350). The read-only
ClusterRole below is that minimum, and grants nothing more.

#66's guarantee is preserved in its load-bearing form -- NO cluster-wide mutate:
create/delete/patch/update stay confined to the namespaced Role in
.Release.Namespace (this chart creates every Sandbox there, the worker's
CURIE_NAMESPACE is .Release.Namespace), so a compromised controller SA still
cannot delete the fail-closed egress policy (Rail 1) in any other namespace.
Cross-namespace binding is intentional -- the SA lives in agent-sandbox-system,
the NetworkPolicies it manages live in this namespace.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-sandbox-controller-networkpolicies-read
  labels:
    {{- include "curie.labels" . | nindent 4 }}
rules:
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-sandbox-controller-networkpolicies-read
  labels:
    {{- include "curie.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: agent-sandbox-controller
  namespace: agent-sandbox-system
roleRef:
  kind: ClusterRole
  name: agent-sandbox-controller-networkpolicies-read
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-sandbox-controller-networkpolicies
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "curie.labels" . | nindent 4 }}
rules:
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs:
  - create
  - delete
  - get
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-sandbox-controller-networkpolicies
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "curie.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: agent-sandbox-controller
  namespace: agent-sandbox-system
roleRef:
  kind: Role
  name: agent-sandbox-controller-networkpolicies
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- define "curie.sandboxTemplate" -}}
{{- $agent := .agent -}}
{{- $secrets := .secrets -}}
{{- with .root }}
{{- $runner := .Values.agentSandbox.runner }}
{{- $bf := $runner.bundleFetch }}
{{- $wf := $runner.workspace }}
{{- $hasRunnerOtelEndpoint := false }}
{{- $hasRunnerOtelProtocol := false }}
{{- range $runner.extraEnv }}
{{- if eq .name "OTEL_EXPORTER_OTLP_ENDPOINT" }}
{{- $hasRunnerOtelEndpoint = true }}
{{- end }}
{{- if eq .name "OTEL_EXPORTER_OTLP_PROTOCOL" }}
{{- $hasRunnerOtelProtocol = true }}
{{- end }}
{{- end }}
{{- $templateName := printf "%s-runner" (include "curie.fullname" .) }}
{{- $poolName := printf "%s-runner-pool" (include "curie.fullname" .) }}
{{- if $agent }}
{{- $templateName = printf "%s-agent-%s-runner" (include "curie.fullname" .) $agent }}
{{- $poolName = printf "%s-agent-%s-runner-pool" (include "curie.fullname" .) $agent }}
{{- end }}
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: {{ $templateName }}
  labels:
    {{- include "curie.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-sandbox
spec:
  service: true
  envVarsInjectionPolicy: {{ $runner.envVarsInjectionPolicy }}
  {{- if .Values.security.networkPolicy.enabled }}
  # Issue #765: NetworkPolicy is additive across objects that select the same
  # pods -- there is no way for one policy to narrow what another already
  # allows. Left at the default "Managed", the vendored agent-sandbox
  # controller reconciles its OWN shared NetworkPolicy for this SandboxTemplate
  # (name: {{ include "curie.fullname" . }}-runner-network-policy) with its
  # built-in Secure Default egress rule -- public internet minus RFC1918/
  # link-local -- which UNIONS with (and silently defeats) this chart's own
  # Rail 1 default-deny + operator allowlist below (security-networkpolicy.yaml)
  # instead of being narrowed by it. "Unmanaged" tells the controller to skip
  # creating that policy entirely for this template, so Rail 1 is the only
  # NetworkPolicy selecting these pods. Gated on security.networkPolicy.enabled
  # (not narrower) because the union defeats the default-deny baseline itself,
  # not just a custom allowlist. When the operator has turned Rail 1 off
  # entirely, leave this field unset (defaults to "Managed") so the
  # controller's own baseline policy still applies rather than nothing at all.
  networkPolicyManagement: Unmanaged
  {{- end }}
  podTemplate:
    metadata:
      labels:
        {{- include "curie.selectorLabels" (dict "root" . "component" "runner-sandbox") | nindent 8 }}
        {{- if $agent }}
        curietech.ai/agent: {{ $agent | quote }}
        {{- end }}
    spec:
      {{- if $runner.serviceAccount.create }}
      serviceAccountName: {{ include "curie.fullname" . }}-runner
      automountServiceAccountToken: {{ $runner.serviceAccount.automountToken }}
      {{- end }}
      {{- with .Values.priorityClasses.sandbox.name }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- $gvisorClass := include "curie.gvisor.runtimeClassName" . }}
      {{- if $gvisorClass }}
      # Kernel-isolation RuntimeClass from security.gvisor.mode. In `auto` this is
      # present only when the class was found by lookup at install time; under
      # `helm template`/--dry-run lookup is empty, so it renders the no-gvisor shape.
      # In `auto` with a real (non-fake) model the install is guarded by the blocking
      # gVisor preflight, so a runsc-less real-model install fails closed rather than
      # silently rendering this no-gvisor shape; under `helm template`/--dry-run this
      # still renders without runtimeClassName, but no real install proceeds unprotected.
      runtimeClassName: {{ $gvisorClass }}
      {{- end }}
      {{- if $runner.dnsPolicy }}
      # The agent-sandbox controller injects a public-resolver DNS default
      # (8.8.8.8/1.1.1.1) when the pod template leaves dnsPolicy unset, which
      # cannot resolve in-cluster Service names -- breaking the bundle-fetch
      # init container's reach to the in-chart RustFS and the runner's OTLP
      # export to the in-chart collector. Setting it here wins over that default.
      dnsPolicy: {{ $runner.dnsPolicy }}
      {{- end }}
      {{- with $runner.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $runner.hardening.enabled }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ $runner.hardening.runAsUser }}
        runAsGroup: {{ $runner.hardening.runAsGroup }}
        fsGroup: {{ $runner.hardening.fsGroup }}
        seccompProfile:
          type: RuntimeDefault
      {{- end }}
      {{- if or $bf.enabled $wf.enabled $runner.hardening.enabled $runner.liteLLM.enabled }}
      volumes:
        {{- if $runner.liteLLM.enabled }}
        # LiteLLM proxy config (model_list + router/fallback), mounted read-only
        # into the sidecar. Sourced from the operator-provided Secret so provider
        # keys referenced by the config are never inlined into a manifest.
        - name: litellm-config
          secret:
            secretName: {{ $runner.liteLLM.configExistingSecret | quote }}
            # Map the config key onto the fixed filename the sidecar reads,
            # regardless of how the operator named it in the Secret.
            items:
              - key: {{ $runner.liteLLM.configKey | quote }}
                path: config.yaml
        {{- end }}
        {{- if $bf.enabled }}
        # Shared bundle volume: the init pair populates <mountPath>/current, the
        # runner reads it as CURIE_PLUGIN_DIR. sizeLimit is ADR-0059 decision
        # 2 -- a fast-writer can still briefly overshoot it (kubelet enforces by
        # periodic measurement, not a write-time cap), but it bounds an
        # oversized or zip-bomb-shaped bundle to its own pod's eviction rather
        # than node-wide DiskPressure.
        - name: bundles
          emptyDir:
            sizeLimit: {{ $bf.sizeLimit | quote }}
        # AWS CLI stores only its path addressing setting here. Credentials are
        # environment variables, and the runner never mounts this init only
        # volume or receives the storage credential.
        - name: aws-config
          emptyDir:
            sizeLimit: {{ $bf.awsConfigSizeLimit | quote }}
        {{- end }}
        {{- if $wf.enabled }}
        # One claim-scoped managed checkout. It is separate from writablePaths
        # so the workspace has one explicit size and lifetime boundary.
        - name: workspace
          emptyDir:
            sizeLimit: {{ $wf.sizeLimit | quote }}
        {{- end }}
        {{- if $runner.hardening.enabled }}
        {{- range $i, $p := $runner.hardening.writablePaths }}
        # sizeLimit is ADR-0059 decision 2 (see hardening.writablePathSizeLimit
        # in values.yaml for the periodic-measurement caveat).
        - name: writable-{{ $i }}
          emptyDir:
            sizeLimit: {{ $runner.hardening.writablePathSizeLimit | quote }}
        {{- end }}
        {{- end }}
      {{- end }}
      {{- if or $bf.enabled $wf.enabled }}
      {{/*
      Claim-scoped provisioning. The bundle path retains its S3 object-key
      contract and object-store identity; the workspace path consumes only a
      worker-minted, exact-object signed URL. Baked empty refs keep warm/unbound
      pods as no-ops. A set-but-invalid ref fails the pod instead of booting
      stale or empty content. Egress to RustFS is opened by the runner
      NetworkPolicy carve out.
      */}}
      initContainers:
        {{- if $bf.enabled }}
        - name: bundle-fetch
          image: {{ $bf.fetchImage }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          {{- if $runner.hardening.enabled }}
          # Same container-level lockdown as the runner: this init container
          # runs an authenticated S3 fetch of operator-supplied input in the
          # untrusted pod, so it must not run looser than it. Every write targets
          # a mounted emptyDir: the archive goes to `bundles` and AWS config to
          # the dedicated `aws-config` volume, so a read-only rootfs is safe.
          {{- include "curie.sandboxHardening.securityContext" . | nindent 10 }}
          {{- end }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              REF="${CURIE_BUNDLE_REF:-}"
              if [ -z "$REF" ]; then
                echo "no CURIE_BUNDLE_REF; skipping bundle fetch"
                exit 0
              fi
              {{- if include "curie.rustfs.staticCredentials" . }}
              export AWS_ACCESS_KEY_ID="$S3_ACCESS_KEY"
              export AWS_SECRET_ACCESS_KEY="$S3_SECRET_KEY"
              {{- else }}
              # Key-free path (#1325): no credential env is set, so the AWS CLI
              # falls through its provider chain to the web-identity provider
              # (AWS_ROLE_ARN + AWS_WEB_IDENTITY_TOKEN_FILE) fed by a projected
              # ServiceAccount token. That reads a mounted file rather than the
              # metadata endpoint, so Rail 1's IMDS denial stays intact.
              {{- end }}
              aws configure set default.s3.addressing_style path
              aws --endpoint-url "$S3_ENDPOINT" s3 cp "s3://${BUNDLE_BUCKET}/${REF}" {{ $bf.mountPath }}/.bundle-archive
              echo "fetched bundle '$REF' from ${BUNDLE_BUCKET}"
          env:
            - name: CURIE_BUNDLE_REF
              value: ""
            - name: S3_ENDPOINT
              value: {{ include "curie.rustfs.endpoint" . }}
            {{- if include "curie.rustfs.staticCredentials" . }}
            - name: S3_ACCESS_KEY
              value: {{ .Values.rustfs.auth.accessKey | quote }}
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.rustfs.existingSecret | default (include "curie.secretName" .) }}
                  key: rustfsSecretKey
            {{- end }}
            - name: BUNDLE_BUCKET
              value: {{ $bf.bucket | quote }}
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.rustfs.region | quote }}
            - name: AWS_CONFIG_FILE
              value: /aws-config/config
            - name: AWS_SHARED_CREDENTIALS_FILE
              value: /aws-config/credentials
            - name: HOME
              value: /aws-config
          volumeMounts:
            - name: bundles
              mountPath: {{ $bf.mountPath }}
            - name: aws-config
              mountPath: /aws-config
          resources:
            {{- toYaml $runner.resources | nindent 12 }}
        - name: bundle-extract
          image: {{ $bf.extractImage }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          {{- if $runner.hardening.enabled }}
          # Same container-level lockdown as the runner (see bundle-fetch): all
          # writes target the mounted `bundles` volume, so a read-only rootfs is
          # safe here too.
          {{- include "curie.sandboxHardening.securityContext" . | nindent 10 }}
          {{- end }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              REF="${CURIE_BUNDLE_REF:-}"
              DEST={{ $bf.mountPath }}/current
              mkdir -p "$DEST"
              if [ -z "$REF" ]; then
                echo "no CURIE_BUNDLE_REF; starting with an empty plugin dir"
                exit 0
              fi
              ARCHIVE={{ $bf.mountPath }}/.bundle-archive
              if [ ! -f "$ARCHIVE" ]; then
                echo "FATAL: ref '$REF' set but no fetched archive present" >&2
                exit 1
              fi
              STAGE={{ $bf.mountPath }}/.stage
              rm -rf "$STAGE"
              mkdir -p "$STAGE"
              if tar -xzf "$ARCHIVE" -C "$STAGE" 2>/dev/null; then
                :
              elif tar -xf "$ARCHIVE" -C "$STAGE" 2>/dev/null; then
                :
              elif unzip -o "$ARCHIVE" -d "$STAGE" >/dev/null; then
                :
              else
                echo "FATAL: bundle is not a supported archive" >&2
                exit 1
              fi
              # Unwrap a single top-level wrapper dir so the plugin manifest sits
              # at the plugin-dir root, matching the API's bundle_root validation
              # (a `tar czf b.tgz myplugin/` wraps everything in one folder). The
              # runner reads CURIE_PLUGIN_DIR expecting the manifest at its root.
              ROOT="$STAGE"
              if [ ! -f "$STAGE/plugin.json" ] && [ ! -f "$STAGE/.claude-plugin/plugin.json" ]; then
                subdir=$(find "$STAGE" -mindepth 1 -maxdepth 1 -type d)
                count=$(printf '%s\n' "$subdir" | grep -c .)
                if [ "$count" = "1" ] && { [ -f "$subdir/plugin.json" ] || [ -f "$subdir/.claude-plugin/plugin.json" ]; }; then
                  ROOT="$subdir"
                fi
              fi
              cp -a "$ROOT"/. "$DEST"/
              rm -rf "$STAGE"
              echo "extracted bundle '$REF' into $DEST"
          env:
            - name: CURIE_BUNDLE_REF
              value: ""
          volumeMounts:
            - name: bundles
              mountPath: {{ $bf.mountPath }}
          resources:
            {{- toYaml $runner.resources | nindent 12 }}
        {{- end }}
        {{- if $wf.enabled }}
        - name: workspace-init
          image: {{ include "curie.image" (dict "repository" $runner.image "tag" $runner.tag "digest" $runner.digest "defaultTag" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ $runner.imagePullPolicy }}
          {{- if $runner.hardening.enabled }}
          {{- include "curie.sandboxHardening.securityContext" . | nindent 10 }}
          {{- end }}
          command:
            - python
            - -c
            - |
              import base64, hashlib, json, os, pathlib, shutil, signal, subprocess, sys, time, urllib.request
              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self, request, fp, code, message, headers, new_url):
                      return None
              ref = os.environ.get("CURIE_WORKSPACE_REF", "")
              root = pathlib.Path("{{ $wf.mountPath }}")
              destination = root / ".curie-workspace.tar.gz"
              stage = root / ".curie-stage"
              if not ref:
                  sys.exit(0)
              # An init-container restart must never overlay a partial prior
              # extraction. The signed archive is fetched again after cleanup.
              for child in root.iterdir():
                  if child.is_dir() and not child.is_symlink():
                      shutil.rmtree(child)
                  else:
                      child.unlink()
              try:
                  raw = base64.urlsafe_b64decode(ref + "=" * (-len(ref) % 4))
                  claim = json.loads(raw)
                  url, expected, expires = claim["u"], claim["s"], int(claim["e"])
              except Exception as exc:
                  raise SystemExit(f"workspace-fetch: invalid workspace reference: {exc}")
              if not isinstance(url, str) or not url.startswith(("http://", "https://")):
                  raise SystemExit("workspace-fetch: signed reference is not HTTP(S)")
              if expires <= int(time.time()):
                  raise SystemExit("workspace-fetch: signed reference expired")
              if expected != os.environ.get("CURIE_WORKSPACE_SHA256"):
                  raise SystemExit("workspace-fetch: claim digest mismatch")
              signal.alarm({{ $wf.fetchTimeoutSeconds }})
              digest, size = hashlib.sha256(), 0
              opener = urllib.request.build_opener(NoRedirect())
              with opener.open(url, timeout={{ $wf.fetchTimeoutSeconds }}) as source, destination.open("wb") as target:
                  while chunk := source.read(1024 * 1024):
                      size += len(chunk)
                      if size > {{ .Values.worker.workspace.maxArchiveBytes }}:
                          raise SystemExit("workspace-fetch: archive exceeds compressed-size limit")
                      digest.update(chunk)
                      target.write(chunk)
              if digest.hexdigest() != expected:
                  destination.unlink(missing_ok=True)
                  raise SystemExit("workspace-fetch: archive digest mismatch")
              signal.alarm(0)
              try:
                  subprocess.run(["git", "--version"], check=True, stdout=subprocess.DEVNULL)
              except (FileNotFoundError, subprocess.CalledProcessError):
                  raise SystemExit("workspace-init: git is required")
              try:
                  stage.mkdir(mode=0o700)
                  subprocess.run(
                      [
                          "tar", "--no-same-owner", "--no-same-permissions",
                          "-xzf", str(destination), "-C", str(stage),
                      ],
                      check=True,
                      timeout={{ $wf.extractTimeoutSeconds }},
                  )
              except (FileNotFoundError, subprocess.CalledProcessError, subprocess.TimeoutExpired):
                  raise SystemExit("workspace-init: archive extraction failed")
              try:
                  origin = subprocess.check_output(
                      [
                          "git", "-C", str(stage), "remote", "get-url", "origin",
                      ],
                      text=True,
                      timeout={{ $wf.extractTimeoutSeconds }},
                  ).strip()
              except (subprocess.CalledProcessError, subprocess.TimeoutExpired):
                  raise SystemExit("workspace-init: checkout origin is unreadable")
              if not origin.startswith("https://github.com/") or not origin.endswith(".git") or "@" in origin:
                  raise SystemExit("workspace-init: checkout origin is not credential-free")
              for child in stage.iterdir():
                  os.replace(child, root / child.name)
              stage.rmdir()
              destination.unlink(missing_ok=True)
          env:
            - name: CURIE_WORKSPACE_REF
              value: ""
            - name: CURIE_WORKSPACE_SHA256
              value: ""
          volumeMounts:
            - name: workspace
              mountPath: {{ $wf.mountPath }}
          resources:
            {{- toYaml $runner.resources | nindent 12 }}
        {{- end }}
      {{- end }}
      containers:
        {{- if $runner.liteLLM.enabled }}
        # BYO model (#24): LiteLLM Anthropic-format proxy sidecar. Off by default;
        # enabled only for genuine multi-model routing/fallback. Serves the
        # Anthropic API shape on localhost:<port>, which the runner targets via
        # ANTHROPIC_BASE_URL above. Config (model_list, router/fallback) comes from
        # the operator-provided Secret; provider keys come from liteLLM.extraEnv.
        - name: litellm
          image: {{ $runner.liteLLM.image | quote }}
          imagePullPolicy: {{ $runner.liteLLM.imagePullPolicy }}
          {{- if $runner.hardening.enabled }}
          # Same container-level lockdown as the runner: the proxy only reads its
          # mounted config and talks upstream, so a read-only rootfs is safe.
          {{- include "curie.sandboxHardening.securityContext" . | nindent 10 }}
          {{- end }}
          args:
            - --config
            - /etc/litellm/config.yaml
            - --port
            - {{ $runner.liteLLM.port | quote }}
          ports:
            - name: litellm
              containerPort: {{ $runner.liteLLM.port }}
          {{- with $runner.liteLLM.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: litellm-config
              mountPath: /etc/litellm
              readOnly: true
          resources:
            {{- toYaml $runner.liteLLM.resources | nindent 12 }}
        {{- end }}
        - name: runner
          image: {{ include "curie.image" (dict "repository" $runner.image "tag" $runner.tag "digest" $runner.digest "defaultTag" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ $runner.imagePullPolicy }}
          {{- if $runner.hardening.enabled }}
          {{- include "curie.sandboxHardening.securityContext" . | nindent 10 }}
          {{- end }}
          ports:
            - name: aci
              containerPort: {{ $runner.port }}
          env:
            {{- if $runner.hardening.enabled }}
            - name: HOME
              value: {{ $runner.hardening.home | quote }}
            {{- end }}
            {{- if $agent }}
            {{- $secretName := printf "%s-agent-%s-connector-secrets" (include "curie.fullname" .) $agent }}
            {{- range $name := keys $secrets | sortAlpha }}
            - name: {{ $name }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ $name }}
                  optional: false
            {{- end }}
            {{- end }}
            {{- if and $runner.fakeModel (not .Values.inference.deploy) }}
            - name: CURIE_FAKE_MODEL
              value: "1"
            {{- end }}
            {{- if .Values.inference.deploy }}
            # Local inference is baked into the warm template so claims keep the
            # fast bind path while the runner targets the in-cluster endpoint.
            - name: ANTHROPIC_BASE_URL
              value: http://{{ include "curie.fullname" . }}-inference:{{ .Values.inference.service.port }}
            - name: CURIE_MODEL
              value: {{ .Values.inference.model | quote }}
            {{- else if $runner.model }}
            # Default model for real runs, baked into the pod template (not
            # per-claim). Per-claim injection would force a cold create
            # (envVarsInjectionPolicy Overrides), so baking it keeps warm-pool
            # binds fast. Pairs with langfuse.modelPricing so the Cost view is
            # non-zero.
            - name: CURIE_MODEL
              value: {{ $runner.model | quote }}
            {{- end }}
            {{- if and $runner.liteLLM.enabled (not .Values.inference.deploy) }}
            # BYO model (#24): route through the in-pod LiteLLM sidecar, which
            # serves the Anthropic API shape on localhost. Multi-model routing /
            # fallback lives in the sidecar's config; the runner just points at it.
            - name: ANTHROPIC_BASE_URL
              value: http://localhost:{{ $runner.liteLLM.port }}
            {{- end }}
            {{- if $runner.credentials }}
            # Warm-pod fallback credential; the worker's per-claim Overrides
            # injection carries the (per-agent) credential on a bound run.
            - name: CURIE_CREDENTIALS
              valueFrom:
                secretKeyRef:
                  name: {{ include "curie.secretName" . }}
                  key: agentCredentials
            {{- end }}
            - name: CURIE_PLUGIN_DIR
              value: {{ $runner.pluginDir | quote }}
            # Generic identity for a pre-warmed, not-yet-claimed sandbox; the
            # substrate's resume path overrides it per-claim.
            - name: CURIE_SESSION_ID
              value: warm-unbound
            # Stable per-sandbox identity: the sandbox controller names the pod
            # after the Sandbox resource, so the pod name IS the sandbox id.
            - name: CURIE_SANDBOX_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CURIE_BUDGET
              value: {{ printf "{\"max_output_tokens_per_run\":%d,\"max_usd_per_day\":%v}" (int $runner.budget.maxOutputTokensPerRun) $runner.budget.maxUsdPerDay | quote }}
            - name: CURIE_RUNNER_PORT
              value: {{ $runner.port | quote }}
            {{- if $wf.enabled }}
            # Kubernetes owns the emptyDir mount root; make the intended checkout
            # explicit without mutating repository config or carrying a secret.
            - name: GIT_CONFIG_COUNT
              value: "1"
            - name: GIT_CONFIG_KEY_0
              value: safe.directory
            - name: GIT_CONFIG_VALUE_0
              value: {{ $wf.mountPath | quote }}
            {{- end }}
            {{- if and .Values.otelCollector.deploy (not $hasRunnerOtelEndpoint) }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://{{ include "curie.fullname" . }}-otel-collector:{{ .Values.otelCollector.service.httpPort }}
            {{- end }}
            {{- if and .Values.otelCollector.deploy (not $hasRunnerOtelProtocol) }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            {{- end }}
            {{- with $runner.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ $runner.port }}
            {{- toYaml $runner.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml $runner.resources | nindent 12 }}
          {{- if or $bf.enabled $wf.enabled $runner.hardening.enabled }}
          volumeMounts:
            {{- if $bf.enabled }}
            - name: bundles
              mountPath: {{ $bf.mountPath }}
            {{- end }}
            {{- if $wf.enabled }}
            - name: workspace
              mountPath: {{ $wf.mountPath }}
            {{- end }}
            {{- if $runner.hardening.enabled }}
            {{- range $i, $p := $runner.hardening.writablePaths }}
            - name: writable-{{ $i }}
              mountPath: {{ $p }}
            {{- end }}
            {{- end }}
          {{- end }}
{{/*
The SandboxWarmPool is always rendered whenever the sandbox substrate is
deployed, including at replicas 0. The worker's SandboxClaims reference this
pool by name (spec.warmPoolRef.name); with the object absent every claim fails
Ready=False reason=WarmPoolNotFound and the run times out. replicas 0 means no
pre-warmed pods (claims cold-create sandboxes from the template) -- it must not
mean no pool object. Raise replicas only for a fake-model/dev pool where an
unbound warm pod boots cleanly (a real-model warm pod has no bundle and
crash-loops, and a real claim cold-creates anyway because per-claim env
injection cannot bind a pre-warmed pod, the envVarsInjectionPolicy Overrides
gotcha).
*/}}
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: {{ $poolName }}
  labels:
    {{- include "curie.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-sandbox
spec:
  replicas: {{ .Values.agentSandbox.warmPool.replicas }}
  updateStrategy:
    type: {{ .Values.agentSandbox.warmPool.updateStrategy }}
  sandboxTemplateRef:
    name: {{ $templateName }}
{{- end }}
{{- end }}
{{- if .Values.agentSandbox.deploy }}
{{- $root := . }}
{{- $connectorSecrets := .Values.agentSandbox.connectorSecrets | default dict }}
{{- range $agent := keys $connectorSecrets | sortAlpha }}
{{- if or (gt (len $agent) 40) (not (regexMatch "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$" $agent)) }}
{{- fail (printf "agentSandbox.connectorSecrets.%s has an invalid agent name" $agent) }}
{{- end }}
{{- end }}
{{ include "curie.sandboxTemplate" (dict "root" $root) | nindent 0 }}
{{- range $agent := keys $connectorSecrets | sortAlpha }}
{{ include "curie.sandboxTemplate" (dict "root" $root "agent" $agent "secrets" (index $connectorSecrets $agent)) | nindent 0 }}
{{- end }}
{{- end }}
