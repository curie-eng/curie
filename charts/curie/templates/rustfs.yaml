{{- if .Values.rustfs.deploy }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "curie.fullname" . }}-rustfs
  labels:
    {{- include "curie.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "curie.selectorLabels" (dict "root" . "component" "rustfs") | nindent 4 }}
  ports:
    - name: s3
      port: {{ .Values.rustfs.port }}
      targetPort: 9000
    - name: console
      port: {{ .Values.rustfs.consolePort }}
      targetPort: 9001
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "curie.fullname" . }}-rustfs
  labels:
    {{- include "curie.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "curie.fullname" . }}-rustfs
  replicas: 1
  selector:
    matchLabels:
      {{- include "curie.selectorLabels" (dict "root" . "component" "rustfs") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- with (include "curie.placement.labels" (dict "root" $ "class" "data")) }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- include "curie.statefulPodLabels" . | nindent 8 }}
        {{- include "curie.selectorLabels" (dict "root" . "component" "rustfs") | nindent 8 }}
      {{- with (include "curie.placement.annotations" (dict "root" $ "class" "data")) }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
    spec:
      {{- with (include "curie.placement.spec" (dict "root" $ "class" "data")) }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- with .Values.priorityClasses.platform.name }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        fsGroup: {{ .Values.rustfs.podSecurityContext.fsGroup }}
        fsGroupChangePolicy: OnRootMismatch
      {{- if not .Values.rustfs.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
      containers:
        - name: rustfs
          image: {{ .Values.rustfs.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- toYaml .Values.rustfs.containerSecurityContext | nindent 12 }}
          env:
            - name: RUSTFS_VOLUMES
              value: /data
            - name: RUSTFS_ADDRESS
              value: 0.0.0.0:9000
            - name: RUSTFS_CONSOLE_ADDRESS
              value: 0.0.0.0:9001
            - name: RUSTFS_CONSOLE_ENABLE
              value: "true"
            - name: RUSTFS_ACCESS_KEY
              value: {{ .Values.rustfs.auth.accessKey | quote }}
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.rustfs.existingSecret | default (include "curie.secretName" .) }}
                  key: rustfsSecretKey
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          readinessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.rustfs.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
  {{- if .Values.rustfs.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.global.storageClass }}
        storageClassName: {{ .Values.global.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.rustfs.persistence.size }}
  {{- end }}
---
{{/* Creates every first-party bucket after RustFS accepts S3 requests. */}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "curie.fullname" . }}-rustfs-init
  labels:
    {{- include "curie.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- with (include "curie.placement.labels" (dict "root" $ "class" "hooks")) }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- include "curie.selectorLabels" (dict "root" . "component" "rustfs-init") | nindent 8 }}
      {{- with (include "curie.placement.annotations" (dict "root" $ "class" "hooks")) }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
    spec:
      {{- with (include "curie.placement.spec" (dict "root" $ "class" "hooks")) }}
      {{- . | nindent 6 }}
      {{- end }}
      restartPolicy: OnFailure
      containers:
        - name: aws-cli
          image: {{ .Values.rustfs.awsCliImage }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              mkdir -p /tmp/aws
              aws configure set default.s3.addressing_style path
              endpoint="http://{{ include "curie.rustfs.host" . }}:{{ .Values.rustfs.port }}"
              echo "waiting for RustFS at $endpoint"
              for bucket in \
                {{ .Values.rustfs.bucket | quote }} \
                {{ .Values.agentSandbox.runner.bundleFetch.bucket | quote }} \
                {{ .Values.worker.workspace.bucket | quote }}; do
                for i in $(seq 1 60); do
                  if aws --endpoint-url "$endpoint" s3api head-bucket --bucket "$bucket" >/dev/null 2>&1; then
                    break
                  fi
                  if aws --endpoint-url "$endpoint" s3api create-bucket --bucket "$bucket" >/dev/null 2>&1; then
                    break
                  fi
                  sleep 3
                done
                aws --endpoint-url "$endpoint" s3api head-bucket --bucket "$bucket"
                echo "bucket $bucket ready"
              done
              {{- $retentionDays := int .Values.langfuse.eventUpload.retentionDays }}
              {{- if gt $retentionDays 0 }}
              {{- /* Langfuse never deletes its event-upload objects (#2870). */}}
              aws --endpoint-url "$endpoint" s3api put-bucket-lifecycle-configuration \
                --bucket {{ .Values.rustfs.bucket | quote }} \
                --lifecycle-configuration '{"Rules":[{"ID":"langfuse-event-upload-retention","Status":"Enabled","Filter":{"Prefix":"events/"},"Expiration":{"Days":{{ $retentionDays }}}}]}'
              echo "events/ in bucket {{ .Values.rustfs.bucket }} expires after {{ $retentionDays }} days"
              {{- end }}
          env:
            - name: AWS_ACCESS_KEY_ID
              value: {{ .Values.rustfs.auth.accessKey | quote }}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.rustfs.existingSecret | default (include "curie.secretName" .) }}
                  key: rustfsSecretKey
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: AWS_CONFIG_FILE
              value: /tmp/aws/config
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
{{- end }}
