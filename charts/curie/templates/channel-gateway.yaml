{{- $gateway := include "curie.channelGateway.values" . | fromYaml }}
{{- $slack := .Values.dispatcher.slack }}
{{- $hasBot := or $slack.botToken $slack.botTokenExistingSecret }}
{{- $identities := include "curie.slack.identities" . | fromJson }}
{{- range $identity := $identities.items }}
{{- if $identity.botSecret }}{{- $hasBot = true }}{{- end }}
{{- end }}
{{- $deploy := eq (include "curie.channelGateway.deploy" .) "true" }}
{{- $tlsSecret := include "curie.channelGateway.tlsSecret" . }}
{{- if and $hasBot (not (or $deploy $gateway.url)) }}
{{- fail "Slack identities require a gateway: set channelGateway.deploy=true or channelGateway.url to an existing gateway" }}
{{- end }}
{{- if and $tlsSecret $gateway.url (not (hasPrefix "https://" $gateway.url)) }}
{{- fail "channelGateway.url must use https when channelGateway.tlsSecret is set" }}
{{- end }}
{{- if $deploy }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "curie.fullname" . }}-channel-gateway
  labels:
    {{- include "curie.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      {{- include "curie.selectorLabels" (dict "root" . "component" "channel-gateway") | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with (include "curie.channelGateway.tlsChecksum" .) }}
        checksum/gateway-tls: {{ . | quote }}
        {{- end }}
        {{- with (include "curie.placement.annotations" (dict "root" $ "class" "platform")) }}
        {{- . | nindent 8 }}
        {{- end }}
        checksum/secret: {{ include "curie.secretChecksum" (dict "root" . "keys" (list "channelGatewayApiToken" "channelGatewayWorkerToken") "refs" (list) "env" (printf "%s\n%s" (include "curie.env.slack" (dict "root" . "workload" "gateway")) (include "curie.env.otel" (dict "root" . "extraEnv" (list))))) | quote }}
      labels:
        {{- with (include "curie.placement.labels" (dict "root" $ "class" "platform")) }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- include "curie.selectorLabels" (dict "root" . "component" "channel-gateway") | nindent 8 }}
    spec:
      {{- with (include "curie.placement.spec" (dict "root" $ "class" "platform")) }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- with .Values.priorityClasses.platform.name }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.dispatcher.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: channel-gateway
          image: {{ include "curie.image" (dict "repository" .Values.dispatcher.image.repository "tag" .Values.dispatcher.image.tag "digest" .Values.dispatcher.image.digest "defaultTag" .Chart.AppVersion) }}
          command: ["python", "-m", "curie_channel_gateway.slack.read_server"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          ports:
            - name: gateway
              containerPort: {{ $gateway.port }}
          env:
            {{- include "curie.env.slack" (dict "root" . "workload" "gateway") | nindent 12 }}
            {{- include "curie.env.otel" (dict "root" . "extraEnv" (list)) | nindent 12 }}
            - name: CURIE_CHANNEL_GATEWAY_PORT
              value: {{ $gateway.port | quote }}
            - name: CURIE_CHANNEL_GATEWAY_ALLOW_INSECURE
              value: {{ eq $tlsSecret "" | quote }}
            - name: SLACK_API_BASE_URL
              value: {{ .Values.worker.slackApiBaseUrl | quote }}
            - name: CURIE_SLACK_TRUSTED_ORIGINS
              value: {{ .Values.worker.slackTrustedOrigins | quote }}
            - name: CURIE_CHANNEL_GATEWAY_MAX_FILE_BYTES
              value: {{ .Values.worker.attachments.maxFileBytes | int64 | quote }}
            - name: SLACK_USERGROUP_CACHE_TTL_S
              value: {{ $gateway.groupCacheTtlSeconds | quote }}
            {{- range $caller := list "api" "worker" }}
            - name: CURIE_CHANNEL_GATEWAY_{{ upper $caller }}_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "curie.secretName" $ }}
                  key: {{ printf "channelGateway%sToken" (title $caller) }}
            {{- end }}
            {{- if $tlsSecret }}
            - name: CURIE_CHANNEL_GATEWAY_TLS_CERT
              value: /var/run/gateway-tls/tls.crt
            - name: CURIE_CHANNEL_GATEWAY_TLS_KEY
              value: /var/run/gateway-tls/tls.key
            {{- end }}
          readinessProbe:
            tcpSocket: {port: gateway}
            {{- toYaml $gateway.readinessProbe | nindent 12 }}
          livenessProbe:
            tcpSocket: {port: gateway}
            {{- toYaml $gateway.livenessProbe | nindent 12 }}
          resources:
            {{- toYaml $gateway.resources | nindent 12 }}
          volumeMounts:
            - name: replay
              mountPath: /var/lib/curie-gateway
            {{- if $tlsSecret }}
            - name: tls
              mountPath: /var/run/gateway-tls
              readOnly: true
            {{- end }}
      volumes:
        - name: replay
          persistentVolumeClaim:
            claimName: {{ include "curie.fullname" . }}-channel-gateway-replay
        {{- if $tlsSecret }}
        - name: tls
          secret:
            secretName: {{ $tlsSecret }}
            defaultMode: 0400
        {{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "curie.fullname" . }}-channel-gateway-replay
spec:
  accessModes: [ReadWriteOnce]
  {{- with ($gateway.replayStorageClass | default .Values.global.storageClass) }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $gateway.replayStorageSize }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "curie.fullname" . }}-channel-gateway
spec:
  selector:
    {{- include "curie.selectorLabels" (dict "root" . "component" "channel-gateway") | nindent 4 }}
  ports:
    - port: {{ $gateway.port }}
      targetPort: gateway
{{- end }}
