{{/*
Chart-managed credential Secret.

Every backing store (postgres, valkey, clickhouse, rustfs, langfuse) and every
first-party app (api, dispatcher, worker) references
`include "curie.secretName" .` for its password/token unless it points at its
own `existingSecret`. The OTel Collector follows `langfuse.existingSecret` for
its auth header (issue #1563). So this object always renders, synthesized from
the values defaults -- override those (or supply an `existingSecret` per
store) in any shared deployment.

The twelve direct-passthrough keys below (agentCredentials,
adapterCredentials, githubToken, githubAppPrivateKey, sealingPrivateKey,
sealingPreviousPrivateKey, slackAppToken, slackBotToken, slackSigningSecret,
mailChannelToken, mailEgressSecret, mailAgentmailApiKey) each carry a
per-component `existingSecret`/`existingSecretKey` pair (issue #1759;
githubAppPrivateKey's shipped first, under ADR-0092). The consuming template's
`secretKeyRef` follows that pair when set and otherwise falls back to this
Secret's own key, so a BYO Secret missing the referenced key fails that pod
loudly with CreateContainerConfigError rather than the chart silently emitting
an empty credential -- the same fail-loud property `otlpAuthHeader` below gets
from never rendering a value the operator's own Secret would not be read for.

The thirteen chart owned credentials (the four backing store passwords, the three
Langfuse app secrets, both init credentials, the API key, approval chat
attester secret, internal worker token, and webhook key) are
resolved through `curie.managedSecret` (issue #195). A sealed fresh install
generates a strong random per release; `security.allowDevDefaults=true`
(values-dev.yaml) instead keeps deterministic published values. The eleven
non-init credentials re-use persisted values on upgrade, and an explicit
override supports their rotation and recovery. The Langfuse init credentials
are first boot inputs: changing them during an upgrade does not rotate records
already initialized in Langfuse. The remaining keys below carry the published
dev defaults documented in values.yaml; they are not production material.
`stringData` lets Kubernetes base64 encode them.

Render-time gate: refuse to emit the published Langfuse bootstrap defaults when
security.checkDefaultCredentials is on (issue #198). This Secret always renders,
so the guard runs on every install/upgrade/template.
*/}}
{{- include "curie.secretContent.init" $ -}}
{{- $content := get $ "_curieSecretContent" -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "curie.secretName" . }}
  labels:
    {{- include "curie.labels" . | nindent 4 }}
type: Opaque
stringData:
  installationId: {{ index $content "installationId" | quote }}
  # Backing-store credentials (fallback when a store sets no existingSecret).
  postgresPassword: {{ index $content "postgresPassword" | quote }}
  valkeyPassword: {{ index $content "valkeyPassword" | quote }}
  clickhousePassword: {{ index $content "clickhousePassword" | quote }}
  rustfsSecretKey: {{ index $content "rustfsSecretKey" | quote }}
  # Langfuse app secrets.
  langfuseSalt: {{ index $content "langfuseSalt" | quote }}
  langfuseEncryptionKey: {{ index $content "langfuseEncryptionKey" | quote }}
  langfuseNextauthSecret: {{ index $content "langfuseNextauthSecret" | quote }}
  # Init project secret key, read by the model-pricing seed Job as basic-auth
  # password against the Langfuse public API.
  langfuseInitProjectSecretKey: {{ index $content "langfuseInitProjectSecretKey" | quote }}
  # Langfuse admin (init user) password, referenced by the Langfuse web
  # deployment via secretKeyRef instead of a plaintext env value.
  langfuseInitUserPassword: {{ index $content "langfuseInitUserPassword" | quote }}
  {{- /* Emitted only when this Secret is the one the collector reads. Asking
       curie.otlpAuthHeaderSecretName rather than re-deriving the answer from
       .Values keeps the secretKeyRef and this emission the same decision, and
       their disagreement is the desync issue #1563 closes. When the operator's
       own Secret carries the key, writing a value here that the collector never
       reads is that desync; the key is absent rather than empty on that path, so
       a BYO Secret missing it fails the pod loudly with
       CreateContainerConfigError instead of letting the collector start with an
       empty header and 401 in silence. */}}
  {{- if eq (include "curie.otlpAuthHeaderSecretName" .) (include "curie.secretName" .) }}
  # Full `Authorization` header value the OTel Collector sends to Langfuse.
  # Composed from the RESOLVED init project secret key above, so a sealed install
  # ships the generated credential Langfuse was actually seeded with, unless
  # otelCollector.otlpAuthHeader overrides it. With a foreign
  # langfuse.existingSecret this key is not emitted here at all; that Secret must
  # carry its own otlpAuthHeader, or set otelCollector.otlpAuthHeader.
  otlpAuthHeader: {{ index $content "otlpAuthHeader" | quote }}
  {{- end }}
  # Opaque model credential the worker forwards into runner claims (empty unless
  # a real-model deploy sets agentSandbox.runner.credentials). Unused by either
  # consumer when agentSandbox.runner.credentialsExistingSecret is set instead
  # (issue #1759) -- harmless to still render here.
  agentCredentials: {{ index $content "agentCredentials" | quote }}
  # Per-ADAPTER egress credentials (ADR-0096 D4.2): a JSON object mapping an
  # adapter slug to the secret the worker presents as X-Curie-Adapter-Secret
  # when it delivers reply events to that adapter's endpoint. Empty means no
  # non-Slack channel can be delivered to -- egress fails CLOSED rather than
  # sending an unauthenticated request any reachable pod could forge. Unused
  # when worker.adapterCredentialsExistingSecret is set instead (issue #1759).
  adapterCredentials: {{ index $content "adapterCredentials" | quote }}
  # First-party app credentials.
  apiKey: {{ index $content "apiKey" | quote }}
  # Dedicated Slack click attestation trust domain. This is deliberately not
  # apiKey: only the dispatcher producer and API verifier receive it.
  approvalChatAttesterSecret: {{ index $content "approvalChatAttesterSecret" | quote }}
  # Remediation authority (ADR 0231): binding and arming a remediation policy
  # need it. Deliberately not apiKey, and mounted into the API alone: a
  # platform-key holder (every worker) must not be able to present it.
  remediationAuthorityKey: {{ index $content "remediationAuthorityKey" | quote }}
  # Distinct from apiKey: possessing the operator/CLI key must never redeem the
  # repository credential. Generated and retained independently on sealed installs.
  internalWorkerToken: {{ index $content "internalWorkerToken" | quote }}
  githubWebhookSecret: {{ index $content "githubWebhookSecret" | quote }}
  {{/* NOT curie.managedSecret: that helper generates a random when the value
       matches its default, which is right for a credential the install must
       have. This one is optional -- empty means "no GitHub credential", and
       git-flow then works on public repos only. Generating a random here would
       send 32 characters of noise to GitHub as a bearer token and fail auth in
       a way that looks like a permissions problem rather than a missing one. */}}
  # Unused when api.githubTokenExistingSecret is set instead (issue #1759).
  githubToken: {{ index $content "githubToken" | quote }}
  {{/* GitHub App identity (ADR-0092). Same reasoning as githubToken above --
       optional, so never generated. The private key can mint a token for every
       repository in the installation, which makes it the most sensitive value
       in this Secret; it is only ever read into the API's env, never logged and
       never placed in argv. */}}
  githubAppPrivateKey: {{ index $content "githubAppPrivateKey" | quote }}
  {{/* The cluster sealing keypair (ADR-0094). Optional and NEVER generated
       here: the CLI mints it and preserves it across upgrades, because the
       chart has no lookup-persist (#195) and a chart-side random would mint a
       NEW key on every `helm upgrade`. That would not merely rotate a
       credential -- it would make every sealed value in every agent repository
       permanently unreadable, since nothing outside this cluster can
       reconstruct the key. `curie cluster up` re-supplies whatever the release
       already recorded; see ops::resolve_sealing_values. */}}
  # Unused when sealing.privateKeyExistingSecret is set instead (issue #1759).
  sealingPrivateKey: {{ index $content "sealingPrivateKey" | quote }}
  {{/* Present only during a rotation, so a value sealed to the old key still
       opens while repositories are resealed to the new one. Unused when
       sealing.previousPrivateKeyExistingSecret is set instead (issue #1759). */}}
  sealingPreviousPrivateKey: {{ index $content "sealingPreviousPrivateKey" | quote }}
  # The three Slack credentials below are each unused when their own
  # dispatcher.slack.*ExistingSecret is set instead (issue #1759).
  {{/* The connector caller key pair (ADR-0168 decision 7). Never generated
       here: `curie cluster up` mints the pair and re-supplies it on every
       upgrade, as it does the sealing key. Unused when
       connectorCaller.existingSecret is set instead. A dev install with no
       pair gets the published dev pair; see curie.connectorCallerSigningKey. */}}
  connectorCallerSigningKey: {{ index $content "connectorCallerSigningKey" | quote }}
  connectorCallerVerifyKey: {{ index $content "connectorCallerVerifyKey" | quote }}
  slackAppToken: {{ index $content "slackAppToken" | quote }}
  slackBotToken: {{ index $content "slackBotToken" | quote }}
  slackSigningSecret: {{ index $content "slackSigningSecret" | quote }}
  {{/* Mail adapter credentials (#1515). NOT curie.managedSecret, for the same
       reason githubToken above is not: that helper generates a strong random
       when the value matches its default, which is right for a credential the
       install must have and wrong for all three of these. A generated AgentMail
       key sends 32 characters of noise to a third party as a bearer token; a
       generated channel token authenticates to nothing the API minted; and a
       generated mailEgressSecret would silently diverge from the worker half in
       adapterCredentials, breaking egress with a 401 that reads like a code
       bug. All three are empty by default and the adapter refuses to boot
       without them. Each key is omitted when its per-field existingSecret is
       set (issue #1759), so a Helm upgrade cannot overwrite the externally
       managed source. */}}
  {{- if not .Values.mailAdapter.agentmail.apiKeyExistingSecret }}
  mailAgentmailApiKey: {{ index $content "mailAgentmailApiKey" | quote }}
  {{- end }}
  {{- if not .Values.mailAdapter.channelTokenExistingSecret }}
  mailChannelToken: {{ index $content "mailChannelToken" | quote }}
  {{- end }}
  {{- if not .Values.mailAdapter.egressSecretExistingSecret }}
  mailEgressSecret: {{ index $content "mailEgressSecret" | quote }}
  {{- end }}
