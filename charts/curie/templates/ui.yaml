{{- if .Values.ui.deploy }}
{{- if not .Values.api.deploy }}
  {{- if not .Values.ui.apiBaseUrl }}
  {{- fail "api.deploy is false: set ui.apiBaseUrl to the bring-your-own API URL" }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "curie.fullname" . }}-ui
  labels:
    {{- include "curie.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  type: {{ .Values.ui.service.type }}
  selector:
    {{- include "curie.selectorLabels" (dict "root" . "component" "ui") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.ui.service.port }}
      # The nginx-unprivileged base listens on 8080 (it cannot bind :80 as
      # non-root); the SPA Dockerfile serves there.
      targetPort: 8080
      {{- if and (eq .Values.ui.service.type "NodePort") .Values.ui.service.nodePort }}
      nodePort: {{ .Values.ui.service.nodePort }}
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "curie.fullname" . }}-ui
  labels:
    {{- include "curie.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  replicas: {{ .Values.ui.replicas }}
  selector:
    matchLabels:
      {{- include "curie.selectorLabels" (dict "root" . "component" "ui") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- with (include "curie.placement.labels" (dict "root" $ "class" "platform")) }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- include "curie.labels" . | nindent 8 }}
        {{- include "curie.selectorLabels" (dict "root" . "component" "ui") | nindent 8 }}
      {{- with (include "curie.placement.annotations" (dict "root" $ "class" "platform")) }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
    spec:
      {{- with (include "curie.placement.spec" (dict "root" $ "class" "platform")) }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- with .Values.ui.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ui
          image: {{ include "curie.image" (dict "repository" .Values.ui.image.repository "tag" .Values.ui.image.tag "digest" .Values.ui.image.digest "defaultTag" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          {{- with .Values.ui.containerSecurityContext }}
          {{- include "curie.containerSecurityContext" . | nindent 10 }}
          {{- end }}
          env:
            # nginx reverse-proxies /api/ to this upstream (the /api prefix is
            # stripped). Empty ui.apiBaseUrl (the default) derives the in-chart
            # API Service; a set value renders verbatim and is the BYO answer,
            # and the only correct one when api.deploy is false. Include
            # curie.api.url, never a copy of its expression.
            - name: CURIE_API_TARGET
              value: {{ include "curie.api.url" (dict "root" . "baseUrl" .Values.ui.apiBaseUrl) | quote }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
{{- end }}
