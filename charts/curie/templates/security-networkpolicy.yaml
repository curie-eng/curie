{{- /*
Pack an IPv4 dotted-quad into a 32-bit integer, e.g. "169.254.169.254" ->
2852039166. Used by curie.metadataExcept to test CIDR containment.
*/ -}}
{{- define "curie.ipv4ToInt" -}}
{{- $o := splitList "." (trim .) -}}
{{- add (mul (int64 (index $o 0)) 16777216) (mul (int64 (index $o 1)) 65536) (mul (int64 (index $o 2)) 256) (int64 (index $o 3)) -}}
{{- end -}}
{{- /*
Given an allowedEgress CIDR string, return the metadata/link-local `except`
entry that must be carved back out of it, or "" when the CIDR cannot reach the
cloud metadata endpoint. NetworkPolicy allows are additive, so a broad allow
(the realistic 0.0.0.0/0 model-API case, or a 0.0.0.0/1 + 128.0.0.0/1 split, or
::/0) re-permits the metadata IP that rail 1 denies -- unless we except it.

Kubernetes requires each `except` to be the same address family as `cidr` and a
strict subset of it, so we (a) pick the family from the CIDR, (b) only emit when
the CIDR actually contains the metadata address, and (c) size the IPv4 except to
stay a STRICT subset (169.254.0.0/16 for prefix <16, the /32 host for 16..<32,
and nothing for an exact /32 host allow, which is a deliberate operator choice).

IPv4 containment is computed exactly (top `prefix` bits of 169.254.169.254 vs the
network). IPv6 covers the realistic broad cases -- ::/0 and the AWS IMDS ULA
prefix fd00:ec2::/nn -- and carves out fd00:ec2::254; full IPv6 range math is not
attempted (documented assumption). Operators can always override with an explicit
per-entry `except:` list, which wins over this auto carve-out.
*/ -}}
{{- define "curie.metadataExcept" -}}
{{- $parts := splitList "/" . -}}
{{- $ip := index $parts 0 -}}
{{- $prefix := index $parts 1 | int -}}
{{- if contains ":" $ip -}}
  {{- if or (eq $prefix 0) (and (hasPrefix "fd00:ec2:" $ip) (le $prefix 32)) -}}fd00:ec2::254/128{{- end -}}
{{- else -}}
  {{- $meta := include "curie.ipv4ToInt" "169.254.169.254" | int64 -}}
  {{- $net := include "curie.ipv4ToInt" $ip | int64 -}}
  {{- $block := int64 1 -}}
  {{- range until (sub 32 $prefix | int) -}}{{- $block = mul $block 2 -}}{{- end -}}
  {{- if eq (div $meta $block) (div $net $block) -}}
    {{- /* Size the except to stay a STRICT subset of cidr (apiserver requires
           exceptMaskLen > cidrMaskLen). prefix<16 -> the /16 link-local block;
           16<=prefix<32 -> the /32 host; prefix==32 is the operator explicitly
           allowing exactly the metadata host, so emit nothing (any except would
           equal cidr and be rejected -- respect the deliberate allow). */ -}}
    {{- if lt $prefix 16 -}}169.254.0.0/16{{- else if lt $prefix 32 -}}169.254.169.254/32{{- end -}}
  {{- end -}}
{{- end -}}
{{- end -}}
{{/*
Validate one BYO endpoint egress entry (rustfs.egress, rustfs.stsEgress,
otelCollector.egress, api.egress). Each of those lists names ONE external peer
the runner must reach, not the model allowlist: a default route or a CIDR that
reaches the cloud metadata address would additively re-open the prompt-injectable
runner. Require cidr + ports, refuse prefix 0/1, and refuse any CIDR that
contains 169.254.169.254 or fd00:ec2::254.
*/}}
{{- define "curie.objectStore.egressEntry" -}}
{{- $key := .key -}}
{{- $cidr := trim (printf "%v" (.entry.cidr | default "")) -}}
{{- if eq $cidr "" -}}
{{- fail (printf "%s entries must set cidr" $key) -}}
{{- end -}}
{{- if not .entry.ports -}}
{{- fail (printf "%s entries must set ports" $key) -}}
{{- end -}}
{{- $parts := splitList "/" $cidr -}}
{{- if ne (len $parts) 2 -}}
{{- fail (printf "%s entry %q is not a CIDR" $key $cidr) -}}
{{- end -}}
{{- $ip := index $parts 0 -}}
{{- $prefixText := index $parts 1 -}}
{{- if not (regexMatch "^(0|[1-9][0-9]{0,2})$" $prefixText) -}}
{{- fail (printf "%s entry %q has an invalid prefix length" $key $cidr) -}}
{{- end -}}
{{- $prefix := int $prefixText -}}
{{- if le $prefix 1 -}}
{{- fail (printf "%s entry %q is a default or equivalently broad route; use a VPC interface endpoint /32 or the narrowest prefix that reaches this one endpoint, not a default route" $key $cidr) -}}
{{- end -}}
{{- $auto := include "curie.metadataExcept" $cidr | trim -}}
{{- if or $auto (eq $ip "169.254.169.254") (hasPrefix "fd00:ec2:" $ip) -}}
{{- fail (printf "%s entry %q must not cover the cloud metadata endpoint 169.254.169.254" $key $cidr) -}}
{{- end -}}
{{- end -}}
{{- if and .Values.agentSandbox.deploy .Values.security.networkPolicy.enabled }}
{{- $np := .Values.security.networkPolicy }}
{{/*
Rail 1: default-deny egress on runner sandboxes, with explicit allows.

These policies select THIS release's runner sandbox pods by their full release
labels (name + instance + component: runner-sandbox), so two Curie releases
sharing a namespace do not cross-affect each other's egress (NetworkPolicy allows
are additive, so a shared component-only selector would leak one release's
allowlist onto another's). A pod matched by ANY egress policy is default-deny for
egress except what some policy explicitly allows -- so the base "deny" plus the
narrow "allow" policies below compose into: DNS + the in-chart collector (when
deployed) + the declared model/MCP egress are permitted, and EVERYTHING else
(arbitrary internet AND the cloud metadata endpoint 169.254.169.254) is denied.
Fail-closed: an empty allowedEgress means the runner can resolve names and ship
traces but reach nothing else outbound until the operator declares where the
model API and MCP servers live.

A customer CNI that does not enforce NetworkPolicy turns all of this into a
silent false-pass; the security probe's before/after egress check exists to
catch exactly that.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "curie.fullname" . }}-runner-default-deny-egress
  labels:
    {{- include "curie.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-sandbox
spec:
  podSelector:
    matchLabels:
      {{- include "curie.selectorLabels" (dict "root" . "component" "runner-sandbox") | nindent 6 }}
  policyTypes: [Egress]
  # No egress rules == deny all egress for the selected pods.
{{- if $np.allowDNS }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "curie.fullname" . }}-runner-allow-dns
  labels:
    {{- include "curie.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-sandbox
spec:
  podSelector:
    matchLabels:
      {{- include "curie.selectorLabels" (dict "root" . "component" "runner-sandbox") | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.dnsNamespace }}
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
{{- end }}
{{- if .Values.otelCollector.deploy }}
{{- if .Values.otelCollector.egress }}
{{- fail "otelCollector.egress is set while otelCollector.deploy is true, where the chart never reads it: it is only read on the BYO branch (otelCollector.deploy false). With the collector in-chart, runner egress to it is governed by the rendered runner-allow-collector policy's in-chart pod selector, so either clear otelCollector.egress or set otelCollector.deploy: false. If a CIDR for this endpoint already sits in security.networkPolicy.allowedEgress, move it to (or duplicate it into) otelCollector.egress when you flip deploy off: allowedEgress is the model/MCP allowlist, and rail 1 renders no runner peer for this endpoint without the dedicated key." }}
{{- end }}
---
{{/* Allow the runner to ship OTLP traces to THIS release's in-chart collector.
     Without this, the default-deny blocks span export and sandbox traces vanish
     whenever the observability backbone is deployed alongside the rails. */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "curie.fullname" . }}-runner-allow-collector
  labels:
    {{- include "curie.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-sandbox
spec:
  podSelector:
    matchLabels:
      {{- include "curie.selectorLabels" (dict "root" . "component" "runner-sandbox") | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              {{- include "curie.selectorLabels" (dict "root" . "component" "otel-collector") | nindent 14 }}
      ports:
        - { protocol: TCP, port: {{ .Values.otelCollector.service.grpcPort }} }
        - { protocol: TCP, port: {{ .Values.otelCollector.service.httpPort }} }
{{- else }}
{{- $otlpEndpoint := include "curie.otel.endpoint" . | trim }}
{{- if $otlpEndpoint }}
{{/* BYO collector (#2317). There is no in-chart collector pod to select, yet
     curie.env.otel still hands the sandbox OTEL_EXPORTER_OTLP_ENDPOINT for an
     external host, and NetworkPolicy cannot target that host (a DNS name). So
     the operator must declare CIDRs. Empty keeps fail-closed: without this the
     install is green, api/worker/dispatcher traces flow, and only the runner's
     spans are silently dropped -- while every turn also pays the exporter's
     flush stall. An empty resolved endpoint (telemetry off, or no endpoint at
     all) requires nothing and renders no policy: there is nothing to reach. */}}
{{- if not .Values.otelCollector.egress }}
{{- fail "otelCollector.deploy is false with an OTLP endpoint set: set otelCollector.egress to the collector endpoint CIDRs the runner sandbox must reach. Rail 1 is fail-closed and the in-chart runner-allow-collector policy does not render without an in-cluster collector pod. NetworkPolicy cannot target a DNS name, so otelCollector.endpoint alone is not enough -- without this key every runner, agent.run, llm.generation and execute_tool span is silently dropped while every other workload's traces keep flowing. If a CIDR for this endpoint already sits in security.networkPolicy.allowedEgress, move it to (or duplicate it into) otelCollector.egress: allowedEgress is the model/MCP allowlist, and rail 1 renders no runner peer for this endpoint without the dedicated key." }}
{{- end }}
{{- range .Values.otelCollector.egress }}
{{- include "curie.objectStore.egressEntry" (dict "key" "otelCollector.egress" "entry" .) }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "curie.fullname" . }}-runner-allow-collector-endpoint
  labels:
    {{- include "curie.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-sandbox
spec:
  podSelector:
    matchLabels:
      {{- include "curie.selectorLabels" (dict "root" . "component" "runner-sandbox") | nindent 6 }}
  policyTypes: [Egress]
  egress:
    {{- include "curie.egress.ipBlockRules" .Values.otelCollector.egress | trim | nindent 4 }}
{{- end }}
{{- end }}
{{- if .Values.api.deploy }}
{{- if .Values.api.egress }}
{{- fail "api.egress is set while api.deploy is true, where the chart never reads it: it is only read on the BYO branch (api.deploy false). With the API in-chart, runner egress to it is governed by the rendered runner-allow-api policy's in-chart pod selector, and an external destination reached while the in-chart API is still deployed stays governed by security.networkPolicy.allowedEgress -- so either clear api.egress or set api.deploy: false. If a CIDR for this endpoint already sits in allowedEgress, move it to (or duplicate it into) api.egress when you flip deploy off: allowedEgress is the model/MCP allowlist, and rail 1 renders no runner peer for this endpoint without the dedicated key." }}
{{- end }}
---
{{/* Allow the runner to reach THIS release's in chart API for memory and history calls;
     without this carve out, rail 1 default deny blocks those calls. TCP 8000 is the API
     container port, not the configurable Service port. Two different destinations,
     two different mechanisms: `api.egress` in the BYO branch below covers the
     `api.deploy: false` shape, where there is no in-chart api pod to select. It
     is NOT read here -- with api.deploy true the chart renders this pod selector
     even when dispatcher.apiBaseUrl points at an external host, and reaching that
     external destination remains governed by the operator's
     security.networkPolicy.allowedEgress list. */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "curie.fullname" . }}-runner-allow-api
  labels:
    {{- include "curie.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-sandbox
spec:
  podSelector:
    matchLabels:
      {{- include "curie.selectorLabels" (dict "root" . "component" "runner-sandbox") | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              {{- include "curie.selectorLabels" (dict "root" . "component" "api") | nindent 14 }}
      ports:
        - { protocol: TCP, port: 8000 }
{{- else }}
{{- $apiBaseUrl := trim (printf "%v" (.Values.dispatcher.apiBaseUrl | default "")) }}
{{- if $apiBaseUrl }}
{{/* BYO API (#2317). There is no in-chart api pod to select, and NetworkPolicy
     cannot target dispatcher.apiBaseUrl (a DNS name), so the operator must
     declare CIDRs. Empty keeps fail-closed: without this the install is green
     and the failure is silent and agent-shaped -- every turn boots with no
     prior memory and no thread transcript, `remember` writes never persist, the
     auto-mounted curie-state MCP server cannot reach its store, and boot burns
     timeout latency inside the worker's claim-bind window. The only trace is a
     `memory load failed` warning inside the sandbox. Mirrors the BYO object
     store branch below; mailAdapter.apiEgress.httpsCidrs is the same idea for
     the mail adapter pod. Scoped to a set dispatcher.apiBaseUrl, mirroring the
     collector branch above: api.deploy false with no base URL at all names no
     API for the runner to reach -- that install already dead-ends loudly at
     dispatcher boot (see curie.env.apiUrl), and the trimming overlays render on
     it. */}}
{{- if not .Values.api.egress }}
{{- fail "api.deploy is false: set api.egress to the external API endpoint CIDRs the runner sandbox must reach for memory, history and state. Rail 1 is fail-closed and the in-chart runner-allow-api policy does not render without an in-cluster api pod. NetworkPolicy cannot target a DNS name, so dispatcher.apiBaseUrl alone is not enough -- without this key agents boot with no memory and no history, remember writes never persist, and the only symptom is a warning line inside the sandbox. If a CIDR for this endpoint already sits in security.networkPolicy.allowedEgress, move it to (or duplicate it into) api.egress: allowedEgress is the model/MCP allowlist, and rail 1 renders no runner peer for this endpoint without the dedicated key." }}
{{- end }}
{{- range .Values.api.egress }}
{{- include "curie.objectStore.egressEntry" (dict "key" "api.egress" "entry" .) }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "curie.fullname" . }}-runner-allow-api-endpoint
  labels:
    {{- include "curie.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-sandbox
spec:
  podSelector:
    matchLabels:
      {{- include "curie.selectorLabels" (dict "root" . "component" "runner-sandbox") | nindent 6 }}
  policyTypes: [Egress]
  egress:
    {{- include "curie.egress.ipBlockRules" .Values.api.egress | trim | nindent 4 }}
{{- end }}
{{- end }}
{{- if or .Values.agentSandbox.runner.bundleFetch.enabled .Values.agentSandbox.runner.workspace.enabled }}
{{- if .Values.rustfs.deploy }}
---
{{/* Allow the runner's bundle-fetch or workspace-fetch init container to reach
     THIS release's in-chart RustFS for its exact object. Mirrors the collector carve out
     above: without it, rail 1's default-deny blocks the S3 fetch and every bound
     sandbox fails closed. */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "curie.fullname" . }}-runner-allow-rustfs
  labels:
    {{- include "curie.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-sandbox
spec:
  podSelector:
    matchLabels:
      {{- include "curie.selectorLabels" (dict "root" . "component" "runner-sandbox") | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              {{- include "curie.selectorLabels" (dict "root" . "component" "rustfs") | nindent 14 }}
      ports:
        - { protocol: TCP, port: 9000 }
{{- else }}
{{/* BYO object store (#2213). There is no in-chart rustfs pod to select, and
     NetworkPolicy cannot target rustfs.host (a DNS name). The operator must
     declare CIDRs. Empty keeps fail-closed: a model-only allowedEgress list
     used to install green and then hang every sandbox in Init. On EKS the
     tight form is VPC interface endpoints for s3 and (key-free) sts with
     private DNS enabled; see the chart README, "Key-free object store auth". */}}
{{- if not .Values.rustfs.egress }}
{{- fail "rustfs.deploy is false: set rustfs.egress to the object-store endpoint CIDRs the runner bundle-fetch must reach. Rail 1 is fail-closed and the in-chart runner-allow-rustfs policy does not render without an in-cluster rustfs pod. NetworkPolicy cannot target rustfs.host. On EKS the tight form is a VPC interface endpoint /32 for S3 with private DNS enabled (see the chart README, 'Key-free object store auth')." }}
{{- end }}
{{- if not (include "curie.rustfs.staticCredentials" .) }}
{{- if not .Values.rustfs.stsEgress }}
{{- fail "rustfs.deploy is false and rustfs.auth.accessKey is empty: set rustfs.stsEgress to the STS endpoint CIDRs AssumeRoleWithWebIdentity must reach. On EKS the tight form is a VPC interface endpoint /32 for STS with private DNS enabled (see the chart README, 'Key-free object store auth')." }}
{{- end }}
{{- end }}
{{- range .Values.rustfs.egress }}
{{- include "curie.objectStore.egressEntry" (dict "key" "rustfs.egress" "entry" .) }}
{{- end }}
{{- range .Values.rustfs.stsEgress }}
{{- include "curie.objectStore.egressEntry" (dict "key" "rustfs.stsEgress" "entry" .) }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "curie.fullname" . }}-runner-allow-object-store
  labels:
    {{- include "curie.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-sandbox
spec:
  podSelector:
    matchLabels:
      {{- include "curie.selectorLabels" (dict "root" . "component" "runner-sandbox") | nindent 6 }}
  policyTypes: [Egress]
  egress:
    {{- include "curie.egress.ipBlockRules" (concat (.Values.rustfs.egress | default list) (.Values.rustfs.stsEgress | default list)) | trim | nindent 4 }}
{{- end }}
{{- end }}
{{- if .Values.inference.deploy }}
---
{{/* Allow the runner to reach THIS release's in-cluster inference endpoint.
     Keeping it as a pod carve-out preserves the external egress allowlist's
     fail-closed default. */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "curie.fullname" . }}-runner-allow-inference
  labels:
    {{- include "curie.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-sandbox
spec:
  podSelector:
    matchLabels:
      {{- include "curie.selectorLabels" (dict "root" . "component" "runner-sandbox") | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              {{- include "curie.selectorLabels" (dict "root" . "component" "inference") | nindent 14 }}
      ports:
        - { protocol: TCP, port: {{ .Values.inference.port }} }
{{- end }}
{{- if $np.allowedEgress }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "curie.fullname" . }}-runner-allow-egress
  labels:
    {{- include "curie.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-sandbox
spec:
  podSelector:
    matchLabels:
      {{- include "curie.selectorLabels" (dict "root" . "component" "runner-sandbox") | nindent 6 }}
  policyTypes: [Egress]
  egress:
    {{- include "curie.egress.ipBlockRules" $np.allowedEgress | trim | nindent 4 }}
{{- end }}
{{- $connectorEgress := .Values.agentSandbox.connectorEgress | default dict }}
{{- range $agent := keys $connectorEgress | sortAlpha }}
{{- if or (gt (len $agent) 40) (not (regexMatch "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$" $agent)) }}
{{- fail (printf "agentSandbox.connectorEgress.%s has an invalid agent name" $agent) }}
{{- end }}
{{- $entries := index $connectorEgress $agent }}
{{- if $entries }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "curie.fullname" $ }}-agent-{{ $agent }}-allow-egress
  labels:
    {{- include "curie.labels" $ | nindent 4 }}
    app.kubernetes.io/component: agent-sandbox
    curietech.ai/agent: {{ $agent | quote }}
spec:
  podSelector:
    matchLabels:
      {{- include "curie.selectorLabels" (dict "root" $ "component" "runner-sandbox") | nindent 6 }}
      curietech.ai/agent: {{ $agent | quote }}
  policyTypes: [Egress]
  egress:
    {{- include "curie.egress.ipBlockRules" $entries | trim | nindent 4 }}
{{- end }}
{{- end }}
{{- if $np.lockIngress }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "curie.fullname" . }}-runner-ingress
  labels:
    {{- include "curie.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-sandbox
spec:
  podSelector:
    matchLabels:
      {{- include "curie.selectorLabels" (dict "root" . "component" "runner-sandbox") | nindent 6 }}
  policyTypes: [Ingress]
  # The worker dials the claimed sandbox on the ACI port; allow ingress to it
  # from within the release namespace only.
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
      ports:
        - { protocol: TCP, port: {{ .Values.agentSandbox.runner.port }} }
{{- end }}
{{- end }}
