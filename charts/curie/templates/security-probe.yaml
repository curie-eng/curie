{{- if and .Values.agentSandbox.deploy .Values.security.probe.enabled }}
{{- $h := .Values.agentSandbox.runner.hardening }}
{{/*
The PT-3 security-boundary probe suite, re-run against the chart's rendered
defaults as a `helm test`. Five claims:

  1. default-deny egress + metadata endpoint blocked, WITH a before/after control
     that proves the CNI actually enforces (not a silent false-pass). Claim 1c
     additionally proves the vendored controller is not shadow-managing its own
     permissive NetworkPolicy alongside Rail 1's (issue #765). Claim 1d
     additionally proves declared BYO runner peers are reachable and an
     undeclared control stays BLOCKED (issue #2369).
  2. connector credential isolation in real claimed runner sandboxes.
  3. runner containers are non-root with a read-only rootfs.
  4. gVisor RuntimeClass enforced (reported testable / not-testable honestly;
     enforcement itself is asserted by the preflight-gvisor hook).
  5. data-tier ingress isolation: a release-app-labeled pod reaches each deployed
     store's port while a non-app-labeled pod is blocked (the data-tier rail).

Claim 3 is a self-contained hardened Pod (the pod IS the test). Claims 1, 2, 4, 5
run from a kubectl-driven orchestrator with a scoped ServiceAccount.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "curie.fullname" . }}-security-probe
  labels:
    {{- include "curie.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "-5"
    # Fixture Secret access and resource creation must not outlive the test:
    # clean up whether the test succeeds or fails, and re-create on the next run.
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "curie.fullname" . }}-security-probe
  labels:
    {{- include "curie.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "-5"
    # Fixture Secret access and resource creation must not outlive the test:
    # clean up whether the test succeeds or fails, and re-create on the next run.
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, delete, get, list, watch]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    # Kubernetes cannot restrict Secret creation by resourceNames.
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    # Read and deletion are limited to the two synthetic fixture Secrets.
    resources: [secrets]
    resourceNames:
      - {{ printf "%s-agent-sp-a-connector-secrets" (include "curie.fullname" .) | quote }}
      - {{ printf "%s-agent-sp-b-connector-secrets" (include "curie.fullname" .) | quote }}
    verbs: [delete, get]
  - apiGroups: [""]
    resources: [services]
    verbs: [get]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [create, delete, get, list]
  - apiGroups: [extensions.agents.x-k8s.io]
    resources: [sandboxtemplates, sandboxwarmpools]
    verbs: [create, delete, get]
  - apiGroups: [extensions.agents.x-k8s.io]
    resources: [sandboxclaims]
    verbs: [create, delete, get, list, watch]
  - apiGroups: [agents.x-k8s.io]
    resources: [sandboxes]
    verbs: [delete, get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "curie.fullname" . }}-security-probe
  labels:
    {{- include "curie.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "-4"
    # Privileged RBAC binding: clean up on success or failure (see the Role/SA).
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "curie.fullname" . }}-security-probe
subjects:
  - kind: ServiceAccount
    name: {{ include "curie.fullname" . }}-security-probe
    namespace: {{ .Release.Namespace }}
---
{{- if $h.enabled }}
{{/* Claim 3: non-root + read-only rootfs. The pod IS the test, hardened with the
     SAME securityContext the chart applies to runner sandboxes. Only rendered
     when hardening is enabled -- otherwise the real runner is not hardened and a
     passing probe here would be a false security result. */}}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "curie.fullname" . }}-security-probe-hardening
  labels:
    {{- with (include "curie.placement.labels" (dict "root" $ "class" "hooks")) }}
    {{- . | nindent 4 }}
    {{- end }}
    {{- include "curie.labels" . | nindent 4 }}
  annotations:
    {{- with (include "curie.placement.annotations" (dict "root" $ "class" "hooks")) }}
    {{- . | nindent 4 }}
    {{- end }}
    "helm.sh/hook": test
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  {{- with (include "curie.placement.spec" (dict "root" $ "class" "hooks")) }}
  {{- . | nindent 2 }}
  {{- end }}
  restartPolicy: Never
  {{- with .Values.priorityClasses.platform.name }}
  priorityClassName: {{ . }}
  {{- end }}
  securityContext:
    runAsNonRoot: true
    runAsUser: {{ $h.runAsUser }}
    runAsGroup: {{ $h.runAsGroup }}
    fsGroup: {{ $h.fsGroup }}
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: hardening
      image: {{ .Values.security.probe.busyboxImage }}
      imagePullPolicy: {{ .Values.global.imagePullPolicy }}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities:
          drop: [ALL]
      command:
        - /bin/sh
        - -c
        - |
          echo "== Claim 3: non-root + read-only rootfs =="
          id
          rc=0
          if echo "$(id -u)" | grep -qx "{{ $h.runAsUser }}"; then
            echo "PASS: running as uid {{ $h.runAsUser }} (non-root)"
          else
            echo "FAIL: expected uid {{ $h.runAsUser }}, got $(id -u)"; rc=1
          fi
          if touch /nope 2>/dev/null; then
            echo "FAIL: wrote to / -- rootfs is NOT read-only"; rc=1
          else
            echo "PASS: write to / blocked (read-only rootfs)"
          fi
          exit $rc
      resources:
        {{- toYaml .Values.security.probe.resources | nindent 8 }}
{{- end }}
---
{{/* Claims 1, 2, 4, 5: kubectl-driven orchestrator (alpine/k8s ships kubectl).
     $dt is the space-separated host:port list of stores Claim 5 probes (one
     representative data port each). Keep this store set + ports in sync with the
     $stores catalog in security-datatier-networkpolicy.yaml -- each port here
     must be in that store's allow-list or Claim 5 red-fails a correct rail.
     Claim 5 only asserts the data-tier boundary when the rail that creates it is
     enabled AND the store is in-chart-deployed; BYO stores are external and
     excluded from $dt (there is no in-cluster ingress rail to prove). Both a
     disabled rail and all-BYO stores yield an empty list => Claim 5 skips.
     When postgres.deploy is false and postgres.host is set, $pgByo carries
     host:port so Claim 5 can SKIP the in-cluster 5432 check by name rather
     than dropping it silently (#2432). Do not put that host on $dt: Claim 5's
     allowed=reachable / denied=blocked pair cannot hold on an external
     endpoint, and helm test would fail a correct BYO/RDS install. */}}
{{- $dt := list -}}
{{- $pgByo := "" -}}
{{- $byoRunner := list -}}
{{- if and (not .Values.postgres.deploy) .Values.postgres.host -}}
{{- $pgByo = printf "%s:%v" .Values.postgres.host .Values.postgres.port -}}
{{- end -}}
{{- if .Values.security.dataTierNetworkPolicy.enabled -}}
{{- if .Values.postgres.deploy }}{{- $dt = append $dt (printf "%s:%v" (include "curie.postgres.host" .) .Values.postgres.port) -}}{{- end }}
{{- if .Values.rustfs.deploy }}{{- $dt = append $dt (printf "%s:%v" (include "curie.rustfs.host" .) .Values.rustfs.port) -}}{{- end }}
{{- if .Values.clickhouse.deploy }}{{- $dt = append $dt (printf "%s:8123" (include "curie.clickhouse.host" .)) -}}{{- end }}
{{- if .Values.valkey.deploy }}{{- $dt = append $dt (printf "%s:6379" (include "curie.valkey.host" .)) -}}{{- end }}
{{- end -}}
{{- if and .Values.agentSandbox.deploy .Values.security.networkPolicy.enabled -}}
{{- $apiExternal := include "curie.runner.apiIsExternal" . | trim -}}
{{- $otlpExternal := include "curie.runner.otlpIsExternal" . | trim -}}
{{- $otlpEndpoint := include "curie.runner.effectiveOtlpEndpoint" . | trim -}}
{{- if and (or .Values.agentSandbox.runner.bundleFetch.enabled .Values.agentSandbox.runner.workspace.enabled) (not .Values.rustfs.deploy) .Values.rustfs.egress -}}
{{- $rustfsHost := include "curie.rustfs.host" . | trim -}}
{{- if and $rustfsHost (not (contains ":" $rustfsHost)) (not (contains "[" $rustfsHost)) -}}
{{- $byoRunner = append $byoRunner (printf "rustfs=%s:%v" $rustfsHost .Values.rustfs.port) -}}
{{- end -}}
{{- if and (not (include "curie.rustfs.staticCredentials" .)) .Values.rustfs.stsEgress -}}
{{- $sts0 := index .Values.rustfs.stsEgress 0 -}}
{{- $stsCidr := trim (printf "%v" ($sts0.cidr | default "")) -}}
{{/* Only a /32 or /128 is a host. A /24 network address has no STS listener,
     and the chart has no STS hostname field, so skip rather than probe .0. */}}
{{- if or (hasSuffix "/32" $stsCidr) (hasSuffix "/128" $stsCidr) -}}
{{- $stsIp := regexReplaceAll "/[0-9]+$" $stsCidr "" -}}
{{- $stsPort := "" -}}
{{- if $sts0.ports -}}
{{- $stsPortItem := index $sts0.ports 0 -}}
{{- $stsPort = printf "%v" ($stsPortItem.port | default "") -}}
{{- end -}}
{{- if and $stsIp $stsPort (not (contains ":" $stsIp)) -}}
{{- $byoRunner = append $byoRunner (printf "sts=%s:%s" $stsIp $stsPort) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if and .Values.otelCollector.egress (or (and (not .Values.otelCollector.deploy) $otlpEndpoint) $otlpExternal) -}}
{{- $otelUrl := $otlpEndpoint -}}
{{- $otelHost := include "curie.endpoint.host" $otelUrl | trim -}}
{{- $otelPort := include "curie.endpoint.dialPort" $otelUrl | trim -}}
{{- if and $otelHost $otelPort (not (contains "[" $otelHost)) (not (contains ":" $otelHost)) -}}
{{- $byoRunner = append $byoRunner (printf "otel=%s:%s" $otelHost $otelPort) -}}
{{- end -}}
{{- end -}}
{{- if and .Values.api.egress (or (and (not .Values.api.deploy) (include "curie.runner.apiOverrideSet" .)) $apiExternal) -}}
{{- $apiUrl := include "curie.runner.effectiveApiUrl" . | trim -}}
{{- $apiHost := include "curie.endpoint.host" $apiUrl | trim -}}
{{- $apiPort := include "curie.endpoint.dialPort" $apiUrl | trim -}}
{{- if and $apiHost $apiPort (not (contains "[" $apiHost)) (not (contains ":" $apiHost)) -}}
{{- $byoRunner = append $byoRunner (printf "api=%s:%s" $apiHost $apiPort) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- $probeRuntimeClass := include "curie.gvisor.runtimeClassName" . | trim -}}
{{- $probeRoot := deepCopy . -}}
{{/* Preserve the release's resolved kernel isolation before enabling fake mode. */}}
{{- if $probeRuntimeClass -}}
{{- $_ := set $probeRoot.Values.security.gvisor "mode" "require" -}}
{{- $_ := set $probeRoot.Values.security.gvisor "runtimeClassName" $probeRuntimeClass -}}
{{- else -}}
{{- $_ := set $probeRoot.Values.security.gvisor "mode" "off" -}}
{{- end -}}
{{- $_ := set $probeRoot.Values.agentSandbox.runner "fakeModel" true -}}
{{- $_ := set $probeRoot.Values.inference "deploy" false -}}
{{- $_ := set $probeRoot.Values.agentSandbox.runner.bundleFetch "enabled" false -}}
{{- $_ := set $probeRoot.Values.agentSandbox.runner.workspace "enabled" false -}}
{{- $_ := set $probeRoot.Values.agentSandbox.runner.attachments "enabled" false -}}
{{- $_ := set $probeRoot.Values.agentSandbox.runner "extraEnv" list -}}
{{- $_ := set $probeRoot.Values.agentSandbox.runner "pluginDir" "/tmp/curie-security-probe" -}}
{{- $_ := set $probeRoot.Values.agentSandbox.warmPool "replicas" 0 -}}
{{- $_ := set $probeRoot.Values.otelCollector "deploy" false -}}
{{- $_ := set $probeRoot.Values.otelCollector "endpoint" "" -}}
{{- $_ := set $probeRoot.Values.otelCollector "headers" "" -}}
{{- $_ := set $probeRoot.Values.otelCollector "headersExistingSecret" "" -}}
{{- $_ := set $probeRoot.Values.otelCollector "telemetryDisabled" true -}}
{{/* The real runner validates a bundle even in fake mode. Bootstrap only
     fixture data, then execute its normal module entrypoint. */}}
{{- $probeBootstrap := "        - name: runner\n          command: [\"/bin/sh\", \"-c\"]\n          args:\n            - |\n              set -eu\n              mkdir -p \"$CURIE_PLUGIN_DIR/.claude-plugin\"\n              printf '%s\\n' '{\"name\":\"acme-security-probe\"}' > \"$CURIE_PLUGIN_DIR/.claude-plugin/plugin.json\"\n              exec python3 -m curie_runner\n" -}}
{{- $probeLabels := printf "  podTemplate:\n    metadata:\n      labels:\n        curie.io/security-probe: %s\n" (include "curie.fullname" . | quote) -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "curie.fullname" . }}-security-probe
  labels:
    {{- include "curie.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        {{- with (include "curie.placement.labels" (dict "root" $ "class" "hooks")) }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- include "curie.selectorLabels" (dict "root" . "component" "security-probe") | nindent 8 }}
      {{- with (include "curie.placement.annotations" (dict "root" $ "class" "hooks")) }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
    spec:
      {{- with (include "curie.placement.spec" (dict "root" $ "class" "hooks")) }}
      {{- . | nindent 6 }}
      {{- end }}
      serviceAccountName: {{ include "curie.fullname" . }}-security-probe
      restartPolicy: Never
      {{- with .Values.priorityClasses.platform.name }}
      priorityClassName: {{ . }}
      {{- end }}
      containers:
        - name: probe
          image: {{ .Values.security.probe.kubectlImage }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: NS
              value: {{ .Release.Namespace | quote }}
            - name: BLOCKED
              value: {{ .Values.security.probe.blockedTarget | quote }}
            - name: RC
              value: {{ include "curie.gvisor.className" . | quote }}
            - name: REQUIRED_RUNTIME_CLASS
              value: {{ include "curie.gvisor.requiredRuntimeClassName" . | quote }}
            - name: RUNNER_TEMPLATES
              {{- $runnerTemplates := list (printf "%s-runner" (include "curie.fullname" .)) }}
              {{- range $agent := include "curie.agentSandboxPoolAgents" . | fromJsonArray }}
              {{- $runnerTemplates = append $runnerTemplates (printf "%s-agent-%s-runner" (include "curie.fullname" $) $agent) }}
              {{- end }}
              value: {{ join " " $runnerTemplates | quote }}
            - name: EGRESS_POD
              value: {{ include "curie.fullname" . }}-egress-probe
            - name: NETSHOOT
              value: {{ .Values.security.probe.netshootImage | quote }}
            - name: BUSYBOX
              value: {{ .Values.security.probe.busyboxImage | quote }}
            - name: ALLOW_ALL_NP
              value: {{ include "curie.fullname" . }}-security-probe-allow-all
            - name: BROAD_ALLOW_NP
              value: {{ include "curie.fullname" . }}-security-probe-broad-allow
            # The egress-probe carries this release's runner-sandbox labels (so the
            # chart's default-deny selects it) PLUS a unique per-release probe label.
            # The temporary allow-all selects ONLY the unique label, so it never
            # opens egress on real runner sandboxes sharing the namespace.
            - name: PROBE_LABELS
              value: "app.kubernetes.io/name={{ include "curie.name" . }},app.kubernetes.io/instance={{ .Release.Name }},app.kubernetes.io/component=runner-sandbox,curie.io/egress-probe={{ .Release.Name }}"
            - name: PROBE_UNIQUE_VAL
              value: {{ .Release.Name | quote }}
            # Claim 5: data-tier ingress isolation. Deployed-store host:port list
            # (empty => skip). Two probe pods: the ALLOWED one carries this
            # release's app labels (rail SHOULD permit it), the DENIED one carries
            # only a probe label with NO app labels (rail SHOULD block it).
            - name: DATATIER_TARGETS
              value: {{ join " " $dt | quote }}
            # BYO Postgres (#2432): empty on the in-chart path. When set, Claim 5
            # skips in-cluster :5432 and names this host:port rather than nc'ing
            # it (no in-cluster deny/allow pair exists for an external store).
            - name: POSTGRES_BYO_TARGET
              value: {{ $pgByo | quote }}
            # Claim 1d (#2369): space-separated name=host:port for BYO runner
            # peers whose -endpoint / object-store policy would render. Empty
            # on the in-chart path (SKIP). IPv4 / hostname tokens only.
            - name: BYO_RUNNER_TARGETS
              value: {{ join " " $byoRunner | quote }}
            - name: DT_ALLOWED_POD
              value: {{ include "curie.fullname" . }}-dt-probe-allowed
            - name: DT_DENIED_POD
              value: {{ include "curie.fullname" . }}-dt-probe-denied
            - name: DT_ALLOWED_LABELS
              value: "app.kubernetes.io/name={{ include "curie.name" . }},app.kubernetes.io/instance={{ .Release.Name }},curie.io/datatier-probe=allowed"
            - name: DT_DENIED_LABELS
              value: "curie.io/datatier-probe=denied"
            # Claim 1c (#765): the controller-managed NetworkPolicy the runner
            # SandboxTemplate's networkPolicyManagement: Unmanaged is meant to
            # suppress. Only asserted when THIS release deploys that controller
            # (agentSandbox.controller.deploy) AND Rail 1 is on -- otherwise there
            # is nothing #765-shaped to check.
            - name: SANDBOX_NP_NAME
              value: {{ include "curie.fullname" . }}-runner-network-policy
            - name: CONTROLLER_DEPLOYED
              value: {{ and .Values.agentSandbox.controller.deploy .Values.security.networkPolicy.enabled | quote }}
          command:
            - /bin/bash
            - -c
            - |
              set -u
              fail=0
              sp_claims=(); sp_sandboxes=(); sp_templates=(); sp_pools=()
              sp_secrets=(); sp_policies=(); sp_descendants=()
              cleanup() {
                local cleanup_failed=0 claim sandbox selector service object found attempt
                for claim in "${sp_claims[@]}"; do
                  sandbox=$(kubectl get sandboxclaim "$claim" -n "$NS" --ignore-not-found -o jsonpath='{.status.sandbox.name}') || cleanup_failed=1
                  if [ -n "$sandbox" ]; then
                    sp_sandboxes+=("$sandbox")
                    selector=$(kubectl get sandbox "$sandbox" -n "$NS" --ignore-not-found -o jsonpath='{.status.selector}') || cleanup_failed=1
                    if [ -n "$selector" ]; then
                      found=$(kubectl get pods -n "$NS" -l "$selector" -o name) || cleanup_failed=1
                      for object in $found; do sp_descendants+=("$object"); done
                    fi
                    service=$(kubectl get sandbox "$sandbox" -n "$NS" --ignore-not-found -o jsonpath='{.status.service}') || cleanup_failed=1
                    [ -z "$service" ] || sp_descendants+=("service/$service")
                  fi
                done
                [ "${#sp_claims[@]}" = 0 ] || kubectl delete sandboxclaim "${sp_claims[@]}" -n "$NS" --ignore-not-found --wait=false >/dev/null || cleanup_failed=1
                [ "${#sp_sandboxes[@]}" = 0 ] || kubectl delete sandbox "${sp_sandboxes[@]}" -n "$NS" --ignore-not-found --wait=false >/dev/null || cleanup_failed=1
                [ "${#sp_pools[@]}" = 0 ] || kubectl delete sandboxwarmpool "${sp_pools[@]}" -n "$NS" --ignore-not-found --wait=false >/dev/null || cleanup_failed=1
                [ "${#sp_templates[@]}" = 0 ] || kubectl delete sandboxtemplate "${sp_templates[@]}" -n "$NS" --ignore-not-found --wait=false >/dev/null || cleanup_failed=1
                [ "${#sp_secrets[@]}" = 0 ] || kubectl delete secret "${sp_secrets[@]}" -n "$NS" --ignore-not-found --wait=false >/dev/null || cleanup_failed=1
                [ "${#sp_policies[@]}" = 0 ] || kubectl delete networkpolicy "${sp_policies[@]}" -n "$NS" --ignore-not-found --wait=false >/dev/null || cleanup_failed=1
                for object in "${sp_claims[@]/#/sandboxclaim/}" "${sp_sandboxes[@]/#/sandbox/}" \
                  "${sp_pools[@]/#/sandboxwarmpool/}" "${sp_templates[@]/#/sandboxtemplate/}" \
                  "${sp_secrets[@]/#/secret/}" "${sp_policies[@]/#/networkpolicy/}" "${sp_descendants[@]}"; do
                  for attempt in $(seq 1 30); do
                    found=$(kubectl get "$object" -n "$NS" --ignore-not-found -o name) || { cleanup_failed=1; break; }
                    [ -n "$found" ] || break
                    sleep 1
                  done
                  if [ -n "$found" ]; then
                    echo "RESULT: FAIL: fixture cleanup left ${object}"
                    cleanup_failed=1
                  fi
                done
                kubectl delete pod "$EGRESS_POD" sp-gvisor-check -n "$NS" --ignore-not-found >/dev/null 2>&1 || true
                kubectl delete pod "$DT_ALLOWED_POD" "$DT_DENIED_POD" -n "$NS" --ignore-not-found >/dev/null 2>&1 || true
                kubectl delete networkpolicy "$ALLOW_ALL_NP" "$BROAD_ALLOW_NP" -n "$NS" --ignore-not-found >/dev/null 2>&1 || true
                if [ "$cleanup_failed" != 0 ]; then trap - EXIT; exit 1; fi
                sp_claims=(); sp_sandboxes=(); sp_templates=(); sp_pools=()
                sp_secrets=(); sp_policies=(); sp_descendants=()
              }
              trap cleanup EXIT

              echo "###############################################"
              echo "# Curie A2 security probe (claims 1, 2, 4, 5)"
              echo "###############################################"

              # ================= Claim 1: egress + metadata (before/after) ==========
              echo ""
              echo "== Claim 1: default-deny egress + metadata, with before/after control =="
              kubectl run "$EGRESS_POD" -n "$NS" --image="$NETSHOOT" --restart=Never \
                --labels="$PROBE_LABELS" \
                --command -- sleep 3600 >/dev/null
              kubectl wait --for=condition=Ready "pod/$EGRESS_POD" -n "$NS" --timeout=120s >/dev/null

              probe_rc() { # $1=url -> prints curl exit code from inside the labeled pod
                kubectl exec -n "$NS" "$EGRESS_POD" -- sh -c "curl -m 6 -sS -o /dev/null '$1' >/dev/null 2>&1; echo rc=\$?" 2>/dev/null | sed -n 's/.*rc=//p'
              }
              classify() { case "$1" in 28|7|6|5|"") echo blocked;; *) echo reachable;; esac; }

              # Baseline control: temporarily allow ALL egress on runner-sandbox pods.
              cat <<EOF | kubectl apply -f - >/dev/null
              apiVersion: networking.k8s.io/v1
              kind: NetworkPolicy
              metadata:
                name: ${ALLOW_ALL_NP}
                namespace: ${NS}
              spec:
                podSelector:
                  matchLabels:
                    curie.io/egress-probe: ${PROBE_UNIQUE_VAL}
                policyTypes: [Egress]
                egress:
                  - {}
              EOF
              sleep 5
              before=$(classify "$(probe_rc "https://${BLOCKED}/")")
              echo "phase 1 (allow-all egress):  ${BLOCKED} -> ${before}"

              # Remove the allow-all; now only the chart's default-deny + allow-dns apply.
              kubectl delete networkpolicy "$ALLOW_ALL_NP" -n "$NS" --ignore-not-found >/dev/null
              sleep 5
              after_ext=$(classify "$(probe_rc "https://${BLOCKED}/")")
              after_meta=$(classify "$(probe_rc "http://169.254.169.254/latest/meta-data/")")
              dns_ok=no
              kubectl exec -n "$NS" "$EGRESS_POD" -- sh -c "nslookup ${BLOCKED} >/dev/null 2>&1" && dns_ok=yes
              echo "phase 2 (chart default-deny): ${BLOCKED} -> ${after_ext}   metadata(169.254.169.254) -> ${after_meta}   dns-resolves -> ${dns_ok}"
              kubectl delete pod "$EGRESS_POD" -n "$NS" --ignore-not-found >/dev/null

              if [ "$before" = reachable ] && [ "$after_ext" = blocked ] && [ "$after_meta" = blocked ] && [ "$dns_ok" = yes ]; then
                echo "RESULT: PASS - CNI enforces (reachable->blocked flip); arbitrary egress AND the"
                echo "        cloud metadata endpoint are denied; DNS still resolves."
              else
                echo "RESULT: FAIL - before=${before} after=${after_ext} metadata=${after_meta} dns=${dns_ok}"
                echo "        (a non-enforcing CNI shows before=after=reachable: silent false-pass.)"
                fail=1
              fi

              # ---- Claim 1b: metadata blocked UNDER a broad (0.0.0.0/0) allowlist ----
              # Phase 2 proves default-deny blocks metadata. This proves the additive
              # carve-out: a broad allow (the realistic model-API 0.0.0.0/0 case) must
              # reach the internet yet keep the metadata endpoint blocked via `except`.
              # Mirrors exactly what the chart renders for allowedEgress:[{cidr:0.0.0.0/0}]
              # (issue #70: a broad allow must not silently re-open IMDS).
              echo ""
              echo "== Claim 1b: metadata blocked under a broad 0.0.0.0/0 allowlist =="
              kubectl run "$EGRESS_POD" -n "$NS" --image="$NETSHOOT" --restart=Never \
                --labels="$PROBE_LABELS" \
                --command -- sleep 3600 >/dev/null
              kubectl wait --for=condition=Ready "pod/$EGRESS_POD" -n "$NS" --timeout=120s >/dev/null
              cat <<EOF | kubectl apply -f - >/dev/null
              apiVersion: networking.k8s.io/v1
              kind: NetworkPolicy
              metadata:
                name: ${BROAD_ALLOW_NP}
                namespace: ${NS}
              spec:
                podSelector:
                  matchLabels:
                    curie.io/egress-probe: ${PROBE_UNIQUE_VAL}
                policyTypes: [Egress]
                egress:
                  - to:
                      - ipBlock:
                          cidr: 0.0.0.0/0
                          except:
                            - 169.254.0.0/16
              EOF
              sleep 5
              broad_ext=$(classify "$(probe_rc "https://${BLOCKED}/")")
              broad_meta=$(classify "$(probe_rc "http://169.254.169.254/latest/meta-data/")")
              echo "phase 3 (broad allow + except): ${BLOCKED} -> ${broad_ext}   metadata(169.254.169.254) -> ${broad_meta}"
              kubectl delete networkpolicy "$BROAD_ALLOW_NP" -n "$NS" --ignore-not-found >/dev/null
              kubectl delete pod "$EGRESS_POD" -n "$NS" --ignore-not-found >/dev/null
              if [ "$broad_ext" = reachable ] && [ "$broad_meta" = blocked ]; then
                echo "RESULT: PASS - a broad 0.0.0.0/0 allow reaches the internet but the metadata"
                echo "        endpoint stays blocked (the except carve-out holds)."
              else
                echo "RESULT: FAIL - broad-allow ext=${broad_ext} metadata=${broad_meta}"
                echo "        (metadata=reachable means a broad allow re-opened IMDS: #70 regression.)"
                fail=1
              fi

              # ---- Claim 1c: controller does not shadow-manage a permissive NetworkPolicy (#765) ----
              # NetworkPolicy allows are additive: a separate, broader policy selecting
              # the same pods cannot be narrowed by Rail 1 above, only unioned with it.
              # The runner SandboxTemplate sets networkPolicyManagement: Unmanaged
              # specifically so the vendored controller never reconciles its own
              # shared NetworkPolicy for that template. Only meaningful when this
              # release deploys that controller -- a different/external controller's
              # behavior toward the field is not this chart's to assert.
              echo ""
              echo "== Claim 1c: controller does not shadow-manage a permissive NetworkPolicy (#765) =="
              if [ "$CONTROLLER_DEPLOYED" != "true" ]; then
                echo "SKIP: agentSandbox.controller.deploy is false, or Rail 1 (security.networkPolicy.enabled) is off -- not this chart's to assert."
              else
                if kubectl get networkpolicy "$SANDBOX_NP_NAME" -n "$NS" >/dev/null 2>&1; then
                  echo "RESULT: FAIL - controller-managed NetworkPolicy '${SANDBOX_NP_NAME}' exists in ${NS}."
                  echo "        networkPolicyManagement: Unmanaged should have suppressed it entirely; its"
                  echo "        presence means the controller is still unioning its own permissive egress"
                  echo "        rule with Rail 1 above, silently re-opening the allowlist (issue #765)."
                  kubectl get networkpolicy "$SANDBOX_NP_NAME" -n "$NS" -o yaml 2>/dev/null | sed 's/^/    /'
                  fail=1
                else
                  echo "RESULT: PASS - no controller-managed NetworkPolicy '${SANDBOX_NP_NAME}' exists; Rail 1 is the only policy selecting these pods."
                fi
              fi

              echo ""
              echo "== Claim 1d: BYO runner declared peers reachable; undeclared control blocked (#2369) =="
              if [ -z "$BYO_RUNNER_TARGETS" ]; then
                echo "SKIP: no BYO runner peers declared (BYO_RUNNER_TARGETS empty); in-chart selectors still govern."
              else
                kubectl run "$EGRESS_POD" -n "$NS" --image="$NETSHOOT" --restart=Never \
                  --labels="$PROBE_LABELS" \
                  --command -- sleep 3600 >/dev/null
                kubectl wait --for=condition=Ready "pod/$EGRESS_POD" -n "$NS" --timeout=120s >/dev/null
                byo_fail=0
                for spec in $BYO_RUNNER_TARGETS; do
                  name=${spec%%=*}
                  hp=${spec#*=}
                  host=${hp%:*}
                  port=${hp##*:}
                  rc=$(kubectl exec -n "$NS" "$EGRESS_POD" -- nc -z -w5 "$host" "$port" >/dev/null 2>&1; echo $?)
                  [ "$rc" = 0 ] && st=reachable || st=blocked
                  echo "declared ${name} ${host}:${port} -> ${st}"
                  if [ "$st" != reachable ]; then
                    echo "RESULT: FAIL - declared ${name} unreachable (DNS/CIDR mismatch or wrong port)"
                    byo_fail=1; fail=1
                  fi
                done
                after_ext=$(classify "$(probe_rc "https://${BLOCKED}/")")
                echo "undeclared control ${BLOCKED} -> ${after_ext}"
                if [ "$after_ext" != blocked ]; then
                  echo "RESULT: FAIL - undeclared control reachable (non-enforcing CNI)"
                  byo_fail=1; fail=1
                fi
                kubectl delete pod "$EGRESS_POD" -n "$NS" --ignore-not-found >/dev/null
                if [ "$byo_fail" = 0 ]; then
                  echo "RESULT: PASS - declared BYO runner peers reachable; undeclared control blocked."
                fi
              fi

              # ================= Claim 2: cross-agent secret isolation ==============
              echo ""
              echo "== Claim 2: connector isolation in claimed runner sandboxes =="
              claim2() {
                local prefix={{ include "curie.fullname" . | quote }}
                local secret_a="${prefix}-agent-sp-a-connector-secrets" secret_b="${prefix}-agent-sp-b-connector-secrets"
                local policy="${prefix}-security-probe-api" agent object existing created create_rc name
                local claim pool sandbox selector pod pods token_paths
                local pod_a pod_b
                local bound_pods=()
                local runner_sa={{ if .Values.agentSandbox.runner.serviceAccount.create }}{{ printf "%s-runner" (include "curie.fullname" .) | quote }}{{ else }}default{{ end }}
                for object in "secret/$secret_a" "secret/$secret_b" "networkpolicy/$policy" \
                  "sandboxtemplate/${prefix}-agent-sp-a-runner" "sandboxtemplate/${prefix}-agent-sp-b-runner" \
                  "sandboxwarmpool/${prefix}-agent-sp-a-runner-pool" "sandboxwarmpool/${prefix}-agent-sp-b-runner-pool" \
                  "sandboxclaim/${prefix}-security-probe-a" "sandboxclaim/${prefix}-security-probe-b"; do
                  existing=$(kubectl get "$object" -n "$NS" --ignore-not-found -o name) || return 1
                  if [ -n "$existing" ]; then
                    echo "RESULT: FAIL: refusing preexisting fixture ${object}"
                    return 1
                  fi
                done
                kubectl create secret generic "$secret_a" -n "$NS" --from-literal=CURIE_SECURITY_PROBE_SECRET=AAA >/dev/null || return 1
                sp_secrets+=("$secret_a")
                kubectl create secret generic "$secret_b" -n "$NS" --from-literal=CURIE_SECURITY_PROBE_SECRET=BBB --from-literal=CURIE_SECURITY_PROBE_B_ONLY=BBB >/dev/null || return 1
                sp_secrets+=("$secret_b")
                create_rc=0
                created=$(kubectl create -n "$NS" -f - -o name <<'PROBE_SANDBOXES'
              {{- include "curie.sandboxTemplate" (dict "root" $probeRoot "agent" "sp-a" "secrets" (dict "CURIE_SECURITY_PROBE_SECRET" "AAA")) | replace "        - name: runner\n" $probeBootstrap | replace "  podTemplate:\n    metadata:\n      labels:\n" $probeLabels | nindent 14 }}
              {{- include "curie.sandboxTemplate" (dict "root" $probeRoot "agent" "sp-b" "secrets" (dict "CURIE_SECURITY_PROBE_SECRET" "BBB" "CURIE_SECURITY_PROBE_B_ONLY" "BBB")) | replace "        - name: runner\n" $probeBootstrap | replace "  podTemplate:\n    metadata:\n      labels:\n" $probeLabels | nindent 14 }}
              PROBE_SANDBOXES
                ) || create_rc=$?
                for object in $created; do
                  name=${object##*/}
                  case "$object" in
                    sandboxtemplate.*/*) sp_templates+=("$name");;
                    sandboxwarmpool.*/*) sp_pools+=("$name");;
                    *) echo "RESULT: FAIL: unexpected fixture ${object}"; return 1;;
                  esac
                done
                [ "$create_rc" = 0 ] || return 1
                API_CA=$(base64 < /var/run/secrets/kubernetes.io/serviceaccount/ca.crt | tr -d '\n') || return 1
                [ -n "$API_CA" ] || return 1
                assert_runner() {
                  kubectl exec -i -n "$NS" "$1" -c runner -- python3 - "$2" "$NS" "$3" "$4" "$API_CA" <<'PROBE_RUNNER'
              import base64
              import json
              import os
              from pathlib import Path
              import ssl
              import sys
              import time
              import urllib.error
              import urllib.request

              expected, namespace, own, other, ca = sys.argv[1:]
              if os.environ.get("CURIE_SECURITY_PROBE_SECRET") != expected:
                  raise SystemExit("FAIL: own connector sentinel is wrong or absent")
              exclusive = os.environ.get("CURIE_SECURITY_PROBE_B_ONLY")
              if (expected == "AAA" and exclusive is not None) or (expected == "BBB" and exclusive != "BBB"):
                  raise SystemExit("FAIL: connector exclusive key crossed the agent boundary")
              foreign = "BBB" if expected == "AAA" else "AAA"
              if any(foreign in value for value in os.environ.values()):
                  raise SystemExit("FAIL: foreign connector sentinel is present")
              if Path("/var/run/secrets/kubernetes.io/serviceaccount/token").exists():
                  raise SystemExit("FAIL: Kubernetes ServiceAccount token is mounted")
              print("own credential present; foreign credential absent; API token absent", flush=True)
              context = ssl.create_default_context(cadata=base64.b64decode(ca, validate=True).decode())
              base = "https://kubernetes.default.svc"

              # Unauthenticated requests are rejected with HTTP 401:
              # https://kubernetes.io/docs/reference/access-authn-authz/authentication/
              # Observed with anonymous auth disabled: tokenless claimed runners
              # received Kubernetes Status objects with code 401 for /version,
              # named Secret GET, and namespace Secret list requests.
              def request(path):
                  for attempt in range(5):
                      try:
                          try:
                              with urllib.request.urlopen(base + path, context=context, timeout=8) as response:
                                  status, body = response.status, response.read(65536)
                          except urllib.error.HTTPError as response:
                              status, body = response.code, response.read(65536)
                          document = json.loads(body)
                          if not isinstance(document, dict):
                              raise SystemExit("FAIL: invalid Kubernetes API response")
                          return status, document
                      except (urllib.error.URLError, OSError, json.JSONDecodeError):
                          if attempt == 4:
                              raise
                          time.sleep(1)

              status, document = request("/version")
              valid_version = status == 200 and bool(document.get("gitVersion"))
              rejected_version = status in (401, 403) and document.get("kind") == "Status" and document.get("code") == status
              if not (valid_version or rejected_version):
                  raise SystemExit("FAIL: Kubernetes API reachability control failed")
              print("reachable Kubernetes API; /version HTTP %s" % status, flush=True)
              for label, path in (
                  ("own Secret GET", "/api/v1/namespaces/%s/secrets/%s" % (namespace, own)),
                  ("other Secret GET", "/api/v1/namespaces/%s/secrets/%s" % (namespace, other)),
                  ("Secret list", "/api/v1/namespaces/%s/secrets" % namespace),
              ):
                  status, document = request(path)
                  if status not in (401, 403) or document.get("kind") != "Status" or document.get("code") != status:
                      raise SystemExit("FAIL: %s did not receive Kubernetes authorization rejection" % label)
                  print("%s rejected HTTP %s" % (label, status), flush=True)
              PROBE_RUNNER
                }
                for agent in a b; do
                  claim="${prefix}-security-probe-${agent}"
                  pool="${prefix}-agent-sp-${agent}-runner-pool"
                  kubectl create -n "$NS" -f - <<EOF >/dev/null || return 1
              apiVersion: extensions.agents.x-k8s.io/v1beta1
              kind: SandboxClaim
              metadata:
                name: ${claim}
              spec:
                warmPoolRef:
                  name: ${pool}
              EOF
                  sp_claims+=("$claim")
                  kubectl wait --for=condition=Ready "sandboxclaim/$claim" -n "$NS" --timeout=120s >/dev/null || return 1
                  [ "$(kubectl get sandboxclaim "$claim" -n "$NS" -o jsonpath='{.spec.warmPoolRef.name}')" = "$pool" ] || return 1
                  sandbox=$(kubectl get sandboxclaim "$claim" -n "$NS" -o jsonpath='{.status.sandbox.name}') || return 1
                  [ -n "$sandbox" ] || { echo "RESULT: FAIL: claim has no sandbox binding"; return 1; }
                  sp_sandboxes+=("$sandbox")
                  selector=$(kubectl get sandbox "$sandbox" -n "$NS" -o jsonpath='{.status.selector}') || return 1
                  [ -n "$selector" ] || return 1
                  pods=$(kubectl get pods -n "$NS" -l "$selector" -o jsonpath='{.items[*].metadata.name}') || return 1
                  read -r -a bound_pods <<< "$pods"
                  [ "${#bound_pods[@]}" = 1 ] || { echo "RESULT: FAIL: sandbox must bind exactly one Pod"; return 1; }
                  pod=${bound_pods[0]}
                  sp_descendants+=("pod/$pod")
                  [ "$(kubectl get pod "$pod" -n "$NS" -o jsonpath='{.metadata.ownerReferences[?(@.kind=="Sandbox")].name}')" = "$sandbox" ] || return 1
                  [ "$(kubectl get pod "$pod" -n "$NS" -o jsonpath='{.metadata.labels.curietech\.ai/agent}')" = "sp-$agent" ] || return 1
                  [ "$(kubectl get pod "$pod" -n "$NS" -o jsonpath='{.spec.serviceAccountName}')" = "$runner_sa" ] || return 1
                  token_paths=$(kubectl get pod "$pod" -n "$NS" -o jsonpath='{.spec.volumes[*].projected.sources[*].serviceAccountToken.path}') || return 1
                  [ -z "$token_paths" ] || { echo "RESULT: FAIL: unexpected projected ServiceAccount token"; return 1; }
                  kubectl wait --for=condition=Ready "pod/$pod" -n "$NS" --timeout=120s >/dev/null || return 1
                  [ "$(kubectl get pod "$pod" -n "$NS" -o jsonpath='{.metadata.labels.curie\.io/security-probe}')" = "$prefix" ] || return 1
                  echo "claim ${claim} bound sandbox ${sandbox} runner Pod ${pod}"
                  if [ "$agent" = a ]; then pod_a=$pod; else pod_b=$pod; fi
                done
                # API translation varies by CNI; only these verified fixture Pods
                # receive temporary broad egress, and they hold synthetic keys only.
                kubectl create -n "$NS" -f - <<EOF >/dev/null || return 1
              apiVersion: networking.k8s.io/v1
              kind: NetworkPolicy
              metadata:
                name: ${policy}
              spec:
                podSelector:
                  matchLabels:
                    app.kubernetes.io/instance: {{ .Release.Name | quote }}
                    curie.io/security-probe: ${prefix}
                policyTypes: [Egress]
                egress:
                  - {}
              EOF
                sp_policies+=("$policy")
                assert_runner "$pod_a" AAA "$secret_a" "$secret_b" || return 1
                assert_runner "$pod_b" BBB "$secret_b" "$secret_a" || return 1
              }
              if claim2; then
                cleanup
                echo "RESULT: PASS: claimed runners receive only their own connector credentials and cannot fetch or list Secrets"
              else
                cleanup
                echo "RESULT: FAIL: claimed runner credential isolation"
                fail=1
              fi

              # ================= Claim 4: gVisor availability =======================
              # Namespaced checks (no cluster RBAC). Read each runner SandboxTemplate
              # class first; an empty class is a mismatch, not a skip. Then schedule
              # a throwaway pod under the runtimeclass: admission tells us if it
              # exists, and the kernel string tells us if it is enforced.
              check_runner_sandbox_template_class() {
                if [ -z "${REQUIRED_RUNTIME_CLASS:-}" ]; then
                  return 0
                fi
                local name got
                for name in ${RUNNER_TEMPLATES}; do
                  got="$(kubectl get sandboxtemplate "$name" -n "$NS" -o jsonpath='{.spec.podTemplate.spec.runtimeClassName}' 2>/dev/null || true)"
                  if [ "$got" != "$REQUIRED_RUNTIME_CLASS" ]; then
                    echo "FAIL: SandboxTemplate ${name} runtimeClassName is '${got}', want '${REQUIRED_RUNTIME_CLASS}'"
                    fail=1
                  fi
                done
                return 0
              }
              echo ""
              echo "== Claim 4: gVisor RuntimeClass =="
              check_runner_sandbox_template_class
              if [ -z "$RC" ]; then
                echo "SKIP: security.gvisor.mode is off (kernel isolation disabled)."
              else
                gpod="sp-gvisor-check"
                kubectl delete pod "$gpod" -n "$NS" --ignore-not-found >/dev/null 2>&1 || true
                admit=$(kubectl run "$gpod" -n "$NS" --image="$BUSYBOX" --restart=Never \
                  --overrides="{\"spec\":{\"runtimeClassName\":\"${RC}\"}}" \
                  --command -- sh -c 'uname -a; sleep 3' 2>&1 || true)
                if echo "$admit" | grep -qi 'not found'; then
                  echo "NOT-TESTABLE: RuntimeClass '${RC}' absent on this cluster (admission: RuntimeClass"
                  echo "  not found). Reported, not faked (PT-3 discipline). gVisor kernel isolation was"
                  echo "  proven live in PT-3 (uname=4.19.0-gvisor); reinstall runsc to re-verify here."
                else
                  kubectl wait --for=jsonpath='{.status.phase}'=Succeeded "pod/$gpod" -n "$NS" --timeout=30s >/dev/null 2>&1 || \
                    kubectl wait --for=condition=Ready "pod/$gpod" -n "$NS" --timeout=30s >/dev/null 2>&1 || true
                  gkernel=$(kubectl logs "$gpod" -n "$NS" 2>/dev/null || true)
                  kubectl delete pod "$gpod" -n "$NS" --ignore-not-found >/dev/null 2>&1 || true
                  if echo "$gkernel" | grep -qi gvisor; then
                    echo "PASS: pod under RuntimeClass '${RC}' reports a gVisor kernel: ${gkernel}"
                  else
                    echo "FAIL: RuntimeClass '${RC}' exists but the pod kernel is NOT gVisor (downgraded"
                    echo "  to runc?). kernel=${gkernel}"
                    fail=1
                  fi
                fi
              fi

              # ================= Claim 5: data-tier ingress isolation ===============
              # Prove the data-tier rail: a pod carrying THIS release's app labels
              # can reach each deployed store's port (positive control), while a pod
              # with no app labels is blocked (the isolation the rail enforces).
              echo ""
              echo "== Claim 5: data-tier ingress isolation (default-deny + scoped-allow) =="
              if [ -n "$POSTGRES_BYO_TARGET" ]; then
                echo "SKIP: postgres.deploy is false; Claim 5 does not probe in-cluster Postgres. BYO ${POSTGRES_BYO_TARGET} is outside the cluster and has no data-tier ingress rail."
              fi
              if [ -z "$DATATIER_TARGETS" ]; then
                echo "SKIP: data-tier NetworkPolicy rail disabled or no in-chart store deployed"
              else
                kubectl run "$DT_ALLOWED_POD" -n "$NS" --image="$NETSHOOT" --restart=Never \
                  --labels="$DT_ALLOWED_LABELS" --command -- sleep 3600 >/dev/null
                kubectl run "$DT_DENIED_POD" -n "$NS" --image="$NETSHOOT" --restart=Never \
                  --labels="$DT_DENIED_LABELS" --command -- sleep 3600 >/dev/null
                kubectl wait --for=condition=Ready "pod/$DT_ALLOWED_POD" -n "$NS" --timeout=120s >/dev/null
                kubectl wait --for=condition=Ready "pod/$DT_DENIED_POD" -n "$NS" --timeout=120s >/dev/null

                dt_reach() { # $1=pod $2=host $3=port -> prints reachable|blocked
                  rc=$(kubectl exec -n "$NS" "$1" -- sh -c "nc -z -w5 $2 $3 >/dev/null 2>&1; echo rc=\$?" 2>/dev/null | sed -n 's/.*rc=//p')
                  [ "$rc" = 0 ] && echo reachable || echo blocked
                }

                dt_fail=0
                for target in $DATATIER_TARGETS; do
                  host=${target%:*}
                  port=${target##*:}
                  allowed=$(dt_reach "$DT_ALLOWED_POD" "$host" "$port")
                  denied=$(dt_reach "$DT_DENIED_POD" "$host" "$port")
                  echo "${target} allowed->${allowed} denied->${denied}"
                  if [ "$allowed" != reachable ] || [ "$denied" != blocked ]; then
                    echo "RESULT: FAIL - ${target}: allowed=${allowed} (want reachable) denied=${denied} (want blocked)"
                    echo "        (allowed=blocked => rail misconfigured; denied=reachable => isolation breach"
                    echo "         OR a non-enforcing CNI silently no-oping the policy.)"
                    dt_fail=1
                    fail=1
                  fi
                done
                kubectl delete pod "$DT_ALLOWED_POD" "$DT_DENIED_POD" -n "$NS" --ignore-not-found >/dev/null 2>&1 || true
                if [ "$dt_fail" = 0 ]; then
                  echo "RESULT: PASS - release app pods reach the data tier; non-app pods are blocked."
                fi
              fi

              echo ""
              echo "== Claim 3 (non-root + read-only rootfs) runs as the separate hardening test pod =="
              echo ""
              cleanup
              trap - EXIT
              [ "$fail" = 0 ] && echo "SECURITY PROBE: PASS" || echo "SECURITY PROBE: FAIL"
              exit $fail
{{- end }}
