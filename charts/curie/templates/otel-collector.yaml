{{- if .Values.otelCollector.deploy }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "curie.fullname" . }}-otel-collector
  labels:
    {{- include "curie.labels" . | nindent 4 }}
data:
  collector-config.yaml: |
{{ include "curie.otelCollector.config" . | indent 4 }}
{{- if .Values.otelCollector.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "curie.fullname" . }}-otel-collector
  labels:
    {{- include "curie.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
spec:
  accessModes:
    {{- toYaml .Values.otelCollector.persistence.accessModes | nindent 4 }}
  {{- with .Values.otelCollector.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.otelCollector.persistence.size }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "curie.fullname" . }}-otel-collector
  labels:
    {{- include "curie.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "curie.selectorLabels" (dict "root" . "component" "otel-collector") | nindent 4 }}
  ports:
    - name: otlp-grpc
      port: {{ .Values.otelCollector.service.grpcPort }}
      targetPort: 4317
    - name: otlp-http
      port: {{ .Values.otelCollector.service.httpPort }}
      targetPort: 4318
    - name: metrics
      port: {{ .Values.otelCollector.service.metricsPort }}
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "curie.fullname" . }}-otel-collector
  labels:
    {{- include "curie.labels" . | nindent 4 }}
spec:
  replicas: 1
  {{- if .Values.otelCollector.persistence.enabled }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "curie.selectorLabels" (dict "root" . "component" "otel-collector") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ printf "%s|%s" (include "curie.otelCollector.config" .) (include "curie.otlpAuthHeader" .) | sha256sum }}
      labels:
        {{- include "curie.labels" . | nindent 8 }}
        {{- include "curie.selectorLabels" (dict "root" . "component" "otel-collector") | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.otelCollector.terminationGracePeriodSeconds }}
      {{- with .Values.otelCollector.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "curie.fullname" . }}-otel-collector
        - name: storage
          {{- if .Values.otelCollector.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "curie.fullname" . }}-otel-collector
          {{- else }}
          emptyDir:
            sizeLimit: {{ .Values.otelCollector.persistence.size }}
          {{- end }}
      containers:
        - name: otel-collector
          image: {{ .Values.otelCollector.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          {{- with .Values.otelCollector.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args: ["--config=/etc/otel/collector-config.yaml"]
          env:
            - name: LANGFUSE_OTLP_AUTH_HEADER
              valueFrom:
                secretKeyRef:
                  name: {{ include "curie.otlpAuthHeaderSecretName" . }}
                  key: otlpAuthHeader
            {{- with .Values.otelCollector.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: health
              containerPort: 13133
            - name: metrics
              containerPort: {{ .Values.otelCollector.service.metricsPort }}
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.otelCollector.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/otel
              readOnly: true
            - name: storage
              mountPath: {{ .Values.otelCollector.persistence.mountPath }}
              readOnly: false
{{- end }}
