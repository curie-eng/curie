{{/*
Runner-image prewarm DaemonSet.

WHY THIS EXISTS: a sandbox pod is cold-created per Slack THREAD, so the runner
image's pullPolicy is IfNotPresent (see agentSandbox.runner.imagePullPolicy) --
`Always` would drop a ~380MB (re-)pull of a churned `latest` inside the
per-thread boot window, which once blew past the worker's 90s claim timeout and
killed the run. This DaemonSet keeps that image pulled and pinned on every node
so those cold boots bind an already-present image instantly.

The same window runs the bundle-fetch and bundle-extract init containers
(agentSandbox.runner.bundleFetch.fetchImage / extractImage). Those refs are
IfNotPresent on the claim path (global.imagePullPolicy) and are not the runner
image, so a DaemonSet that pins only curie-runner still leaves a fresh or
image-GCed node to cold-pull ~418MB of amazon/aws-cli on the first claim. When
bundleFetch.enabled is true this DaemonSet therefore also sleeps one extra
container per bundle-fetch image, sourced from the same values keys the
sandbox init pair uses.

An agent that layers its own runner image (agentSandbox.runnerImages,
ADR-0173) boots from that digest instead, so this DaemonSet also sleeps one
container per distinct layered digest that differs from the platform image.

It is a long-idle DaemonSet, not a one-shot Job, on purpose:
  - DaemonSet covers every node (single-node clusters get exactly one pod).
  - The kubelet treats the image as in-use, so image GC never evicts it between
    threads.
  - Each container just `sleep infinity`s at near-zero cost -- the pinned image is
    the point, not the process.

ROLL-TO-REFRESH: with a mutable `latest` tag the pod spec does not change when
only the remote digest churns, so a plain DaemonSet would never re-pull. The
Release-revision annotation on the pod template changes on every `helm upgrade`,
which rolls the pods; imagePullPolicy Always on this container then fetches the
fresh `latest`. That is the whole cache-refresh mechanism.
*/}}
{{- if and .Values.agentSandbox.deploy .Values.agentSandbox.runner.prewarm.enabled }}
{{- $runner := .Values.agentSandbox.runner }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "curie.fullname" . }}-runner-prewarm
  labels:
    {{- include "curie.labels" . | nindent 4 }}
    app.kubernetes.io/component: runner-prewarm
spec:
  selector:
    matchLabels:
      {{- include "curie.selectorLabels" (dict "root" . "component" "runner-prewarm") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- with (include "curie.placement.labels" (dict "root" $ "class" "sandbox")) }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- include "curie.labels" . | nindent 8 }}
        {{- include "curie.selectorLabels" (dict "root" . "component" "runner-prewarm") | nindent 8 }}
      annotations:
        {{- with (include "curie.placement.annotations" (dict "root" $ "class" "sandbox")) }}
        {{- . | nindent 8 }}
        {{- end }}
        # Rolls the prewarm pods on every `helm upgrade` so imagePullPolicy Always
        # re-pulls a churned `latest` (a digest-only change does not otherwise
        # alter the pod spec). See the file header.
        curietech.ai/prewarm-revision: {{ .Release.Revision | quote }}
    spec:
      {{- with (include "curie.placement.spec" (dict "root" $ "class" "sandbox")) }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- with $runner.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: prewarm
          image: {{ include "curie.image" (dict "repository" $runner.image "tag" $runner.tag "digest" $runner.digest "defaultTag" $.Chart.AppVersion) | quote }}
          # Always (the default) so the roll above re-pulls the pinned ref (and
          # picks up a moved tag on the rare cluster that still overrides tag back
          # to a mutable one); on an immutable digest/version pin it is a no-op.
          # Overridable via agentSandbox.runner.prewarm.imagePullPolicy for an
          # offline cluster whose runner image was imported into the node store
          # (kind/k3s) rather than published, where `Always` would ErrImagePull a
          # registry-less ref that is already present locally.
          imagePullPolicy: {{ $runner.prewarm.imagePullPolicy }}
          command: ["sleep", "infinity"]
          resources:
            {{- toYaml $runner.prewarm.resources | nindent 12 }}
        {{- /* One container per distinct layered runner digest, named for the
               first agent (sorted) that carries it. */}}
        {{- $platformImage := include "curie.image" (dict "repository" $runner.image "tag" $runner.tag "digest" $runner.digest "defaultTag" $.Chart.AppVersion) }}
        {{- $runnerImages := .Values.agentSandbox.runnerImages | default dict }}
        {{- $seen := list $platformImage }}
        {{- range $agent := keys $runnerImages | sortAlpha }}
        {{- $ref := toString (index $runnerImages $agent) }}
        {{- if not (has $ref $seen) }}
        {{- $seen = append $seen $ref }}
        - name: prewarm-agent-{{ $agent }}
          image: {{ $ref | quote }}
          imagePullPolicy: {{ $runner.prewarm.imagePullPolicy }}
          command: ["sleep", "infinity"]
          resources:
            {{- toYaml $runner.prewarm.resources | nindent 12 }}
        {{- end }}
        {{- end }}
        {{- if $runner.bundleFetch.enabled }}
        # Same values keys as the sandbox init pair in agent-sandbox.yaml -- a
        # hardcoded ref here would drift from the claim path the first time an
        # operator overrides fetchImage or extractImage.
        #
        # Pull policy is global.imagePullPolicy (IfNotPresent), NOT
        # prewarm.imagePullPolicy. Cluster CI and the kind/k3s import path set
        # the latter to Never and only kind-load first-party images; applying
        # Never here would ErrImageNeverPull amazon/aws-cli and busybox and
        # the DaemonSet would never become Ready. IfNotPresent still pulls
        # those registry images on a fresh node (the point of this sidecar)
        # without re-pulling ~418MB on every helm upgrade roll.
        - name: prewarm-bundle-fetch
          image: {{ $runner.bundleFetch.fetchImage | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["sleep", "infinity"]
          resources:
            {{- toYaml $runner.prewarm.resources | nindent 12 }}
        - name: prewarm-bundle-extract
          image: {{ $runner.bundleFetch.extractImage | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["sleep", "infinity"]
          resources:
            {{- toYaml $runner.prewarm.resources | nindent 12 }}
        {{- end }}
{{- end }}
