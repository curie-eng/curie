{{- $resumeReconcilerGrace := include "curie.api.resumeReconciler.grace" . -}}
{{- if .Values.api.deploy }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "curie.fullname" . }}-api
  labels:
    {{- include "curie.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  selector:
    {{- include "curie.selectorLabels" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: 8000
      {{- if and (eq .Values.api.service.type "NodePort") .Values.api.service.nodePort }}
      nodePort: {{ .Values.api.service.nodePort }}
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "curie.fullname" . }}-api
  labels:
    {{- include "curie.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "curie.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- with (include "curie.placement.labels" (dict "root" $ "class" "platform")) }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- include "curie.labels" . | nindent 8 }}
        {{- include "curie.selectorLabels" (dict "root" . "component" "api") | nindent 8 }}
      {{- with (include "curie.placement.annotations" (dict "root" $ "class" "platform")) }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
    spec:
      {{- with (include "curie.placement.spec" (dict "root" $ "class" "platform")) }}
      {{- . | nindent 6 }}
      {{- end }}
      # The runner-logs proxy lists pods and reads pod logs via the K8s API, so
      # the API pod runs as its own ServiceAccount (see api-rbac.yaml).
      serviceAccountName: {{ include "curie.fullname" . }}-api
      {{- with .Values.priorityClasses.platform.name }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.api.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.api.migrate.enabled }}
      # Wait for the upgrade Job / install migrate phase to bring the schema
      # to a revision this image can serve. This init never runs Alembic:
      # applying migrations in every API pod is what made patch rollback
      # refuse an additive newer revision (#2300).
      initContainers:
        - name: schema-wait
          image: {{ include "curie.image" (dict "repository" .Values.api.image.repository "tag" .Values.api.image.tag "digest" .Values.api.image.digest "defaultTag" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          {{- with .Values.api.containerSecurityContext }}
          {{- include "curie.containerSecurityContext" . | nindent 10 }}
          {{- end }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              attempt=1
              max_attempts=60
              probe_error_class=""
              while [ "$attempt" -le "$max_attempts" ]; do
                if probe_error_class=$(python -c '
              import asyncio
              import os

              try:
                  import asyncpg

                  async def probe():
                      database_url = os.environ["DATABASE_URL"].replace(
                          "postgresql+asyncpg://", "postgresql://", 1
                      )
                      connection = await asyncpg.connect(database_url, timeout=2)
                      await connection.close()

                  asyncio.run(probe())
              except Exception as error:
                  print(type(error).__name__)
                  raise SystemExit(1)
              ' 2>/dev/null); then
                  if python -c 'import curie_api.schema_compat' >/dev/null 2>&1; then
                    exec python -m curie_api.schema_compat wait
                  fi
                  # Image predates #2300 (retained digest on helm upgrade).
                  # Do not run Alembic here: that is the rollback defect.
                  exit 0
                fi
                if [ "$attempt" -eq 1 ]; then
                  echo "Waiting for Postgres readiness"
                fi
                if [ "$attempt" -lt "$max_attempts" ]; then
                  sleep 2
                fi
                attempt=$((attempt + 1))
              done
              echo "Postgres unavailable after $max_attempts readiness attempts; final probe error class: $probe_error_class; exiting for init container restart" >&2
              exit 1
          env:
            {{- include "curie.env.postgres" . | nindent 12 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "curie.image" (dict "repository" .Values.api.image.repository "tag" .Values.api.image.tag "digest" .Values.api.image.digest "defaultTag" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          {{- with .Values.api.containerSecurityContext }}
          {{- include "curie.containerSecurityContext" . | nindent 10 }}
          {{- end }}
          env:
            {{- include "curie.env.postgres" . | nindent 12 }}
            {{- include "curie.env.valkey" . | nindent 12 }}
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "curie.secretName" . }}
                  key: apiKey
            - name: CURIE_APPROVAL_CHAT_ATTESTER_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "curie.secretName" . }}
                  key: approvalChatAttesterSecret
            - name: CURIE_INTERNAL_WORKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "curie.secretName" . }}
                  key: internalWorkerToken
            - name: CURIE_PUBLICATION_PATCH_MAX_BYTES
              value: {{ .Values.worker.publication.patchMaxBytes | quote }}
            - name: CURIE_PUBLICATION_RETENTION_SECONDS
              value: {{ .Values.worker.publication.retentionSeconds | quote }}
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "curie.secretName" . }}
                  key: githubWebhookSecret
            - name: GITHUB_API_URL
              value: {{ .Values.api.githubApiUrl | quote }}
            # Outbound GitHub credential: the eval commit status AND the
            # git-flow bundle clone, without which a private repo cannot
            # deploy (#1058).
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  {{- /* BYO (issue #1759, same idiom as GITHUB_APP_PRIVATE_KEY
                         below): the token never passes through helm values on
                         this path. */}}
                  {{- include "curie.secretRef" (dict "root" . "existingSecret" .Values.api.githubTokenExistingSecret "existingSecretKey" .Values.api.githubTokenExistingSecretKey "defaultKey" "githubToken") | nindent 18 }}
            - name: GITHUB_REPO_ALLOWLIST
              value: {{ .Values.api.githubRepoAllowlist | toJson | quote }}
            {{- include "curie.env.otel" (dict "root" . "extraEnv" .Values.api.extraEnv) | nindent 12 }}
            # GitHub App identity (ADR-0092). When both are set the platform
            # mints a one-hour token scoped to the single repository it is
            # cloning, instead of using GITHUB_TOKEN above. Both empty is fine:
            # public repositories clone with no credential.
            - name: GITHUB_APP_ID
              value: {{ if .Values.api.githubAppId }}{{ .Values.api.githubAppId | int64 | quote }}{{ else }}""{{ end }}
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  {{- /* BYO: the key never passes through helm values, so it
                         is not copied into every retained release revision and
                         `helm get values` cannot print it. Create the Secret
                         with kubectl, External Secrets, or Sealed Secrets. */}}
                  {{- if .Values.api.githubAppExistingSecret }}
                  name: {{ .Values.api.githubAppExistingSecret | quote }}
                  key: {{ .Values.api.githubAppExistingSecretKey | quote }}
                  {{- else }}
                  name: {{ include "curie.secretName" . }}
                  key: githubAppPrivateKey
                  {{- end }}
            # Without this the service's own INFO records go nowhere (#1270):
            # uvicorn configures only its own loggers, so curie_api sits at
            # WARNING with no handler.
            - name: LOG_LEVEL
              value: {{ .Values.api.logLevel | quote }}
            - name: ENVIRONMENT
              value: {{ .Values.api.environment | quote }}
            - name: ORG_NAME
              value: {{ .Values.api.orgName | quote }}
            - name: COMMIT_POLL_INTERVAL_S
              value: {{ .Values.api.commitPollIntervalSeconds | quote }}
            - name: GITHUB_CLONE_BASE
              value: {{ .Values.api.githubCloneBase | quote }}
            - name: LANGFUSE_HOST
              value: {{ include "curie.langfuse.url" . }}
            - name: LANGFUSE_PUBLIC_KEY
              value: {{ .Values.langfuse.init.projectPublicKey | quote }}
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.langfuse.existingSecret | default (include "curie.secretName" .) }}
                  key: langfuseInitProjectSecretKey
            - name: S3_ENDPOINT_URL
              value: {{ include "curie.rustfs.endpoint" . }}
            {{- if include "curie.rustfs.staticCredentials" . }}
            - name: S3_ACCESS_KEY
              value: {{ .Values.rustfs.auth.accessKey | quote }}
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.rustfs.existingSecret | default (include "curie.secretName" .) }}
                  key: rustfsSecretKey
            {{- end }}
            # Immutable plugin-bundle bucket. Single source of truth with the
            # runner sandbox's bundle-fetch init container: the API writes each
            # uploaded bundle here, the fetcher reads it from the same bucket, so
            # an operator override of bundleFetch.bucket keeps them in lockstep.
            - name: BUNDLE_BUCKET
              value: {{ .Values.agentSandbox.runner.bundleFetch.bucket | quote }}
            # Resume reconciler (#411) knobs; see values.yaml api.resumeReconciler.
            # ENABLED false also switches the resolve endpoint to fail-loud on
            # enqueue failure (no backstop to defer to).
            - name: RESUME_RECONCILER_ENABLED
              value: {{ .Values.api.resumeReconciler.enabled | quote }}
            - name: RESUME_RECONCILER_INTERVAL_SECONDS
              value: {{ .Values.api.resumeReconciler.intervalSeconds | quote }}
            - name: RESUME_RECONCILER_GRACE_SECONDS
              value: {{ $resumeReconcilerGrace | quote }}
            - name: RESUME_RECONCILER_BATCH_LIMIT
              value: {{ .Values.api.resumeReconciler.batchLimit | quote }}
            # Slack bot token for the approval user-group authorizer (#420): the
            # API resolves usergroups.users.list itself rather than trusting a
            # caller-asserted membership claim (ADR-0034). Same shared secret
            # reference dispatcher.yaml and worker.yaml resolve (issue #1759,
            # curie.secretRef), so the three cannot drift apart.
            # Rendered unconditionally; a declared approver group with no token
            # then fails closed at resolve time, which is the intended posture.
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  {{- include "curie.secretRef" (dict "root" . "existingSecret" .Values.dispatcher.slack.botTokenExistingSecret "existingSecretKey" .Values.dispatcher.slack.botTokenExistingSecretKey "defaultKey" "slackBotToken") | nindent 18 }}
            # Expiry sweeper cadence (#412). Rendered unconditionally, not behind
            # an optional-value guard, because the disable value 0 is falsy in Go
            # templates and would be silently dropped, leaving the app default
            # instead of disabling. <= 0 disables the sweeper.
            - name: APPROVAL_SWEEP_INTERVAL_S
              value: {{ .Values.api.approvalSweepIntervalSeconds | quote }}
            # How long a fetched user-group member set is reused (#420). Rendered
            # unconditionally for the same reason as the sweeper above: 0 is the
            # meaningful strict-mode value (fetch per resolve) and is falsy in Go
            # templates, so an optional-value guard would silently drop exactly
            # the setting an operator is trying to make.
            - name: SLACK_USERGROUP_CACHE_TTL_S
              value: {{ .Values.api.slackUsergroupCacheTtlSeconds | quote }}
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 6
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
{{- end }}
