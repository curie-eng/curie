{{- if .Values.valkey.deploy }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "curie.fullname" . }}-valkey
  labels:
    {{- include "curie.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "curie.selectorLabels" (dict "root" . "component" "valkey") | nindent 4 }}
  ports:
    - name: valkey
      port: {{ .Values.valkey.port }}
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "curie.fullname" . }}-valkey
  labels:
    {{- include "curie.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "curie.fullname" . }}-valkey
  replicas: 1
  selector:
    matchLabels:
      {{- include "curie.selectorLabels" (dict "root" . "component" "valkey") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- with (include "curie.placement.labels" (dict "root" $ "class" "data")) }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- include "curie.statefulPodLabels" . | nindent 8 }}
        {{- include "curie.selectorLabels" (dict "root" . "component" "valkey") | nindent 8 }}
      {{- with (include "curie.placement.annotations" (dict "root" $ "class" "data")) }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
    spec:
      {{- with (include "curie.placement.spec" (dict "root" $ "class" "data")) }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- with .Values.priorityClasses.platform.name }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        fsGroup: 999
      {{- if not .Values.valkey.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
      containers:
        - name: valkey
          image: {{ .Values.valkey.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          {{- with .Values.valkey.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - sh
            - -c
            {{- /* #3350: an internal ceiling below the container limit makes a
                full broker refuse writes (OOM command not allowed) instead of
                being OOMKilled. noeviction is fixed: evicting stream or lock
                keys is worse than a refused write, and Langfuse BullMQ, which
                shares this Valkey, requires it. */}}
            {{- $maxmemory := toString (.Values.valkey.maxmemory | default "") }}
            {{- if and $maxmemory (not (regexMatch "^[0-9]+([kKmMgG][bB]?)?$" $maxmemory)) }}
            {{- fail (printf "valkey.maxmemory %q is not a Valkey size (bytes or a k/kb/m/mb/g/gb suffix) (#3350)" $maxmemory) }}
            {{- end }}
            {{- if and (eq $maxmemory "") .Values.valkey.resources.limits.memory }}
            {{- $limit := include "curie.capacity.memBytes" .Values.valkey.resources.limits.memory | int64 }}
            {{- $maxmemory = toString (div (mul $limit 3) 4) }}
            {{- end }}
            - exec valkey-server --dir /data --requirepass "$VALKEY_PASSWORD"{{ if $maxmemory }} --maxmemory {{ $maxmemory }}{{ end }} --maxmemory-policy noeviction --appendonly yes --appendfsync everysec
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "curie.storeSecretName" (dict "root" . "store" .Values.valkey) }}
                  key: valkeyPassword
          ports:
            - name: valkey
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["sh", "-c", "valkey-cli -a \"$VALKEY_PASSWORD\" ping | grep -q PONG"]
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "valkey-cli -a \"$VALKEY_PASSWORD\" ping | grep -q PONG"]
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.valkey.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
  {{- if .Values.valkey.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.global.storageClass }}
        storageClassName: {{ .Values.global.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.valkey.persistence.size }}
  {{- end }}
{{- end }}
