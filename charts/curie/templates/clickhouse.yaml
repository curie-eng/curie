{{- if .Values.clickhouse.deploy }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "curie.fullname" . }}-clickhouse-config
  labels:
    {{- include "curie.labels" . | nindent 4 }}
data:
  # Overlay merged over the image's config.xml. `config.d/` is already how the
  # official image layers its own settings (docker_related_config.xml), so this
  # needs no image change and no entrypoint override.
  #
  # Why this file exists at all: stock ClickHouse config is sized for a
  # dedicated analytics box, and here it is an embedded store holding kilobytes
  # of Langfuse traces. Left alone it logs at `trace` and keeps 30 days of its
  # own telemetry, which grows until a merge exceeds the memory limit and wedges
  # into an infinite retry. See the clickhouse block in values.yaml for the
  # measured numbers.
  curie-logging.xml: |
{{ include "curie.clickhouse.loggingConfig" . | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "curie.fullname" . }}-clickhouse
  labels:
    {{- include "curie.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "curie.selectorLabels" (dict "root" . "component" "clickhouse") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.clickhouse.httpPort }}
      targetPort: 8123
    - name: native
      port: {{ .Values.clickhouse.nativePort }}
      targetPort: 9000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "curie.fullname" . }}-clickhouse
  labels:
    {{- include "curie.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "curie.fullname" . }}-clickhouse
  replicas: 1
  selector:
    matchLabels:
      {{- include "curie.selectorLabels" (dict "root" . "component" "clickhouse") | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with (include "curie.placement.annotations" (dict "root" $ "class" "data")) }}
        {{- . | nindent 8 }}
        {{- end }}
        # Roll the pod when the rendered logging overlay changes. Without this a
        # ConfigMap edit renders a new ConfigMap and the
        # running server keeps the old config until something else restarts it
        # -- i.e. the fix would appear applied while the node kept starving.
        checksum/config: {{ include "curie.clickhouse.loggingConfig" . | sha256sum }}
      labels:
        {{- with (include "curie.placement.labels" (dict "root" $ "class" "data")) }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- include "curie.statefulPodLabels" . | nindent 8 }}
        {{- include "curie.selectorLabels" (dict "root" . "component" "clickhouse") | nindent 8 }}
    spec:
      {{- with (include "curie.placement.spec" (dict "root" $ "class" "data")) }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- with .Values.priorityClasses.platform.name }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        fsGroup: {{ .Values.clickhouse.podSecurityContext.fsGroup }}
      volumes:
        - name: config
          configMap:
            name: {{ include "curie.fullname" . }}-clickhouse-config
        {{- if not .Values.clickhouse.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
      containers:
        - name: clickhouse
          # Pinned tag (coupled to langfuse.image.tag); the AVX preflight
          # validates it against the node's CPU. clickhouse.image.digest wins
          # over the tag when set (#2332).
          image: {{ include "curie.image" (dict "repository" .Values.clickhouse.image.repository "tag" .Values.clickhouse.image.tag "digest" .Values.clickhouse.image.digest) | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          {{- with .Values.clickhouse.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: CLICKHOUSE_USER
              value: {{ .Values.clickhouse.auth.username | quote }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.clickhouse.existingSecret | default (include "curie.secretName" .) }}
                  key: clickhousePassword
          ports:
            - name: http
              containerPort: 8123
            - name: native
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /ping
              port: 8123
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /ping
              port: 8123
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.clickhouse.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            # subPath, so this lands beside the image's own
            # docker_related_config.xml instead of replacing the directory.
            - name: config
              mountPath: /etc/clickhouse-server/config.d/curie-logging.xml
              subPath: curie-logging.xml
              readOnly: true
  {{- if .Values.clickhouse.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.global.storageClass }}
        storageClassName: {{ .Values.global.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.clickhouse.persistence.size }}
  {{- end }}
{{- end }}
