{{- if and .Values.agentSandbox.deploy .Values.agentSandbox.runner.serviceAccount.create }}
{{/*
Rail 2 (secret isolation), part 1: the runner ServiceAccount.

The release runner SA has no bound Role or RoleBinding, and its Kubernetes
API token is not mounted by default. Connector credentials are delivered as
secretKeyRef environment entries in each agent's SandboxTemplate, without
control plane created per agent Roles. A runner can inspect credentials
injected into its own process, including a configured shared model credential.
Claim 2 tests this delivery path through real claims and bound runners.

IRSA scope (#3842). NetworkPolicy selects pods, not containers, so the
prompt-injectable runner can use any role the bundle-fetch init container can.
The chart therefore refuses a runner `eks.amazonaws.com/role-arn` equal to the
api, worker, or langfuse one: those identities read and write object storage.
What is NOT enforced: the runner role's actual IAM policy (the chart cannot read
IAM), and EKS Pod Identity associations, which live outside the chart.
*/}}
{{- $roleKey := "eks.amazonaws.com/role-arn" }}
{{- $runnerRole := index (.Values.agentSandbox.runner.serviceAccount.annotations | default dict) $roleKey | default "" | toString }}
{{- if $runnerRole }}
{{- range $owner := list "api" "worker" "langfuse" }}
{{- $ownerRole := dig $owner "serviceAccount" "annotations" $roleKey "" $.Values.AsMap | toString }}
{{- if eq $runnerRole $ownerRole }}
{{- fail (printf "agentSandbox.runner.serviceAccount.annotations %s reuses the %s ServiceAccount role %q; the runner is prompt-injectable and can use any role its bundle-fetch init container can, so give it a separate read-only bundle-bucket role (#3842)" $roleKey $owner $runnerRole) }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "curie.fullname" . }}-runner
  labels:
    {{- include "curie.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-sandbox
  {{- with .Values.agentSandbox.runner.serviceAccount.annotations }}
  # Where a key-free object store binds the bundle-fetch identity (#1325): an
  # IRSA install annotates this SA with `eks.amazonaws.com/role-arn`. The
  # projected web-identity token is a separate volume from the SA's own API
  # token, so this composes with `automountToken: false` below. It does not
  # grant the runner a Kubernetes API identity.
  #
  # Scope this role to the bundle bucket, read-only. NetworkPolicy selects pods
  # and not containers, so any identity reachable by the bundle-fetch init
  # container is also reachable by the runner, which is prompt-injectable. The
  # render refuses a role ARN shared with the api, worker, or langfuse SA.
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- /* agent-sandbox.yaml refuses any automountToken other than false. */}}
automountServiceAccountToken: false
{{- end }}
