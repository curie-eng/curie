{{/* Tenant capacity ceiling, part 1: ResourceQuota (ADR-0059 decision 4, ADR-0008). In the N=1 topology sandboxes share the namespace with the control plane, so the PriorityClass scopeSelector limits every hard line to sandbox pods; never make this quota namespace-wide. No ephemeral-storage: a scoped quota may only list compute and pod-count resources and the API server rejects it at admission, which only a real apply sees (#692); the per-pod limit bounds disk (ADR-0059 decision 1). The scope DERIVES from priorityClasses.sandbox.name (decision 5, #759) so quota and pods cannot desynchronize (#1534, a silent fail-open); sandboxPriorityClassName overrides only for a class managed outside the chart. Not a scheduling guarantee (#2949): see resourceQuota in values.yaml and curie.sandboxCapacity in _capacity.tpl. */}}
{{- if and .Values.agentSandbox.deploy .Values.resourceQuota.enabled }}
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ include "curie.sandboxQuota.name" . }}
  labels:
    {{- include "curie.labels" . | nindent 4 }}
    app.kubernetes.io/component: tenant-capacity
spec:
  scopeSelector:
    matchExpressions:
      - operator: In
        scopeName: PriorityClass
        values:
          - {{ include "curie.sandboxQuota.priorityClass" . | quote }}
  # Only cpu/memory/pods: a PriorityClass-scoped quota cannot list
  # ephemeral-storage (see the header). Per-pod ephemeral limits x the pods cap
  # give the aggregate disk ceiling instead.
  hard:
    {{- include "curie.sandboxQuota.hard" . | fromJson | toYaml | nindent 4 }}
{{- end }}
