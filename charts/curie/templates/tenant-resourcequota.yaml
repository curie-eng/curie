{{/*
Tenant capacity ceiling, part 1: ResourceQuota (ADR-0059 decision 4).

ADR-0008 makes the namespace a reachability boundary (namespace-per-tenant
compute); this completes it with a capacity boundary. Nodes are shared beneath
the namespace, so without a namespace-level cap one tenant's sandboxes can
exhaust node cpu/memory/disk that another tenant's sandboxes depend on -- a
namespace alone does not stop that, because ResourceQuota is the object that
actually bounds aggregate consumption inside it.

Self-host wrinkle (ADR-0059 decision 4, and decision 5's PriorityClass): in the
N=1 topology this release's sandboxes share the release namespace with the
platform pods (api, worker, dispatcher, and the data tier). A plain
namespace-wide ResourceQuota would therefore bind the control plane and data
tier too -- exactly what `resourceQuota.enabled` must NOT do. `scopeSelector`
on the `PriorityClass` scope restricts every `hard` line in this object
(including the pod count) to pods carrying that priority class, so only sandbox
pods are counted and the control plane renders unconstrained by this quota.

Why no `ephemeral-storage` here (and why render tests could not catch its
absence being required): a ResourceQuota scoped by `PriorityClass` (like the
other pod scopes) may only constrain the compute + pod-count resources
Kubernetes allows for a pod scope -- `requests/limits.cpu`, `requests/limits.memory`,
and `pods`. `ephemeral-storage` is NOT in that set, so an API server REJECTS a
scoped quota that lists it ("unsupported scope applied to resource") at admission
-- a failure `helm template` and render-assertions never see, only a real apply
(the kind cluster rung, #692). The per-sandbox disk ceiling therefore lives on
the pod, not here: every sandbox container carries an `ephemeral-storage`
request+limit (ADR-0059 decision 1, plus the LimitRange default), and the
aggregate ceiling is that per-pod limit times the `pods` cap below. An UNSCOPED
ephemeral-storage quota is not an alternative -- it would force every control-plane
pod (which declares none) to be rejected, reintroducing the exact blast radius
the scopeSelector exists to avoid.

That priority class is the one decision 5 / issue #759 defines for sandbox
pods. This template does not depend on #759's chart objects or values existing
in this branch -- `scopeSelector` matches purely on the STRING name a pod's
`priorityClassName` resolves to, which Kubernetes does not validate against an
existing PriorityClass object at ResourceQuota-admission time. So this quota
renders and behaves correctly whether #759 has landed yet or not:
  - #759 not yet merged / no pod sets this priorityClassName: the scope simply
    matches no pods yet (an inert-but-present quota), never an error.
  - #759 merged with a DIFFERENT sandbox PriorityClass name: the scope now
    DERIVES from `priorityClasses.sandbox.name`, the same value
    agent-sandbox.yaml stamps on the sandbox pod template, so a rename
    propagates to both sides at once and cannot desynchronize them.

The derivation is the fix for a silent fail-open (#1534). The scope used to read
`resourceQuota.sandboxPriorityClassName` independently of the name the pods
actually carry, so renaming the PriorityClass -- without knowing to override a
second, differently-named value -- left the quota scoped to a class nothing
carried. Observed on a live install: a sandbox holding `limits.cpu: 1` running
while the quota reported `used: {limits.cpu: "0", pods: "0"}`, with the scoped
class absent from `kubectl get priorityclass` entirely. The whole tenant capacity
ceiling was inert, and it presented as healthy -- the object exists, and `used: 0`
reads as "nothing consumed" rather than "matching nothing".

`sandboxPriorityClassName` remains as an EXPLICIT override for the one case
deriving cannot serve: a PriorityClass managed outside this chart
(`priorityClasses.sandbox.create: false`) whose name differs from
`priorityClasses.sandbox.name`. Left unset -- the default -- it derives, which is
what every in-chart install wants. Setting it is now a deliberate act rather than
a silent prerequisite nobody knew about.

Not a scheduling guarantee (#2949): this object is rendered from values alone
and bounds admission, not placement. A ceiling above node allocatable admits
sandboxes that stay Pending. See the arithmetic and the two refusal signatures
at `resourceQuota` in values.yaml; NOTES.txt (curie.sandboxCapacity in
_capacity.tpl) compares the ceiling to live node capacity at install time.
*/}}
{{- if and .Values.agentSandbox.deploy .Values.resourceQuota.enabled }}
{{- $rq := .Values.resourceQuota }}
{{/*
  Derive from the name the sandbox pods actually carry. An explicit
  `sandboxPriorityClassName` still wins, for an externally-managed class.
*/}}
{{- $sandboxPriorityClass := $rq.sandboxPriorityClassName | default .Values.priorityClasses.sandbox.name }}
{{- if not $sandboxPriorityClass }}
{{- fail "resourceQuota.enabled is true but no sandbox PriorityClass name resolves: set priorityClasses.sandbox.name, or resourceQuota.sandboxPriorityClassName for an externally-managed class. A quota scoped to an empty name matches no pods and silently enforces nothing." }}
{{- end }}
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ include "curie.fullname" . }}-sandbox-quota
  labels:
    {{- include "curie.labels" . | nindent 4 }}
    app.kubernetes.io/component: tenant-capacity
spec:
  scopeSelector:
    matchExpressions:
      - operator: In
        scopeName: PriorityClass
        values:
          - {{ $sandboxPriorityClass | quote }}
  # Only cpu/memory/pods: a PriorityClass-scoped quota cannot list
  # ephemeral-storage (see the header). Per-pod ephemeral limits x the pods cap
  # give the aggregate disk ceiling instead.
  hard:
    requests.cpu: {{ $rq.hard.requestsCpu | quote }}
    requests.memory: {{ $rq.hard.requestsMemory | quote }}
    limits.cpu: {{ $rq.hard.limitsCpu | quote }}
    limits.memory: {{ $rq.hard.limitsMemory | quote }}
    # Scoped by the same scopeSelector, so this bounds sandbox pod COUNT, not
    # every pod in the namespace -- a tenant cannot route around the
    # cpu/memory ceiling above by simply claiming more, smaller sandboxes.
    pods: {{ $rq.hard.sandboxPodCount | quote }}
{{- end }}
