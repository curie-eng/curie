{{- if include "curie.dispatcher.enabled" . }}
{{- $apiPreflightTimeout := float64 .Values.dispatcher.apiPreflightTimeoutSeconds -}}
{{- $startupInitialDelay := float64 .Values.dispatcher.startupProbe.initialDelaySeconds -}}
{{- $startupPeriod := float64 .Values.dispatcher.startupProbe.periodSeconds -}}
{{- $startupFailureThreshold := float64 .Values.dispatcher.startupProbe.failureThreshold -}}
{{- $startupFailureCutoff := addf $startupInitialDelay (mulf (subf $startupFailureThreshold 1.0) $startupPeriod) -}}
{{- $startupApplicationBudget := addf (mulf $apiPreflightTimeout 2.0) 2.0 -}}
{{- if le $startupFailureCutoff $startupApplicationBudget -}}
{{- fail (printf "dispatcher.apiPreflightTimeoutSeconds (%g) gives a maximum application startup envelope of %g seconds (API health budget + fresh discovery/Slack budget + the final bounded 2-second Slack call), which must be less than the startupProbe earliest failure cutoff (%g seconds = %g + (%g - 1) * %g). Raise dispatcher.startupProbe.initialDelaySeconds, dispatcher.startupProbe.periodSeconds, or dispatcher.startupProbe.failureThreshold, or lower dispatcher.apiPreflightTimeoutSeconds." $apiPreflightTimeout $startupApplicationBudget $startupFailureCutoff $startupInitialDelay $startupFailureThreshold $startupPeriod) -}}
{{- end -}}
{{/*
The dispatcher runs Slack in Socket Mode: it dials Slack outbound over a
websocket, so there is no inbound port and therefore no Service and no HTTP
probe. It deploys only when the Slack identity `default` has both tokens
(see curie.dispatcher.enabled); a token-less default install skips it
entirely rather than crash-looping the reconnect supervisor, and
NOTES.txt prints the `helm upgrade` command to connect Slack later.
*/}}
{{- $threadedReserved := dict -}}
{{- $threadedBotAllowlist := "" -}}
{{- if $.Values.dispatcher.threadedBotAllowlist -}}
{{- /* Validate typed entries before extraEnv rejects duplicate names, so a
malformed allowlist still reports its invalid field first. */ -}}
{{- $threadedBotAllowlist = include "curie.dispatcher.threadedBotAllowlist" $ -}}
{{- $threadedReserved = dict "CURIE_SLACK_THREADED_BOT_ALLOWLIST" "dispatcher.threadedBotAllowlist" -}}
{{- end -}}
{{- $httpReceiver := include "curie.httpIdentity.receiverSecret" . -}}
{{- $checksumExtraEnv := include "curie.extraEnv" (dict "root" . "workload" "dispatcher" "env" .Values.dispatcher.extraEnv "additionalReserved" (merge $threadedReserved (include "curie.slack.reservedEnv" (dict "root" . "workload" "dispatcher") | fromJson))) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "curie.fullname" . }}-dispatcher
  labels:
    {{- include "curie.labels" . | nindent 4 }}
    app.kubernetes.io/component: dispatcher
spec:
  replicas: {{ .Values.dispatcher.replicas }}
  # Recreate, not RollingUpdate: each pod holds a Socket Mode connection per
  # Slack app token and Slack hands an event to only one connected client, so a
  # surge pod would split events with a terminating one (issue #2944). The old
  # pod exits before the new one starts; see dispatcher.replicas in values.yaml.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "curie.selectorLabels" (dict "root" . "component" "dispatcher") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- with (include "curie.placement.labels" (dict "root" $ "class" "platform")) }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- include "curie.labels" . | nindent 8 }}
        {{- include "curie.selectorLabels" (dict "root" . "component" "dispatcher") | nindent 8 }}
      {{- $placementAnnotations := include "curie.placement.annotations" (dict "root" $ "class" "platform") }}
      {{- $secretChecksum := include "curie.secretChecksum" (dict
        "root" $
        "keys" (list "approvalChatAttesterSecret")
        "refs" (list)
        "env" (printf "%s\n%s\n%s\n%s\n%s" (include "curie.env.valkey" $) (include "curie.env.api" $) (include "curie.env.slack" (dict "root" $ "workload" "dispatcher")) (include "curie.env.otel" (dict "root" $ "extraEnv" $.Values.dispatcher.extraEnv)) $checksumExtraEnv)) }}
      {{- if or $placementAnnotations $secretChecksum }}
      annotations:
        {{- with $placementAnnotations }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- with $secretChecksum }}
        checksum/secret: {{ . }}
        {{- end }}
      {{- end }}
    spec:
      {{- with (include "curie.placement.spec" (dict "root" $ "class" "platform")) }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- with .Values.priorityClasses.platform.name }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.dispatcher.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $httpReceiver }}
      # The dispatcher runs as gid 1000: fsGroup reads the 0440 receiver file.
      securityContext:
        fsGroup: 1000
      {{- end }}
      containers:
        - name: dispatcher
          image: {{ include "curie.image" (dict "repository" .Values.dispatcher.image.repository "tag" .Values.dispatcher.image.tag "digest" .Values.dispatcher.image.digest "defaultTag" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.dispatcher.image.pullPolicy }}
          {{- with .Values.dispatcher.containerSecurityContext }}
          {{- include "curie.containerSecurityContext" . | nindent 10 }}
          {{- end }}
          env:
            {{- include "curie.env.valkey" . | nindent 12 }}
            # Every Slack identity's tokens, from the one helper api.yaml and
            # worker.yaml also render (curie.env.slack), so the three cannot
            # drift apart. BYO references never pass through helm values (#1759).
            {{- include "curie.env.slack" (dict "root" . "workload" "dispatcher") | trim | nindent 12 }}
            {{- include "curie.env.api" . | nindent 12 }}
            - name: CURIE_API_PREFLIGHT_TIMEOUT_SECONDS
              value: {{ .Values.dispatcher.apiPreflightTimeoutSeconds | quote }}
            # Independent HMAC credential for Slack click identity/channel
            # attestation. The platform API key authenticates API calls but is
            # intentionally unable to forge this evidence.
            - name: CURIE_APPROVAL_CHAT_ATTESTER_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "curie.secretName" . }}
                  key: approvalChatAttesterSecret
            {{- include "curie.env.otel" (dict "root" . "extraEnv" .Values.dispatcher.extraEnv) | nindent 12 }}
            # Heartbeat file a background daemon thread in the dispatcher touches
            # each tick; the exec probes below read this same path so template and
            # app cannot drift.
            - name: CURIE_HEARTBEAT_FILE
              value: /tmp/curie-dispatcher.heartbeat
            # The test installation declaration (ADR 0202 decision 1), from the
            # helpers api.yaml renders it with. The dispatcher refuses to boot
            # on a published default secret while it is on, and its Slack
            # preflight keeps each driver identity to its own agent.
            - name: CURIE_TEST_INSTALLATION_ENABLED
              value: {{ include "curie.testInstallation.enabled" . | quote }}
            - name: CURIE_TEST_INSTALLATION_DRIVERS
              value: {{ include "curie.testInstallation.drivers" . | quote }}
            - name: CURIE_TEST_INSTALLATION_THREAD_TURN_LIMIT
              value: {{ include "curie.testInstallation.threadTurnLimit" . | quote }}
            {{- if .Values.dispatcher.threadedBotAllowlist }}
            # First-class allowlist (#2437). Rendered ONLY when the typed value is
            # non-empty; the chart then owns the name for this render, so the
            # #2297 guard below refuses a dispatcher.extraEnv entry that also
            # names it. An empty value renders nothing and reserves nothing, so a
            # pre-existing extraEnv entry keeps working unchanged.
            - name: CURIE_SLACK_THREADED_BOT_ALLOWLIST
              value: {{ $threadedBotAllowlist | quote }}
            {{- end }}
            {{- if $httpReceiver }}
            # Selected HTTP receivers (HTTP-INVOCATION-EXECUTION-20).
            - name: CURIE_HTTP_RECEIVER_DIR
              value: /var/run/curie/http-receiver
            {{- end }}
            {{- $checksumExtraEnv | nindent 12 }}
          # No HTTP port on the dispatcher (Slack Socket Mode is outbound-only),
          # so an exec probe checks a heartbeat file a background daemon thread
          # touches each tick. The dispatcher blocks the main thread in
          # supervisor.run(), so a wedged/hung process stops touching the file ->
          # it goes stale -> the probe fails -> restart.
          # startupProbe suppresses readiness/liveness until all bounded boot preflights complete.
          startupProbe:
            exec:
              command:
                - python
                - -c
                - |
                  import os, sys, time
                  p = os.environ["CURIE_HEARTBEAT_FILE"]
                  sys.exit(0 if os.path.exists(p) and time.time() - os.path.getmtime(p) < 30 else 1)
            initialDelaySeconds: {{ .Values.dispatcher.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.dispatcher.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.dispatcher.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.dispatcher.startupProbe.failureThreshold }}
          {{- include "curie.heartbeatProbes" . | nindent 10 }}
          resources:
            {{- toYaml .Values.dispatcher.resources | nindent 12 }}
          {{- if $httpReceiver }}
          volumeMounts:
            - name: http-receiver
              mountPath: /var/run/curie/http-receiver
              readOnly: true
          {{- end }}
      {{- if $httpReceiver }}
      volumes:
        {{- include "curie.httpIdentity.volume" (dict "name" "http-receiver" "secret" $httpReceiver "files" (list "receivers.json")) | nindent 8 }}
      {{- end }}
{{- end }}
