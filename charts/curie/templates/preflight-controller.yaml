{{- if and .Values.agentSandbox.controller.deploy .Values.preflights.controllerReady.enabled }}
{{/*
Preflight (c): controller-ready install-time gate (issue #350, ADR-0023).

The vendored agent-sandbox controller runs a CLUSTER-scope NetworkPolicy
informer; if its RBAC cannot satisfy that cluster LIST, the manager crash-loops
and no SandboxClaim ever binds. The vendored Deployment has NO readiness probe,
so `rollout status` passes while the manager still blocks on cache sync -- the
gate first rejects a forbidden-NetworkPolicy line in the current log, then
accepts a stable serving leader (below), then rejects observed RBAC/lease
failures and pod restarts, and finally requires the "Starting workers" log line
or positive successful-reconcile metrics from the current Running controller
pod. This post-install/post-upgrade hook Job fails the Helm operation unless the
controller reaches one of those states, so an RBAC regression fails at install.

Stable serving leader (issue #4197): the controller Deployment has completed
its rollout for its current generation, the leader-election Lease names a
current Running, Ready, non-terminating controller pod, its renewTime advances
while the hook watches, and that same holder has led continuously for at least
preflights.controllerReady.stableLeaderSeconds. A controller-runtime manager
whose caches cannot sync exits after CacheSyncTimeout (2 minutes by default,
not overridden by agent-sandbox v0.5.0), which ends its leadership; the next
process takes a new holder identity and a new acquireTime. So a holder that has
led longer than that bound has synced, without needing a startup log line that
only a restart produces. Both lease timestamps are written by the controller,
so the hold duration does not depend on the hook node's clock.

The gate is read-only: its Role can only get/list/watch deployments + pods, get
pod logs + pod proxy metrics, and get the controller's one leader-election
Lease in agent-sandbox-system. Gated on agentSandbox.controller.deploy so it
never runs against a BYO controller this release does not own.
*/}}
{{- /* Defaulted here, not only in values.yaml: `helm upgrade --reuse-values`
renders these templates against the PREVIOUS chart's values, which predate
this key (#3813). */}}
{{- $stableLeaderSeconds := 180 }}
{{- if not (kindIs "invalid" .Values.preflights.controllerReady.stableLeaderSeconds) }}
{{- $stableLeaderSeconds = int .Values.preflights.controllerReady.stableLeaderSeconds }}
{{- end }}
{{- if lt $stableLeaderSeconds 150 }}
{{- fail (printf "preflights.controllerReady.stableLeaderSeconds must be at least 150 (the controller's 120s cache-sync timeout plus lease and scheduling margin); got %d" $stableLeaderSeconds) }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "curie.fullname" . }}-preflight-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "curie.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade,test
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "curie.fullname" . }}-preflight-controller
  namespace: agent-sandbox-system
  labels:
    {{- include "curie.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade,test
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/proxy"]
    verbs: ["get"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["a3317529.agent-sandbox.x-k8s.io"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "curie.fullname" . }}-preflight-controller
  namespace: agent-sandbox-system
  labels:
    {{- include "curie.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade,test
    "helm.sh/hook-weight": "-4"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "curie.fullname" . }}-preflight-controller
subjects:
  - kind: ServiceAccount
    name: {{ include "curie.fullname" . }}-preflight-controller
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "curie.fullname" . }}-preflight-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "curie.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade,test
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        {{- with (include "curie.placement.labels" (dict "root" $ "class" "hooks")) }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- include "curie.labels" . | nindent 8 }}
        {{- include "curie.selectorLabels" (dict "root" . "component" "preflight-controller") | nindent 8 }}
      {{- with (include "curie.placement.annotations" (dict "root" $ "class" "hooks")) }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
    spec:
      {{- with (include "curie.placement.spec" (dict "root" $ "class" "hooks")) }}
      {{- . | nindent 6 }}
      {{- end }}
      serviceAccountName: {{ include "curie.fullname" . }}-preflight-controller
      restartPolicy: Never
      {{- with .Values.priorityClasses.platform.name }}
      priorityClassName: {{ . }}
      {{- end }}
      containers:
        - name: controller-ready
          image: {{ .Values.preflights.controllerReady.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: CONTROLLER_NS
              value: "agent-sandbox-system"
            - name: DEPLOY
              value: "agent-sandbox-controller"
            # The vendored controller's fixed LeaderElectionID; leader
            # election auto-detects the pod's own namespace. Upstream:
            # kubernetes-sigs/agent-sandbox v0.5.0
            # cmd/agent-sandbox-controller/main.go.
            - name: LEASE
              value: "a3317529.agent-sandbox.x-k8s.io"
            - name: TIMEOUT
              value: {{ .Values.preflights.controllerReady.timeoutSeconds | quote }}
            - name: STABLE_LEADER_SECONDS
              value: {{ $stableLeaderSeconds | quote }}
          command:
            - /bin/sh
            - -c
            - |
              set -u
              # Short fixed budget for the preliminary rollout-status check,
              # deliberately much smaller than ${TIMEOUT}. It caps the total
              # wall-clock at ~ROLLOUT_TIMEOUT + TIMEOUT (~210s) so the Job stays
              # safely under Helm's default 300s install/upgrade hook timeout and
              # its FAIL diagnostic always prints -- even on Pending /
              # ImagePullBackOff paths where the controller never becomes
              # Available -- instead of Helm killing the Job generically first.
              ROLLOUT_TIMEOUT=30
              echo "== Curie controller-ready preflight =="
              echo "controller: deployment/${DEPLOY}  namespace: ${CONTROLLER_NS}  timeout: ${TIMEOUT}s"

              # Existence/schedule check only, bounded by the short
              # ROLLOUT_TIMEOUT (not ${TIMEOUT}). The vendored Deployment has NO
              # readiness probe (D2), so a passing rollout is NOT proof the
              # informer caches synced -- this rc is informative only; the poll
              # loop below (bounded by ${TIMEOUT}) is the real gate.
              kubectl rollout status "deployment/${DEPLOY}" -n "${CONTROLLER_NS}" \
                --timeout="${ROLLOUT_TIMEOUT}s" 2>/dev/null
              rc=$?
              echo "rollout status rc=${rc} (informative only)"

              # Seconds between two RFC 3339 UTC timestamps as Kubernetes
              # serializes them (MicroTime is always UTC with a "Z" suffix).
              # Pure awk arithmetic, so it behaves the same under busybox,
              # mawk and gawk; prints -1 for anything it cannot parse.
              seconds_between() {
                printf '%s %s\n' "$1" "$2" | awk '
                  function epoch(ts,   y, m, d, era, yoe, mp, doy, doe) {
                    if (ts !~ /^[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]T[0-9][0-9]:[0-9][0-9]:[0-9][0-9](\.[0-9]+)?Z$/) return -1
                    y = substr(ts, 1, 4) + 0; m = substr(ts, 6, 2) + 0; d = substr(ts, 9, 2) + 0
                    if (m <= 2) y -= 1
                    era = int(y / 400); yoe = y - era * 400
                    mp = (m + 9) % 12
                    doy = int((153 * mp + 2) / 5) + d - 1
                    doe = yoe * 365 + int(yoe / 4) - int(yoe / 100) + doy
                    return ((era * 146097 + doe - 719468) * 86400) + substr(ts, 12, 2) * 3600 + substr(ts, 15, 2) * 60 + substr(ts, 18, 2)
                  }
                  { a = epoch($1); b = epoch($2); if (a < 0 || b < 0) print -1; else print b - a }
                '
              }

              # Stable serving leader (issue #4197). An upgrade that does not
              # restart the controller produces no fresh startup log line, so
              # judge the controller as it is now: its rollout is complete, the
              # leader Lease names a current Running, Ready, non-terminating
              # pod, the same holder has led for at least STABLE_LEADER_SECONDS
              # -- longer than the 120s CacheSyncTimeout after which a manager
              # whose informers cannot sync exits, ending its leadership (the
              # next process gets a new holder identity and acquireTime) --
              # and it renews the Lease while we watch, so a stale record left
              # by a dead process cannot pass. Every missing or unparsable
              # field fails closed to "not proven".
              read_lease() {
                kubectl get lease "${LEASE}" -n "${CONTROLLER_NS}" \
                  -o jsonpath='{.spec.holderIdentity} {.spec.acquireTime} {.spec.renewTime}' \
                  2>/dev/null
              }
              leader_detail=""
              stable_leader() {
                deploy_fields=$(kubectl get deployment "${DEPLOY}" -n "${CONTROLLER_NS}" \
                  -o jsonpath='{.metadata.generation} {.status.observedGeneration} {.spec.replicas} {.status.replicas} {.status.updatedReplicas} {.status.readyReplicas} {.status.availableReplicas}' \
                  2>/dev/null) || return 1
                # shellcheck disable=SC2086
                set -- ${deploy_fields}
                [ "$#" -eq 7 ] || return 1
                [ "$1" = "$2" ] && [ "$3" -ge 1 ] 2>/dev/null \
                  && [ "$4" = "$3" ] && [ "$5" = "$3" ] && [ "$6" = "$3" ] && [ "$7" = "$3" ] \
                  || return 1

                lease_fields=$(read_lease) || return 1
                # shellcheck disable=SC2086
                set -- ${lease_fields}
                [ "$#" -eq 3 ] || return 1
                holder=$1
                acquired=$2
                renewed=$3
                # controller-runtime names the holder <hostname>_<uuid>; a pod
                # name cannot contain "_", so the prefix is the pod name.
                case "${holder}" in
                  *_*) holder_pod=${holder%%_*} ;;
                  *) return 1 ;;
                esac

                pod_fields=$(kubectl get pods -n "${CONTROLLER_NS}" -l app=agent-sandbox-controller \
                  -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.status.phase}{" "}{.status.conditions[?(@.type=="Ready")].status}{" "}{.metadata.deletionTimestamp}{"\n"}{end}' \
                  2>/dev/null) || return 1
                printf '%s\n' "${pod_fields}" | awk -v pod="${holder_pod}" '
                  $1 == pod && $2 == "Running" && $3 == "True" && NF == 3 { found = 1 }
                  END { exit !found }
                ' || return 1

                held=$(seconds_between "${acquired}" "${renewed}")
                [ "${held}" -ge "${STABLE_LEADER_SECONDS}" ] 2>/dev/null || return 1

                # controller-runtime renews every 2s (RetryPeriod); one wait
                # longer than that must show the same holder renewing. The
                # wait counts against TIMEOUT so the Job stays inside Helm's
                # hook timeout.
                sleep 5
                elapsed=$(( elapsed + 5 ))
                lease_fields=$(read_lease) || return 1
                # shellcheck disable=SC2086
                set -- ${lease_fields}
                [ "$#" -eq 3 ] && [ "$1" = "${holder}" ] && [ "$2" = "${acquired}" ] \
                  && [ "$3" != "${renewed}" ] || return 1
                renewal_advance=$(seconds_between "${renewed}" "$3")
                [ "${renewal_advance}" -gt 0 ] 2>/dev/null || return 1
                held=$(seconds_between "${acquired}" "$3")
                [ "${held}" -ge "${STABLE_LEADER_SECONDS}" ] 2>/dev/null || return 1

                leader_detail="pod ${holder_pod} has held lease ${LEASE} for ${held}s (>= ${STABLE_LEADER_SECONDS}s) and is renewing it"
                return 0
              }

              # Poll failure signals before accepting "Starting workers" or
              # positive successful-reconcile metrics, which both require
              # synced informer caches. The counter survives startup-log
              # rotation. A restart is NOT diagnostic on its own: the #350
              # crash-loop (RBAC) and a leader-election lease timeout (#507) both
              # restart the pod, so classify the CAUSE from the logs instead of
              # blaming NetworkPolicy RBAC unconditionally.
              cause=unknown
              elapsed=0
              while [ "${elapsed}" -lt "${TIMEOUT}" ]; do
                logs=$(kubectl logs "deployment/${DEPLOY}" -n "${CONTROLLER_NS}" --tail=-1 2>/dev/null || true)

                # The current container's own forbidden-networkpolicies line is
                # the #350 RBAC signature and outranks every success signal.
                if printf '%s\n' "${logs}" | grep -Eq "networkpolicies.*[Ff]orbidden"; then
                  cause=rbac
                  echo "detected controller failure (forbidden networkpolicies log)."
                  break
                fi

                # A leader that has served past the cache-sync bound has synced
                # since any earlier restart, so this is checked before restart
                # history (an old restart or its previous log is not current
                # state). A controller restarted by this upgrade holds a fresh
                # lease and falls through to the checks below.
                if stable_leader; then
                  echo "RESULT: PASS -- agent-sandbox-controller rollout complete and serving: ${leader_detail}."
                  exit 0
                fi

                restarts=$(kubectl get pods -n "${CONTROLLER_NS}" -l app=agent-sandbox-controller \
                  -o jsonpath='{.items[*].status.containerStatuses[*].restartCount}' 2>/dev/null || true)
                restarted=0
                for r in ${restarts}; do
                  if [ "${r}" -gt 0 ] 2>/dev/null; then
                    restarted=1
                  fi
                done

                # A previous container's logs only exist once the pod has
                # restarted, so only fetch --previous then -- skips a wasted
                # kubectl call every poll on the healthy path.
                prev=""
                if [ "${restarted}" -eq 1 ]; then
                  prev=$(kubectl logs "deployment/${DEPLOY}" -n "${CONTROLLER_NS}" --tail=-1 --previous 2>/dev/null || true)
                fi

                # Classify by the actual log signal, most-specific first. The
                # forbidden-networkpolicies line is the #350 RBAC signature; a
                # leader-election lease loss is the #507 signature (the manager
                # exits and the pod restarts, but RBAC is fine).
                #
                # Join the two logs with a NEWLINE: command substitution strips
                # trailing newlines, so a bare "${logs}${prev}" glues the last
                # line of one onto the first line of the other and can fabricate
                # a signature that appears in NEITHER log (issue #611).
                if printf '%s\n%s' "${logs}" "${prev}" | grep -Eq "networkpolicies.*[Ff]orbidden"; then
                  cause=rbac
                  echo "detected controller failure (forbidden networkpolicies log)."
                  break
                elif printf '%s\n%s' "${logs}" "${prev}" | grep -Eq "leader election lost|failed to renew lease|error retrieving resource lock|timed out waiting for the condition.*lease"; then
                  cause=lease
                  echo "detected controller failure (leader-election lease not renewed)."
                  break
                elif [ "${restarted}" -eq 1 ]; then
                  cause=restart
                  echo "detected controller restart (restartCount>0) with no recognized failure signature."
                  break
                fi

                if echo "${logs}" | grep -q "Starting workers"; then
                  echo "RESULT: PASS -- agent-sandbox-controller Available and informer caches synced ('Starting workers' observed)."
                  exit 0
                fi

                # A current pod's successful reconciles prove cache sync even
                # when its startup log has rotated away. Select the first
                # Running controller pod and discard stdout from failed proxy
                # requests so partial metrics cannot establish health.
                pod=$(kubectl get pods -n "${CONTROLLER_NS}" -l app=agent-sandbox-controller \
                  --field-selector=status.phase=Running \
                  -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
                metrics=""
                if [ -n "${pod}" ]; then
                  metrics=$(kubectl get --raw "/api/v1/namespaces/${CONTROLLER_NS}/pods/${pod}:8080/proxy/metrics" \
                    2>/dev/null) || metrics=""
                fi
                if printf '%s\n' "${metrics}" | awk '
                  $1 ~ /^controller_runtime_reconcile_total[{].*[}]$/ &&
                  $1 ~ /[,{]result="success"[,}]/ { successful += $2 }
                  END { exit !(successful > 0) }
                '; then
                  echo "RESULT: PASS -- agent-sandbox-controller informer caches synced (positive controller_runtime_reconcile_total result=success observed)."
                  exit 0
                fi

                sleep 5
                elapsed=$(( elapsed + 5 ))
              done

              echo "---"
              echo "FAIL diagnostic: last controller log lines:"
              kubectl logs "deployment/${DEPLOY}" -n "${CONTROLLER_NS}" --tail=40 2>/dev/null || true
              echo "---"
              echo "controller pod status:"
              kubectl get pods -n "${CONTROLLER_NS}" -l app=agent-sandbox-controller 2>/dev/null || true
              echo "---"
              echo "controller leader Lease (holder acquireTime renewTime):"
              read_lease || true
              echo
              echo "---"
              case "${cause}" in
                rbac)
                  echo "RESULT: FAIL -- controller did not reach 'Starting workers' -- its NetworkPolicy"
                  echo "        informer cannot sync (forbidden-networkpolicies logged). Verify ClusterRole"
                  echo "        agent-sandbox-controller-networkpolicies-read exists and grants"
                  echo "        get/list/watch on networkpolicies cluster-wide (issue #350 / ADR-0023)."
                  echo "        If this is an upgrade over a previously crash-looping controller, the"
                  echo "        pod may still be in CrashLoopBackOff backoff -- delete the controller"
                  echo "        pod and re-run 'helm test <release>'."
                  ;;
                lease)
                  echo "RESULT: FAIL -- controller lost its leader-election lease before syncing (issue #507)."
                  echo "        This is NOT an RBAC/NetworkPolicy problem -- the lease could not be renewed"
                  echo "        in time, typically under API-server saturation or a too-tight lease deadline."
                  echo "        Retry once the API server is healthy; if it recurs, loosen the controller's"
                  echo "        leader-election lease/renew deadlines."
                  ;;
                *)
                  echo "RESULT: FAIL -- controller showed no 'Starting workers', no successful reconcile and no"
                  echo "        stable serving leader within ${TIMEOUT}s, and no recognized failure signature"
                  echo "        (forbidden-networkpolicies or lease loss) was logged. Inspect the controller"
                  echo "        log lines, pod status and leader Lease above for the cause."
                  echo "        If this is an upgrade over a previously crash-looping controller, the"
                  echo "        pod may still be in CrashLoopBackOff backoff -- delete the controller"
                  echo "        pod and re-run 'helm test <release>'."
                  ;;
              esac
              exit 1
          resources:
            {{- toYaml .Values.preflights.controllerReady.resources | nindent 12 }}
{{- end }}
