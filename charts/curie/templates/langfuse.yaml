{{- $pgReadiness := fromYaml (include "curie.langfuse.postgresReadinessValues" .) -}}
{{- if .Values.langfuse.deploy }}
{{- if .Values.langfuse.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "curie.langfuse.serviceAccountName" . }}
  labels:
    {{- include "curie.labels" . | nindent 4 }}
    app.kubernetes.io/component: langfuse
  {{- with .Values.langfuse.serviceAccount.annotations }}
  # Where a key-free object store binds Langfuse's identity (#2211): an IRSA
  # install annotates this SA with `eks.amazonaws.com/role-arn`, and the
  # pod-identity webhook injects the projected token and the two web-identity
  # env vars. Both Langfuse Deployments share this account.
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Langfuse does not call the Kubernetes API. IRSA's projected web-identity
# token is a separate volume, so this composes with key-free object-store
# auth. Leaving automount at the Kubernetes default would mint a namespace
# API token the previous `default` ServiceAccount path did not need.
automountServiceAccountToken: false
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "curie.fullname" . }}-langfuse-web
  labels:
    {{- include "curie.labels" . | nindent 4 }}
spec:
  type: {{ .Values.langfuse.web.service.type }}
  selector:
    {{- include "curie.selectorLabels" (dict "root" . "component" "langfuse-web") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.langfuse.web.service.port }}
      targetPort: 3000
      {{- if and (eq .Values.langfuse.web.service.type "NodePort") .Values.langfuse.web.service.nodePort }}
      nodePort: {{ .Values.langfuse.web.service.nodePort }}
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "curie.fullname" . }}-langfuse-web
  labels:
    {{- include "curie.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Boot migrations (Prisma + ClickHouse) have no cross-process lock. Recreate
  # stops the old pod before the new one starts so two versions never migrate
  # the same database at once (#2216).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "curie.selectorLabels" (dict "root" . "component" "langfuse-web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- with (include "curie.placement.labels" (dict "root" $ "class" "platform")) }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- include "curie.labels" . | nindent 8 }}
        {{- include "curie.selectorLabels" (dict "root" . "component" "langfuse-web") | nindent 8 }}
      {{- with (include "curie.placement.annotations" (dict "root" $ "class" "platform")) }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
    spec:
      {{- with (include "curie.placement.spec" (dict "root" $ "class" "platform")) }}
      {{- . | nindent 6 }}
      {{- end }}
      serviceAccountName: {{ include "curie.langfuse.serviceAccountName" . }}
      {{- if or .Values.langfuse.clickhouseReadiness.enabled $pgReadiness.enabled }}
      initContainers:
      {{- if $pgReadiness.enabled }}
        {{- include "curie.langfuse.postgresGate" (dict
             "root" .
             "containerSecurityContext" .Values.langfuse.web.containerSecurityContext) | nindent 8 }}
      {{- end }}
      {{- if .Values.langfuse.clickhouseReadiness.enabled }}
        {{- include "curie.langfuse.clickhouseGate" (dict
             "root" .
             "image" (include "curie.image" (dict "repository" .Values.langfuse.image.web "tag" .Values.langfuse.image.tag "digest" .Values.langfuse.image.webDigest))
             "containerSecurityContext" .Values.langfuse.web.containerSecurityContext
             "resources" .Values.langfuse.web.resources) | nindent 8 }}
      {{- end }}
      {{- end }}
      containers:
        - name: langfuse-web
          image: {{ include "curie.image" (dict "repository" .Values.langfuse.image.web "tag" .Values.langfuse.image.tag "digest" .Values.langfuse.image.webDigest) | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          {{- with .Values.langfuse.web.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- include "curie.langfuse.env" . | nindent 12 }}
            {{- if .Values.langfuse.web.nodeOptions }}
            - name: NODE_OPTIONS
              value: {{ .Values.langfuse.web.nodeOptions | quote }}
            {{- end }}
            - name: NEXTAUTH_URL
              value: {{ .Values.langfuse.nextauthUrl | quote }}
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.langfuse.existingSecret | default (include "curie.secretName" .) }}
                  key: langfuseNextauthSecret
            # Headless bootstrap: fixed dev org/project + keys so the OTel path
            # authenticates on first boot with no manual key-minting.
            - name: LANGFUSE_INIT_ORG_ID
              value: {{ .Values.langfuse.init.orgId | quote }}
            - name: LANGFUSE_INIT_ORG_NAME
              value: {{ .Values.langfuse.init.orgName | quote }}
            - name: LANGFUSE_INIT_PROJECT_ID
              value: {{ .Values.langfuse.init.projectId | quote }}
            - name: LANGFUSE_INIT_PROJECT_NAME
              value: {{ .Values.langfuse.init.projectName | quote }}
            - name: LANGFUSE_INIT_PROJECT_PUBLIC_KEY
              value: {{ .Values.langfuse.init.projectPublicKey | quote }}
            - name: LANGFUSE_INIT_PROJECT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.langfuse.existingSecret | default (include "curie.secretName" .) }}
                  key: langfuseInitProjectSecretKey
            - name: LANGFUSE_INIT_USER_EMAIL
              value: {{ .Values.langfuse.init.userEmail | quote }}
            - name: LANGFUSE_INIT_USER_NAME
              value: {{ .Values.langfuse.init.userName | quote }}
            - name: LANGFUSE_INIT_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.langfuse.existingSecret | default (include "curie.secretName" .) }}
                  key: langfuseInitUserPassword
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/public/health
              port: 3000
            {{- toYaml .Values.langfuse.web.readinessProbe | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/public/health
              port: 3000
            {{- toYaml .Values.langfuse.web.livenessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.langfuse.web.resources | nindent 12 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "curie.fullname" . }}-langfuse-worker
  labels:
    {{- include "curie.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Same boot-migration race as langfuse-web (#2216): Recreate so an image
  # change never runs two worker pods against the same stores at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "curie.selectorLabels" (dict "root" . "component" "langfuse-worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- with (include "curie.placement.labels" (dict "root" $ "class" "platform")) }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- include "curie.labels" . | nindent 8 }}
        {{- include "curie.selectorLabels" (dict "root" . "component" "langfuse-worker") | nindent 8 }}
      {{- with (include "curie.placement.annotations" (dict "root" $ "class" "platform")) }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
    spec:
      {{- with (include "curie.placement.spec" (dict "root" $ "class" "platform")) }}
      {{- . | nindent 6 }}
      {{- end }}
      serviceAccountName: {{ include "curie.langfuse.serviceAccountName" . }}
      {{- if or .Values.langfuse.clickhouseReadiness.enabled $pgReadiness.enabled }}
      initContainers:
      {{- if $pgReadiness.enabled }}
        {{- include "curie.langfuse.postgresGate" (dict
             "root" .
             "containerSecurityContext" .Values.langfuse.worker.containerSecurityContext) | nindent 8 }}
      {{- end }}
      {{- if .Values.langfuse.clickhouseReadiness.enabled }}
        {{- include "curie.langfuse.clickhouseGate" (dict
             "root" .
             "image" (include "curie.image" (dict "repository" .Values.langfuse.image.worker "tag" .Values.langfuse.image.tag "digest" .Values.langfuse.image.workerDigest))
             "containerSecurityContext" .Values.langfuse.worker.containerSecurityContext
             "resources" .Values.langfuse.worker.resources) | nindent 8 }}
      {{- end }}
      {{- end }}
      containers:
        - name: langfuse-worker
          image: {{ include "curie.image" (dict "repository" .Values.langfuse.image.worker "tag" .Values.langfuse.image.tag "digest" .Values.langfuse.image.workerDigest) | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          {{- with .Values.langfuse.worker.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- include "curie.langfuse.env" . | nindent 12 }}
            {{- if .Values.langfuse.worker.nodeOptions }}
            - name: NODE_OPTIONS
              value: {{ .Values.langfuse.worker.nodeOptions | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 3030
          # Readiness is the SIGTERM-aware /api/ready (the worker image's only
          # endpoint that fails during shutdown, so a terminating pod drains).
          # Liveness is deliberately tcpSocket, NOT an HTTP path: both
          # /api/health and /api/ready run a Prisma `SELECT 1` and a Redis ping,
          # and this Deployment is replicas:1 + Recreate with Prisma/ClickHouse
          # migrations at container boot. Init containers do NOT re-run on a
          # liveness restart, so a store blip would restart the only replica
          # straight into those boot migrations against a sick Postgres -- the
          # exact P1001/BackOff class the wait-for-postgres gate exists to stop
          # (#71, #2330). Cadences for both probes come from
          # `langfuse.worker.readinessProbe` / `.livenessProbe` in values, as
          # langfuse-web's block above now does from `langfuse.web.*`: both
          # Deployments declare `timeoutSeconds` explicitly rather than taking
          # the kubelet's invisible 1s default, and on each container the
          # liveness failure cutoff must outlive the readiness one, pinned by
          # ci/probe-window-assertions.sh.
          readinessProbe:
            httpGet:
              path: /api/ready
              port: 3030
            {{- toYaml .Values.langfuse.worker.readinessProbe | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: 3030
            {{- toYaml .Values.langfuse.worker.livenessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.langfuse.worker.resources | nindent 12 }}
{{- end }}
