{{- if .Values.worker.deploy }}
{{- $warmPool := .Values.worker.warmPool | default (printf "%s-runner-pool" (include "curie.fullname" .)) }}
{{- $workspaceStageBudget := add .Values.worker.workspace.cloneTimeoutSeconds .Values.worker.workspace.archiveTimeoutSeconds .Values.worker.workspace.uploadTimeoutSeconds }}
{{- $publicationPullSecrets := list }}
{{- range .Values.agentSandbox.runner.imagePullSecrets }}
{{- $publicationPullSecrets = append $publicationPullSecrets .name }}
{{- end }}
{{- if gt (float64 $workspaceStageBudget) (float64 .Values.worker.workspace.totalTimeoutSeconds) }}
{{- fail "worker.workspace stage timeouts must sum to no more than totalTimeoutSeconds" }}
{{- end }}
{{/* ADR-0131: grace must cover deliveryBudget + deliveryShutdownReserve. Render
     time is the ONLY place this can fail usefully -- values.schema.json cannot
     express cross-field arithmetic, and the worker's own boot check raises
     before its supervisor exists, so a bad value that reaches a Pod is a
     CrashLoopBackOff after a green `helm upgrade`. */}}
{{- include "curie.worker.validateDrainBudget" . }}
{{/* A runner request ceiling above the overall delivery budget is internally
     inconsistent. Refuse it before creating a worker Pod; the worker boot
     validator remains the backstop outside Helm. */}}
{{- include "curie.worker.validateRunnerBudget" . }}
{{- if .Values.worker.serviceAccount.create }}
{{/*
The worker drives the Kubernetes API to claim and manage agent-sandbox custom
resources (the substrate's SandboxClient). It gets a namespaced Role scoped to
exactly the CRD verbs KubernetesSandboxClient uses -- SandboxClaims it
creates/reads/deletes/lists, Sandboxes it reads and patches (suspend/resume) --
and nothing else. RBAC does not require the CRDs to be installed for the Role to
apply, so this is valid even when agentSandbox.deploy is false.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "curie.fullname" . }}-worker
  labels:
    {{- include "curie.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
  {{- with .Values.worker.serviceAccount.annotations }}
  # Where a key-free object store binds its identity (#1325): an IRSA install
  # annotates this SA with `eks.amazonaws.com/role-arn`, and the pod-identity
  # webhook injects the projected token and the two web-identity env vars.
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "curie.fullname" . }}-worker
  labels:
    {{- include "curie.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
rules:
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "patch"]
{{- if .Values.worker.connectorReconciler.enabled }}
{{/*
ADR-0090: the connector reconciler converges each agent's connector objects
toward its in-force bundle. Exactly the four kinds a connector is made of --
the same list as CONNECTOR_KINDS in curie_worker/connector_k8s.py -- and
exactly the verbs the three-verb ConnectorClient calls:
  list_owned -> list            (scoped by the curie.dev/connector-owner label)
  apply      -> patch + create  (server-side apply)
  delete     -> delete
`create` is NOT redundant next to `patch`. A server-side apply of an object
that does not exist yet is authorized as a create, so a Role with only `patch`
lets the reconciler update existing connectors while failing to create any --
the first-run path, and the one most likely to be exercised. Verified with
`kubectl apply --server-side --as=<the worker SA>`, which is forbidden without
it. No `get` (nothing reads a single object), no cluster scope, no other kinds.

This is a genuine privilege increase over the CRD-only rules above -- it
includes delete on Secrets -- which is why it renders only when the reconciler
is actually enabled.
*/}}
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "list", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "secrets"]
    verbs: ["create", "list", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "list", "patch", "delete"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "curie.fullname" . }}-worker
  labels:
    {{- include "curie.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "curie.fullname" . }}-worker
subjects:
  - kind: ServiceAccount
    name: {{ include "curie.fullname" . }}-worker
    namespace: {{ .Release.Namespace }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "curie.fullname" . }}-worker
  labels:
    {{- include "curie.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "curie.selectorLabels" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with (include "curie.placement.annotations" (dict "root" $ "class" "platform")) }}
        {{- . | nindent 8 }}
        {{- end }}
        # Roll the workers when the per-adapter egress credentials change
        # (ADR-0096 D4.2). They arrive as env from the chart Secret, and env is
        # read once at boot, so a `helm upgrade` that rotates a compromised
        # adapter secret would otherwise leave every running worker presenting
        # the OLD one -- the operator has to choose between an outage and a
        # credential they believe they revoked. Same sha256sum-of-the-rendered-
        # value idiom as otel-collector.yaml and clickhouse.yaml. Scoped to this
        # value on purpose: annotating the whole Secret would restart the workers
        # on any unrelated credential change in it.
        #
        # Includes the existingSecret name/key (issue #1759), not just the
        # inline value: switching which BYO Secret or key is referenced is a
        # helm-values-visible credential-source change and must roll the
        # workers the same way changing the inline value does. It cannot
        # reach into a foreign Secret's CONTENT at render time, so rotating an
        # existingSecret's value in place while keeping the same name/key
        # still needs a manual rollout -- the same limitation every other
        # existingSecret-sourced credential in this chart already has (a
        # secretKeyRef env resolves once at pod start).
        checksum/adapter-credentials: {{ include "curie.adapterCredentialsChecksumSource" . | sha256sum }}
      labels:
        {{- with (include "curie.placement.labels" (dict "root" $ "class" "platform")) }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- include "curie.labels" . | nindent 8 }}
        {{- include "curie.selectorLabels" (dict "root" . "component" "worker") | nindent 8 }}
    spec:
      {{- with (include "curie.placement.spec" (dict "root" $ "class" "platform")) }}
      {{- . | nindent 6 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      {{- with .Values.worker.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.worker.serviceAccount.create }}
      serviceAccountName: {{ include "curie.fullname" . }}-worker
      {{- end }}
      {{- with .Values.priorityClasses.platform.name }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.worker.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $hasWorkerApiUrl := false }}
      {{- $hasWorkerApiKey := false }}
      {{- range .Values.worker.extraEnv }}
      {{- if eq .name "CURIE_API_URL" }}
      {{- $hasWorkerApiUrl = true }}
      {{- end }}
      {{- if eq .name "CURIE_API_KEY" }}
      {{- $hasWorkerApiKey = true }}
      {{- end }}
      {{- end }}
      containers:
        - name: worker
          image: {{ include "curie.image" (dict "repository" .Values.worker.image.repository "tag" .Values.worker.image.tag "digest" .Values.worker.image.digest "defaultTag" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          {{- with .Values.worker.containerSecurityContext }}
          {{- include "curie.containerSecurityContext" . | nindent 10 }}
          {{- end }}
          env:
            {{- include "curie.env.postgres" . | nindent 12 }}
            {{- include "curie.env.valkey" . | nindent 12 }}
            {{- if not $hasWorkerApiUrl }}
            {{- include "curie.env.apiUrl" . | nindent 12 }}
            {{- end }}
            {{- if not $hasWorkerApiKey }}
            {{- include "curie.env.apiKey" . | nindent 12 }}
            {{- end }}
            - name: CURIE_INTERNAL_WORKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "curie.secretName" . }}
                  key: internalWorkerToken
            - name: CURIE_WORKSPACE_ENABLED
              value: {{ .Values.agentSandbox.runner.workspace.enabled | quote }}
            - name: CURIE_WORKSPACE_MAX_CONCURRENT_CLONES
              value: {{ .Values.worker.workspace.maxConcurrentClones | quote }}
            - name: CURIE_WORKSPACE_CLONE_TIMEOUT_SECONDS
              value: {{ .Values.worker.workspace.cloneTimeoutSeconds | quote }}
            - name: CURIE_WORKSPACE_ARCHIVE_TIMEOUT_SECONDS
              value: {{ .Values.worker.workspace.archiveTimeoutSeconds | quote }}
            - name: CURIE_WORKSPACE_UPLOAD_TIMEOUT_SECONDS
              value: {{ .Values.worker.workspace.uploadTimeoutSeconds | quote }}
            - name: CURIE_WORKSPACE_TOTAL_TIMEOUT_SECONDS
              value: {{ .Values.worker.workspace.totalTimeoutSeconds | quote }}
            - name: CURIE_WORKSPACE_MAX_CHECKOUT_BYTES
              value: {{ .Values.worker.workspace.maxCheckoutBytes | int64 | quote }}
            - name: CURIE_WORKSPACE_MAX_ARCHIVE_BYTES
              value: {{ .Values.worker.workspace.maxArchiveBytes | int64 | quote }}
            - name: CURIE_WORKSPACE_MAX_MEMBERS
              value: {{ .Values.worker.workspace.maxMembers | quote }}
            - name: CURIE_WORKSPACE_MAX_COMPRESSION_RATIO
              value: {{ .Values.worker.workspace.maxCompressionRatio | quote }}
            - name: CURIE_WORKSPACE_REFERENCE_TTL_SECONDS
              value: {{ .Values.worker.workspace.referenceTtlSeconds | quote }}
            - name: CURIE_WORKSPACE_BUCKET
              value: {{ .Values.worker.workspace.bucket | quote }}
            - name: CURIE_WORKSPACE_SCRATCH_ROOT
              value: {{ printf "%s/worker" (trimSuffix "/" .Values.worker.workspace.mountPath) | quote }}
            - name: CURIE_PUBLICATION_ENABLED
              value: {{ .Values.worker.publication.enabled | quote }}
            - name: CURIE_PUBLICATION_NAMESPACE
              value: {{ include "curie.publicationNamespace" . | quote }}
            - name: CURIE_PUBLICATION_PATCH_MAX_BYTES
              value: {{ .Values.worker.publication.patchMaxBytes | quote }}
            - name: CURIE_PUBLICATION_RESULT_MAX_ATTEMPTS
              value: {{ .Values.worker.publication.resultMaxAttempts | quote }}
            - name: CURIE_PUBLICATION_RECONCILE_MAX_ATTEMPTS
              value: {{ .Values.worker.publication.reconcileMaxAttempts | quote }}
            - name: CURIE_PUBLICATION_JOB_ACTIVE_DEADLINE_SECONDS
              value: {{ .Values.worker.publication.jobActiveDeadlineSeconds | quote }}
            - name: CURIE_PUBLICATION_GIT_COMMAND_TIMEOUT_SECONDS
              value: {{ .Values.worker.publication.gitCommandTimeoutSeconds | quote }}
            - name: CURIE_PUBLICATION_GITHUB_API_URL
              value: {{ .Values.api.githubApiUrl | quote }}
            - name: CURIE_PUBLICATION_RECONCILE_INTERVAL_SECONDS
              value: {{ .Values.worker.publication.reconcileIntervalSeconds | quote }}
            - name: CURIE_PUBLICATION_LEASE_SECONDS
              value: {{ .Values.worker.publication.leaseSeconds | quote }}
            - name: CURIE_PUBLICATION_IMAGE_PULL_POLICY
              value: {{ .Values.agentSandbox.runner.imagePullPolicy | quote }}
            - name: CURIE_RUNNER_IMAGE
              value: {{ include "curie.image" (dict "repository" .Values.agentSandbox.runner.image "tag" .Values.agentSandbox.runner.tag "digest" .Values.agentSandbox.runner.digest "defaultTag" .Chart.AppVersion) | quote }}
            - name: CURIE_PUBLICATION_IMAGE_PULL_SECRETS
              value: {{ join "," $publicationPullSecrets | quote }}
            - name: CURIE_PUBLICATION_PRIORITY_CLASS_NAME
              value: {{ .Values.priorityClasses.platform.name | quote }}
            - name: CURIE_PUBLICATION_SERVICE_ACCOUNT_NAME
              value: {{ .Values.worker.publication.serviceAccountName | default (printf "%s-publication" (include "curie.fullname" .)) | quote }}
            - name: CURIE_PUBLICATION_OWNER_NAME
              value: {{ .Values.worker.publication.ownerName | default (printf "%s-publication-owner" (include "curie.fullname" .)) | quote }}
            - name: CURIE_PUBLICATION_GIT_USER_NAME
              value: {{ .Values.worker.publication.gitUserName | quote }}
            - name: CURIE_PUBLICATION_GIT_USER_EMAIL
              value: {{ .Values.worker.publication.gitUserEmail | quote }}
            - name: CURIE_PUBLICATION_CPU_REQUEST
              value: {{ .Values.worker.publication.resources.requests.cpu | quote }}
            - name: CURIE_PUBLICATION_CPU_LIMIT
              value: {{ .Values.worker.publication.resources.limits.cpu | quote }}
            - name: CURIE_PUBLICATION_MEMORY_REQUEST
              value: {{ .Values.worker.publication.resources.requests.memory | quote }}
            - name: CURIE_PUBLICATION_MEMORY_LIMIT
              value: {{ .Values.worker.publication.resources.limits.memory | quote }}
            - name: CURIE_PUBLICATION_EPHEMERAL_REQUEST
              value: {{ index .Values.worker.publication.resources.requests "ephemeral-storage" | quote }}
            - name: CURIE_PUBLICATION_EPHEMERAL_LIMIT
              value: {{ index .Values.worker.publication.resources.limits "ephemeral-storage" | quote }}
            # Same shared secret reference api.yaml and dispatcher.yaml resolve
            # (issue #1759, curie.secretRef), so the three cannot drift apart.
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  {{- include "curie.secretRef" (dict "root" . "existingSecret" .Values.dispatcher.slack.botTokenExistingSecret "existingSecretKey" .Values.dispatcher.slack.botTokenExistingSecretKey "defaultKey" "slackBotToken") | nindent 18 }}
            # The sealing keys (ADR-0094). The connector reconciler runs here,
            # so this is the only workload that needs to DECRYPT a sealed
            # value; nothing else in the release gets them. Both are optional:
            # empty means no sealed credential can be opened, which the
            # reconciler reports rather than working around.
            - name: CURIE_SEALING_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  {{- include "curie.secretRef" (dict "root" . "existingSecret" .Values.sealing.privateKeyExistingSecret "existingSecretKey" .Values.sealing.privateKeyExistingSecretKey "defaultKey" "sealingPrivateKey") | nindent 18 }}
            - name: CURIE_SEALING_PREVIOUS_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  {{- include "curie.secretRef" (dict "root" . "existingSecret" .Values.sealing.previousPrivateKeyExistingSecret "existingSecretKey" .Values.sealing.previousPrivateKeyExistingSecretKey "defaultKey" "sealingPreviousPrivateKey") | nindent 18 }}
            # Substrate wiring: which namespace to claim sandboxes in, the warm
            # pool to claim from, and the ACI port on each claimed sandbox.
            - name: CURIE_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            # The Helm release name, so the worker can tell the sandbox where
            # its hosted connectors live (ADR-0086, #1118). Connector object
            # names are `<release>-<agent>-mcp-<connector>`, and the release
            # name is knowable only here.
            - name: CURIE_RELEASE
              value: {{ .Release.Name | quote }}
{{- if .Values.worker.connectorReconciler.enabled }}
            # Connector reconciler (ADR-0090, #1184). It reuses CURIE_NAMESPACE
            # and CURIE_RELEASE above deliberately: the runner dials a connector
            # Service by the name those two produce, and the reconciler creates
            # it by the same name. Two separate settings could disagree, and the
            # symptom would be a connector that exists and an agent that cannot
            # reach it.
            - name: CURIE_CONNECTOR_RECONCILE
              value: "true"
            # The chart's nameOverride, which appears in the pod selector the
            # connector NetworkPolicy matches on. The worker cannot derive it.
            - name: CURIE_CONNECTOR_APP_NAME
              value: {{ include "curie.name" . | quote }}
            - name: CURIE_CONNECTOR_RECONCILE_INTERVAL_S
              value: {{ .Values.worker.connectorReconciler.intervalSeconds | quote }}
{{- end }}
            - name: LANGFUSE_HOST
              value: {{ include "curie.langfuse.url" . }}
            - name: LANGFUSE_PUBLIC_KEY
              value: {{ .Values.langfuse.init.projectPublicKey | quote }}
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.langfuse.existingSecret | default (include "curie.secretName" .) }}
                  key: langfuseInitProjectSecretKey
            - name: CURIE_WARM_POOL
              value: {{ $warmPool | quote }}
            - name: CURIE_RUNNER_PORT
              value: {{ .Values.agentSandbox.runner.port | quote }}
            # Heartbeat file the worker's asyncio loop touches each tick; the
            # exec probes below read this same path so template and app cannot
            # drift.
            - name: CURIE_HEARTBEAT_FILE
              value: /tmp/curie-worker.heartbeat
            # How long claim() waits for a cold sandbox to become ready before it
            # gives up. Must stay below the worker's per-thread lock TTL (120s).
            - name: CURIE_CLAIM_TIMEOUT_SECONDS
              value: {{ .Values.worker.claimTimeoutSeconds | quote }}
            # How long a thread pins its sandbox after its last message -- the
            # term that governs how many exist at once, and the one that used
            # to be unreachable while the deadline above was tunable (#1380).
            - name: CURIE_ROUTE_TTL_SECONDS
              value: {{ .Values.worker.routeTtlSeconds | quote }}
            - name: CURIE_SUSPENDED_ROUTE_TTL_SECONDS
              value: {{ .Values.worker.suspendedRouteTtlSeconds | quote }}
            # Delivery budget and ownership lease (ADR-0131, #1971). The
            # overall wall-clock deadline for one delivery -- claim, every
            # runner request, every retry backoff, reclaim, and terminal
            # cleanup.
            - name: CURIE_DELIVERY_BUDGET_S
              value: {{ .Values.worker.deliveryBudgetSeconds | quote }}
            # Per-request runner ceiling within the overall delivery budget.
            - name: CURIE_RUNNER_TOTAL_TIMEOUT_S
              value: {{ .Values.worker.runnerTotalTimeoutSeconds | quote }}
            # How long the renewable ownership lease lives before it is
            # considered expired and transferable to a new owner.
            - name: CURIE_DELIVERY_LEASE_TTL_S
              value: {{ .Values.worker.deliveryLeaseTtlSeconds | quote }}
            # How often the owner renews its lease and resets its PEL idle.
            - name: CURIE_DELIVERY_LEASE_HEARTBEAT_S
              value: {{ .Values.worker.deliveryLeaseHeartbeatSeconds | quote }}
            # Budget reserved for terminal settlement after the runner work is
            # done; terminationGracePeriodSeconds below must be at least the
            # delivery budget plus this reserve.
            - name: CURIE_DELIVERY_SHUTDOWN_RESERVE_S
              value: {{ .Values.worker.deliveryShutdownReserveSeconds | quote }}
            # The platform's own voluntary termination grace, injected from the
            # SAME value that renders onto this Pod's spec.terminationGracePeriodSeconds
            # (line ~145) so the worker's boot validator and the platform can
            # never disagree about how long a drain is allowed to take.
            - name: CURIE_TERMINATION_GRACE_PERIOD_S
              value: {{ .Values.worker.terminationGracePeriodSeconds | quote }}
            # Slack assistant-thread "shimmer" (#1182). Rendered on the WORKER
            # only: it both raises the caption and lowers it, so one value
            # governs the feature release-wide and the two halves cannot be
            # configured into disagreement (#1312). Deliberately absent from
            # templates/dispatcher.yaml -- that service no longer reads it.
            - name: CURIE_SHIMMER
              value: {{ .Values.worker.shimmer | quote }}
            - name: CURIE_STATUS_TEXT
              value: {{ .Values.worker.statusText | quote }}
            # Runner model passthrough: the worker injects these into every claim
            # (fake model needs no credential; a real credential comes from the
            # chart Secret and is only wired when one is configured).
            {{- $claimFakeModel := and .Values.agentSandbox.runner.fakeModel (not .Values.inference.deploy) }}
            - name: CURIE_FAKE_MODEL
              value: {{ ternary "1" "0" $claimFakeModel | quote }}
            {{- if or .Values.agentSandbox.runner.credentials .Values.agentSandbox.runner.credentialsExistingSecret }}
            # Same shared secret reference agent-sandbox.yaml resolves (issue
            # #1759, curie.secretRef), so the two cannot drift apart.
            - name: CURIE_CREDENTIALS
              valueFrom:
                secretKeyRef:
                  {{- include "curie.secretRef" (dict "root" . "existingSecret" .Values.agentSandbox.runner.credentialsExistingSecret "existingSecretKey" .Values.agentSandbox.runner.credentialsExistingSecretKey "defaultKey" "agentCredentials") | nindent 18 }}
            {{- end }}
            # Per-adapter egress credentials (ADR-0096 D4.2). From the chart
            # Secret, never inlined into the Deployment: these authenticate the
            # PLATFORM to a channel adapter, so a leaked manifest is a leaked
            # ability to impersonate Curie to every bound channel. Rendered
            # unconditionally (unlike agentCredentials) because the worker's
            # own parser treats empty as "no adapters configured" and fails
            # closed on the first non-Slack turn, which is the honest signal.
            - name: CURIE_ADAPTER_CREDENTIALS
              valueFrom:
                secretKeyRef:
                  {{- /* BYO (issue #1759): the referenced key must already
                         hold the JSON-encoded map. */}}
                  {{- include "curie.secretRef" (dict "root" . "existingSecret" .Values.worker.adapterCredentialsExistingSecret "existingSecretKey" .Values.worker.adapterCredentialsExistingSecretKey "defaultKey" "adapterCredentials") | nindent 18 }}
            # No-Slack egress routing: when set, the worker's Slack sink posts its
            # placeholder edits at this base URL (the `curie cluster message` CLI stub)
            # instead of real Slack. Empty (the default) leaves the sink on real
            # Slack. Rendered only when non-empty (values-not-templates).
            {{- if .Values.worker.slackApiBaseUrl }}
            - name: SLACK_API_BASE_URL
              value: {{ .Values.worker.slackApiBaseUrl | quote }}
            {{- end }}
            # Extra trusted Slack origins (ADR-0096 D4.4), a DEV-ONLY widening of
            # where the bot token may be sent. Empty (the default) renders
            # nothing, leaving the configured Slack origin as the only trusted
            # one and every cross-origin per-turn endpoint refused.
            {{- if .Values.worker.slackTrustedOrigins }}
            - name: CURIE_SLACK_TRUSTED_ORIGINS
              value: {{ .Values.worker.slackTrustedOrigins | quote }}
            {{- end }}
            # Object store, for fetching immutable plugin bundles.
            #
            # These four were missing entirely, and the worker's config defaults
            # them to the docker-compose stack -- s3_endpoint_url defaults to
            # http://localhost:29000. In compose that is correct and in
            # Kubernetes there is nothing on that port, so bundle_store's boto3
            # client connected to localhost and got ECONNREFUSED on every fetch.
            #
            # It fails in the two places that are hardest to notice:
            #
            #   * eval default @ <sha> failed: unresolvable suite/bundle
            #     -- the post-deploy eval never runs. Nothing alerts, because a
            #     suite that cannot resolve is indistinguishable from one that
            #     was not requested.
            #   * every Slack turn dies as ClaimTimeoutError after 90s, whose
            #     message blames a CPU-saturated node first. On the install where
            #     this was found the node was at 11% CPU with 4% pressure, and
            #     three people read that error as "the box is too small".
            #
            # Same values as api.yaml, deliberately: the API WRITES each uploaded
            # bundle to this bucket and the worker READS it back, so they have to
            # agree. ci/worker-object-store-assertions.sh asserts they do.
            - name: S3_ENDPOINT_URL
              value: {{ include "curie.rustfs.endpoint" . }}
            {{- if include "curie.rustfs.staticCredentials" . }}
            - name: S3_ACCESS_KEY
              value: {{ .Values.rustfs.auth.accessKey | quote }}
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.rustfs.existingSecret | default (include "curie.secretName" .) }}
                  key: rustfsSecretKey
            {{- end }}
            - name: BUNDLE_BUCKET
              value: {{ .Values.agentSandbox.runner.bundleFetch.bucket | quote }}
            {{- include "curie.env.otel" (dict "root" . "extraEnv" .Values.worker.extraEnv) | nindent 12 }}
            {{- with (include "curie.worker.extraEnv" . | trim) }}
            {{- . | nindent 12 }}
            {{- end }}
          # No HTTP port on the worker, so an exec probe checks a heartbeat file
          # the asyncio event loop touches each tick. A wedged loop stops
          # touching it -> the file goes stale -> the probe fails -> restart.
          {{- include "curie.heartbeatProbes" . | nindent 10 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - name: workspace-clone
              mountPath: {{ .Values.worker.workspace.mountPath | quote }}
      volumes:
        - name: workspace-clone
          emptyDir:
            sizeLimit: {{ .Values.worker.workspace.cloneVolumeSize | quote }}
{{- end }}
