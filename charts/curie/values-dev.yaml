# Single-node dev profile for the Curie umbrella chart.
#
#   helm install curie-dev charts/curie -n curie-dev --create-namespace \
#     -f charts/curie/values-dev.yaml
#
# Sized to fit a ~4 GB / 4-core scratch cluster, tightly. Sum of memory
# requests here is 2496 Mi (~2.44 GiB). That plus a distribution's kubelet
# and system pods leaves little request headroom on a 4 GB node; ClickHouse
# and Langfuse bursting toward their limits is the remaining squeeze, which
# is why the README's measured steady state is ~3.3 GB / ~82% node memory.
# Everything is single-replica and ClickHouse cluster mode is off. This
# mirrors compose.dev.yaml (same Langfuse, Postgres and Valkey pins; chart
# ClickHouse default is 25.12.11.4 / AVX-required, compose stays 24.8.14.39 for
# SSE4.2-only local hosts) so
# V1 (compose) and V3 (chart) verify the same application stack.

langfuse:
  web:
    # Node's default heap cap OOM-crashes the web app under a 1Gi limit; give it
    # room. ~1Gi heap fits comfortably in the 1536Mi container limit.
    nodeOptions: "--max-old-space-size=1024"
    resources:
      requests: { cpu: 150m, memory: 384Mi }
      limits: { cpu: "1", memory: 1536Mi }
  worker:
    nodeOptions: "--max-old-space-size=640"
    resources:
      requests: { cpu: 150m, memory: 384Mi }
      limits: { cpu: "1", memory: 1Gi }

postgres:
  persistence:
    size: 2Gi
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

valkey:
  persistence:
    size: 1Gi
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 256Mi }

clickhouse:
  # Inherits the chart-default :25.12.11.4 pin (AVX required, coupled to Langfuse).
  # Cluster mode off for single-node.
  clusterEnabled: false
  persistence:
    size: 3Gi
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { cpu: "2", memory: 1536Mi }

rustfs:
  persistence:
    size: 3Gi
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

otelCollector:
  debugExporter:
    enabled: true
  persistence:
    enabled: false
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 256Mi }

# The sandbox substrate stays OFF in this offline profile. The chart now defaults
# agentSandbox.deploy and controller.deploy to true (a bare install pulls the
# GHCR runner and the registry.k8s.io agent-sandbox controller), which a
# disconnected scratch cluster cannot satisfy. Turn both back off here so
# values-dev renders no remote-pull sandbox resources; the sandbox e2e re-enables the
# substrate explicitly with the backbone toggled down (see charts/curie/README.md).
# When it IS enabled for dev/e2e, use the locally-built, cluster-imported runner
# image rather than the GHCR default, so an offline cluster never tries (and
# fails) to pull.
agentSandbox:
  deploy: false
  controller:
    deploy: false
  runner:
    image: curie-runner
    tag: latest
    imagePullPolicy: Never

# First-party apps: locally-built images imported into the cluster runtime
# (docker build + `k3s ctr images import`), pulled Never so an offline scratch
# cluster never reaches out to GHCR. Mirrors the runner override above.
api:
  image:
    repository: curie-api
    tag: local
    pullPolicy: Never

dispatcher:
  image:
    repository: curie-dispatcher
    tag: local
    pullPolicy: Never

# Off by default (mailAdapter.deploy stays false here), but the image override
# must be in place for the offline profile: an operator who turns the email
# channel on with `--set mailAdapter.deploy=true` on a disconnected cluster would
# otherwise get the GHCR default on pullPolicy Always and an adapter that never
# starts.
mailAdapter:
  image:
    repository: curie-mail-adapter
    tag: local
    pullPolicy: Never

worker:
  image:
    repository: curie-worker
    tag: local
    pullPolicy: Never

ui:
  image:
    repository: curie-ui
    tag: local
    pullPolicy: Never

security:
  # Deterministic dev credentials: keep the published defaults from values.yaml
  # instead of generating per-release randoms (mirrors compose.dev.yaml).
  allowDevDefaults: true
