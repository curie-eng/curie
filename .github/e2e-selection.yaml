chart_scenarios:
  job: e2e-cluster-chart-regressions
  shared_inputs:
    - charts/curie/templates
    - charts/curie/values
    - charts/curie/Chart.yaml
    - charts/curie/crds
    - charts/curie/files
    - charts/curie/.helmignore
    - .github/workflows/ci.yaml
    - .github/e2e-selection.yaml
    - .github/actions/load-ci-images
    - tools/runtime-assertion-gate/run.sh
    - cli/scripts/configure-docker-hub-mirror.sh
    - cli/scripts/ensure-kind-registry.sh
  scenarios:
    failed-first-install-retry:
      step: Failed first install retry recreates data volumes
      leg: workload
      inputs:
        - charts/curie/ci/runtime/failed-first-install-retry-runtime.sh
        - cli/src/ops/up.rs
    installation-identity:
      step: Installation identity Secret lifecycle
      leg: chart
      inputs:
        - charts/curie/ci/runtime/upgrade-drain-installation-runtime.sh
    connector-identity:
      step: End to end connector identity is denied outside its scope
      leg: chart
      inputs:
        - charts/curie/ci/runtime/e2e-connector-identity-runtime.sh
    runner-resources-render:
      step: Per-agent runner resource override renders
      leg: chart
      inputs:
        - charts/curie/ci/runtime/runner-resources-assertions.sh
    connector-readiness:
      step: Connector that never listens stays not-Ready until it binds
      leg: chart
      inputs:
        - charts/curie/ci/runtime/connector-readiness-runtime.sh
        - packages/plugin-format
        - apps/worker/src/curie_worker/connector_k8s.py
        - pyproject.toml
        - uv.lock
    connector-apply-race:
      step: Connector apply survives a concurrent reconciler create
      leg: workload
      inputs:
        - charts/curie/ci/runtime/connector-apply-race-runtime.sh
        - cli
        - apps/api
        - apps/worker
        - packages
        - pyproject.toml
        - uv.lock
    connector-secret-rotation:
      step: Hosted connector credential rotation rolls only that connector
      leg: workload
      inputs:
        - charts/curie/ci/runtime/connector-secret-rotation-runtime.sh
        - cli
        - apps/api
        - apps/worker
        - packages
        - pyproject.toml
        - uv.lock
    runner-template-admission:
      step: Runner template admission refuses host escapes, token mounts, and unlisted images
      leg: chart
      inputs:
        - charts/curie/ci/runtime/runner-template-admission-runtime.sh
    runner-byo-egress:
      step: Runner BYO egress enforces (not just rendered)
      leg: chart
      inputs:
        - scripts/check-runner-byo-egress.sh
    controller-preflight:
      step: Controller preflight accepts a serving upgrade and refuses broken RBAC
      leg: chart
      inputs:
        - charts/curie/ci/scenarios/controller-preflight-kind.sh
        - pyproject.toml
        - uv.lock
    workspace-diagnostic:
      step: Workspace dependency failure reaches the terminal diagnostic
      leg: workload
      inputs:
        - charts/curie/ci/runtime/workspace-dependency-diagnostic-runtime.sh
        - apps/api
        - apps/worker
        - runner
        - cli
        - packages
        - pyproject.toml
        - uv.lock
    quota-progress:
      step: Quota progress regression
      leg: workload
      inputs:
        - charts/curie/ci/runtime/idle-capacity-reclamation-runtime.sh
        - apps/api
        - apps/worker
        - runner
        - cli
        - packages
        - pyproject.toml
        - uv.lock
    # #4889: the chart files that generate the factory sandbox envelope are
    # named even though shared_inputs already covers them, so the scenario
    # still runs if shared_inputs is ever narrowed.
    factory-resource-profile:
      step: Factory resource profile runtime (#4889)
      leg: workload
      inputs:
        - charts/curie/ci/runtime/factory-resource-profile-runtime.sh
        - charts/curie/values.yaml
        - charts/curie/values.schema.json
        - charts/curie/templates/agent-sandbox.yaml
        - charts/curie/templates/_sandbox_envelope.tpl
        - charts/curie/templates/_helpers.tpl
        - apps/api
        - apps/worker
        - runner
        - cli
        - packages
        - pyproject.toml
        - uv.lock
rules:
  exact:
    compose.dev.yaml: [local]
    .github/workflows/release.yaml: [local-release]
    pyproject.toml: [skill, local, local-release, cluster]
    uv.lock: [skill, local, local-release, cluster]
    # These scripts run in cluster-gated jobs despite their ignored parent trees.
    scripts/check-netpol-enforcement.sh: [cluster]
    scripts/check-connector-caller-enforcement.sh: [cluster]
    scripts/check-mail-adapter-otel-egress.sh: [cluster]
    scripts/check-runner-byo-egress.sh: [cluster]
    tools/runtime-assertion-gate/run.sh: [cluster]
    # The upgrade matrix and the repository files it reads. A test scans the
    # script's $REPO_ROOT reads and fails on any that skips released-upgrade.
    cli/scripts/gnu-process.py: [released-upgrade]
    apps/api/src/curie_api/schema_compat.json: [released-upgrade]
    cli/src/application_schema_windows.json: [released-upgrade]
    cli/scripts/cluster-upgrade-matrix.sh: [released-upgrade]
    # @spec NAMESPACE-CLEANUP-EVIDENCE-4
    tools/released-upgrade/namespace_cleanup_evidence.py: [released-upgrade]
    # Upgrade and kind jobs run these before they pull images or create a cluster.
    cli/scripts/configure-docker-hub-mirror.sh: [released-upgrade]
    cli/scripts/ensure-kind-registry.sh: [released-upgrade]
    cli/tests/data/upgrade-driver.py: [released-upgrade]
    cli/src/config_migrate.rs: [released-upgrade]
    cli/src/factory_app.rs: [released-upgrade]
    cli/src/factory_config_migrate.rs: [released-upgrade]
    cli/src/github_app.rs: [released-upgrade]
    cli/src/ops/upgrade.rs: [released-upgrade]
    tools/factory-e2e/tests/test_c4_upgrade_migration.py: [cluster, released-upgrade]
    cli/Cargo.toml: [released-upgrade]
    runner/Dockerfile: [released-upgrade]
    tools/factory-e2e/factory_e2e.py: [released-upgrade]
    tools/factory-e2e/scripted_kind.py: [released-upgrade]
    tools/factory-e2e/scripted_scenario.py: [released-upgrade]
    tools/factory-e2e/fixtures/unitconv-issue.md: [released-upgrade]
    tools/factory-e2e/fixtures/unitconv/.curie/verification.json: [released-upgrade]
    tools/factory-e2e/fixtures/unitconv/.github/workflows/test.yml: [released-upgrade]
    tools/factory-e2e/fixtures/unitconv/.gitignore: [released-upgrade]
    tools/factory-e2e/fixtures/unitconv/README.md: [released-upgrade]
    tools/factory-e2e/fixtures/unitconv/unitconv/__init__.py: [released-upgrade]
    tools/factory-e2e/fixtures/unitconv/unitconv/__main__.py: [released-upgrade]
    tools/factory-e2e/fixtures/unitconv/unitconv/convert.py: [released-upgrade]
    tools/factory-e2e/fixtures/unitconv/unitconv/tests/__init__.py: [released-upgrade]
    tools/factory-e2e/fixtures/unitconv/unitconv/tests/test_convert.py: [released-upgrade]
    tools/github-stub/github_stub.py: [released-upgrade]
    tools/github-stub/recordings/curie-pr-3400.json: [released-upgrade]
    tools/model-script/model_script.py: [released-upgrade]
    tools/model-script/transcripts/unitconv-issue.json: [released-upgrade]
    # The only charts/curie/ci files the released-upgrade jobs run.
    charts/curie/ci/live_manifest_parity.py: [released-upgrade]
    charts/curie/ci/make-upgrade-mutants.py: [released-upgrade]
    charts/curie/ci/scenarios/released-upgrade-resource-profile-assertions.sh: [cluster, released-upgrade]
    charts/curie/ci/fixtures/factory-resource-profile.yaml: [cluster, released-upgrade]
    apps/worker/src/curie_worker/approval_cards.py: [local, local-release, cluster, released-upgrade]
    apps/worker/src/curie_worker/config.py: [local, local-release, cluster, released-upgrade]
    apps/worker/src/curie_worker/consumer_liveness.py: [local, local-release, cluster, released-upgrade]
    apps/worker/src/curie_worker/workspace.py: [local, local-release, cluster, released-upgrade]
  prefixes:
    charts: [cluster]
    # Everything `helm package charts/curie` ships. charts/curie/ci is
    # helmignored, so its test scripts cannot change an upgrade and stay on
    # the cluster tier only.
    charts/curie/.helmignore: [released-upgrade]
    charts/curie/CLAUDE.md: [released-upgrade]
    charts/curie/Chart.yaml: [released-upgrade]
    charts/curie/README.md: [released-upgrade]
    charts/curie/crds: [released-upgrade]
    charts/curie/files: [released-upgrade]
    charts/curie/templates: [released-upgrade]
    charts/curie/values-dev.yaml: [released-upgrade]
    charts/curie/values-e2e-harness.yaml: [released-upgrade]
    charts/curie/values-e2e-nogvisor.yaml: [released-upgrade]
    charts/curie/values-e2e-two-release-consumer.yaml: [released-upgrade]
    charts/curie/values-external.yaml: [released-upgrade]
    charts/curie/values.schema.json: [released-upgrade]
    charts/curie/values.yaml: [released-upgrade]
    compose: [local-release]
    apps/api: [local, local-release, cluster]
    apps/api/src/curie_api/migrations: [released-upgrade]
    apps/worker: [local, local-release, cluster]
    otel: [local, local-release]
    runner: [skill, local, local-release, cluster]
    cli: [skill, local, local-release, cluster]
    cli/src/ops: [released-upgrade]
    packages: [skill, local, local-release, cluster]
    examples: [skill, local, local-release, cluster]
    examples/dark-factory: [released-upgrade]
  # Root documentation filenames are exact paths, never directory ignores.
  ignored_exact:
    AGENTS.md: []
    ARCHITECTURE.md: []
    CLAUDE.md: []
    CODE_OF_CONDUCT.md: []
    CONTRIBUTING.md: []
    LICENSE: []
    NOTICE: []
    QUICKSTART.md: []
    README.md: []
    SECURITY.md: []
    SUPPORT.md: []
    TRADEMARKS.md: []
    llms.txt: []
  ignored_prefixes:
    docs: []
    apps/ui: []
    apps/dispatcher: []
    # Nothing deploys the per-run Docker daemon image yet; its group in
    # image-proofs builds it and runs the escape tests against it.
    apps/docker-daemon: []
    scripts: []
    # The revision-based selector inspects ci.yaml hunks and selects the
    # released-upgrade smoke shard and negative control for upgrade job edits.
    # Other workflow edits stay ignored; path-only requests cannot inspect hunks.
    .github/workflows: []
    .github/e2e-selection.yaml: []
    tools: []
    release: []
    runner/tests/test_repo_toolchain_proof_ci.py: []
    packages/test-support: []
    examples/coder: []
