name: Plugin compat

# The bundle format is the Claude Code plugin shape verbatim, so outbound
# compatibility (a Curie bundle validates unmodified as a Claude Code plugin)
# is a contract we owe, not a claim we make. This gate defends it.
#
# Both triggers are deliberate, because there are two independent drift vectors:
#   - pull_request (path-filtered): catches OUR drift, when we touch the example
#     bundles, the plugin-format models, or this gate itself.
#   - schedule (nightly): catches THEIR drift, when Claude Code changes the
#     format under us with no PR of ours involved. No per-PR trigger can see
#     this, since the cadence is external to the repo.
# The job is a checkout plus one npm install, so running both is cheap.
on:
  pull_request:
    branches: [main, next]
    paths:
      - "examples/**"
      - "packages/plugin-format/**"
      - ".github/workflows/plugin-compat.yaml"
      - "scripts/check-plugin-compat.sh"
      - "scripts/assert-gates-are-live-tools.py"
      - "tools/sre-contract/**"
      - "docs/agents.md"
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plugin-compat:
    name: Bundles validate as Claude Code plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install the Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code
      - name: Validate every examples/ bundle
        run: bash scripts/check-plugin-compat.sh

      # A write connector is enabled by uncommenting it; its gate is declared in
      # a different file. Nothing made those two edits happen together, and on a
      # real install they did not -- the connector ran for four and a half days
      # with no gate in front of it, healthy the whole time. This is that check,
      # plus the two write allowlists (connector env, RBAC resourceNames)
      # agreeing, which drifted apart on the same install.
      - name: Assert every write path is gated
        run: python3 scripts/check-write-path-gated.py

  sre-contract:
    name: Supported SRE bundle consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install contract checker dependencies
        run: python -m pip install -r tools/sre-contract/requirements.txt -e packages/plugin-format
      - name: Exercise causal contract and HTTP catalog mutations
        run: python -m pytest -q tools/sre-contract/tests
      - name: Validate the shipped supported bundle
        run: python tools/sre-contract/check.py

  sre-live-catalog:
    name: Supported SRE actual connector catalogs
    needs: sre-contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install contract checker dependencies
        run: python -m pip install -r tools/sre-contract/requirements.txt -e packages/plugin-format
      - name: Probe declared connector images and execute live gate checker
        run: python tools/sre-contract/catalog_ci.py
