name: SRE scheduled job alerts

on:
  pull_request:
    branches: [main, next]
    paths:
      - 'examples/sre-bot/observability/*scheduled_job_alerts.py'
      - 'examples/tests/test_scheduled_job_alerts.py'
      - 'examples/sre-bot/docs/SCHEDULED-JOB-ALERTS.md'
      - '.github/workflows/sre-scheduled-alerts.yaml'
  push:
    branches: [main, next]
    paths:
      - 'examples/sre-bot/observability/*scheduled_job_alerts.py'
      - 'examples/tests/test_scheduled_job_alerts.py'
      - 'examples/sre-bot/docs/SCHEDULED-JOB-ALERTS.md'
      - '.github/workflows/sre-scheduled-alerts.yaml'

permissions:
  contents: read

jobs:
  scheduled-alert-consumer:
    name: SRE scheduled job rule verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # @spec SRE-SCHEDULED-JOBS c1, c2, c3, c4, c5
      - name: Evaluate generated rules and refusal cases
        run: python3 examples/tests/test_scheduled_job_alerts.py
      # @spec SRE-SCHEDULED-JOBS c1, c2, c3, c5
      - name: Load and evaluate the exact rules in running Prometheus
        run: python3 examples/sre-bot/observability/verify_scheduled_job_alerts.py
