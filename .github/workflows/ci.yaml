name: CI

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]

# Supersede an in-flight run when a branch is pushed again so runs stop
# stacking. Keyed per workflow+ref: each PR branch and main have independent
# groups, and a new push to a branch cancels only that branch's older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Retry eligibility (#1106): only a step whose whole job is to ACQUIRE a
      # third-party dependency (a tool binary, an image, a registry session, a
      # build artifact) may be wrapped. Such a step can fail only on a network
      # or registry error, never on a non-zero exit from this repository's own
      # build, test, or gate, so a retry there cannot hide a defect in our
      # code. Never wrap a step that builds, tests, or gates that code.
      # Enforced by tools/ci-retry-gate/tests/test_retry_eligibility.py.
      - name: Install uv
        id: install_uv
        continue-on-error: true
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.13"
      - name: Back off before retrying Install uv
        if: steps.install_uv.outcome == 'failure'
        run: |
          echo "Install uv failed on attempt 1 of 2, retrying in 15 seconds"
          sleep 15
      - name: Install uv (retry)
        if: steps.install_uv.outcome == 'failure'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.13"
      # Fail fast if uv.lock has drifted from the pyproject.toml files (a
      # dependency edit committed without re-locking). --check resolves and
      # compares without writing, so it never mutates the checkout.
      - name: Lockfile is up to date
        run: uv lock --check
      - name: Sync workspace
        run: uv sync
      - name: Alembic revision gate
        run: uv run python scripts/check-alembic-revisions.py
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy
      # ADR-0062 (#844): the harness boundary is gated, not just documented. Two
      # contracts today -- the platform never imports a harness SDK, and the
      # harness PORT (contribution + registry) stays vendor-neutral. Transitive,
      # so a leak arriving through an intermediate module is caught too.
      - name: Import boundaries (harness SDK containment)
        run: uv run lint-imports
      # Regenerate the interface-catalog seam table and per-doc headers from
      # each seam's front-matter, fail on drift, resolve every `curie ...`
      # command named in the agent verification contract (docs/agents.md)
      # against cli/command-manifest.json (#1041), then lint every citation
      # under docs/ (excluding docs/adr/). A cheap, cluster-free gate, so it
      # runs right after ruff/mypy and before the dev stack boots.
      - name: Docs gate (catalog drift + agent contract + citations)
        run: bash scripts/check-docs.sh
      # _AciModel tolerant-decode gate (#625, following #492): every direct
      # ClassName.model_validate*(...) call on an _AciModel subclass must thread
      # READER_CONTEXT or be a declared allowlist exception. Another cheap,
      # cluster-free static gate, so it runs alongside the docs gate.
      - name: Wire tolerance gate (_AciModel model_validate call sites)
        run: bash scripts/check-wire-tolerance.sh
      # Integration tests dial the real dev stack (Postgres 25432, Valkey 26379,
      # RustFS 29000, Langfuse 23000 + ClickHouse + OTel Collector). Boot it after
      # ruff/mypy so cheap failures stay fast. The first up starts the one-shot
      # rustfs-init that creates the Langfuse bucket alongside the long-lived
      # services; the second --waits only on the long-lived ones (rustfs-init is
      # kept out of the wait set because --wait treats its exit(0) as a failure).
      # The app services (curie-api, curie-migrate) are deliberately NOT
      # started: the suite runs the app in-process via uv and migrates the shared
      # DB with alembic below, so their image is never needed here -- and it lives
      # in a private registry, so a bare `up` that pulled it failed the job.
      - name: Start dev stack
        run: |
          docker compose -f compose.dev.yaml up -d \
            postgres valkey clickhouse rustfs rustfs-init \
            langfuse-web langfuse-worker otel-collector
          docker compose -f compose.dev.yaml up -d --wait --wait-timeout 300 \
            postgres valkey clickhouse rustfs \
            langfuse-web langfuse-worker otel-collector
      # Langfuse web has no compose healthcheck, so --wait returns once its
      # container is merely running. Poll its public health endpoint until it is
      # actually serving; the Langfuse-backed tests skip themselves when the
      # stack is unreachable, so this gate is what keeps them running for real.
      - name: Wait for Langfuse to serve
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:23000/api/public/health >/dev/null 2>&1; then
              echo "Langfuse ready after attempt ${i}"; exit 0
            fi
            sleep 3
          done
          echo "Langfuse did not become ready within 180s"; exit 1
      # The apps/api suite provisions a throwaway migrated DB per run, but the
      # worker binding integration tests dial the shared default database and
      # assume the curie schema already exists (as it does on a dev box).
      # Apply the real migrations to it so those tests run against a real
      # schema; this also exercises the alembic upgrade path on virgin Postgres.
      - name: Migrate the shared database
        working-directory: apps/api
        run: uv run alembic upgrade head
      # The committed-lock test only proves the lock matches the current wire; it
      # passes even if the lock was regenerated without a version bump. Compare
      # against the BASE branch's lock so an unbumped wire change actually fails
      # CI. The shallow checkout has no base ref, so fetch it depth=1; a missing
      # or empty base lock (base predates the lock) skips cleanly (exit 0), and
      # only a genuine unbumped wire change vs an existing base lock exits 1.
      - name: ACI wire-lock base gate
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref || 'main' }}" || true
          git show "origin/${{ github.base_ref || 'main' }}:packages/aci-protocol/schema/wire.lock" > /tmp/base-wire.lock 2>/dev/null || true
          uv run python -m aci_protocol.wire_lock --check-base /tmp/base-wire.lock
      - name: Pytest
        run: uv run pytest -q
      - name: Dump dev stack logs on failure
        if: failure()
        run: docker compose -f compose.dev.yaml logs --no-color --tail=200

  rust:
    name: Rust (fmt + clippy + test)
    runs-on: ubuntu-latest
    env:
      CI_REQUIRE_VALKEY_TESTS: "1"
      TEST_VALKEY_URL: redis://localhost:26379
    services:
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 26379:6379
        options: >-
          --health-cmd "valkey-cli ping | grep -q PONG"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup component add rustfmt clippy
      # Cache the cargo registry + build artifacts keyed on the lockfiles + rustc
      # so a run recompiles only what changed, not the whole dependency tree from
      # scratch (the dominant cost of this job).
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            cli
            packages/aci-protocol/generated/rust
      # The release-coupled versions (cli/Cargo.toml, Chart.yaml version +
      # appVersion) must agree on every PR, so a bump that forgets one field
      # fails here rather than shipping a chart that pulls the wrong image (#489).
      - name: Version consistency
        working-directory: ${{ github.workspace }}
        run: bash scripts/check-version-consistency.sh
      - name: Fmt
        run: cargo fmt --check
      # --locked on every resolving cargo command asserts the committed
      # Cargo.lock (both cli/ and the generated ACI crate) already satisfies its
      # Cargo.toml -- cargo errors instead of silently updating the lock, which
      # is the lockfile-freshness gate for Rust (mirrors uv lock --check above).
      - name: Clippy
        run: cargo clippy --locked -- -D warnings
      - name: Schema baseline
        run: bash scripts/refresh-schema-baseline.sh --check
      - name: Test
        run: cargo test --locked
      - name: Generated ACI protocol crate compiles
        working-directory: packages/aci-protocol/generated/rust
        run: cargo test --locked

  # The release binary the e2e ladder + falsifiability gate consume, split out of
  # the quality job above so those downstream jobs start as soon as the binary
  # COMPILES -- in parallel with fmt/clippy/test rather than after them (they no
  # longer gate the ladder; a real test/clippy failure still blocks the merge via
  # the required "Rust (fmt + clippy + test)" check). The release-build compile
  # check now lives here; if it should stay merge-blocking, add this job ("Build
  # the curie release binary") to the branch ruleset's required checks (today
  # the required set is Compose/Contracts/Python/Rust/UI). Cached independently.
  rust-build:
    name: Build the curie release binary
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustc --version
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - name: Release build
        run: cargo build --release --locked
      - name: Upload curie binary
        uses: actions/upload-artifact@v7
        with:
          name: curie-x86_64-linux-${{ github.sha }}
          path: cli/target/release/curie
          if-no-files-found: error

  cli-portability:
    name: CLI runs on old glibc (and publishes per-commit binaries)
    runs-on: ubuntu-latest
    # The release cross-compile path was never exercised before a tag, so a
    # regression in it was undiscoverable until someone tried the artifact on a
    # real host. #1341 shipped exactly that way: both Linux targets inherited
    # the runner's GLIBC_2.39, and every runner that executes them is also
    # `ubuntu-latest`, so nothing went red. This job runs the same path a tag
    # would and then runs the result on an OLDER distro, which is the only
    # check that could have caught it.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      # rustup for the std/core rlibs, zig for the C toolchain and the glibc
      # floor. Both are needed: without the target added, the cross build dies
      # on `can't find crate for core` while the host target quietly succeeds --
      # which is why adding arm64 here caught something x86_64-only never could.
      - name: Install cross toolchain
        run: |
          set -euo pipefail
          rustup target add x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu
          python3 -m pip install --user --break-system-packages "ziglang==0.16.0"
          cargo install cargo-zigbuild --locked --version 0.23.0
      # Both Linux targets, the same way a tag builds them. arm64 is here as
      # much for the artifact as for the check: it is the target that cannot be
      # obtained any other way between releases, and the one a Graviton cluster
      # host needs.
      - name: Build (same path as the release)
        working-directory: cli
        env:
          CURIE_BUILD_CHANNEL: release
          RUSTFLAGS: -C strip=symbols
        run: |
          set -euo pipefail
          cargo zigbuild --release --target x86_64-unknown-linux-gnu.2.28
          cargo zigbuild --release --target aarch64-unknown-linux-gnu.2.28
      - name: Assert the glibc floor
        run: |
          set -euo pipefail
          bash scripts/check-glibc-floor.sh cli/target/x86_64-unknown-linux-gnu/release/curie 2.28
          bash scripts/check-glibc-floor.sh cli/target/aarch64-unknown-linux-gnu/release/curie 2.28
      # The floor asserted above is a claim about symbols. This is the claim
      # under test: Amazon Linux 2023 is glibc 2.34, it is what the deployment
      # runbook provisions, and it is where `curie --version` died.
      # The Amazon Linux execution check remains x86_64 only because arm64 execution would require qemu.
      - name: Run it on Amazon Linux 2023
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/cli/target/x86_64-unknown-linux-gnu/release/curie:/curie:ro" \
            amazonlinux:2023 /curie --version

      # Installable binaries for any commit, not just tagged releases, so a
      # cluster can run an unreleased fix without building Rust on the host.
      #
      # NOT the same as `curie-x86_64-linux-<sha>` from the build job above:
      # that one is a native build with the runner's glibc floor, exists to feed
      # the e2e jobs on ubuntu-latest, and will NOT start on an older distro.
      # These two carry the 2.28 floor and are the ones to install anywhere real.
      # Named like the release assets so `--chart`/install flows read the same.
      #
      #   gh run download <run-id> -R curie-eng/curie \
      #     -n curie-aarch64-unknown-linux-gnu-<sha>
      #   chmod +x curie && sudo install -m 0755 curie /usr/local/bin/curie
      - name: Publish per-commit portable binaries
        uses: actions/upload-artifact@v7
        with:
          name: curie-x86_64-unknown-linux-gnu-${{ github.sha }}
          path: cli/target/x86_64-unknown-linux-gnu/release/curie
          if-no-files-found: error
      - name: Publish per-commit portable binaries (arm64)
        uses: actions/upload-artifact@v7
        with:
          name: curie-aarch64-unknown-linux-gnu-${{ github.sha }}
          path: cli/target/aarch64-unknown-linux-gnu/release/curie
          if-no-files-found: error

  contracts-ts:
    name: Contracts (generated TypeScript compiles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Regenerate TypeScript from the committed schema and check for drift
        run: |
          npx --yes json-schema-to-typescript@15.0.4 \
            packages/aci-protocol/schema/aci-protocol.schema.json \
            --unreachableDefinitions \
            -o packages/aci-protocol/generated/ts/aci-protocol.ts
          git diff --exit-code -- packages/aci-protocol/generated/ts/aci-protocol.ts
      - name: tsc --noEmit on generated ACI types
        run: npx --yes -p typescript@5.9.3 tsc --noEmit -p packages/aci-protocol/generated/ts/tsconfig.json

  ui:
    name: UI (lint + vitest + build + Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ui
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/ui/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Command manifest is current
        # The committed src/generated/commandManifest.ts must match what
        # cli/command-manifest.json regenerates (the UI Docker build has no
        # cli/, so the manifest is committed, not built there). Fail on drift.
        run: |
          pnpm gen:manifest
          git diff --exit-code src/generated/commandManifest.ts \
            || (echo "commandManifest.ts is stale; run 'pnpm gen:manifest' in apps/ui and commit." && exit 1)
      - name: Lint
        run: pnpm lint
      - name: Unit tests (vitest)
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium
      # The stackless E2E project (route-interception fixtures, testIgnore
      # integration) runs with no backend; the live-backend "integration" project
      # only activates under PW_INTEGRATION=1, which CI does not set. Playwright's
      # webServer builds and serves the preview for the run.
      - name: E2E (Playwright, stackless)
        run: pnpm exec playwright test

  compose:
    name: Compose (release stack validates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Generate the release compose
        run: python3 compose/generate_release_compose.py > compose.release.yaml
      # compose.release.yaml is generated from compose.dev.yaml (the single
      # source of truth) by compose/generate_release_compose.py; the release
      # asset itself has no other CI coverage. Validate the generated stack
      # parses with the Slack profile off (default: the
      # optional dispatcher is absent) and on (dispatcher rendered), and assert
      # the profile actually gates the service, so the #111 opt-in cannot silently
      # break the default zero-Slack `curie local up`.
      - name: Default profile parses and omits the dispatcher
        run: |
          docker compose -f compose.release.yaml config -q
          if docker compose -f compose.release.yaml config --services | grep -qx curie-dispatcher; then
            echo "curie-dispatcher must NOT be present without the slack profile" >&2
            exit 1
          fi
      - name: Slack profile parses and includes the dispatcher
        run: |
          export SLACK_APP_TOKEN=xapp-ci SLACK_BOT_TOKEN=xoxb-ci
          # The dispatcher depends on valkey (a core service), so the slack
          # profile is paired with a base profile; the CLI does the same.
          docker compose -f compose.release.yaml --profile full --profile slack config -q
          docker compose -f compose.release.yaml --profile full --profile slack config --services \
            | grep -qx curie-dispatcher \
            || { echo "curie-dispatcher must be present under the slack profile" >&2; exit 1; }
      # `curie local up --minimal` selects the `core` profile and plain
      # `curie local up` the `full` profile; assert the release stack renders
      # exactly those service counts so a profile regression cannot silently
      # start the wrong set.
      - name: Core profile renders 8 services
        run: |
          count=$(docker compose -f compose.release.yaml --profile core config --services | wc -l)
          [ "$count" -eq 8 ] || { echo "core profile must render 8 services, got $count" >&2; exit 1; }
      - name: Full profile renders 13 services
        run: |
          count=$(docker compose -f compose.release.yaml --profile full config --services | wc -l)
          [ "$count" -eq 13 ] || { echo "full profile must render 13 services, got $count" >&2; exit 1; }

  # Build the first-party images on every PR/push -- build only, never push --
  # so a Dockerfile break is caught here instead of only at release time. This
  # mirrors release.yaml's build step (same contexts, same pinned actions, same
  # gha layer cache) minus the registry login and push. All five app images
  # build from public bases (python/node/nginx), so no GHCR credentials are
  # needed; the worker-local overlay is handled separately below.
  images:
    name: Build ${{ matrix.name }} image (no push)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: runner
            dockerfile: runner/Dockerfile
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: dispatcher
            dockerfile: apps/dispatcher/Dockerfile
          - name: worker
            dockerfile: apps/worker/Dockerfile
          - name: ui
            dockerfile: apps/ui/Dockerfile
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The worker-local overlay is FROM the published curie-worker image, so it
  # cannot be built purely from the checkout. Build the base worker image
  # locally first and tag it exactly as the overlay's FROM ref, then build the
  # overlay against it. Plain `docker build` uses the default buildx builder
  # (docker driver), whose FROM lookup consults the local image store -- so the
  # overlay resolves the just-built base with no GHCR pull, no registry auth,
  # and works on any branch (including forks). Build only, never pushed.
  worker-local-image:
    name: Build worker-local overlay image (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build the base worker image locally
        run: docker build -t ghcr.io/curie-eng/curie-worker:ci-local -f apps/worker/Dockerfile .
      - name: Build the worker-local overlay (no push)
        run: docker build --build-arg BASE_TAG=ci-local -f compose/worker-local.Dockerfile compose

  # The dispatcher image builds with `uv sync --no-editable`, so it installs
  # only the package's DECLARED dependencies. aci-protocol is a uv workspace
  # member imported by handlers.py/queue.py; if it is not declared in
  # apps/dispatcher/pyproject.toml it stays importable from a source checkout
  # but is absent from the isolated image venv, and the process crash-loops on
  # startup (issue #428). The build-only `images` job above cannot catch this
  # (it never runs the image). Build the real image and assert the entrypoint's
  # imports resolve inside it -- the one place that gap is observable.
  dispatcher-image-smoke:
    name: Dispatcher image imports resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build the dispatcher image locally
        run: docker build -t curie-dispatcher:ci-smoke -f apps/dispatcher/Dockerfile .
      - name: Entrypoint imports resolve in the built image
        run: docker run --rm --entrypoint python curie-dispatcher:ci-smoke -c "import curie_dispatcher; import aci_protocol"

  # FALSIFIABILITY gate for the committed eval suites (issue #619). This is NOT
  # an E2E test: it never runs a real agent or makes a model call. It boots the
  # runner's scripted FAKE model (offline, no credential, no network) -- a
  # do-nothing agent whose only reply is the canned "all done" -- and runs every
  # committed eval suite (examples/*/evals/cases.json + the init scaffold seed at
  # apps/worker/schema/eval-cases.example.json) through the real `curie skill
  # eval` path, failing if ANY case passes. A case that greens against a
  # responder that calls no tool and ignores the input is unfalsifiable (#527),
  # which is exactly what this gate forbids reaching main. Suites are discovered,
  # not hardcoded, so a new suite needs no edit here. The input-parrot
  # vacuousness control (the `contains: "weather"` class) and the positive
  # control (each grader greens on a known-good exemplar) are grader-level and
  # ride the Rust job (cli/tests/eval_falsifiability.rs) -- the fake model can
  # only ever say "all done", so those cannot be expressed through this path.
  # Reuses the release binary the Rust job already built and uploaded, and builds
  # the runner image locally (plain `docker build`, no registry auth).
  eval-falsifiability:
    name: Eval falsifiability gate (fake model, offline)
    runs-on: ubuntu-latest
    needs: rust-build
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download the curie binary built by the Rust job
        uses: actions/download-artifact@v8
        with:
          name: curie-x86_64-linux-${{ github.sha }}
          path: cli/target/release
      - name: Make the binary executable
        run: chmod +x cli/target/release/curie
      - name: Build the runner image locally
        run: docker build -t curie-runner -f runner/Dockerfile .
      - name: Falsifiability gate (every committed case must go RED against the fake model)
        env:
          CURIE_BIN: cli/target/release/curie
        run: bash cli/scripts/eval-falsifiability.sh

  # COLD-START PARITY LADDER (issue #690), skill + local rungs only. A
  # meta-analysis of all 41 bug issues filed against this repo found roughly
  # 18 were caught ONLY by a manual cold-start dogfood run and never surfaced
  # by unit tests, review, or existing CI -- whole classes of bug had no
  # lower-tier signal at all: compose env wiring (#545), profile asymmetry
  # (#233, #342), deploy-then-message reachability (#352, #359), and
  # fake/live model defaults (#343). The ladder drives the real `curie`
  # verbs end to end (rung 1: the skill-tier `e2e.sh`; rung 2: `local
  # up --minimal` -> `local deploy` -> `local message` with the reply
  # asserted -> `local down`) against a real runner container, sealed with
  # the fake model, so this class of bug fails CI instead of surviving to
  # the next manual dogfood pass.
  #
  # The cluster rung is NOT run by THIS job (it stays skill + local +
  # local-release, credential-free with no cluster). It is now covered by the
  # separate `e2e-ladder-cluster` job below (issue #692), which stands up a
  # disposable kind cluster, Helm-installs the platform through `curie cluster
  # up`, brings up the runner prewarm DaemonSet, and gates the same
  # deploy-then-message round trip -- with the bidirectional reachability the
  # rung needs (in-cluster worker -> host-bound reply stub). Keep the two jobs
  # split: this one must stay cluster-free and fast, so a kind/Helm flake can
  # never red the skill/local signal.
  #
  # Rung 2 brings up the `core` compose profile for real, unlike the Python
  # job above (which never starts curie-api/worker to dodge private-registry
  # pulls). `curie-api` and `curie-migrate` pull
  # `ghcr.io/curie-eng/curie-api:${CURIE_BASE_TAG:-latest}`, a private GHCR
  # image this workflow has no credentials for, so it is built locally first and
  # tagged to match. `curie-worker` builds from source at `up` time via
  # compose/worker-local.Dockerfile, whose own FROM is
  # `ghcr.io/curie-eng/curie-worker:${BASE_TAG}` (default `latest`), another
  # private pull one layer down -- compose.dev.yaml threads the same
  # CURIE_BASE_TAG through as that build stanza's BASE_TAG arg (issue #698),
  # so one override variable drives all three. This job sets CURIE_BASE_TAG=
  # ci-local (the same convention the `worker-local-image` job above already
  # uses for its own base build) and tags its from-source builds to match,
  # rather than retagging over whatever `:latest` meant in the local image
  # store before this job ran -- `:latest` is not shadowed. Both builds are
  # throwaway (this runner's Docker daemon is discarded at job end; nothing
  # here is ever pushed).
  #
  # Rung 2's worker spawns sibling runner containers through the mounted
  # Docker socket (network_mode: host, CURIE_SANDBOX_SUBSTRATE=docker); the
  # runner image it spawns must already exist on the host daemon, which it
  # does once the `curie-runner` build below completes. GitHub-hosted
  # runners support Docker-in-Docker this way, but this is confirmed by the
  # first green live run of this job in CI, not asserted from first
  # principles -- if that first run does not go green, treat the
  # docker-socket path as unverified rather than assuming the theory above is
  # right.
  #
  # A third private-image seam, easy to miss because it is not a compose
  # `image:` pull: compose.dev.yaml sets CURIE_RUNNER_IMAGE=
  # ghcr.io/curie-eng/curie-runner:latest on the worker service, and
  # apps/worker/src/curie_worker/run.py reads that env var (falling back to
  # bare `curie-runner` only when it is unset) to name the image it spawns
  # per message. Rung 1 (skill) and the CLI's own dev-build default both use
  # the bare `curie-runner` tag the build step below produces, but rung 2's
  # worker asks for the ghcr.io-qualified tag instead. Retag the same local
  # build under both names rather than building twice, so one rung's image
  # choice cannot silently break the other.
  #
  # Reuses the release binary the Rust job already built and uploaded. The
  # local rung needs a working Docker daemon for `docker compose`;
  # ubuntu-latest ships one, the same assumption the `compose` job above
  # already relies on. `CURIE_E2E_TIERS` carries the selected skill and local
  # subset. Expect this to be the slowest job in the
  # workflow -- three image builds (runner, api, worker base) plus one more
  # (the worker-local overlay) that compose triggers itself, on top of the
  # actual up/deploy/message/down round trip; `local up --wait` alone can run
  # up to compose's 300s default wait timeout if a service is slow to report
  # healthy.
  #
  # Additive on top of the above: a `local-release` rung (issue #695) runs the
  # SAME local round trip again, this time against compose/generate_release_compose.py's
  # OUTPUT (compose.release.yaml) instead of the checked-in compose.dev.yaml --
  # the artifact a release binary's `curie local up` actually runs. The
  # `compose` job elsewhere in this workflow already asserts that generated
  # file parses and renders the right service counts; it never runs a turn
  # through it, which is exactly the gap #545-class compose-env-wiring bugs
  # hide in. Reuses the SAME curie-api/curie-worker local builds above
  # (no second Dockerfile build for those), just tags/builds the two additional
  # refs the DEFAULT (no --version) generation pins: curie-api:latest (the
  # dev file's own unset-override outcome) and the worker-local overlay image
  # the generator's T1 substitutes for the build directive, both resolved
  # locally so `local up` never attempts a pull against a private GHCR ref.
  #
  # AGENTS.md forbids naming an AI assistant in a commit message and forbids
  # Co-Authored-By lines referencing AI. Nothing enforced it and it landed on main
  # twice in one day (#952/#953, issue #962). Deliberately NOT path-gated: a commit
  # message is wrong regardless of which files the PR touches. Scoped to the PR's
  # OWN commits (base..head), so the ~29% of pre-gate history carrying the trailer
  # is not retroactively enforced -- commits are immutable and a history rewrite is
  # not worth it.
  commit-messages:
    name: Commit messages (no AI attribution)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The range needs both endpoints present locally.
          fetch-depth: 0
      # Prove the matcher still distinguishes attribution from mention before
      # trusting its verdict; a gate that cannot fail is not a gate.
      - name: Gate self-test (negative control)
        run: bash scripts/check-commit-messages.sh --self-test
      - name: Check the PR's commit messages
        run: |
          bash scripts/check-commit-messages.sh \
            "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  # The three image builds here are GHA-layer-cached via a buildx builder that
  # is created but NOT made the default (`setup-buildx-action` with
  # `use: false`): two of the tags are consumed as Dockerfile FROM bases by a
  # compose-triggered build later in the same job, which must stay on a plain
  # `docker` builder to resolve them. See the build steps' own comment for the
  # full history and why `use: false` is the fix (#697/#791/#803).
  e2e-ladder:
    name: E2E parity ladder (skill + local, fake model)
    runs-on: ubuntu-latest
    needs: [rust-build, changes]
    # Skip on PRs that can't affect what the ladder tests (docs, UI-only, gtools,
    # non-ladder CI). Not a required check, so skipping never blocks a merge; it
    # just stops paying the ~2min image-build + rung cost when nothing it
    # exercises changed. Always runs on push to either release train branch (the
    # changes job forces it).
    if: ${{ needs.changes.outputs.skill == 'true' || needs.changes.outputs.local == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download the curie binary built by the Rust job
        uses: actions/download-artifact@v8
        with:
          name: curie-x86_64-linux-${{ github.sha }}
          path: cli/target/release
      - name: Make the binary executable
        run: chmod +x cli/target/release/curie
      # The three from-scratch image builds below are GHA-layer-cached WITHOUT
      # repointing the default buildx builder -- the exact mechanism the pre-#803
      # revert note asked for. Two of these tags (curie-worker:ci-local,
      # curie-api:ci-local) are consumed as Dockerfile FROM bases by a build
      # that `docker compose` triggers itself a few steps down (the worker-local
      # overlay via compose/worker-local.Dockerfile, inside `curie local up`),
      # so that compose build MUST run on a plain `docker` builder that can see
      # the locally-built `:ci-local` tags in the daemon store.
      #
      # History: #697 first added the GHA cache here with a bare
      # docker/setup-buildx-action step; its default `use: true` made the
      # docker-container builder the *current* builder, the compose-triggered
      # build inherited it, and it could no longer resolve the `:ci-local` tags
      # as a FROM ("failed to resolve source metadata ... not found"), reddening
      # every run (#791/#803). The fix is the one line #697 lacked: `use: false`
      # creates the container builder for the cache export but leaves the plain
      # `docker` builder current, so the compose FROM still resolves. Each build
      # below runs on the named builder explicitly (`builder:` input) with
      # `load: true` to export the result into that same daemon store -- so both
      # this job's steps and the compose FROM find the tags. Same pinned actions
      # and gha cache as the `images` job above, which proves the token wiring.
      # Validated locally (kind box): named builder never becomes default, the
      # `FROM :ci-local` resolves, and a cache-warm runner build restores 9
      # layers from cache alone (58s -> 15s) after wiping the builder.
      - name: Set up a cache-only buildx builder (named, NOT the default -- preserves compose FROM, #803)
        id: laddercache
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          use: false
      - name: Build the runner image locally (gha layer cache)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: runner/Dockerfile
          builder: ${{ steps.laddercache.outputs.name }}
          tags: curie-runner
          push: false
          load: true
          cache-from: type=gha,scope=ladder-runner
          cache-to: type=gha,mode=max,scope=ladder-runner
      - name: Retag the runner image for the compose worker (CURIE_RUNNER_IMAGE, no registry auth)
        run: docker tag curie-runner ghcr.io/curie-eng/curie-runner:latest
      # Tagged :ci-local (the worker-local-image job's own convention), not
      # :latest -- compose.dev.yaml's CURIE_BASE_TAG override (set below) points
      # curie-api/curie-migrate's `image:` and the worker-local overlay's
      # BASE_TAG build arg at this tag directly, so this job no longer needs to
      # retag its from-source builds over whatever `:latest` meant in the local
      # Docker image store before this job ran.
      - name: Build the api image locally (satisfies curie-api + curie-migrate, no registry auth)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/api/Dockerfile
          builder: ${{ steps.laddercache.outputs.name }}
          tags: ghcr.io/curie-eng/curie-api:ci-local
          push: false
          load: true
          cache-from: type=gha,scope=ladder-api
          cache-to: type=gha,mode=max,scope=ladder-api
      - name: Build the worker base image locally (satisfies the worker-local overlay's FROM, no registry auth)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/worker/Dockerfile
          builder: ${{ steps.laddercache.outputs.name }}
          tags: ghcr.io/curie-eng/curie-worker:ci-local
          push: false
          load: true
          cache-from: type=gha,scope=ladder-worker
          cache-to: type=gha,mode=max,scope=ladder-worker
      - name: Parity ladder (skill + local rungs, fake model, credential-free)
        env:
          CURIE_BIN: cli/target/release/curie
          CURIE_BASE_TAG: ci-local
          CURIE_E2E_TIERS: ${{ needs.changes.outputs.skill_local_tiers }}
        run: bash cli/scripts/e2e-ladder.sh

  # LOCAL-RELEASE RUNG -- split into its own job (issue #695 follow-up) so it
  # runs in PARALLEL with the skill+local rung above instead of appended after
  # it, taking the release round trip off the ladder's critical path
  # (~30-50s wall-clock). A fresh runner shares no Docker daemon with e2e-ladder
  # so it must rebuild the images; the shared GHA layer cache defuses that --
  # these builds reuse the same cache scopes as the other ladder jobs, so on a
  # warm cache they cost the --load export, not a full
  # rebuild. Uses the same use:false / build-push-action mechanism.
  e2e-ladder-release:
    name: E2E parity ladder (local-release, fake model)
    runs-on: ubuntu-latest
    needs: [rust-build, changes]
    if: ${{ needs.changes.outputs.local_release == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download the curie binary built by the Rust job
        uses: actions/download-artifact@v8
        with:
          name: curie-x86_64-linux-${{ github.sha }}
          path: cli/target/release
      - name: Make the binary executable
        run: chmod +x cli/target/release/curie
      # Cache-only named builder (use: false) so the worker-local overlay's
      # `FROM :ci-local` (a plain `docker build` below) still resolves on the
      # default builder -- the same #803-safe mechanism the e2e-ladder job
      # documents in full.
      - name: Set up a cache-only buildx builder (named, NOT the default -- #803)
        id: releasecache
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          use: false
      - name: Build the runner image locally (gha layer cache)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: runner/Dockerfile
          builder: ${{ steps.releasecache.outputs.name }}
          tags: curie-runner
          push: false
          load: true
          cache-from: type=gha,scope=ladder-runner
          cache-to: type=gha,mode=max,scope=ladder-runner
      - name: Retag the runner image for the compose worker (CURIE_RUNNER_IMAGE, no registry auth)
        run: docker tag curie-runner ghcr.io/curie-eng/curie-runner:latest
      - name: Build the api image locally (satisfies curie-api + curie-migrate, no registry auth)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/api/Dockerfile
          builder: ${{ steps.releasecache.outputs.name }}
          tags: ghcr.io/curie-eng/curie-api:ci-local
          push: false
          load: true
          cache-from: type=gha,scope=ladder-api
          cache-to: type=gha,mode=max,scope=ladder-api
      - name: Build the worker base image locally (satisfies the worker-local overlay's FROM, no registry auth)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/worker/Dockerfile
          builder: ${{ steps.releasecache.outputs.name }}
          tags: ghcr.io/curie-eng/curie-worker:ci-local
          push: false
          load: true
          cache-from: type=gha,scope=ladder-worker
          cache-to: type=gha,mode=max,scope=ladder-worker
      - name: Build the ui image locally (satisfies the generated release compose, no registry auth)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/ui/Dockerfile
          builder: ${{ steps.releasecache.outputs.name }}
          tags: ghcr.io/curie-eng/curie-ui:latest
          push: false
          load: true
          cache-from: type=gha,scope=ladder-ui
          cache-to: type=gha,mode=max,scope=ladder-ui
      - name: Tag the api image for the generated release compose (ghcr.io/curie-eng/curie-api:latest, no registry auth)
        run: docker tag ghcr.io/curie-eng/curie-api:ci-local ghcr.io/curie-eng/curie-api:latest
      - name: Build the worker-local overlay for the generated release compose (ghcr.io/curie-eng/curie-worker-local:latest, no registry auth)
        run: docker build --build-arg BASE_TAG=ci-local -t ghcr.io/curie-eng/curie-worker-local:latest -f compose/worker-local.Dockerfile compose
      - name: Parity ladder (local-release rung against generated compose.release.yaml, fake model, credential-free)
        env:
          CURIE_BIN: cli/target/release/curie
          CURIE_E2E_TIERS: local-release
        run: bash cli/scripts/e2e-ladder.sh

  # COLD-START PARITY LADDER -- CLUSTER RUNG (issue #692). The one rung the
  # credential-free `e2e-ladder` job above deliberately does not run: the
  # deploy-then-message round trip against a real Helm-installed release on
  # Kubernetes. Deploy-then-message reachability (#352, #359) is one of the bug
  # classes the ladder exists to catch, and until this job existed it was the
  # only rung CI never gated -- verified by hand against a dev cluster before a
  # release. This stands up a DISPOSABLE kind cluster (thrown away with the
  # runner at job end), Helm-installs the platform through `curie cluster up`
  # (the operator wrapper, so the install path itself is exercised, not a
  # bespoke helm line), brings the runner prewarm DaemonSet up, and runs the
  # cluster rung of `cli/scripts/e2e-ladder.sh` (CURIE_E2E_TIERS=cluster).
  #
  # THE REACHABILITY CRUX (why this rung was cut from #690 and needs its own
  # job): the round trip is bidirectional. Host->cluster is easy -- `cluster
  # deploy`/`cluster message` self-plumb kubectl port-forwards and read the
  # release's UI `/api` NodePort. The hard leg is POD->HOST: the in-cluster
  # worker must POST its reply back to the host-bound Slack stub that `cluster
  # message` binds on 0.0.0.0 with a kernel assigned ephemeral port on THIS
  # runner. `cluster message`
  # auto-detects the host to advertise from the kubeconfig API-server address,
  # but a kind cluster's API server is bound on loopback (127.0.0.1:<port>), so
  # auto-detection yields 127.0.0.1 -- which an in-cluster pod cannot route to.
  # So the ladder is told the pod-reachable host explicitly via
  # CURIE_E2E_LISTEN_HOST (forwarded to `cluster message --listen-host`, the
  # documented operator escape hatch every loopback-API cluster needs): the kind
  # Docker network gateway -- the host's own address on the bridge every kind
  # node container sits on, which those containers (and pods egressing through
  # them) can always reach. The stub binds 0.0.0.0, so it answers on that bridge
  # address too. The UI NodePort (30080) is mapped to the host by the kind config
  # so `cluster deploy`'s NodePort discovery (which resolves the loopback
  # kubeconfig host) reaches the API through the UI proxy.
  #
  # Images: the four the cluster path needs (api, worker, ui, runner) are built
  # locally and `kind load`ed into the node store, then the install overrides
  # each image to the loaded tag with pullPolicy Never (mirroring
  # charts/curie/values-dev.yaml's offline posture) so the cluster never
  # reaches for the private GHCR refs it has no credentials for. The dispatcher
  # is NOT deployed -- no Slack ingress is needed, and a `<release>-dispatcher`
  # Deployment would trip `cluster message`'s guard against hijacking a live
  # workspace's replies. gVisor is forced off (kind nodes have no runsc). The
  # install is sealed with the fake model, so the whole rung stays
  # credential-free like the rest of the ladder.
  #
  # GitHub-hosted Docker-in-Docker + kind is confirmed by the first green run of
  # this job, not asserted from first principles (same posture as the
  # `e2e-ladder` job's docker-socket note): if the first run does not go green,
  # treat the kind/reachability path as unverified rather than assuming the
  # theory above is right. Kept a SEPARATE job from `e2e-ladder` on purpose: the
  # skill/local signal must never be reddened by a kind or Helm flake.
  changes:
    name: Select end to end tiers
    runs-on: ubuntu-latest
    outputs:
      skill: ${{ steps.filter.outputs.skill }}
      local: ${{ steps.filter.outputs.local }}
      local_release: ${{ steps.filter.outputs.local_release }}
      cluster: ${{ steps.filter.outputs.cluster }}
      skill_local_tiers: ${{ steps.filter.outputs.skill_local_tiers }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - id: filter
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            uv run --no-project --with pyyaml==6.0.3 python \
              tools/e2e-ci-selection/select.py \
              --registry .github/e2e-selection.yaml \
              --push
          else
            base="${{ github.base_ref }}"
            git fetch --quiet origin "$base"
            uv run --no-project --with pyyaml==6.0.3 python \
              tools/e2e-ci-selection/select.py \
              --registry .github/e2e-selection.yaml \
              --base "origin/$base" \
              --head HEAD
          fi

  e2e-ladder-cluster:
    name: E2E parity ladder (cluster rung on kind, fake model)
    runs-on: ubuntu-latest
    needs: [rust-build, changes]
    if: ${{ needs.changes.outputs.cluster == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download the curie binary built by the Rust job
        uses: actions/download-artifact@v8
        with:
          name: curie-x86_64-linux-${{ github.sha }}
          path: cli/target/release
      - name: Make the binary executable
        run: chmod +x cli/target/release/curie
      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.4
      # GHA-layer-cached builds via a named buildx builder that is NOT made the
      # default (`use: false`), same mechanism the `e2e-ladder` job documents.
      # `load: true` exports each image into the local daemon store so `kind
      # load` picks it up with no registry round trip. Only the four images the
      # cluster round trip actually needs; the dispatcher is not deployed.
      - name: Set up a cache-only buildx builder (named, NOT the default)
        id: clustercache
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          use: false
      - name: Build the api image locally
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/api/Dockerfile
          builder: ${{ steps.clustercache.outputs.name }}
          tags: curie-api:local
          push: false
          load: true
          cache-from: type=gha,scope=ladder-api
          cache-to: type=gha,mode=max,scope=ladder-api
      - name: Build the worker image locally
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/worker/Dockerfile
          builder: ${{ steps.clustercache.outputs.name }}
          tags: curie-worker:local
          push: false
          load: true
          cache-from: type=gha,scope=ladder-worker
          cache-to: type=gha,mode=max,scope=ladder-worker
      - name: Build the ui image locally
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/ui/Dockerfile
          builder: ${{ steps.clustercache.outputs.name }}
          tags: curie-ui:local
          push: false
          load: true
          cache-from: type=gha,scope=ladder-ui
          cache-to: type=gha,mode=max,scope=ladder-ui
      - name: Build the runner image locally
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: runner/Dockerfile
          builder: ${{ steps.clustercache.outputs.name }}
          tags: curie-runner:latest
          push: false
          load: true
          cache-from: type=gha,scope=ladder-runner
          cache-to: type=gha,mode=max,scope=ladder-runner
      # kind config: map the UI NodePort (chart default 30080) to the host so
      # `cluster deploy`'s UI `/api` NodePort discovery -- which resolves the
      # loopback kubeconfig host (127.0.0.1) -- reaches the in-cluster API.
      #
      # disableDefaultCNI is load-bearing (#1153). kind's default kindnet
      # implements NO NetworkPolicy controller, so every policy the chart ships
      # -- including Rail 1's default-deny egress for runner sandboxes
      # (ADR-0067) -- is applied and then silently never evaluated. A totally
      # broken policy is indistinguishable from a correct one, which is how an
      # egress rule naming a Service ClusterIP (unmatchable: kube-proxy DNATs
      # to a pod IP before policy runs) reached a real cluster. Calico is
      # installed below so this cluster behaves like the k3s and EKS clusters
      # Curie actually runs on.
      - name: Write the kind cluster config
        run: |
          cat > kind-config.yaml <<'EOF'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          networking:
            disableDefaultCNI: true
            podSubnet: "192.168.0.0/16"
          nodes:
            - role: control-plane
              extraPortMappings:
                - containerPort: 30080
                  hostPort: 30080
                  listenAddress: "127.0.0.1"
                  protocol: TCP
          EOF
      # Disposable kind cluster. Pins both the action and the kind/node-image
      # versions. The `kind` Docker network (created here) is the bridge every
      # node container sits on; its gateway is the host address the in-cluster
      # worker reaches the reply stub through, resolved below.
      - name: Create the kind cluster
        id: create_kind_cluster
        continue-on-error: true
        uses: helm/kind-action@v1.14.0
        with:
          version: v0.24.0
          node_image: kindest/node:v1.31.0
          cluster_name: curie-e2e
          config: kind-config.yaml
      # A first attempt that died partway can leave nodes behind, and
      # `kind create cluster` refuses to run against a cluster name that
      # already has any. Tear the partial cluster down so the retry starts
      # clean. `kind` is absent from PATH when attempt 1 died before the
      # action installed it, which is what the `|| true` covers.
      - name: Back off before retrying Create the kind cluster
        if: steps.create_kind_cluster.outcome == 'failure'
        run: |
          echo "Create the kind cluster failed on attempt 1 of 2, retrying in 15 seconds"
          kind delete cluster --name curie-e2e 2>/dev/null || true
          sleep 15
      - name: Create the kind cluster (retry)
        if: steps.create_kind_cluster.outcome == 'failure'
        uses: helm/kind-action@v1.14.0
        with:
          version: v0.24.0
          node_image: kindest/node:v1.31.0
          cluster_name: curie-e2e
          config: kind-config.yaml
      # The cluster has no CNI until this lands (disableDefaultCNI above), so
      # every node stays NotReady and nothing schedules until Calico is up.
      - name: Install Calico so NetworkPolicy is actually enforced
        run: |
          set -euo pipefail
          kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.28.2/manifests/calico.yaml
          kubectl -n kube-system rollout status daemonset/calico-node --timeout=300s
          kubectl wait --for=condition=Ready node --all --timeout=300s
      # Load the four locally-built images into the node store so the install's
      # pullPolicy Never overrides bind them with no registry pull.
      - name: Load images into the kind cluster
        run: |
          set -euo pipefail
          for img in curie-api:local curie-worker:local curie-ui:local curie-runner:latest; do
            kind load docker-image "$img" --name curie-e2e
          done
      # The pod-reachable host for the reply stub: the kind Docker network
      # gateway. Every node container sits on this bridge, so a pod egressing
      # through its node reaches the host here; the stub binds 0.0.0.0 and answers
      # on it. See this job's header for why auto-detection (loopback API server)
      # cannot produce this value on kind. Resolved before the install now that
      # the install trusts the stub origin, and it only needs the kind node
      # container, which is already running by here.
      - name: Resolve the pod-reachable host for the reply stub
        run: |
          set -euo pipefail
          # The kind bridge's IPv4 gateway is the host address every node -- and
          # every pod egressing through its node -- can reach; the stub binds
          # 0.0.0.0 and answers on it. The `kind` Docker network is frequently
          # dual-stack, so IPAM.Config carries both an IPv4 and an IPv6 entry in
          # an unspecified order (and an entry may omit Gateway) -- `index 0` is
          # not reliably the IPv4 one, which is why it came back empty. Read the
          # gateway the control-plane node container actually got first, then
          # fall back to ranging the network's IPAM for a dotted-quad gateway.
          node="curie-e2e-control-plane"
          gw="$(docker inspect "$node" --format '{{ .NetworkSettings.Networks.kind.Gateway }}' 2>/dev/null || true)"
          if [[ ! "$gw" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]]; then
            gw="$(docker network inspect kind \
                    --format '{{range .IPAM.Config}}{{println .Gateway}}{{end}}' 2>/dev/null \
                  | grep -E '^[0-9]{1,3}(\.[0-9]{1,3}){3}$' | head -1 || true)"
          fi
          if [[ ! "$gw" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]]; then
            echo "could not resolve the kind network IPv4 gateway" >&2
            echo "--- docker network inspect kind ---" >&2
            docker network inspect kind >&2 || true
            echo "--- docker inspect $node (.NetworkSettings.Networks) ---" >&2
            docker inspect "$node" --format '{{json .NetworkSettings.Networks}}' >&2 || true
            exit 1
          fi
          echo "kind network gateway (worker->stub reply host): $gw"
          echo "CURIE_E2E_LISTEN_HOST=$gw" >> "$GITHUB_ENV"
      # Helm-install the platform through the operator wrapper. --dev pins the
      # chart's deterministic published secrets (so `cluster message` can read
      # them back); --fake-model seals the install credential-free. The --set
      # overrides repoint every first-party image at the just-loaded local tags
      # with pullPolicy Never (the runner AND its prewarm DaemonSet), force gVisor
      # off (no runsc on kind nodes), and drop the dispatcher (no Slack; its
      # presence would trip the `cluster message` reply-hijack guard).
      # worker.slackTrustedOrigins is a CI only widening that lets the worker
      # answer the host side reply stub on any kernel assigned port on this
      # host. The portless origin is intentional because `cluster message`
      # requests an ephemeral port; the chart default stays empty and fail closed.
      - name: Install the platform (curie cluster up)
        env:
          CURIE_BIN: cli/target/release/curie
        run: |
          set -euo pipefail
          "$CURIE_BIN" cluster up \
            --chart charts/curie \
            --dev \
            --fake-model \
            --set security.gvisor.mode=off \
            --set dispatcher.deploy=false \
            --set worker.slackTrustedOrigins="http://${CURIE_E2E_LISTEN_HOST}" \
            --set api.image.repository=curie-api --set api.image.tag=local --set api.image.pullPolicy=Never \
            --set worker.image.repository=curie-worker --set worker.image.tag=local --set worker.image.pullPolicy=Never \
            --set ui.image.repository=curie-ui --set ui.image.tag=local --set ui.image.pullPolicy=Never \
            --set agentSandbox.runner.image=curie-runner --set agentSandbox.runner.tag=latest --set agentSandbox.runner.imagePullPolicy=Never \
            --set agentSandbox.runner.prewarm.imagePullPolicy=Never
      # `cluster up` does not `helm --wait` (the argv stays a thin wrapper), so
      # wait for the rollouts the round trip depends on before driving it. The
      # controller-ready preflight already gated the agent-sandbox controller
      # during install; these cover the app tier and the prewarm cache. Langfuse
      # and ClickHouse are intentionally NOT waited on -- a fake-model turn does
      # not need traces to have flushed, and they are the slowest pods to settle.
      - name: Wait for the platform to become ready
        run: |
          set -euo pipefail
          kubectl rollout status deploy/curie-api -n curie --timeout=300s
          kubectl rollout status deploy/curie-worker -n curie --timeout=300s
          kubectl rollout status deploy/curie-ui -n curie --timeout=300s
          kubectl rollout status daemonset/curie-runner-prewarm -n curie --timeout=300s
      # The cluster rung only: `cluster status` gate -> `cluster deploy` ->
      # `cluster message` (reply asserted). Fake model, credential-free.
      - name: Parity ladder (cluster rung, fake model, credential-free)
        env:
          CURIE_BIN: cli/target/release/curie
          CURIE_E2E_TIERS: cluster
        run: bash cli/scripts/e2e-ladder.sh
      # Rail 1 (ADR-0067) is a load-bearing security control that nothing else
      # here asserts ENFORCES -- only that its policies exist (#1153). Runs
      # after the round trip so a genuine turn failure surfaces first, and is
      # itself a non-vacuity check: it proves a DENIED direction is blocked
      # before trusting any allowed one, so it fails rather than passes green
      # if the CNI ever stops enforcing.
      - name: Rail 1 enforces (not just applied)
        env:
          CURIE_BIN: cli/target/release/curie
        run: bash scripts/check-netpol-enforcement.sh curie curie curie
      # Surface why on any failure above: pod states, recent events, and the
      # worker/runner logs are what localize a reachability or scheduling break.
      - name: Dump cluster diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl get events -n curie --sort-by=.lastTimestamp | tail -50 || true
          kubectl describe pods -n curie -l app.kubernetes.io/component=runner-sandbox || true
          kubectl logs -n curie -l app.kubernetes.io/component=worker --tail=100 || true

  e2e-required:
    name: E2E required
    runs-on: ubuntu-latest
    needs: [changes, e2e-ladder, e2e-ladder-release, e2e-ladder-cluster]
    # A cancelled run leaves no evidence and must rerun. In a completed run,
    # every dependency outcome reaches the strict matcher below, which rejects
    # selected results other than success.
    if: ${{ !cancelled() }}
    steps:
      - name: Require exact selected outcomes
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SKILL_SELECTED: ${{ needs.changes.outputs.skill }}
          LOCAL_SELECTED: ${{ needs.changes.outputs.local }}
          LOCAL_RELEASE_SELECTED: ${{ needs.changes.outputs.local_release }}
          CLUSTER_SELECTED: ${{ needs.changes.outputs.cluster }}
          SKILL_LOCAL_RESULT: ${{ needs.e2e-ladder.result }}
          LOCAL_RELEASE_RESULT: ${{ needs.e2e-ladder-release.result }}
          CLUSTER_RESULT: ${{ needs.e2e-ladder-cluster.result }}
        run: |
          set -euo pipefail

          validate_selected_outcomes() {
            if [[ "$SKILL_LOCAL_RESULT" != "$skill_local_expected" ||
                  "$LOCAL_RELEASE_RESULT" != "$local_release_expected" ||
                  "$CLUSTER_RESULT" != "$cluster_expected" ]]; then
              return 1
            fi
            return 0
          }

          if [[ "$CHANGES_RESULT" != "success" ||
                ( "$SKILL_SELECTED" != "true" && "$SKILL_SELECTED" != "false" ) ||
                ( "$LOCAL_SELECTED" != "true" && "$LOCAL_SELECTED" != "false" ) ||
                ( "$LOCAL_RELEASE_SELECTED" != "true" && "$LOCAL_RELEASE_SELECTED" != "false" ) ||
                ( "$CLUSTER_SELECTED" != "true" && "$CLUSTER_SELECTED" != "false" ) ]]; then
            echo "E2E required failed" >&2
            exit 1
          fi

          skill_local_expected="skipped"
          if [[ "$SKILL_SELECTED" == "true" || "$LOCAL_SELECTED" == "true" ]]; then
            skill_local_expected="success"
          fi
          local_release_expected="skipped"
          if [[ "$LOCAL_RELEASE_SELECTED" == "true" ]]; then
            local_release_expected="success"
          fi
          cluster_expected="skipped"
          if [[ "$CLUSTER_SELECTED" == "true" ]]; then
            cluster_expected="success"
          fi

          if ! validate_selected_outcomes; then
            echo "E2E required failed" >&2
            exit 1
          fi

          negative_skill_local_result="$skill_local_expected"
          negative_local_release_result="$local_release_expected"
          negative_cluster_result="$cluster_expected"
          if [[ "$skill_local_expected" == "success" ]]; then
            negative_skill_local_result="skipped"
          elif [[ "$local_release_expected" == "success" ]]; then
            negative_local_release_result="skipped"
          elif [[ "$cluster_expected" == "success" ]]; then
            negative_cluster_result="skipped"
          else
            negative_skill_local_result="success"
          fi

          if SKILL_LOCAL_RESULT="$negative_skill_local_result" \
            LOCAL_RELEASE_RESULT="$negative_local_release_result" \
            CLUSTER_RESULT="$negative_cluster_result" \
            validate_selected_outcomes; then
            echo "Selected and skipped negative control failed" >&2
            exit 1
          fi
          echo "Selected and skipped negative control passed"

          echo "E2E required passed"
