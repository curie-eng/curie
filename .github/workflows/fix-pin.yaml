name: Fix pin verification

on:
  pull_request:
    branches: [main, next, "task/**"]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  fix-pin:
    name: Fix pin verification
    runs-on: ubuntu-latest
    # #2230 measured the Python job as the sole critical path. On run
    # 34528877480 it was 26.4 minutes, and two of its steps were this gate: a
    # cold 251s `cargo build --release` plus a 127s verification, both appended
    # AFTER the 1048s pytest that neither of them depends on.
    #
    # #2228 stopped that build on pull requests that declare nothing. It did
    # not stop it for the ones that do, and this repository REQUIRES a
    # `Fix pin:` selector on every pull request closing a `bug` labelled issue,
    # so the declaring majority still paid all 6.3 minutes in series behind the
    # suite. Run 34528877480 is one of those: the build ran, for 251s.
    #
    # Nothing here is waste in itself, so this does not delete a step, it moves
    # them off the path. The build stays direct and restores a shared dependency
    # Cargo cache. rust-cache v2 defaults cache-workspace-crates to false,
    # removing the workspace's curie artifacts before saving. Its key hashes
    # rustc, Cargo.lock and Cargo.toml; Cargo fingerprints version, features,
    # profile and rustc, so curie is always compiled from this checkout.
    # A `rust` selector builds the debug crate in a detached worktree. Its
    # reversed run never uses the release driver as the code under test.
    # The comment it carried about living "inside the required Python status"
    # is now met by this job being its own required status.
    #
    # The dev stack is the one addition, and it is a correctness fix, not a
    # speed one. verify-fix-pin.sh runs `uv run pytest <selector>` for a
    # `python` selector; for an integration selector that dials Postgres and
    # Valkey. Inside the Python job the stack was already up and the gate
    # inherited it. Split out, it has to boot its own or those selectors fail
    # for the environment rather than for the pin.
    permissions:
      contents: read
      # `issues: read` is what lets this gate read the labels of the closed
      # issues a pull request names, through the Issues API.
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          # verify-fix-pin.sh resolves HEAD and adds a detached worktree at it,
          # and the gate diffs against the base, so the full history is needed.
          fetch-depth: 0
          persist-credentials: false
      # Retry eligibility (#1106): this step's whole job is to ACQUIRE a
      # third-party tool, so it may be wrapped. The verification below is this
      # repository's own gate and is deliberately not.
      - name: Install uv
        id: install_uv
        continue-on-error: true
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
      - name: Back off before retrying Install uv
        if: steps.install_uv.outcome == 'failure'
        run: |
          echo "Install uv failed on attempt 1 of 2, retrying in 15 seconds"
          sleep 15
      - name: Install uv (retry)
        if: steps.install_uv.outcome == 'failure'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
      - name: Sync workspace
        run: uv sync
      # Setup follows the parsed requirements. Verification always runs so
      # malformed or missing declarations still reach the policy gate.
      - name: Decide whether the current curie binary is needed
        id: fix-pin-curie
        run: >-
          python3 tools/fix-pin-ci/check.py
          --event "$GITHUB_EVENT_PATH"
          --needs-curie
      - name: Prepare source-local factory upgrade artifacts
        if: steps.fix-pin-curie.outputs.needs_factory_upgrade == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.projects/4628/tmp" \
            "$GITHUB_WORKSPACE/.projects/4628/assets"
          echo "TMPDIR=$GITHUB_WORKSPACE/.projects/4628/tmp" >> "$GITHUB_ENV"
          echo "CURIE_C4_RELEASE_ASSETS=$GITHUB_WORKSPACE/.projects/4628/assets" >> "$GITHUB_ENV"
      - name: Cargo cache
        if: steps.fix-pin-curie.outputs.needed == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: cli
          shared-key: curie-cli-release
          cache-on-failure: true
      - name: Build the current curie binary for fix pin verification
        if: steps.fix-pin-curie.outputs.needed == 'true'
        run: cargo build --release --locked --manifest-path cli/Cargo.toml
      # A `chart` selector runs charts/curie/ci/<name>.sh, which needs Helm.
      - name: Install Helm for fix pin verification
        if: steps.fix-pin-curie.outputs.needed == 'true'
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.16.4
      - name: Ensure kind-registry exists
        if: steps.fix-pin-curie.outputs.needs_kind == 'true'
        run: bash cli/scripts/ensure-kind-registry.sh
      - name: Install kind and kubectl without creating a cluster
        if: steps.fix-pin-curie.outputs.needs_kind == 'true'
        id: install_kind
        continue-on-error: true
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.24.0
          node_image: kindest/node:v1.31.0
          install_only: true
      - name: Back off before retrying Install kind and kubectl without creating a cluster
        if: steps.fix-pin-curie.outputs.needs_kind == 'true' && steps.install_kind.outcome == 'failure'
        run: |
          echo "Install kind and kubectl without creating a cluster failed on attempt 1 of 2, retrying in 15 seconds"
          bash cli/scripts/ensure-kind-registry.sh
          sleep 15
      - name: Install kind and kubectl without creating a cluster (retry)
        if: steps.fix-pin-curie.outputs.needs_kind == 'true' && steps.install_kind.outcome == 'failure'
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.24.0
          node_image: kindest/node:v1.31.0
          install_only: true
      - name: Download and verify the exact public v0.12.5 factory upgrade assets
        if: steps.fix-pin-curie.outputs.needs_factory_upgrade == 'true'
        run: |
          set -euo pipefail
          release_url=https://github.com/curie-eng/curie/releases/download/v0.12.5
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 \
            -o "$CURIE_C4_RELEASE_ASSETS/checksums.txt" "$release_url/checksums.txt"
          for asset in curie-0.12.5.tgz curie-x86_64-unknown-linux-gnu; do
            curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 \
              -o "$CURIE_C4_RELEASE_ASSETS/$asset" "$release_url/$asset"
            awk -v asset="$asset" '$2 == asset {print; count++} END {if (count != 1) exit 1}' \
              "$CURIE_C4_RELEASE_ASSETS/checksums.txt" | (
                cd "$CURIE_C4_RELEASE_ASSETS"
                sha256sum --check --strict
              )
          done
      # Use the same migration, authenticated read and worker readiness gate
      # as the Python job before executing any pinned integration selector.
      - name: Start dev stack
        if: steps.fix-pin-curie.outputs.needs_stack == 'true'
        run: python3 scripts/wait-for-langfuse.py --start --timeout-seconds 480
      - name: Wait for Langfuse to serve
        if: steps.fix-pin-curie.outputs.needs_stack == 'true'
        run: python3 scripts/wait-for-langfuse.py
      # A pinned worker binding test dials the shared default database and
      # assumes the curie schema exists, exactly as it does under the Python
      # job, so the same migration runs here.
      - name: Migrate the shared database
        if: steps.fix-pin-curie.outputs.needs_stack == 'true'
        working-directory: apps/api
        run: uv run alembic upgrade head
      - name: Require declared fixes to be pinned by a changed test
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/cli/target
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python3 tools/fix-pin-ci/check.py
          --event "$GITHUB_EVENT_PATH"
          --curie cli/target/release/curie
          --ref HEAD
      # Every dev-stack service sits behind the compose `full` profile. Without
      # --profile full, `docker compose logs` matches no service and prints
      # nothing, so a real outage gets diagnosed with no container logs at all.
      - name: Dump dev stack logs on failure
        if: ${{ failure() && steps.fix-pin-curie.outputs.needs_stack == 'true' }}
        run: docker compose --profile full -f compose.dev.yaml logs --no-color --tail=200
