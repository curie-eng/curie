# @spec STARTABILITY-7; boundary replays are not the STARTABILITY-8 runtime gate.
name: SRE startability observer

on:
  pull_request:
    branches: [main, next, "epic/**"]
    paths:
      - "examples/sre-bot/observability/startability/**"
      - "examples/sre-bot/docs/STARTABILITY.md"
      - "apps/worker/src/curie_worker/sandbox/types.py"
      - "apps/worker/src/curie_worker/sandbox/substrate.py"
      - "apps/worker/src/curie_worker/binding.py"
      - "apps/worker/src/curie_worker/run.py"
      - "packages/curie-internal/**"
      - "packages/aci-protocol/**"
      - "packages/plugin-format/**"
      - "examples/tests/test_startability_observer.py"
      - "uv.lock"
      - ".github/workflows/startability.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  startability-contract:
    name: SRE startability contract verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - name: Lint observer and tests
        run: uv run ruff check examples/sre-bot/observability/startability examples/tests/test_startability_observer.py
      - name: Type check observer
        run: uv run mypy examples/sre-bot/observability/startability/observer.py
      - name: Exercise observer command and current worker policy
        run: uv run pytest -q examples/tests/test_startability_observer.py
