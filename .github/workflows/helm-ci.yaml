name: Helm CI

# charts/curie is the highest-blast-radius surface in the repo: a hardcoded
# value in a template applies to every install with no rollout control. This
# job gives the chart the CI it otherwise lacks -- lint, render every shipped
# values overlay, and schema-validate the rendered manifests.
on:
  # Push runs for every releasable commit because release authorization
  # requires this check. Pull requests remain filtered to chart changes.
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]
    paths:
      - "charts/curie/**"
      - "examples/sre-bot/observability/**"
      - ".github/workflows/helm-ci.yaml"
      # The object-store web-identity gate below EXECUTES these repository
      # files, so a change to one of them can break the gate without touching
      # any charts/ path. Without them in this filter, a PR that reverts the
      # credential fix matches nothing here, the whole helm job is skipped, and
      # the gate that exists to catch exactly that revert never runs. That is
      # the difference between a gate and a gate-shaped thing.
      - "packages/aci-protocol/src/aci_protocol/s3.py"
      - "apps/api/src/curie_api/config.py"
      - "apps/api/src/curie_api/storage.py"
      - "apps/worker/src/curie_worker/config.py"
      - "apps/worker/src/curie_worker/bundle_store.py"
      - "uv.lock"
      - "pyproject.toml"
      # The unpinned-image gate (#2319) and the Langfuse image-pin gate
      # (#2190) both read compose.dev.yaml to check third-party image tags,
      # so a compose-only edit that unpins one must run this workflow too.
      - "compose.dev.yaml"

permissions:
  contents: read

env:
  CHART: charts/curie
  # Chart.yaml pins kubeVersion ">=1.25.0-0"; validate the rendered manifests
  # against a concrete, currently-supported minor.
  KUBE_VERSION: "1.29.0"
  KUBECONFORM_VERSION: v0.6.7

jobs:
  helm:
    name: Chart (lint + template + kubeconform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.4

      - name: Install kubeconform
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform
          kubeconform -v
          # The validate steps normalize rendered manifests through PyYAML (see
          # below). It ships on ubuntu-latest, but ensure it explicitly so this
          # job is not coupled to the runner image.
          python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml

      # Lint the default values plus every e2e overlay the chart ships.
      # values-e2e-nogvisor.yaml is a partial overlay (it only forces gVisor
      # OFF), so it is layered on values-dev.yaml exactly as an e2e/scratch
      # install applies it.
      - name: helm lint
        run: |
          set -euo pipefail
          helm lint "$CHART"
          helm lint "$CHART" -f "$CHART/values-dev.yaml"
          helm lint "$CHART" -f "$CHART/values-dev.yaml" -f "$CHART/values-e2e-nogvisor.yaml"

      # Render each overlay and schema-validate the output with kubeconform.
      #
      # Two normalizations keep validation honest without editing the chart:
      #  * The chart's Sandbox* custom resources (extensions.agents.x-k8s.io)
      #    have no published kubeconform schema, so -ignore-missing-schemas skips
      #    them while every core / apps / rbac / networking object is validated
      #    strictly.
      #  * Some pod templates emit an app.kubernetes.io/{name,instance} label
      #    twice with an identical value (last-wins, harmless to Kubernetes),
      #    which kubeconform's strict YAML parser rejects as a duplicate map key.
      #    Piping through PyYAML first collapses duplicate keys so schema
      #    validation can run. Removing the chart-side duplicate labels is a
      #    separate follow-up, out of scope for this CI-only change.
      - name: helm template + kubeconform (default values)
        run: |
          set -euo pipefail
          helm template "$CHART" \
            | python3 -c "import sys, yaml; yaml.safe_dump_all(yaml.safe_load_all(sys.stdin), sys.stdout)" \
            | kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version "$KUBE_VERSION"

      # Prove the credential Secret generates strong per-release values on the
      # sealed path (issue #195) while the dev overlay keeps its deterministic
      # published defaults. Runs the chart-owned assertion script.
      - name: helm render assertions (credential generation)
        run: |
          set -euo pipefail
          bash charts/curie/ci/render-assertions.sh

      # Prove the API Service keeps a stable NodePort when enabled, allows an
      # override, and omits the field for ClusterIP or explicit auto allocation.
      - name: helm render assertions (api service NodePort)
        run: |
          set -euo pipefail
          bash charts/curie/ci/api-service-nodeport-assertions.sh

      # Prove the retired BYO-model LiteLLM sidecar (issue #253) is absent by
      # default and that enabling its values flag is refused by the chart
      # guard. Runs the chart-owned assertion script.
      - name: helm render assertions (litellm sidecar)
        run: |
          set -euo pipefail
          bash charts/curie/ci/litellm-sidecar-assertions.sh

      # Prove cluster-local inference cannot silently download model weights
      # into an emptyDir (issue #1779): the unsafe pull+ephemeral combination
      # fails with both recovery paths, while durable pulls and explicitly
      # pre-provisioned/no-pull ephemeral models retain their intended shapes.
      - name: helm render assertions (inference download guard)
        run: |
          set -euo pipefail
          bash charts/curie/ci/inference-download-guard-assertions.sh

      # Prove the direct-passthrough existingSecret escape (issue #1759): the
      # eight keys that previously had none now resolve to the chart's own
      # Secret by default and to an operator-named Secret when
      # <field>ExistingSecret is set, in EVERY consumer of a multi-consumer
      # key (agentCredentials, slackBotToken) and winning over a stale inline
      # value; and the two parity-seam gates the escape would otherwise trip
      # (curie.dispatcher.enabled, the agentCredentials render gate) now open
      # on a BYO-only credential too.
      - name: helm render assertions (direct-passthrough existingSecret)
        run: |
          set -euo pipefail
          bash charts/curie/ci/direct-passthrough-existing-secret-assertions.sh

      # Prove ClickHouse's own telemetry stays bounded: logger at `warning`, the
      # four firehose system log tables removed, and whatever remains carrying a
      # TTL. At image defaults ClickHouse logs at `trace` and keeps 30 days of
      # self-telemetry -- measured at 2.72 GiB against 31 KiB of real Langfuse
      # data, filling a 3Gi volume in eight days and ending in a merge that
      # exceeded the memory limit and retried forever, starving the node until
      # every agent turn escalated as an opaque `runner-error`.
      - name: helm render assertions (clickhouse self-telemetry)
        run: |
          set -euo pipefail
          bash charts/curie/ci/clickhouse-logging-assertions.sh

      # Prove Langfuse honors existingSecret for BYO valkey, postgres, and its
      # own app keys (#2052, #2327). A supported BYO install has every other
      # component read the operator's Secret except Langfuse: api and worker
      # authenticate against the real postgres while both Langfuse Deployments
      # present the chart-generated password and crash-loop at Prisma auth --
      # so ingestion dies alone while the rest of the release stays healthy.
      - name: helm render assertions (langfuse store existingSecret)
        run: |
          set -euo pipefail
          bash charts/curie/ci/valkey-existing-secret-assertions.sh

      # Prove a BYO Valkey can be reached over TLS, and that the signal reaches
      # every consumer of that store rather than some of them (#2315). Every
      # managed Redis-compatible service an operator would bring is TLS-only or
      # TLS-by-default and redis-py never downgrades, so a half-applied
      # transport takes down the api, worker, dispatcher and both Langfuse
      # Deployments at once with a healthy-looking render. Also proves the
      # guard refuses valkey.tls against the in-chart store, which serves no
      # TLS listener.
      - name: helm render assertions (valkey TLS)
        run: |
          set -euo pipefail
          bash charts/curie/ci/valkey-tls-assertions.sh

      # Prove the tenant capacity ceiling actually binds the pods it is meant to.
      # The quota is PriorityClass-scoped, so if its scope is not the name the
      # sandbox pods carry it matches nothing and enforces nothing -- silently,
      # because the object exists and `used: 0` reads as "nothing consumed"
      # rather than "matching nothing". Observed live: a sandbox holding
      # `limits.cpu: 1` running while the quota reported used 0, with the scoped
      # class absent from the cluster entirely (#1534). Compares the two rendered
      # objects against each other, not a value against itself.
      - name: helm render assertions (sandbox quota scope)
        run: |
          set -euo pipefail
          bash charts/curie/ci/sandbox-quota-scope-assertions.sh

      - name: helm render assertions (otel collector checksum)
        run: |
          set -euo pipefail
          bash charts/curie/ci/otel-collector-checksum-assertions.sh

      # Metadata only chart and app bumps must not recycle stateful backing stores.
      - name: helm render assertions (stateful metadata rollout isolation)
        run: |
          set -euo pipefail
          bash charts/curie/ci/statefulset-metadata-rollout-assertions.sh

      - name: helm render assertions (otel collector durable delivery)
        run: |
          set -euo pipefail
          bash charts/curie/ci/otel-collector-durability-assertions.sh

      - name: helm render assertions (SRE bot observability stack)
        run: |
          set -euo pipefail
          bash charts/curie/ci/observability-stack-assertions.sh

      # Prove the collector's Langfuse credential and the Secret that carries it
      # stay the same decision (issue #1563): under `langfuse.existingSecret` the
      # collector follows the operator's Secret, the chart-managed Secret ships no
      # stale dev-derived header for it to read, and the default-credential gate
      # refuses the published dev header on that path instead of going green.
      - name: helm render assertions (collector langfuse secret wiring)
        run: |
          set -euo pipefail
          bash charts/curie/ci/otel-collector-langfuse-secret-assertions.sh

      - name: helm render assertions (BYO Langfuse host)
        run: |
          set -euo pipefail
          bash charts/curie/ci/langfuse-byo-assertions.sh

      # Keep the shipped Helm and Compose Langfuse images on one exact,
      # reviewed migration set. A floating major tag can move between jobs and
      # leave the two stores on incompatible migration state (#2190).
      - name: helm render assertions (langfuse image pin)
        run: |
          set -euo pipefail
          bash charts/curie/ci/langfuse-image-pin-assertions.sh

      # Refuse untagged, :latest and major/minor-alias image references in
      # values *Image keys, in rendered container image fields, and in
      # compose.dev.yaml services (#2318, #2319). The security probe's netshoot
      # image was the first miss: a bare repository pulls :latest with implicit
      # Always. An alias like postgres:16-alpine is the subtler one -- it has a
      # tag, but upstream republishes it under the chart version.
      - name: helm render assertions (unpinned images)
        run: |
          set -euo pipefail
          bash charts/curie/ci/unpinned-image-assertions.sh

      # Prove postgres.podSecurityContext.fsGroup is the gid of the `postgres`
      # user inside the digest-pinned image, by running that image (#2319). The
      # chart shipped the Debian 999 against an Alpine build where it is 70,
      # which no render-only assertion can see.
      - name: helm render assertions (postgres fsGroup matches the image)
        run: |
          set -euo pipefail
          bash charts/curie/ci/postgres-fsgroup-assertions.sh

      # Keep the chart ClickHouse default and Langfuse pin as one supported
      # pair. ClickHouse 24.8 cannot apply Langfuse 3.225.x migration 39, so
      # the default must stay on 25.12 and AVX-required (#2210).
      - name: helm render assertions (clickhouse langfuse pin pair)
        run: |
          set -euo pipefail
          bash charts/curie/ci/clickhouse-langfuse-pin-assertions.sh

      # Prove both Langfuse Deployments use Recreate so an image change never
      # runs two boot migrations against the same database (#2216).
      - name: helm render assertions (langfuse Recreate strategy)
        run: |
          set -euo pipefail
          bash charts/curie/ci/langfuse-recreate-assertions.sh

      # Prove Langfuse startup is gated on ClickHouse being up (issue #2009). A
      # Helm upgrade that recreates the ClickHouse Service otherwise lets the new
      # Langfuse pods start their migrations against an unresolvable name, so the
      # rollout converges only through CrashLoopBackOff. This one EXECUTES the
      # rendered init-container script against a stub ClickHouse that is down and
      # then comes up, so it fails on a gate that merely renders without waiting.
      - name: helm render assertions (langfuse clickhouse readiness gate)
        run: |
          set -euo pipefail
          bash charts/curie/ci/langfuse-clickhouse-readiness-assertions.sh

      # Prove the Langfuse web+worker containers carry a numeric runAsUser
      # alongside runAsNonRoot (issue #351) so the kubelet can verify non-root
      # and the pods actually start on an enforcing cluster.
      - name: helm render assertions (langfuse runAsUser)
        run: |
          set -euo pipefail
          bash charts/curie/ci/langfuse-runasuser-assertions.sh

      # Prove the Postgres readiness gate is rendered on BOTH Langfuse
      # Deployments (#2330: it was web-only, so langfuse-worker crash-looped on
      # the same Prisma P1001 that #1853 fixed for web), ordered before the
      # ClickHouse gate on each, credential-free, bounded/tunable, hardened from
      # each Deployment's OWN containerSecurityContext, and removable through its
      # values switch. `langfuse.web.postgresReadiness` stays honoured as a
      # deprecated alias applied to both Deployments -- not refused, because a
      # render fail would abort `helm upgrade --reuse-values` on exactly the
      # releases that need the gate. Includes red mutations, armed per Deployment.
      - name: helm render assertions (langfuse postgres readiness)
        run: |
          set -euo pipefail
          bash charts/curie/ci/langfuse-postgres-readiness-assertions.sh

      # Prove langfuse-worker carries both probes on its :3030 endpoint -- #71's
      # criterion is that every Deployment with a persistent process has both a
      # readiness and a liveness probe, and the worker was the last violation.
      # Readiness is the SIGTERM-aware /api/ready so a terminating pod drains;
      # liveness is tcpSocket so a Postgres or Valkey blip cannot restart the
      # single replica into its boot migrations (#71, #2330).
      - name: helm render assertions (langfuse worker probes)
        run: |
          set -euo pipefail
          bash charts/curie/ci/langfuse-worker-probe-assertions.sh

      # Prove the probe-window invariant across the WHOLE render, not a named
      # list: for every container carrying both probes, the liveness failure
      # cutoff -- initialDelaySeconds + (failureThreshold - 1) * periodSeconds,
      # kubelet defaults applied to omitted keys -- must be strictly LATER than
      # the readiness one, or the kubelet restarts a container that is still
      # inside the boot window readiness was sized to tolerate. postgres (WAL
      # replay), langfuse-web and langfuse-worker (Prisma/ClickHouse boot
      # migrations) and api all inverted the two probes. Also requires an
      # explicit livenessProbe timeoutSeconds everywhere, since the kubelet's
      # invisible 1s default is the silent half of the postgres case.
      - name: helm render assertions (probe windows)
        run: |
          set -euo pipefail
          bash charts/curie/ci/probe-window-assertions.sh

      # Prove the controller NetworkPolicy RBAC split (issue #350): exactly one
      # read-only cluster grant (get/list/watch) so the informer syncs, no
      # cluster-wide mutate anywhere (#66 guarded), namespaced mutate intact, and
      # the controller-ready install gate renders/suppresses with its flags.
      - name: helm render assertions (controller netpol RBAC)
        run: |
          set -euo pipefail
          bash charts/curie/ci/controller-rbac-assertions.sh

      # Prove per-agent connector secrets (ADR-0009, #429) render as their own
      # Secret, do not leak into the shared chart Secret, and are absent by
      # default.
      - name: helm render assertions (per-agent connector secrets)
        run: |
          set -euo pipefail
          bash charts/curie/ci/connector-secrets-assertions.sh

      # Prove the API ingress (issue #1238): opt-in, fails loudly without a
      # host rather than matching every request, and honours tls.enabled and
      # api.service.port. The API is the one endpoint reached from outside the
      # cluster, and X-API-Key crosses it on every authenticated call.
      - name: helm render assertions (api ingress)
        run: |
          set -euo pipefail
          bash charts/curie/ci/api-ingress-assertions.sh

      # Prove the GitHub App credential (ADR-0092): the App ID reaches the API
      # as digits (a float renders as "4.47597e+06" and 401s every call), and a
      # BYO existingSecret is REFERENCED rather than copied into helm's stored
      # values, where it would land in every retained release revision.
      - name: helm render assertions (github app credential)
        run: |
          set -euo pipefail
          bash charts/curie/ci/github-app-credential-assertions.sh

      # Prove the sealing keypair's handling (ADR-0094). It is the one credential
      # in this chart nobody can regenerate: losing it does not rotate anything,
      # it makes every value sealed to it -- in every agent repository --
      # permanently unreadable. So the chart must never GENERATE one (a
      # chart-side random would mint a new key on every upgrade, since there is
      # no lookup-persist), only the worker may receive it, and both the current
      # and previous keys must render so a rotation can overlap.
      - name: helm render assertions (sealing keypair)
        run: |
          set -euo pipefail
          bash charts/curie/ci/sealing-key-assertions.sh

      # Prove the connector reconciler's RBAC (ADR-0090, #1184): absent when the
      # reconciler is off, and when on, exactly {create,list,patch,delete} on
      # exactly the four kinds the client handles. `create` is load-bearing --
      # a server-side apply of a missing object is authorized as a create, so
      # dropping it breaks first-run while leaving updates working.
      - name: helm render assertions (connector reconciler RBAC)
        run: |
          set -euo pipefail
          bash charts/curie/ci/connector-reconciler-rbac-assertions.sh

      - name: helm render assertions (remote dev capability)
        run: |
          set -euo pipefail
          bash charts/curie/ci/remote-dev-capability-assertions.sh

      # The pre-upgrade drain gate (issue #2010). A routine `helm upgrade` used
      # to admit a side-effecting turn and then roll the worker and its backing
      # services out from under it, so the replacement reclaimed the delivery
      # and escalated accepted work to a human. These assertions prove the gate
      # is wired to the hook phases that actually run before the roll, that its
      # clocks are derived from the delivery budget rather than silently left
      # too short, and that the one self-contradictory value pair is refused at
      # render time.
      - name: helm render assertions (upgrade drain gate)
        run: |
          set -euo pipefail
          bash charts/curie/ci/upgrade-drain-assertions.sh

      # The resume reconciler may enqueue a replacement turn only after the
      # prior delivery has exhausted both its delivery budget and terminal
      # settlement reserve. Prove the default derives from that floor and an
      # explicitly shorter override is rejected during rendering.
      - name: helm render assertions (API resume reconciler grace)
        run: |
          set -euo pipefail
          bash charts/curie/ci/api-resume-reconciler-grace-assertions.sh

      # Prove every container in the untrusted sandbox pod renders the identical
      # Rail 3 hardened securityContext from the shared helper (issue #493), so a
      # helper edit that weakens the lockdown -- or a container that skips it --
      # fails CI rather than silently shipping a looser sandbox.
      - name: helm render assertions (sandbox hardening)
        run: |
          set -euo pipefail
          bash charts/curie/ci/sandbox-hardening-assertions.sh

      # Prove every writable emptyDir volume in the sandbox pod (bundles,
      # mc-config, and one per hardening.writablePaths entry) carries an
      # explicit sizeLimit (ADR-0059 decision 2, issue #756), and that a
      # lengthened writablePaths list still gets one on every entry rather
      # than only the two default paths.
      - name: helm render assertions (sandbox emptyDir sizeLimit)
        run: |
          set -euo pipefail
          bash charts/curie/ci/sandbox-emptydir-sizelimit-assertions.sh

      # Prove the dispatcher is told where the platform API is and how to
      # authenticate to it (issue #442), and that the UI's CURIE_API_TARGET
      # uses the same helper (issue #2316). Unwired, the dispatcher falls back
      # to its code default http://localhost:8000 -- itself -- and every Slack
      # Approve click dead-ends with only a warning. An unwired UI stays Ready
      # while every /api/ request fails at the proxy, so api.deploy=false with
      # an empty ui.apiBaseUrl must fail the render closed.
      - name: helm render assertions (dispatcher API wiring)
        run: |
          set -euo pipefail
          bash charts/curie/ci/dispatcher-api-wiring-assertions.sh

      - name: helm render assertions (approval principal wiring)
        run: |
          set -euo pipefail
          bash charts/curie/ci/approval-principal-wiring-assertions.sh

      # Prove the mail adapter's chart wiring (issue #1515): it does not render
      # at all by default, it is told where the platform API is, it receives its
      # channel token, egress secret and AgentMail key by reference only, and it
      # receives NO CURIE_API_KEY -- the adapter authenticates with a token
      # scoped to one channel binding and must hold no platform key. The same
      # script pins the single-source-of-truth egress pair and the rotation
      # annotations on both this Deployment and the worker.
      - name: helm render assertions (mail adapter wiring)
        run: |
          set -euo pipefail
          bash charts/curie/ci/mail-adapter-wiring-assertions.sh

      # Prove the tenant capacity ceiling (issue #758, ADR-0059 decision 4): the
      # ResourceQuota scopes to the sandbox PriorityClass with the published
      # (overridable) hard ceilings, the LimitRange ships safe default-only
      # per-container defaults, both toggle independently and with
      # agentSandbox.deploy, and the N=1 self-host control plane stays fully
      # self-declared on cpu/memory (so the new LimitRange defaults never
      # engage for it).
      - name: "helm render assertions (tenant capacity: ResourceQuota + LimitRange)"
        run: |
          set -euo pipefail
          bash charts/curie/ci/tenant-capacity-assertions.sh

      # Prove the runner and both bundle init containers declare an
      # ephemeral-storage request AND limit (ADR-0059 decision 1, issue #755),
      # and that the ceiling is operator-overridable (decision 6). Before this,
      # disk was the one resource dimension with no ceiling at all.
      - name: helm render assertions (ephemeral-storage ceilings)
        run: |
          set -euo pipefail
          bash charts/curie/ci/ephemeral-storage-assertions.sh

      # Prove values.schema.json bounds the three worker TTL/timeout knobs at
      # both ends (issue #1388): 0, a negative, 31536001 and a non-integer are
      # refused by helm itself, while the shipped defaults, legitimate tuning
      # and the value exactly at the maximum still render. `routeTtlSeconds: 0`
      # is valid YAML that installs green and then hangs every turn, leaking a
      # sandbox per attempt, so the value must never reach worker env. Also the
      # blast-radius net for the schema: a chart-root values.schema.json is
      # validated against the WHOLE coalesced values tree on
      # lint/template/install/upgrade, so an over-specified one breaks every
      # install, and this asserts every overlay this job already exercises
      # still lints and renders clean.
      - name: helm render assertions (worker TTL bounds)
        run: |
          set -euo pipefail
          bash charts/curie/ci/worker-ttl-bounds-assertions.sh

      # Prove the API and the worker agree about the object store. The API writes
      # each uploaded plugin bundle to the bundle bucket and the worker reads it
      # back, so a disagreement -- or an omission -- makes every bundle
      # unfetchable. worker.yaml set none of the four variables, so the worker
      # used its compose defaults (localhost:29000) and every fetch in
      # Kubernetes hit ECONNREFUSED. Both symptoms point elsewhere: the
      # post-deploy eval goes quiet with "unresolvable suite/bundle", and turns
      # die as ClaimTimeoutError, whose message blames a CPU-saturated node --
      # on the install where this was found the node was at 11% CPU.
      - name: helm render assertions (worker/api object store agree)
        run: |
          set -euo pipefail
          bash charts/curie/ci/worker-object-store-assertions.sh

      # A default worker missing these values runs eval suites that cannot
      # record or report results.
      - name: helm render assertions (worker eval wiring)
        run: |
          set -euo pipefail
          bash charts/curie/ci/worker-eval-wiring-assertions.sh

      # This otherwise Python-free chart job needs the workspace because the
      # web-identity gate below does not stop at the rendered YAML: it builds
      # the real API and worker BundleStore objects under each rendered
      # workload's env and asks the constructed boto3 client which credential
      # provider won. Reading the manifests alone cannot tell an omitted
      # credential apart from one the SDK signs as an empty identity.
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.13"
      - name: Sync workspace
        run: uv sync

      # Prove the key-free object store path (#1325, #2211). Pointing the bundle
      # store at a real cloud object store used to REQUIRE static access keys:
      # all four consumers (api, worker, bundle-fetch, Langfuse) supplied
      # explicit credentials unconditionally, so an ambient role was never
      # consulted. Clearing rustfs.auth.accessKey now omits every credential env
      # and shell export, which only works if the omission is COMPLETE -- an
      # empty AWS_ACCESS_KEY_ID is still a credential to the SDK, so it stops
      # the provider chain and the web-identity provider is never reached. Also
      # asserts the instance-role shortcut stays shut: NetworkPolicy selects
      # pods and not containers, so opening IMDS for bundle-fetch would hand
      # the node's IAM role to the runner as well.
      - name: helm render assertions (object store web identity)
        run: |
          set -euo pipefail
          bash charts/curie/ci/object-store-web-identity-assertions.sh

      # Prove a BYO object store gets a runner egress allow for S3 (and STS on
      # the key-free path). Rail 1 is fail-closed and the in-chart rustfs pod
      # selector does not render when rustfs.deploy is false, so a default-shaped
      # BYO install used to hang every sandbox in Init (#2213).
      - name: helm render assertions (BYO object store runner egress)
        run: |
          set -euo pipefail
          bash charts/curie/ci/object-store-byo-egress-assertions.sh

      # Prove the same for the other two in-chart runner carve-outs: a BYO
      # collector or API endpoint renders its own ipBlock allow and is refused
      # at render without one. Assertion 10 is the class guard -- a future
      # `.deploy` carve-out added without a BYO else branch fails here rather
      # than in a customer's silently trace-less or amnesiac install (#2317).
      - name: helm render assertions (BYO collector/API runner egress)
        run: |
          set -euo pipefail
          bash charts/curie/ci/byo-endpoint-egress-assertions.sh

      # Prove a nil worker.publication.githubHttpsCidrs cannot collapse the
      # tokenless publication job's GitHub egress rule to an empty to: (allow-all
      # on 443). Also rejects that empty-to shape on every rendered
      # NetworkPolicy, not just this one template (#2321).
      - name: helm render assertions (NetworkPolicy empty egress to)
        run: |
          set -euo pipefail
          bash charts/curie/ci/networkpolicy-empty-to-assertions.sh

      - name: helm template + kubeconform (values-dev overlay)
        run: |
          set -euo pipefail
          helm template "$CHART" -f "$CHART/values-dev.yaml" \
            | python3 -c "import sys, yaml; yaml.safe_dump_all(yaml.safe_load_all(sys.stdin), sys.stdout)" \
            | kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version "$KUBE_VERSION"

      - name: helm template + kubeconform (e2e nogvisor overlay)
        run: |
          set -euo pipefail
          helm template "$CHART" -f "$CHART/values-dev.yaml" -f "$CHART/values-e2e-nogvisor.yaml" \
            | python3 -c "import sys, yaml; yaml.safe_dump_all(yaml.safe_load_all(sys.stdin), sys.stdout)" \
            | kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version "$KUBE_VERSION"
