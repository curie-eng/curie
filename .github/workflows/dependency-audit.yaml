name: Dependency Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Advisory databases change independently of the code, so re-run weekly to
    # catch newly-published CVEs against dependencies that never changed.
    - cron: "0 6 * * 2"
  workflow_dispatch:

# Supersede an in-flight run when the same ref is pushed again so runs stop
# stacking (scheduled/dispatch runs each key on their own ref).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # Both committed Cargo.lock files are audited. cargo-audit reads the
      # Cargo.lock in the working directory and fails the job on any advisory.
      - name: Audit cli crate
        working-directory: cli
        run: cargo audit
      - name: Audit generated ACI protocol crate
        working-directory: packages/aci-protocol/generated/rust
        run: cargo audit

  python-audit:
    name: pip-audit (uv workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Retry eligibility (#1106): only a step whose whole job is to ACQUIRE a
      # third-party dependency (a tool binary, an image, a registry session, a
      # build artifact) may be wrapped. Such a step can fail only on a network
      # or registry error, never on a non-zero exit from this repository's own
      # build, test, or gate, so a retry there cannot hide a defect in our
      # code. Never wrap a step that builds, tests, or gates that code.
      # Enforced by tools/ci-retry-gate/tests/test_retry_eligibility.py.
      - name: Install uv
        id: install_uv
        continue-on-error: true
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - name: Back off before retrying Install uv
        if: steps.install_uv.outcome == 'failure'
        run: |
          echo "Install uv failed on attempt 1 of 2, retrying in 15 seconds"
          sleep 15
      - name: Install uv (retry)
        if: steps.install_uv.outcome == 'failure'
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      # Export the fully-resolved third-party dependency set from the frozen
      # lockfile. --no-emit-workspace drops the local workspace packages (they
      # carry no advisories and pip-audit cannot resolve editable/local entries);
      # --all-packages walks every workspace member so no member's deps are missed.
      - name: Export locked requirements
        run: |
          uv export --frozen --all-packages --no-emit-workspace \
            --format requirements-txt --output-file requirements-audit.txt
      - name: pip-audit
        run: uvx pip-audit --requirement requirements-audit.txt

  js-audit:
    name: pnpm audit (apps/ui)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/ui/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: apps/ui
        run: pnpm install --frozen-lockfile
      # pnpm audit reads the committed lockfile and exits non-zero on any
      # advisory, matching cargo-audit/pip-audit's fail-the-job behavior above.
      - name: pnpm audit
        working-directory: apps/ui
        run: pnpm audit
