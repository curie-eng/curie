name: CodeQL

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next, "task/**"]
  schedule:
    - cron: "0 6 * * 3"
  workflow_dispatch:

# Supersede an in-flight run when the same ref is pushed again so runs stop
# stacking (scheduled/dispatch runs each key on their own ref).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      # Required for CodeQL to upload results to the Security tab.
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python and JavaScript/TypeScript are interpreted, so no build step
          # is needed (build-mode: none). Rust is intentionally out of scope for
          # this issue (Python + JavaScript only).
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
