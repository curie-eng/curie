name: Nightly kind on next

# Kind jobs (cluster rung, released chart upgrade, upgrade matrix) are not
# selected for next pull requests or for pushes to next. This schedule puts
# them back once a day by dispatching CI on next.
#
# The schedule has to live on the default branch. A cron in a workflow that
# exists only on next never fires. CI on next treats workflow_dispatch as a
# full run, so this dispatch selects kind again.

on:
  schedule:
    # 09:30 UTC. Off the hour, and after the 08:00 graded ladder.
    - cron: "30 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    name: Dispatch kind CI on next
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    outputs:
      run_id: ${{ steps.dispatch_ci.outputs.run_id }}
      run_url: ${{ steps.dispatch_ci.outputs.run_url }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Dispatch the CI workflow on next
        id: dispatch_ci
        run: |
          dispatch=$(gh api --method POST "repos/$GH_REPO/actions/workflows/ci.yaml/dispatches" \
            -f ref=next -F return_run_details=true)
          run_id=$(jq -er '.workflow_run_id | select(type == "number" and . > 0 and . == floor)' <<< "$dispatch")
          run_url=$(jq -er '.html_url | select(type == "string" and length > 0)' <<< "$dispatch")
          printf 'run_id=%s\nrun_url=%s\n' "$run_id" "$run_url" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify kind CI on next
    needs: dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Wait for the dispatched CI result
        env:
          CI_RUN_ID: ${{ needs.dispatch.outputs.run_id }}
        run: gh run watch "$CI_RUN_ID" --exit-status

  report:
    name: Report nightly kind CI result
    needs: [dispatch, verify]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      actions: read
    steps:
      - name: Update the nightly tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CI_RUN_ID: ${{ needs.dispatch.outputs.run_id }}
          CI_RUN_URL: ${{ needs.dispatch.outputs.run_url }}
          DISPATCH_RESULT: ${{ needs.dispatch.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          NIGHTLY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          repo = os.environ["GH_REPO"]
          title = "Nightly kind CI on next is failing"
          failed_conclusions = {"failure", "timed_out", "cancelled"}

          def read_pages(endpoint):
              result = subprocess.run(
                  ["gh", "api", "--paginate", "--slurp", endpoint],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              return json.loads(result.stdout)

          issue_number = min(
              (
                  issue["number"]
                  for page in read_pages(f"repos/{repo}/issues?state=open&per_page=100")
                  for issue in page
                  if "pull_request" not in issue
                  and issue.get("title") == title
                  and (issue.get("user") or {}).get("login") == "github-actions[bot]"
              ),
              default=None,
          )
          nightly_url = os.environ["NIGHTLY_RUN_URL"]
          run_url = os.environ["CI_RUN_URL"]
          dispatch_result = os.environ["DISPATCH_RESULT"]
          verify_result = os.environ["VERIFY_RESULT"]

          if dispatch_result == "success" and verify_result == "success":
              if issue_number is not None:
                  body = (
                      "Nightly kind CI on next passed.\n\n"
                      f"Nightly workflow: {nightly_url}\n"
                      f"Dispatched CI run: {run_url}"
                  )
                  subprocess.run(
                      ["gh", "issue", "comment", str(issue_number), "--repo", repo, "--body", body],
                      check=True,
                  )
                  subprocess.run(
                      ["gh", "issue", "close", str(issue_number), "--repo", repo, "--reason", "completed"],
                      check=True,
                  )
          else:
              lines = [
                  "Nightly kind CI on next did not succeed.",
                  "",
                  f"Nightly workflow: {nightly_url}",
                  f"Dispatch result: {dispatch_result}",
                  f"Verification result: {verify_result}",
                  "",
              ]
              if run_url:
                  lines.append(f"Dispatched CI run: {run_url}")
                  try:
                      pages = read_pages(
                          f"repos/{repo}/actions/runs/{os.environ['CI_RUN_ID']}/jobs?filter=latest&per_page=100"
                      )
                  except (subprocess.CalledProcessError, json.JSONDecodeError):
                      lines.extend(["", "Failed jobs: could not be listed"])
                  else:
                      lines.extend(["", "Failed jobs:"])
                      jobs = [
                          job
                          for page in pages
                          for job in page["jobs"]
                          if job.get("conclusion") in failed_conclusions
                      ]
                      for index, job in enumerate(jobs, 1):
                          steps = [
                              step["name"]
                              for step in job.get("steps", [])
                              if step.get("conclusion") in failed_conclusions
                          ]
                          detail = ", ".join(steps) if steps else (
                              f"no failed step recorded ({job['conclusion']})"
                          )
                          lines.append(f"{index}. {job['name']}: {detail}")
                      if not jobs:
                          lines.append("No failed jobs recorded.")
              else:
                  lines.append(
                      "No CI run was confirmed. Inspect the nightly workflow logs for the dispatch failure."
                  )
              body = "\n".join(lines)
              if issue_number is None:
                  subprocess.run(
                      ["gh", "issue", "create", "--repo", repo, "--title", title, "--body", body],
                      check=True,
                  )
              else:
                  subprocess.run(
                      ["gh", "issue", "comment", str(issue_number), "--repo", repo, "--body", body],
                      check=True,
                  )
          PY
