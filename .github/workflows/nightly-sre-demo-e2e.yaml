name: Nightly SRE demo e2e

# Issue #2246 / #2854: the five SRE demo assertions (namespaces_list read,
# approved resources_scale, one-shot re-arm, configuration_view denial, RBAC
# ceiling) on kind with the pinned kubernetes-mcp-server
# (sha256:6d650f4bd6ac303ad82713c997e73a2d001602f9bf17392c9b9a0e30e29c6423)
# and a live provider. Turns start with `curie cluster message`. Approvals
# resolve through `curie cluster approvals` and an operator principal on
# approvers.users routes. No Slack app is required.
#
# GitHub fires schedule and workflow_dispatch from the default branch, so a
# scheduled run grades that branch's script (the Slack-less cluster-message
# driver). Checking out next here would pair this workflow with the older
# Slack script and fail closed. A missing live provider blocks required
# scheduled/dispatch/RC acceptance. Pull requests only
# inventory readiness without running live work.
on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC, before the 08:00 graded ladder
  workflow_dispatch:
    inputs:
      model:
        description: "OpenRouter model route for the live demo"
        required: false
        default: "z-ai/glm-5.2"
  push:
    tags:
      - "v*-rc*"
  pull_request:
    branches: [main, next]
    paths:
      - ".github/workflows/nightly-sre-demo-e2e.yaml"
      - "cli/scripts/sre-demo-e2e.sh"
      - "cli/scripts/sre-demo-mcp-probe.py"
      - "cli/tests/nightly_sre_demo_e2e.rs"
      - "cli/tests/sre_demo_e2e_test.py"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prereqs:
    name: Check live provider
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Grade the triggering ref so this Slack-less workflow always runs
          # the matching script. Checking out next would pair it with the
          # older Slack driver.
          ref: ${{ github.ref }}
          persist-credentials: false
      - id: check
        name: Report missing setup and fail required live acceptance
        env:
          CURIE_SRE_DEMO_PHASE: prereqs
          CURIE_SRE_DEMO_REQUIRED: ${{ github.event_name != 'pull_request' && '1' || '0' }}
          CURIE_CREDENTIALS: ${{ secrets.OPENROUTER_API_KEY }}
        run: bash cli/scripts/sre-demo-e2e.sh prereqs

  sre-demo:
    name: Five SRE demo assertions on kind
    needs: [prereqs]
    if: needs.prereqs.outputs.ready == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          # Grade the triggering ref so this Slack-less workflow always runs
          # the matching script. Checking out next would pair it with the
          # older Slack driver.
          ref: ${{ github.ref }}
          persist-credentials: false
      - name: Toolchain
        working-directory: cli
        run: rustc --version
      - name: Install uv for the runner's MCP SDK probe
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - name: Release build
        working-directory: cli
        run: cargo build --release --locked
      - name: Make the binary executable
        run: chmod +x cli/target/release/curie
      - name: Install Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v3.16.4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Start disposable local registry
        run: docker run -d --name sre-demo-registry -p 127.0.0.1:5000:5000 registry:2
      - name: Set up a named buildx builder
        id: democache
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
        with:
          use: false
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."localhost:5000"]
              http = true
      - name: Build SRE demo connectors
        env:
          BUILDX_BUILDER: ${{ steps.democache.outputs.name }}
        run: cli/target/release/curie build --plugin-dir examples/sre-bot --registry localhost:5000
      - name: Build the api image locally
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          builder: ${{ steps.democache.outputs.name }}
          tags: curie-api:local
          push: false
          load: true
          cache-from: type=gha,scope=ladder-api
          cache-to: type=gha,mode=max,scope=ladder-api
      - name: Build the worker image locally
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/worker/Dockerfile
          builder: ${{ steps.democache.outputs.name }}
          tags: curie-worker:local
          push: false
          load: true
          cache-from: type=gha,scope=ladder-worker
          cache-to: type=gha,mode=max,scope=ladder-worker
      - name: Build the ui image locally
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/ui/Dockerfile
          builder: ${{ steps.democache.outputs.name }}
          tags: curie-ui:local
          push: false
          load: true
          cache-from: type=gha,scope=ladder-ui
          cache-to: type=gha,mode=max,scope=ladder-ui
      - name: Build the runner image locally
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: runner/Dockerfile
          builder: ${{ steps.democache.outputs.name }}
          tags: curie-runner:latest
          push: false
          load: true
          cache-from: type=gha,scope=ladder-runner
          cache-to: type=gha,mode=max,scope=ladder-runner
      - name: Pull the pinned kubernetes-mcp-server image
        run: docker pull ghcr.io/containers/kubernetes-mcp-server@sha256:6d650f4bd6ac303ad82713c997e73a2d001602f9bf17392c9b9a0e30e29c6423
      - name: Write the kind cluster config
        run: |
          cat > kind-config.yaml <<'EOF'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          # Local registry mapping: https://kind.sigs.k8s.io/docs/user/local-registry/
          containerdConfigPatches:
            - |-
              [plugins."io.containerd.grpc.v1.cri".registry]
                config_path = "/etc/containerd/certs.d"
          nodes:
            - role: control-plane
              extraPortMappings:
                - containerPort: 30080
                  hostPort: 30080
                  listenAddress: "127.0.0.1"
                  protocol: TCP
          EOF
      - name: Create the kind cluster
        uses: helm/kind-action@v1.15.0
        with:
          version: v0.24.0
          node_image: kindest/node:v1.31.0
          cluster_name: curie-sre-demo
          config: kind-config.yaml
      - name: Map the local registry into kind
        run: |
          set -euo pipefail
          docker network connect kind sre-demo-registry
          for node in $(kind get nodes --name curie-sre-demo); do
            docker exec "$node" mkdir -p /etc/containerd/certs.d/localhost:5000
            printf '%s\n' '[host."http://sre-demo-registry:5000"]' | docker exec -i "$node" cp /dev/stdin /etc/containerd/certs.d/localhost:5000/hosts.toml
          done
      - name: Load images into the kind cluster
        run: |
          set -euo pipefail
          for img in curie-api:local curie-worker:local curie-ui:local curie-runner:latest; do
            kind load docker-image "$img" --name curie-sre-demo
          done
          kind load docker-image ghcr.io/containers/kubernetes-mcp-server@sha256:6d650f4bd6ac303ad82713c997e73a2d001602f9bf17392c9b9a0e30e29c6423 --name curie-sre-demo
      - name: Install the platform (curie cluster up, live, dispatcher off)
        env:
          CURIE_BIN: cli/target/release/curie
          CURIE_CREDENTIALS: ${{ secrets.OPENROUTER_API_KEY }}
          CURIE_MODEL: ${{ inputs.model || 'z-ai/glm-5.2' }}
        run: |
          set -euo pipefail
          "$CURIE_BIN" cluster up \
            --chart charts/curie \
            --dev \
            --allow-egress-host openrouter \
            --set security.gvisor.mode=off \
            --set dispatcher.deploy=false \
            --set api.image.repository=curie-api --set api.image.tag=local --set api.image.pullPolicy=Never \
            --set worker.image.repository=curie-worker --set worker.image.tag=local --set worker.image.pullPolicy=Never \
            --set ui.image.repository=curie-ui --set ui.image.tag=local --set ui.image.pullPolicy=Never \
            --set agentSandbox.runner.image=curie-runner --set agentSandbox.runner.tag=latest --set agentSandbox.runner.imagePullPolicy=Never \
            --set agentSandbox.runner.prewarm.imagePullPolicy=Never
      - name: Wait for the platform to become ready
        run: |
          set -euo pipefail
          kubectl rollout status deploy/curie-api -n curie --timeout=300s
          kubectl rollout status deploy/curie-worker -n curie --timeout=300s
          kubectl rollout status deploy/curie-ui -n curie --timeout=300s
          kubectl rollout status daemonset/curie-runner-prewarm -n curie --timeout=300s
      - name: Five SRE demo assertions
        env:
          CURIE_SRE_DEMO_RESULTS_FILE: ${{ runner.temp }}/sre-demo-outcomes.jsonl
          CURIE_BIN: cli/target/release/curie
          CURIE_SRE_DEMO_PHASE: run
          CURIE_SRE_DEMO_ALLOW_LIVE: "1"
          CURIE_CREDENTIALS: ${{ secrets.OPENROUTER_API_KEY }}
          CURIE_MODEL: ${{ inputs.model || 'z-ai/glm-5.2' }}
        run: bash cli/scripts/sre-demo-e2e.sh run
      - name: Retain sanitized assertion outcomes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sre-demo-outcomes
          path: ${{ runner.temp }}/sre-demo-outcomes.jsonl
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove disposable local registry
        if: always()
        run: docker rm -f sre-demo-registry || true
