apiVersion: apps/v1
kind: Deployment
metadata:
  annotations: {}
  labels:
    app.kubernetes.io/name: curie-adr-stubfin-bot-mcp-stubfin
    app.kubernetes.io/part-of: curie-adr
    curie.dev/connector-owner: stubfin-bot
  name: curie-adr-stubfin-bot-mcp-stubfin
  namespace: curie-adr
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: curie-adr-stubfin-bot-mcp-stubfin
      app.kubernetes.io/part-of: curie-adr
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations: {}
      labels:
        app.kubernetes.io/name: curie-adr-stubfin-bot-mcp-stubfin
        app.kubernetes.io/part-of: curie-adr
    spec:
      containers:
      - env:
        - name: FIN_API_BASE
          value: http://stubfin-api:8080
        - name: FIN_TOKEN_SECRET
          value: stubfin-credentials
        - name: FIN_TOKEN_SECRET_KEY
          value: FIN_REFRESH_TOKEN
        - name: FIN_CLIENT_ID
          valueFrom:
            secretKeyRef:
              key: FIN_CLIENT_ID
              name: stubfin-credentials
              optional: false
        - name: FIN_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              key: FIN_CLIENT_SECRET
              name: stubfin-credentials
              optional: false
        - name: FIN_REFRESH_TOKEN
          valueFrom:
            secretKeyRef:
              key: FIN_REFRESH_TOKEN
              name: stubfin-credentials
              optional: false
        image: registry.example.com/acme/stubfin-bot-stubfin@sha256:424195b050f38786218f545d9aa678ff8dae3e9c45af721e6b9af220c9f49e75
        imagePullPolicy: IfNotPresent
        name: server
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 10m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  annotations: {}
  labels:
    app.kubernetes.io/name: curie-adr-stubfin-bot-mcp-stubfin
    app.kubernetes.io/part-of: curie-adr
    curie.dev/connector-owner: stubfin-bot
  name: curie-adr-stubfin-bot-mcp-stubfin
  namespace: curie-adr
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: http
    port: 8000
    protocol: TCP
    targetPort: http
  selector:
    app.kubernetes.io/name: curie-adr-stubfin-bot-mcp-stubfin
    app.kubernetes.io/part-of: curie-adr
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  annotations: {}
  labels:
    app.kubernetes.io/name: curie-adr-stubfin-bot-mcp-stubfin
    app.kubernetes.io/part-of: curie-adr
    curie.dev/connector-owner: stubfin-bot
  name: curie-adr-stubfin-bot-mcp-stubfin-allow
  namespace: curie-adr
spec:
  egress:
  - ports:
    - port: 8000
      protocol: TCP
    to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: curie-adr-stubfin-bot-mcp-stubfin
          app.kubernetes.io/part-of: curie-adr
  podSelector:
    matchLabels:
      app.kubernetes.io/component: runner-sandbox
      app.kubernetes.io/instance: curie-adr
      app.kubernetes.io/name: curie
  policyTypes:
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  annotations: {}
  labels:
    app.kubernetes.io/name: curie-adr-stubfin-bot-mcp-stubfin
    app.kubernetes.io/part-of: curie-adr
    curie.dev/connector-owner: stubfin-bot
  name: curie-adr-stubfin-bot-mcp-stubfin-allow-ingress
  namespace: curie-adr
spec:
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: runner-sandbox
          app.kubernetes.io/instance: curie-adr
          app.kubernetes.io/name: curie
    ports:
    - port: 8000
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: curie-adr-stubfin-bot-mcp-stubfin
      app.kubernetes.io/part-of: curie-adr
  policyTypes:
  - Ingress
