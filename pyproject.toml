[project]
name = "curie-workspace"
version = "0.0.0"
description = "Relay (Curie) monorepo workspace root"
requires-python = ">=3.13"
dependencies = [
    "aci-protocol",
    "curie-channel-protocol",
    "plugin-format",
    "curie-api",
    "curie-dispatcher",
    "curie-mail-adapter",
    "curie-worker",
    "curie-runner",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/aci-protocol",
    "packages/channel-protocol",
    "packages/plugin-format",
    "packages/test-support",
    "apps/api",
    "apps/dispatcher",
    "apps/mail-adapter",
    "apps/worker",
    "runner",
    "tools/doclint",
    "tools/wire-tolerance-gate",
]

[tool.uv.sources]
aci-protocol = { workspace = true }
curie-channel-protocol = { workspace = true }
plugin-format = { workspace = true }
curie-test-support = { workspace = true }
curie-api = { workspace = true }
curie-dispatcher = { workspace = true }
curie-mail-adapter = { workspace = true }
curie-worker = { workspace = true }
curie-runner = { workspace = true }
curie-doclint = { workspace = true }
curie-wire-tolerance-gate = { workspace = true }

[dependency-groups]
dev = [
    "curie-doclint",
    "curie-wire-tolerance-gate",
    "curie-test-support",
    "pytest>=8.3",
    "ruff>=0.16.0",
    "mypy>=2.3.0",
    "import-linter>=2.0",
    "pyyaml>=6.0",
    "types-PyYAML>=6.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.29",
]

[tool.importlinter]
# ADR-0062 (#844 Phase 2): harness conformance gets teeth. The full contract that
# ADR-0062 asks for -- no `claude_agent_sdk` import ANYWHERE outside the Claude
# harness package -- cannot pass yet: nine `curie_runner` modules still import the
# SDK directly (adapter, approval, check, fake, hooks, plugin, session, state,
# translate), and confining them is Phase 2's refactor. These two contracts gate
# the boundaries that are ALREADY clean, so they cannot rot back before that
# lands, and the third contract is added when it does.
root_packages = [
    "curie_api",
    "curie_worker",
    "curie_dispatcher",
    "curie_mail_adapter",
    "curie_runner",
    # The frozen contract packages (#961). Outside the graph, no contract could
    # ever fire on them, which left the worst possible place for an SDK import
    # ungated. Clean today; the contract below keeps them that way.
    "aci_protocol",
    "channel_protocol",
    "plugin_format",
]
# Required for the contracts below: `claude_agent_sdk` is an EXTERNAL package, and
# import-linter only tracks imports that leave the root packages when told to.
include_external_packages = true

[[tool.importlinter.contracts]]
# The SDK is a runner-side concern. If the platform ever imports it directly, the
# out-of-process harness boundary (ADR-0061) has been breached in the one
# direction that is hardest to see in review.
name = "The platform never imports a harness SDK"
type = "forbidden"
source_modules = ["curie_api", "curie_worker", "curie_dispatcher", "curie_mail_adapter"]
forbidden_modules = ["claude_agent_sdk"]

[[tool.importlinter.contracts]]
# The frozen tri-language contracts (ADR-0005/0017/0036) are generated from
# Pydantic models and consumed by Python, Rust and TypeScript. A vendor SDK
# import here would bind the wire itself to one harness -- the single worst place
# for one, and ADR-0031's whole premise. Gated separately from the platform
# contract so the failure message says which invariant broke (#961, following
# #950).
name = "The frozen contract packages never import a harness SDK"
type = "forbidden"
source_modules = ["aci_protocol", "channel_protocol", "plugin_format"]
forbidden_modules = ["claude_agent_sdk"]

[[tool.importlinter.contracts]]
# The PORT half of the harness package Phase 1 introduced: the contribution
# manifest and the registry. A harness declares itself through the manifest, so
# the registry side of the seam never needs a vendor SDK -- a leak here would make
# the port Claude-shaped again, which is what ADR-0060 exists to prevent.
#
# Deliberately NOT the whole `curie_runner.harness` package: `harness.claude` is
# the Claude harness itself, which ADR-0062 explicitly permits to use the SDK
# ("no import OUTSIDE the Claude harness package"). This contract is transitive,
# so it also catches a leak arriving through an intermediate module -- which is
# how it earns its keep over a grep for the import line.
name = "The harness port stays vendor-neutral"
type = "forbidden"
source_modules = [
    "curie_runner.harness.contribution",
    "curie_runner.harness.registry",
]
forbidden_modules = ["claude_agent_sdk"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = [
    "packages/aci-protocol/tests",
    "packages/channel-protocol/tests",
    "packages/plugin-format/tests",
    "apps/api/tests",
    "apps/dispatcher/tests",
    "apps/mail-adapter/tests",
    "apps/worker/tests",
    "runner/tests",
    "compose/tests",
    "release/tests",
    "examples/tests",
    "tools/doclint/tests",
    "tools/wire-tolerance-gate/tests",
    "tools/ci-retry-gate/tests",
    "tools/ci-workflow-paths/tests",
    # Only the offline harness unit tests -- NOT the whole tree: the cluster
    # scenario in test_soak_resilience.py stays out of default collection and
    # runs only under CURIE_SOAK=1 (#499).
    "tests/soak/test_harness_unit.py",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["prototypes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The committed doclint test suite is frozen (issue #452) and groups its imports
# with an extra blank line before the first section comment, which ruff's isort
# would collapse. The implementation under tools/doclint/src stays fully linted,
# I001 included; only the frozen tests are exempt from import-block formatting.
"tools/doclint/tests/**" = ["I001"]

[tool.mypy]
python_version = "3.13"
strict = true
namespace_packages = true
explicit_package_bases = true
mypy_path = [
    "packages/aci-protocol/src",
    "packages/channel-protocol/src",
    "packages/plugin-format/src",
    "packages/test-support/src",
    "apps/api/src",
    "apps/dispatcher/src",
    "apps/mail-adapter/src",
    "apps/worker/src",
    "runner/src",
    "tools/doclint/src",
    "tools/wire-tolerance-gate/src",
]
files = [
    "packages/aci-protocol/src",
    "packages/channel-protocol/src",
    "packages/plugin-format/src",
    "packages/test-support/src",
    "apps/api/src",
    "apps/dispatcher/src",
    "apps/mail-adapter/src",
    "apps/worker/src",
    "runner/src",
    "tools/doclint/src",
    "tools/wire-tolerance-gate/src",
]

# The official kubernetes client ships no type stubs; keep its boundary typed
# on our side (apps/worker/src/curie_worker/sandbox/k8s.py) instead.
[[tool.mypy.overrides]]
module = "kubernetes.*"
ignore_missing_imports = true
