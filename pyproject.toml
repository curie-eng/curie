[project]
name = "curie-workspace"
version = "0.0.0"
description = "Relay (Curie) monorepo workspace root"
requires-python = ">=3.13"
dependencies = [
    "aci-protocol",
    "curie-internal",
    "curie-channel-protocol",
    "curie-protected-hooks",
    "curie-telemetry-schema",
    "curie-upgrade-pause",
    "plugin-format",
    "curie-api",
    "curie-dispatcher",
    "curie-discord-adapter",
    "curie-mail-adapter",
    "curie-e2e-connector",
    "curie-worker",
    "curie-runner",
    "curie-telemetry",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/aci-protocol",
    "packages/curie-internal",
    "packages/channel-protocol",
    "packages/protected-hooks",
    "packages/plugin-format",
    "packages/telemetry-schema",
    "packages/upgrade-pause",
    "packages/test-support",
    "packages/telemetry",
    "apps/api",
    "apps/dispatcher",
    "adapters/discord",
    "apps/mail-adapter",
    "apps/e2e-connector",
    "apps/worker",
    "runner",
    "tools/doclint",
    "tools/wire-tolerance-gate",
]

[tool.uv.sources]
aci-protocol = { workspace = true }
curie-internal = { workspace = true }
curie-channel-protocol = { workspace = true }
curie-protected-hooks = { workspace = true }
curie-telemetry-schema = { workspace = true }
curie-upgrade-pause = { workspace = true }
plugin-format = { workspace = true }
curie-test-support = { workspace = true }
curie-api = { workspace = true }
curie-dispatcher = { workspace = true }
curie-discord-adapter = { workspace = true }
curie-mail-adapter = { workspace = true }
curie-e2e-connector = { workspace = true }
curie-worker = { workspace = true }
curie-runner = { workspace = true }
curie-telemetry = { workspace = true }
curie-doclint = { workspace = true }
curie-wire-tolerance-gate = { workspace = true }

[dependency-groups]
dev = [
    "curie-doclint",
    "curie-wire-tolerance-gate",
    "curie-test-support",
    "pytest>=8.3",
    "pytest-xdist>=3.6",
    "pytest-rerunfailures>=15.0",
    "ruff>=0.16.2",
    "mypy>=2.3.0",
    "import-linter>=2.0",
    "pyyaml>=6.0",
    "types-PyYAML>=6.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.29",
]

[tool.importlinter]
# ADR 0140 keeps the current harness boundaries and ratchets the 15 remaining
# legacy runner SDK importers. Only the Claude harness package may add imports.
# The platform, frozen contracts, harness port and approval gate stay SDK free.
root_packages = [
    "curie_protected_hooks",
    "curie_api",
    "curie_internal",
    "curie_worker",
    "curie_connector_proxy",
    "curie_commissioning_ingress",
    "curie_commissioning_worker",
    "curie_dispatcher",
    "curie_discord_adapter",
    "curie_mail_adapter",
    "curie_e2e_connector",
    "curie_runner",
    "curie_telemetry_schema",
    "curie_upgrade_pause",
    # The frozen contract packages (#961). Outside the graph, no contract could
    # ever fire on them, which left the worst possible place for an SDK import
    # ungated. Clean today; the contract below keeps them that way.
    "aci_protocol",
    "channel_protocol",
    "plugin_format",
]
# Required for the contracts below: `claude_agent_sdk` is an EXTERNAL package, and
# import-linter only tracks imports that leave the root packages when told to.
include_external_packages = true

# @spec PROTECTED-HOOK-LANE-1: internal transport has no application/SDK authority.
[[tool.importlinter.contracts]]
name = "Protected hook primitives stay independent of applications and harnesses"
type = "forbidden"
source_modules = ["curie_protected_hooks"]
forbidden_modules = ["curie_api", "curie_worker", "curie_runner", "claude_agent_sdk"]

# @spec PROTECTED-HOOK-SOURCE-11: only provisioner composition imports the
# runtime directory writer. The HTTP application and every package that
# composes a process holding the ordinary platform key or ordinary application
# credentials cannot reach it, and the shared grammar the API reads never
# imports it. A provisioner entry inside a listed package needs a reviewed
# ignore_imports exception naming that one module.
[[tool.importlinter.contracts]]
name = "The runtime directory writer stays out of ordinary compositions"
type = "forbidden"
source_modules = [
    "curie_api",
    "curie_worker",
    "curie_dispatcher",
    "curie_runner",
    "curie_internal",
    "curie_upgrade_pause",
    "curie_discord_adapter",
    "curie_mail_adapter",
    "curie_connector_proxy",
    "curie_e2e_connector",
    "curie_commissioning_ingress",
    "curie_commissioning_worker",
    "curie_protected_hooks.runtime_directory",
]
forbidden_modules = ["curie_protected_hooks.runtime_directory_writer"]

# @spec PROTECTED-COMMISSIONING-1/2: production composition reads no commissioning
# record. The whole API and worker are sources, so a new production module is
# covered by default; a later commissioning entry needs a reviewed exception.
# Later commissioning slices add their record modules to the forbidden list.
[[tool.importlinter.contracts]]
name = "Production composition never imports commissioning records"
type = "forbidden"
source_modules = ["curie_api", "curie_worker"]
forbidden_modules = [
    "curie_protected_hooks.commissioning_acceptance_writer",
    "curie_protected_hooks.commissioning_acl",
    "curie_protected_hooks.commissioning_admissions",
    "curie_protected_hooks.commissioning_bootstrap",
    "curie_protected_hooks.commissioning_campaign_records",
    "curie_protected_hooks.commissioning_encoding",
    "curie_protected_hooks.commissioning_journal",
    "curie_protected_hooks.commissioning_local_ownership",
    "curie_protected_hooks.commissioning_operator_guard",
    "curie_protected_hooks.commissioning_operator_protocol",
    "curie_protected_hooks.commissioning_producers",
    "curie_protected_hooks.commissioning_provisioner",
    "curie_protected_hooks.commissioning_records",
    "curie_protected_hooks.commissioning_reservations",
    "curie_protected_hooks.commissioning_scripts",
    "curie_protected_hooks.commissioning_worker",
    "curie_protected_hooks.qualification_publication",
]

# @spec PROTECTED-COMMISSIONING-8: the guard's control profile, slots and
# admission policy are installation objects, read by the guard and the
# commissioning compositions only. No production composition imports them, and
# they reach no launch authority, so the guard can decide admission but can
# never itself create, reserve or authorize a launch. The guard modules live in
# `curie_worker`, so the first contract names every protected production module
# explicitly: import-linter does not check a package against its own modules.
[[tool.importlinter.contracts]]
name = "Production composition never imports the commissioning guard"
type = "forbidden"
source_modules = [
    "curie_api",
    "curie_worker.protected_binding",
    "curie_worker.protected_completion",
    "curie_worker.protected_configuration",
    "curie_worker.protected_dispatch",
    "curie_worker.protected_entry",
    "curie_worker.protected_execution",
    "curie_worker.protected_history",
    "curie_worker.protected_kubernetes_projection",
    "curie_worker.protected_lane",
    "curie_worker.protected_launch_client",
    "curie_worker.protected_launch_kubernetes",
    "curie_worker.protected_launch_mechanics",
    "curie_worker.protected_launch_records",
    "curie_worker.protected_launch_registry",
    "curie_worker.protected_launch_server",
    "curie_worker.protected_markers",
    "curie_worker.protected_nomination",
    "curie_worker.protected_nomination_filter",
    "curie_worker.protected_recovery",
    "curie_worker.protected_retirement",
    "curie_worker.protected_run",
    "curie_worker.protected_runner",
    "curie_worker.protected_substrate",
    "curie_worker.protected_substrate_facts",
    "curie_worker.protected_substrate_readers",
    "curie_worker.protected_worker_bootstrap",
]
forbidden_modules = [
    "curie_worker.commissioning_control_admission",
    "curie_worker.commissioning_control_profile",
    "curie_worker.commissioning_control_slots",
]

[[tool.importlinter.contracts]]
name = "The commissioning guard holds no launch authority"
type = "forbidden"
source_modules = [
    "curie_worker.commissioning_control_admission",
    "curie_worker.commissioning_control_profile",
    "curie_worker.commissioning_control_slots",
]
forbidden_modules = [
    "curie_api",
    "curie_worker.protected_entry",
    "curie_worker.protected_launch_mechanics",
    "curie_worker.protected_launch_server",
    "curie_worker.protected_launch_client",
    "curie_worker.protected_launch_registry",
]
# The guard builds the expected Secret and Service from the launch mechanics'
# own shape functions. Their module names the registry's termination record type
# and nothing else of it.
ignore_imports = [
    "curie_worker.protected_launch_kubernetes -> curie_worker.protected_launch_registry",
]

# @spec PROTECTED-COMMISSIONING-2/4: the commissioning ingress and worker are
# separate standalone process compositions, top-level packages beside
# `curie_api` and `curie_worker` rather than modules of them, so the contract
# above holds for the whole API and worker with no exception. No ordinary
# composition imports either. The ingress may import the API's shared signing
# and file-reading helpers and the worker the worker's stream transport, never
# the reverse.
[[tool.importlinter.contracts]]
name = "Ordinary compositions never import the commissioning compositions"
type = "forbidden"
source_modules = [
    "curie_api",
    "curie_worker",
    "curie_dispatcher",
    "curie_runner",
    "curie_internal",
    "curie_protected_hooks",
    "curie_connector_proxy",
]
forbidden_modules = ["curie_commissioning_ingress", "curie_commissioning_worker"]

# The commissioning worker has no path into the API: no worker to API import.
[[tool.importlinter.contracts]]
name = "The commissioning worker imports nothing of the API"
type = "forbidden"
source_modules = ["curie_commissioning_worker"]
forbidden_modules = ["curie_api", "curie_commissioning_ingress"]

[[tool.importlinter.contracts]]
# Telemetry attribute names are shared schema, not an application or harness
# integration surface. Keeping this package independent lets every producer and
# consumer use the exact same enum without reversing a runtime dependency.
name = "The telemetry schema package stays independent"
type = "forbidden"
source_modules = ["curie_telemetry_schema"]
forbidden_modules = [
    "curie_api",
    "curie_worker",
    "curie_dispatcher",
    "curie_runner",
    "aci_protocol",
    "channel_protocol",
    "plugin_format",
    "claude_agent_sdk",
]

[[tool.importlinter.contracts]]
# The connector caller proxy (ADR-0168 decision 7) runs from the worker image
# beside a connector that holds a production credential. Importing any
# `curie_worker` module runs that package's `__init__`, which loads the kernel,
# the Kubernetes client, SQLAlchemy and Valkey with it.
name = "The connector caller proxy imports none of the worker"
type = "forbidden"
source_modules = ["curie_connector_proxy"]
forbidden_modules = ["curie_worker", "kubernetes", "sqlalchemy", "redis", "boto3"]

[[tool.importlinter.contracts]]
# The SDK is a runner-side concern. If the platform ever imports it directly, the
# out-of-process harness boundary (ADR-0061) has been breached in the one
# direction that is hardest to see in review.
name = "The platform never imports a harness SDK"
type = "forbidden"
source_modules = ["curie_api", "curie_worker", "curie_dispatcher", "curie_discord_adapter", "curie_mail_adapter", "curie_e2e_connector"]
forbidden_modules = ["claude_agent_sdk"]

[[tool.importlinter.contracts]]
# The frozen tri-language contracts (ADR-0005/0017/0036) are generated from
# Pydantic models and consumed by Python, Rust and TypeScript. A vendor SDK
# import here would bind the wire itself to one harness -- the single worst place
# for one, and ADR-0031's whole premise. Gated separately from the platform
# contract so the failure message says which invariant broke (#961, following
# #950).
name = "The frozen contract packages never import a harness SDK"
type = "forbidden"
source_modules = ["aci_protocol", "channel_protocol", "plugin_format"]
forbidden_modules = ["claude_agent_sdk"]

[[tool.importlinter.contracts]]
# The PORT half of the harness package Phase 1 introduced: the contribution
# manifest and the registry. A harness declares itself through the manifest, so
# the registry side of the seam never needs a vendor SDK -- a leak here would make
# the port Claude-shaped again, which is what ADR-0060 exists to prevent.
#
# Deliberately NOT the whole `curie_runner.harness` package: `harness.claude` is
# the Claude harness itself, which ADR-0062 explicitly permits to use the SDK
# ("no import OUTSIDE the Claude harness package"). This contract is transitive,
# so it also catches a leak arriving through an intermediate module -- which is
# how it earns its keep over a grep for the import line.
name = "The harness port stays vendor-neutral"
type = "forbidden"
source_modules = [
    "curie_runner.harness.contribution",
    "curie_runner.harness.registry",
]
forbidden_modules = ["claude_agent_sdk"]

[[tool.importlinter.contracts]]
# These are the current direct SDK edges. Indirect use remains possible while
# the existing adapters stay in place, but a new importing module must live in
# the Claude harness package rather than expanding this list (ADR 0140).
name = "The runner adds no SDK imports outside the Claude harness"
type = "forbidden"
source_modules = ["curie_runner"]
forbidden_modules = ["claude_agent_sdk"]
allow_indirect_imports = true
ignore_imports = [
    "curie_runner.__main__ -> claude_agent_sdk",
    "curie_runner.adapter -> claude_agent_sdk",
    "curie_runner.harness.claude.** -> claude_agent_sdk",
    "curie_runner.check -> claude_agent_sdk",
    "curie_runner.fake -> claude_agent_sdk",
    "curie_runner.hooks -> claude_agent_sdk",
    "curie_runner.issue_read -> claude_agent_sdk",
    "curie_runner.mcp_argv -> claude_agent_sdk",
    "curie_runner.plugin -> claude_agent_sdk",
    "curie_runner.progress -> claude_agent_sdk",
    "curie_runner.session -> claude_agent_sdk",
    "curie_runner.state -> claude_agent_sdk",
    "curie_runner.tool_access -> claude_agent_sdk",
    "curie_runner.translate -> claude_agent_sdk",
    "curie_runner.turn_progress -> claude_agent_sdk",
    "curie_runner.usage_report -> claude_agent_sdk",
]


[[tool.importlinter.contracts]]
# Approval decisions must remain free of the SDK through every dependency,
# including shared tool identities. This gate intentionally checks indirect
# imports separately from the legacy direct import ratchet.
name = "The approval gate stays free of the harness SDK"
type = "forbidden"
source_modules = ["curie_runner.approval"]
forbidden_modules = ["claude_agent_sdk"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = [
    "packages/aci-protocol/tests",
    "packages/channel-protocol/tests",
    "packages/plugin-format/tests",
    "packages/test-support/tests",
    "packages/upgrade-pause/tests",
    "packages/telemetry/tests",
    "apps/api/tests",
    "apps/dispatcher/tests",
    "apps/mail-adapter/tests",
    "apps/e2e-connector/tests",
    # The Discord adapter's tests sat in no collection root above, and the
    # string "discord" appears in no .github/workflows file, so they ran
    # nowhere in CI (#2358). A telemetry test in a suite CI never collects is
    # a falsely-claimed proof, so the listing is part of the fix, not tidying.
    "adapters/discord/tests",
    "apps/worker/tests",
    "runner/tests",
    "compose/tests",
    "charts/curie/ci",
    "release/tests",
    "examples/tests",
    "examples/sre-bot/observability/alert-signer",
    # @spec SRE-EMAIL-1: the intake's executable contract belongs to the root
    # suite; a shipped scanner with hand-run-only tests is not verified.
    "examples/sre-bot/observability/slack-email-intake",
    # The two source-built SRE-bot connectors (tempo and self-upgrade) are built
    # by CI and published by release.yaml, but each
    # ships its own test_server.py outside every collection root above -- so
    # the only CI signal on the shipped images was "the Dockerfile builds"
    # (#2093).
    "examples/sre-bot/connectors",
    # The github-activity connector ships its own test_server.py, same reason.
    "examples/github-activity/connectors",
    # @spec ACTION-EXECUTOR-9: the reference reversible connector is a hosted
    # fixture the e2e ladder builds into a bundle; its tests ship beside it.
    "cli/scripts/fixtures/reversible-reference",
    "tools/preflight/tests",
    "tools/test-env",
    "tools/doclint/tests",
    # @spec PROTECTED-HOOK-LANE-2
    "packages/protected-hooks/tests",
    "tools/wire-tolerance-gate/tests",
    "tools/ci-retry-gate/tests",
    "tools/dependency-audit-paths/tests",
    "tools/ci-workflow-paths/tests",
    "tools/e2e-ci-selection/tests",
    "tools/helm-ci-gate/tests",
    "tools/fix-pin-ci/tests",
    "tools/sdk-lock-gate/tests",
    "tools/close-on-next/tests",
    "tools/p0-closes-ci/tests",
    "tools/ci-release-target-parity/tests",
    "tools/restore-drill/tests",
    "tools/sre-contract/tests",
    "tools/factory-e2e/tests",
    "tools/github-stub/tests",
    "tools/model-script/tests",
    "tools/runtime-assertion-gate/tests",
    # Repo-level tests that pin a seam between two apps which may not import
    # each other, such as the runner/API default memory guidance (#1461).
    "tests",
]

[tool.ruff]
line-length = 100
target-version = "py313"
# runner/tests/fixtures/repo_toolchain stands in for a FOREIGN repository that a
# managed sandbox checks out. Its formatting, its pinned dependency and its
# deliberately seeded defect belong to that repository's own fictional owner, so
# holding it to this repository's lint rules would be wrong twice over: it would
# make the stand-in unrepresentative, and ruff would "fix" the very defect the
# red -> green -> red proof observes.
extend-exclude = ["prototypes", "runner/tests/fixtures/repo_toolchain"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE"]

[tool.ruff.lint.per-file-ignores]
# The committed doclint test suite is frozen (issue #452) and groups its imports
# with an extra blank line before the first section comment, which ruff's isort
# would collapse. The implementation under tools/doclint/src stays fully linted,
# I001 included; only the frozen tests are exempt from import-block formatting.
"tools/doclint/tests/**" = ["I001"]
"tools/restore-drill/tests/**" = ["E402"]
"tools/sre-contract/tests/**" = ["E402"]

[tool.mypy]
python_version = "3.13"
strict = true
namespace_packages = true
explicit_package_bases = true
mypy_path = [
    "packages/aci-protocol/src",
    "packages/curie-internal/src",
    "packages/channel-protocol/src",
    "packages/protected-hooks/src",
    "packages/plugin-format/src",
    "packages/telemetry-schema/src",
    "packages/upgrade-pause/src",
    "packages/test-support/src",
    "packages/telemetry/src",
    "apps/api/src",
    "apps/dispatcher/src",
    "adapters/discord/src",
    "apps/mail-adapter/src",
    "apps/e2e-connector/src",
    "apps/worker/src",
    "runner/src",
    "tools/doclint/src",
    "tools/wire-tolerance-gate/src",
]
files = [
    "packages/aci-protocol/src",
    "packages/curie-internal/src",
    "packages/channel-protocol/src",
    "packages/protected-hooks/src",
    "packages/plugin-format/src",
    "packages/telemetry-schema/src",
    "packages/upgrade-pause/src",
    "packages/test-support/src",
    "packages/telemetry/src",
    "apps/api/src",
    "apps/dispatcher/src",
    "adapters/discord/src",
    "apps/mail-adapter/src",
    "apps/e2e-connector/src",
    "apps/worker/src",
    "runner/src",
    "tools/doclint/src",
    "tools/wire-tolerance-gate/src",
]

# The official kubernetes client ships no type stubs; keep its boundary typed
# on our side (apps/worker/src/curie_worker/sandbox/k8s.py) instead.
[[tool.mypy.overrides]]
module = "kubernetes.*"
ignore_missing_imports = true
